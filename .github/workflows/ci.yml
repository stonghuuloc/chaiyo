name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Kit validates these at check/test/build; CI never talks to Supabase.
      PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-fonts.txt
      - run: pnpm check
      - run: pnpm lint
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: pnpm test:coverage
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest scripts/tests
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] && node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const rows = ['lines', 'statements', 'functions', 'branches'].map((k) => '| ' + k + ' | ' + t[k].pct + '% |');
          console.log(['## Test coverage', '', '| Metric | Covered |', '| --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm build
