name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main: one group per commit so no merge is skipped; branches: newest push wins.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Kit validates these at check/test/build; CI never talks to Supabase.
  PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  # The Mac host has the real vault at the refs.ts default path; fixtures must not lint against it.
  CHAIYO_VAULT: /nonexistent/chaiyo-vault

# Self-hosted Mac runner (~/actions-runner): GitHub-hosted minutes are capped on this private repo.
# Dependabot branches stay on GitHub-hosted VMs so unreviewed dependency code never runs on the Mac.
jobs:
  web:
    runs-on: ${{ fromJSON(startsWith(github.ref, 'refs/heads/dependabot/') && '"ubuntu-latest"' || '["self-hosted","chaiyo"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      # refs.ts execs python3; refs.test.ts drives it with a fake vault. Mac host has its own python3.
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - run: pnpm lint
      - run: pnpm check
        if: ${{ !cancelled() }}
      # Runner is an 8-core laptop shared with other work: cap workers, allow slow tests under load.
      - run: pnpm test:coverage --maxWorkers=3 --testTimeout=30000 --hookTimeout=30000
        if: ${{ !cancelled() }}
      - run: pnpm -s import:content src/lib/content/import/fixtures/ok --sink memory --only lessons/hsk1
        if: ${{ !cancelled() }}
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] && node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const rows = ['lines', 'statements', 'functions', 'branches'].map((k) => '| ' + k + ' | ' + t[k].pct + '% |');
          console.log(['## Test coverage', '', '| Metric | Covered |', '| --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm build
        if: ${{ !cancelled() }}

  python:
    runs-on: ${{ fromJSON(startsWith(github.ref, 'refs/heads/dependabot/') && '"ubuntu-latest"' || '["self-hosted","chaiyo"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff@0.17.5 check scripts
      # Mac runner: pngquant + ImageMagick from Homebrew. Ubuntu (Dependabot): apt.
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pngquant imagemagick
      - run: command -v pngquant && (command -v magick || command -v convert)
        if: ${{ !cancelled() }}
      - run: uv run --locked --python 3.12 --with-requirements scripts/requirements-fonts.txt python -m unittest discover -s scripts -p 'test_*.py'
        if: ${{ !cancelled() }}
      - run: uv run --locked --python 3.12 pytest scripts/tests
        if: ${{ !cancelled() }}

  security:
    runs-on: ${{ fromJSON(startsWith(github.ref, 'refs/heads/dependabot/') && '"ubuntu-latest"' || '["self-hosted","chaiyo"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action downloads to $TMPDIR/gitleaks.tmp and leaves it; on the persistent Mac host the next run then fails.
          TMPDIR: ${{ runner.temp }}
      - uses: ./.github/actions/setup-web
      - run: pnpm audit --prod --audit-level=high
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --python 3.12 semgrep@1.185.0 scan --config p/typescript --config p/javascript --metrics off --error src
