name: Setup web
description: pnpm 10 + Node 24 + frozen install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
