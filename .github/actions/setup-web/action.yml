name: Setup web
description: pnpm 10 + Node 24 + frozen install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        # Self-hosted keeps its pnpm store on disk; the remote cache only adds a restore timeout there.
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
