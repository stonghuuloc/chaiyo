<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Hội thoại · Bài 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<style>
  .tools { margin-top: var(--s4); display: flex; gap: var(--s2); }
  .tg { height: 34px; padding: 0 var(--s3); display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill); border: 1px solid var(--ink-5); background: transparent; color: var(--ink-4); font-size: var(--t-meta); font-weight: 500; transition: background .12s, border-color .12s, color .12s; }
  .tg .ic { font-size: 17px; }
  .tg[aria-pressed="true"] { border-color: var(--ink-3); background: rgba(255,255,255,.55); color: var(--ink-1); }

  .talk { margin-top: var(--s5); display: grid; gap: var(--s2); }
  .ln { width: 100%; display: grid; align-items: center; gap: var(--s3); padding: var(--s3); text-align: left; border-radius: var(--r-cell); border: 1.5px solid transparent;
    transition: opacity .25s, background .15s, border-color .15s; }
  .ln.L { grid-template-columns: 40px 1fr; background: rgba(255,255,255,.5); margin-right: 28px; width: calc(100% - 28px); }
  .ln.R { grid-template-columns: 1fr 40px; background: var(--paper-2); margin-left: 28px; width: calc(100% - 28px); text-align: right; }
  .ln.R .av { order: 2; }
  .ln.dim { opacity: .38; }
  .ln.on { opacity: 1; background: var(--vermilion-wash); border-color: var(--ink-1); }
  .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--paper-2); border: 1px solid var(--ink-5); display: block; }
  .tx { min-width: 0; }
  .tx .hz { display: block; font-size: 24px; line-height: 1.25; }
  .tx .py { display: block; margin-top: 2px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .tx .vi { display: block; margin-top: 2px; font-size: var(--t-meta); color: var(--ink-3); }
  .hide-py .py, .hide-vi .vi { display: none; }
  .spk { display: none; }

  .prompt { margin-top: var(--s5); display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: var(--s3); padding: var(--s3) var(--s3) var(--s3) var(--s3); border-radius: var(--r-cell); background: var(--paper-2); }
  .prompt b { font-weight: 600; font-size: var(--t-body); }
  .prompt small { display: block; font-size: var(--t-meta); color: var(--ink-3); }
  .prompt .play { width: 48px; height: 48px; font-size: 22px; }
  #hint button { color: var(--vermilion-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 10px; }
  .opts.text .opt.hz { font-size: 24px; font-weight: 400; }
</style>
</head>
<body>
<div class="top">
  <a class="x" href="l1-hub.html" aria-label="Lưu và về bài học"><svg class="ic"><use href="icons.svg#i-regular-x"/></svg></a>
  <div class="seg" id="seg" aria-hidden="true"></div>
  <span class="count" id="count"></span>
</div>
<main id="main"></main>
<div class="foot"><button class="cta" id="cta"></button><p id="hint"></p></div>

<script type="module">
import { $, $$, ic, play, audio, ended, bar, cta, hint, choice, doneStep } from './step.js?v=9';
import { CAST, SENTENCES as S, DIALOGUE } from './data/h1-01.js?v=2';

const show = { py: true, vi: true };                    // persists across parts
const finished = [false, false];                        // each part heard to the end once
let part = 0, mode = 'part';                            // part | q | done
let run = 0, heard = new Set(), cur = -1, paused = false, resume = null, playing = false;

const lines = () => DIALOGUE[part].lines.map((id) => S[id]);

function showPart() {
  const d = DIALOGUE[part], L = lines();
  run++; heard = new Set(finished[part] ? L.map((_, i) => i) : []); cur = -1; paused = false; playing = false;
  $('#main').innerHTML = `<div class="step">
    <p class="ask">Đoạn ${part + 1}/${DIALOGUE.length}</p><h2>${d.title}</h2>
    <div class="tools" role="group" aria-label="Hiện">
      <button class="tg" id="t-py" aria-pressed="${show.py}">${ic(show.py ? 'regular-eye' : 'regular-eye-slash')}Pinyin</button>
      <button class="tg" id="t-vi" aria-pressed="${show.vi}">${ic(show.vi ? 'regular-eye' : 'regular-eye-slash')}Nghĩa</button>
    </div>
    <div class="talk" id="talk">${L.map((s, i) => {
      const c = CAST[s.speaker];
      return `<button class="ln ${s.speaker === 'redpanda' ? 'L' : 'R'}" data-i="${i}" aria-label="${c.name}: ${s.hz} Nghe lại câu này">
        <img class="av" src="${c.avatar}" alt="${c.name}">
        <span class="tx"><span class="hz">${s.hz}</span><span class="py">${s.spoken || s.py}</span><span class="vi">${s.vi}</span></span></button>`;
    }).join('')}</div></div>`;
  applyToggles();
  $$('.ln').forEach((b) => (b.onclick = () => lineTap(+b.dataset.i)));
  $('#t-py').onclick = () => toggle('py'); $('#t-vi').onclick = () => toggle('vi');
  paint(); ctaState();
}

function applyToggles() {
  $('#main').classList.toggle('hide-py', !show.py); $('#main').classList.toggle('hide-vi', !show.vi);
  [['py', '#t-py'], ['vi', '#t-vi']].forEach(([k, id]) => { const b = $(id); if (!b) return;
    b.setAttribute('aria-pressed', show[k]); b.firstElementChild.outerHTML = ic(show[k] ? 'regular-eye' : 'regular-eye-slash'); });
}
function toggle(k) { show[k] = !show[k]; applyToggles(); }

function paint() {
  $$('.ln').forEach((b, i) => { b.classList.toggle('on', i === cur); b.classList.toggle('dim', i !== cur && !heard.has(i)); });
}

function ctaState() {
  const n = lines().length;
  if (playing) {
    cta(`${ic(paused ? 'fill-play' : 'fill-pause')}${paused ? 'Tạm dừng' : 'Đang phát'} ${cur + 1}/${n}`, { caret: false, hint: paused ? 'Bấm để nghe tiếp' : 'Bấm để tạm dừng', onClick: pauseToggle });
  } else if (finished[part]) {
    cta(part === 0 ? 'Tiếp' : 'Trả lời câu hỏi', { onClick: next });
    $('#hint').innerHTML = `<button id="again">Nghe lại</button>`;
    $('#again').onclick = () => start();
  } else {
    cta(`${ic('fill-play')}Nghe đoạn hội thoại`, { caret: false, hint: 'Hoặc bấm vào từng câu để nghe', onClick: () => start() });
  }
}

function pauseToggle() {
  paused = !paused;
  if (paused) audio.pause(); else { audio.play().catch(() => {}); resume?.(); }
  ctaState();
}

async function start() {
  const me = ++run, L = lines();
  heard = new Set(); paused = false; playing = true; resume = null;
  for (let i = 0; i < L.length; i++) {
    cur = i; heard.add(i); paint(); ctaState();
    play(L[i].a); await ended();
    while (paused && me === run) { await new Promise((r) => (resume = r)); if (me !== run) return; await ended(); }
    if (me !== run) return;
  }
  finished[part] = true; playing = false; cur = -1; heard = new Set(L.map((_, i) => i)); paint(); ctaState();
}

function lineTap(i) {
  const me = ++run, L = lines();                        // cancel any running sequence
  playing = false; paused = false; cur = i; heard.add(i); paint(); ctaState();
  play(L[i].a);
  ended().then(() => { if (me === run) { cur = -1; paint(); } });
}

function next() { run++; audio.pause(); if (part === 0) { part = 1; render(); } else { mode = 'q'; render(); } }

function showQ() {
  const c = CAST.takin;
  choice({ ask: 'Câu hỏi', title: 'Gấu Đỏ nên trả lời thế nào?', kind: 'text',
    promptHtml: `<div class="prompt"><img class="av" src="${c.avatar}" alt="Linh Ngưu"><div><b>Linh Ngưu nói:</b><small>Bấm để nghe</small></div>
      <button class="play" id="qp" aria-label="Nghe Linh Ngưu nói">${ic('fill-speaker-high')}</button></div>`,
    opts: ['没关系。', '不客气。', '再见！'], ans: '没关系。',
    explain: () => `<span class="hz">没关系。</span> méi guānxi · Không sao.`,
    missHint: 'Câu này sẽ quay lại ở phần ôn' },
  () => { mode = 'done'; render(); });
  $('#qp').onclick = (e) => play('m14', e.currentTarget);
  $$('.opt').forEach((b) => b.classList.add('hz'));
}

function render() {
  if (mode === 'done') { bar(3, 3, '3/3'); return doneStep({ title: 'Xong phần Hội thoại', text: 'Bạn đã nghe 2 đoạn hội thoại và thử một tình huống thật.', next: 'Nghe & nói', label: 'Phần tiếp theo', href: 'l6-listen.html' }); }
  if (mode === 'q') { bar(2, 3, '3/3'); showQ(); }
  else { bar(part, 3, `${part + 1}/3`); showPart(); }
  scrollTo(0, 0);
}
render();
</script>
</body>
</html>
