<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Chaiyo · Học tiếng Trung bằng tiếng Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<link rel="stylesheet" href="onboard.css">
<style>
  main { padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--s5) calc(env(safe-area-inset-bottom, 0px) + 200px); }
  .hero { margin: calc(-20px - env(safe-area-inset-top, 0px)) calc(-1 * var(--s5)) 0; aspect-ratio: 1 / 1; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; display: block; }
  .name { text-align: center; }
  .name img { display: block; width: 112px; height: 112px; margin: -56px auto 0; position: relative; filter: drop-shadow(0 6px 14px rgba(45,25,10,.18)); }
  h1 { margin-top: var(--s3); font: 600 28px/1.2 var(--font-display); }
  .name p { margin-top: var(--s2); font-size: 17px; color: var(--ink-2); }
  .pts { margin-top: var(--s6); list-style: none; display: grid; gap: var(--s3); }
  .pts li { display: flex; align-items: center; gap: var(--s4); padding: var(--s3); border-radius: var(--r-cell); background: #fff; font-weight: 500; }
  .pts img { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; background: var(--paper-2); flex: none; }
  .foot .link { margin-top: var(--s1); }
</style>
</head>
<body>
<main id="main">
  <div class="step">
    <div class="hero"><img src="../assets/onboard/welcome.png" alt="" onerror="this.src='../assets/home/lesson-next.png'"></div>
    <div class="name"><img src="../static/brand/logo.png?v=2" alt="Chaiyo"><h1>Học tiếng Trung bằng tiếng Việt</h1><p>Mỗi ngày một chút, cùng các bạn thú.</p></div>
    <ul class="pts">
      <li><img src="../assets/cast/redpanda.png" alt=""><span>Mỗi chữ có Hán Việt</span></li>
      <li><img src="../assets/cast/takin.png" alt=""><span>Nghe giọng thật từ các bạn thú</span></li>
      <li><img src="../assets/cast/panda.png" alt=""><span>Mỗi ngày một chút, có lộ trình HSK</span></li>
    </ul>
  </div>
</main>
<div class="foot">
  <a class="cta" id="start" href="p2-login.html">Bắt đầu học</a>
  <a class="link" href="p2-login.html">Đã có tài khoản? Đăng nhập</a>
</div>
</body>
</html>
