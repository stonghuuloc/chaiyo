<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình · desktop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<script src="nav.js"></script>
<style>
  .mode { margin-top: var(--s4); display: grid; grid-template-columns: 1fr 1fr; max-width: 320px; padding: 3px; border-radius: var(--r-pill); background: var(--paper-2); }
  .mode button { height: 38px; border-radius: var(--r-pill); font-size: 15px; font-weight: 600; color: var(--ink-3); }
  .mode button[aria-selected="true"] { background: #fff; color: var(--ink-1); box-shadow: 0 1px 4px rgba(45,25,10,.12); }
  .sum { margin-top: var(--s3); font-size: var(--t-meta); color: var(--ink-3); }
  .levels-bar { position: sticky; top: 0; z-index: 8; margin: var(--s4) calc(-1 * var(--gutter)) 0; padding: 8px var(--gutter) 10px;
    background: var(--frost-tint); -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%); border-bottom: .5px solid var(--frost-edge); }
  @media (min-width: 1024px) { .levels-bar { margin: var(--s5) -12px 0; padding: 10px 12px; border-radius: 0 0 var(--r-cell) var(--r-cell); } }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lv { display: grid; justify-items: center; align-content: center; gap: 6px; height: 52px; border-radius: var(--r-cell); border: 1px solid var(--ink-5); background: rgba(255,255,255,.5); font-size: 12.5px; font-weight: 600; color: var(--ink-3); position: relative; }
  .lv b { font: 600 17px/1 var(--font-display); color: var(--ink-2); }
  .lv .bar { width: 60%; height: 4px; border-radius: 2px; background: var(--ink-5); overflow: hidden; } .lv .bar i { display: block; height: 100%; background: var(--vermilion); }
  .lv.on { border: 2px solid var(--ink-1); background: #fff; } .lv.on b { color: var(--ink-1); }
  @media (hover: hover) { .lv:not(.on):hover { background: #fff; } }
  .now-card { margin-top: var(--s5); border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid var(--ink-5); }
  .now-card img { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; object-position: 50% 45%; }
  .now-card .body { padding: var(--s4); }
  .now-card .k { font-size: 12.5px; font-weight: 600; color: var(--vermilion-text); letter-spacing: .02em; text-transform: uppercase; }
  .now-card h2 { margin-top: 4px; font-size: var(--t-h2); } .now-card h2 .hz { font-size: 22px; color: var(--ink-2); }
  .now-card p { margin-top: 4px; font-size: var(--t-meta); color: var(--ink-3); }
  .now-card .cta { margin-top: var(--s4); height: 56px; font-size: 19px; }
  .glance { display: none; }
  @media (min-width: 1280px) {
    .root { grid-template-rows: auto 1fr; }
    .main.head-area { grid-row: 1; }
    .aside { grid-row: 1 / span 2; position: sticky; top: 24px; padding-top: 40px; }
    .now-card { margin-top: 0; }
    .now-card img { aspect-ratio: 3 / 2; }
    .main.list-area { grid-row: 2; }
    .glance { display: block; margin-top: var(--s5); border-top: 1px solid var(--ink-5); }
    .glance div { display: flex; justify-content: space-between; padding: var(--s3) 0; border-bottom: 1px solid var(--ink-5); font-size: 14.5px; }
    .glance dt { color: var(--ink-3); } .glance dd { font-weight: 600; font-variant-numeric: tabular-nums; }
  }
  .topic { border-bottom: 1px solid var(--ink-5); }
  .topic summary { list-style: none; display: grid; grid-template-columns: 1fr auto 18px; gap: var(--s2); align-items: center; min-height: 54px; cursor: pointer; font-weight: 600; font-size: 15px; border-radius: 8px; }
  .topic summary::-webkit-details-marker { display: none; }
  .topic summary .c { font-weight: 500; font-size: 13.5px; color: var(--ink-4); }
  .topic summary .chev { font-size: 16px; color: var(--ink-4); transition: transform .2s; }
  .topic[open] summary .chev { transform: rotate(180deg); }
  @media (hover: hover) { .topic summary:hover { color: var(--vermilion-text); } }
  .primer { margin-top: var(--s3); }
</style>
</head>
<body class="app">
<a class="skip" href="#main">Bỏ qua tới nội dung</a>
<nav class="nav" id="nav"></nav>
<div class="frame">
<main class="root" id="main">
  <header class="main head-area page-head">
    <h1>Lộ trình</h1>
    <div class="mode" role="tablist" aria-label="Loại lộ trình"><button role="tab" aria-selected="true">HSK</button><button role="tab" aria-selected="false">Chuyên đề</button></div>
    <p class="sum">HSK 1 · 1/40 bài qua · cần 80% bài kiểm tra để mở bài sau</p>
  </header>

  <aside class="aside" aria-label="Bài đang học">
    <section class="now-card">
      <img src="../../assets/home/lesson-next.png" alt="">
      <div class="body"><p class="k">Đang học</p><h2>Bài 1 · Xin chào <span class="hz">你好</span></h2><p>Phần Từ mới · cần 80% bài kiểm tra để mở Bài 2</p>
        <button class="cta"><svg class="ic"><use href="../icons.svg#i-regular-play"/></svg>Tiếp tục Bài 1<svg class="ic go"><use href="../icons.svg#i-regular-caret-right"/></svg></button></div>
    </section>
    <dl class="glance">
      <div><dt>HSK 1</dt><dd>1 / 40 bài</dd></div>
      <div><dt>Điểm kiểm tra tốt nhất</dt><dd>Bài 0 · 92%</dd></div>
      <div><dt>Thi thử HSK 1</dt><dd>Mở sau Bài 40</dd></div>
    </dl>
  </aside>

  <div class="main list-area">
    <div class="levels-bar"><nav class="levels" id="levels" aria-label="Cấp độ"></nav></div>
    <ol class="path primer">
      <li class="done" role="link" tabindex="0"><span class="mark"><svg class="ic"><use href="../icons.svg#i-bold-check"/></svg></span><div><b>Bài 0 <span>· Nhập môn <span class="hz">拼音</span></span></b><small>Đã xong · 92%</small></div><svg class="ic go"><use href="../icons.svg#i-regular-caret-right"/></svg></li>
    </ol>
    <div id="topics"></div>
  </div>
</main>
</div>
<script>
renderNav(document.getElementById('nav'), 1);
const LV = [[1, 3], [2, 0], [3, 0], [4, 0], [5, 0]];
const lv = document.getElementById('levels');
const paint = (on) => lv.innerHTML = LV.map(([n, p]) => '<button class="lv' + (n === on ? ' on' : '') + '" aria-pressed="' + (n === on) + '"><b>' + n + '</b>' + (n === 1 ? '<span class="bar"><i style="width:' + Math.max(4, p) + '%"></i></span>' : ic('fill-lock-simple')) + '</button>').join('');
paint(1);
lv.onclick = (e) => { const b = e.target.closest('.lv'); if (b) paint(+b.querySelector('b').textContent); };
const T = [
  ['Chào hỏi', [['Xin chào', '你好', 'now'], ['Bạn tên gì?', '你叫什么名字']]],
  ['Gia đình', [['Gia đình', '我的家'], ['Đây là ai?', '这是谁'], ['Bạn mấy tuổi?', '你几岁'], ['Nhà bạn có mấy người?', '你家有几口人'], ['Bố mẹ làm nghề gì?', '做什么工作']]],
  ['Quốc tịch và ngôn ngữ', [['Bạn là người nước nào?', '你是哪国人'], ['Tôi biết nói tiếng Trung', '我会说汉语'], ['Cô giáo tiếng Trung', '汉语老师'], ['Rất vui được gặp bạn', '认识你很高兴']]],
  ['Số và thời gian', [['Số đếm', '一二三'], ['Hôm nay ngày mấy?', '今天几号'], ['Thứ mấy?', '星期几'], ['Bây giờ mấy giờ?', '现在几点'], ['Hôm qua, ngày mai', '昨天明天']]],
];
let n = 0;
document.getElementById('topics').innerHTML = T.map(([t, ls], i) => '<details class="topic"' + (i < 2 ? ' open' : '') + '><summary>' + t + '<span class="c">' + ls.length + ' bài</span>' + ic('regular-caret-down', 'ic chev') + '</summary><ol class="path">' +
  ls.map(([vi, hz, st]) => { n++; st = st || 'locked'; return '<li class="' + st + '" role="link" tabindex="0"><span class="mark">' + (st === 'now' ? '<i></i>' : ic('fill-lock-simple')) + '</span><div><b>Bài ' + n + ' <span>· ' + vi + '</span></b><small>' + (st === 'now' ? 'Đang học · phần Từ mới' : 'Mở khi qua Bài ' + (n - 1)) + ' · <span class="hz">' + hz + '</span></small></div>' + ic('regular-caret-right', 'ic go') + '</li>'; }).join('') + '</ol></details>').join('');
</script>
</body>
</html>
