<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập · desktop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<script src="nav.js"></script>
<style>
  /* public template: compact = art on top with fade, column below; >=1024 = art 3:2 left, 400px column right */
  .pub { max-width: calc(var(--container-column) + 2 * var(--gutter)); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 var(--gutter); }
  .pub-art { margin: 0 calc(-1 * var(--gutter)); aspect-ratio: 1 / 1; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .pub-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; display: block; }
  .pub-col { flex: 1; display: flex; flex-direction: column; }
  .pub-col > .body { flex: 1; }
  .logo { display: block; width: 112px; height: 112px; margin: -56px auto 0; position: relative; filter: drop-shadow(0 6px 14px rgba(45,25,10,.18)); }
  .name { text-align: center; }
  .name h1 { margin-top: var(--s3); font-size: 28px; }
  .name p { margin-top: var(--s2); font-size: 17px; color: var(--ink-2); } .name p .hz { font-size: 1.35em; line-height: 1; color: var(--ink-1); }
  .g { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; } .g svg { width: 18px; height: 18px; }
  .legal { margin-top: var(--s2); text-align: center; font-size: 12.5px; color: var(--ink-4); } .legal a { text-decoration: underline; text-underline-offset: 2px; }
  .back { margin: var(--s4) 0 var(--s2) -10px; } .back svg { transform: rotate(180deg); }
  .form h1 { font-size: 28px; }
  .sent { margin-top: var(--s8); text-align: center; }
  .sent .m { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); font-size: 34px; }
  .sent h1 { margin-top: var(--s5); font-size: 28px; } .sent .lead { margin-inline: auto; } .sent b { overflow-wrap: anywhere; }
  .foot { position: sticky; bottom: 0; padding: var(--s4) 0 calc(env(safe-area-inset-bottom, 0px) + var(--s4)); background: linear-gradient(rgba(247,243,234,0), var(--paper) 22%); }
  .pub.state-email .pub-art, .pub.state-sent .pub-art { display: none; }
  @media (min-width: 768px) { .pub { max-width: calc(480px + 2 * var(--gutter)); } .pub-art { margin: var(--s6) 0 0; aspect-ratio: 3 / 2; border-radius: var(--r-cta); } }
  @media (min-width: 1024px) {
    .pub { max-width: 1120px; flex-direction: row; align-items: center; justify-content: center; gap: 80px; padding: 40px; }
    .pub-art, .pub.state-email .pub-art, .pub.state-sent .pub-art { display: block; flex: 0 1 560px; margin: 0; aspect-ratio: 3 / 2; border-radius: var(--r-cta); -webkit-mask-image: none; mask-image: none; }
    .pub-col { flex: 0 0 var(--container-form); min-height: 480px; justify-content: center; }
    .pub-col > .body { flex: 0 0 auto; }
    .logo { margin: 0 auto; width: 96px; height: 96px; }
    .foot { position: static; background: none; padding-bottom: 0; }
    .back { margin-top: 0; }
  }
</style>
</head>
<body class="public">
<div class="pub" id="pub">
  <div class="pub-art"><img src="../../assets/onboard/welcome.png" alt=""></div>
  <div class="pub-col"><main class="body" id="main"></main><div class="foot" id="foot"></div></div>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h2 id="sh-t">Khôi phục tài khoản?</h2>
    <p><b>tong.loc@gmail.com</b> sẽ bị xoá sau <b>5 ngày</b>. Khôi phục để giữ bài học và từ vựng.</p>
    <div class="row"><button class="cta" id="restore">Khôi phục</button><button class="ghost" id="cancel">Để sau</button></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s), pub = $('#pub');
const demo = new URLSearchParams(location.search).get('s');
let email = demo === 'expired' ? 'tong.loc@gmail.com' : '';
const G = "<span class=\"g\"><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path fill=\"#FFC107\" d=\"M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z\"/><path fill=\"#FF3D00\" d=\"m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z\"/><path fill=\"#4CAF50\" d=\"M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z\"/><path fill=\"#1976D2\" d=\"M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z\"/></svg></span>";
function start() {
  pub.className = 'pub state-start';
  $('#main').innerHTML = '<div class="step name"><img class="logo" src="../../static/brand/logo.png" alt=""><h1>Chaiyo!</h1><p>Mỗi ngày một chút. <span class="hz">加油</span>!</p></div>';
  $('#foot').innerHTML = '<button class="cta" id="google">' + G + 'Tiếp tục với Google</button><button class="link" id="mail">Dùng email</button><p class="legal"><a href="#">Điều khoản</a> · <a href="#">Quyền riêng tư</a></p>';
  $('#google').onclick = () => demo === 'restore' ? openSheet() : go('d-welcome.html');
  $('#mail').onclick = () => form();
}
function form(expired = false) {
  pub.className = 'pub state-email';
  $('#main').innerHTML = '<div class="step form"><button class="x back" id="back" aria-label="Quay lại">' + ic('regular-caret-right') + '</button><h1>Đăng nhập bằng email</h1><p class="lead">Không cần mật khẩu.</p>' +
    (expired ? '<div class="note" role="status">' + ic('fill-clock') + '<span>Link đã hết hạn. Gửi link mới nhé.</span></div>' : '') +
    '<label class="field"><span>Email</span><input id="em" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="ban@gmail.com" value="' + email + '"></label><p class="err" id="err" hidden>Email chưa đúng</p></div>';
  $('#foot').innerHTML = '<button class="cta" id="send">Gửi link</button>';
  $('#back').onclick = start;
  const inp = $('#em'), sync = () => { $('#send').disabled = !inp.value.trim(); $('#err').hidden = true; };
  inp.oninput = sync; sync();
  $('#send').onclick = () => { const v = inp.value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { $('#err').hidden = false; inp.focus(); return; } email = v; sent(); };
  if (!expired) inp.focus();
}
let timer;
function sent() {
  pub.className = 'pub state-sent';
  $('#main').innerHTML = '<div class="step sent"><div class="m">' + ic('fill-letter') + '</div><h1>Mở email của bạn</h1><p class="lead">Đã gửi link tới <b>' + email + '</b></p><p class="meta">Không thấy? Xem mục Spam.</p></div>';
  $('#foot').innerHTML = '<button class="ghost" id="again" disabled></button><button class="link" id="change">Đổi email</button>';
  $('#change').onclick = () => form();
  let s = 60; const tick = () => { const b = $('#again'); if (!b) return clearInterval(timer); b.disabled = s > 0; b.textContent = s > 0 ? 'Gửi lại sau ' + s + 's' : 'Gửi lại link'; s--; };
  clearInterval(timer); tick(); timer = setInterval(tick, 1000);
}
const scrim = $('#scrim');
const openSheet = () => { scrim.hidden = false; $('#restore').focus(); };
$('#restore').onclick = () => go('d-today.html');
$('#cancel').onclick = () => (scrim.hidden = true);
scrim.onclick = (e) => { if (e.target === scrim) scrim.hidden = true; };
// public page: no shortcuts; Esc closes the dialog (modal), Enter in the email field = native submit
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !scrim.hidden) scrim.hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'em' && !e.isComposing) $('#send').click(); });
if (demo === 'expired') form(true); else start();
if (demo === 'restore') openSheet();
</script>
</body>
</html>
