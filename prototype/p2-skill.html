<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Luyện tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<style>
  .ico { margin-top: var(--s6); width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: #fff; font-size: 34px; color: var(--ink-1); }
  h2 { margin-top: var(--s4); font: 600 28px/1.2 var(--font-display); }
  .lead { margin-top: var(--s2); color: var(--ink-2); }
  .how { margin-top: var(--s5); list-style: none; counter-reset: n; }
  .how li { position: relative; padding: var(--s3) 0 var(--s3) 40px; border-top: 1px solid var(--ink-5); font-size: 15px; }
  .how li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: var(--s3); width: 26px; height: 26px; border-radius: 50%; background: var(--paper-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .sample { margin-top: var(--s5); padding: var(--s4); border-radius: 18px; background: #fff; }
  .sample .k { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
  .sample .hz { margin-top: var(--s2); font-size: 30px; line-height: 1.3; }
  .sample p { margin-top: 2px; font-size: 14.5px; color: var(--ink-2); }
  .modes { margin-top: var(--s4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .mode { text-align: left; padding: var(--s3); border-radius: 14px; border: 2px solid var(--ink-5); background: #fff; font: inherit; color: var(--ink-1); cursor: pointer; }
  .mode b { display: block; font-size: 15px; }
  .mode small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
  .mode[aria-pressed="true"] { border-color: var(--ink-1); }
  .best { margin-top: var(--s3); font-size: 14px; color: var(--ink-2); }
  .note { margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: 14px; border: 1px dashed var(--ink-4); font-size: 14px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="top">
  <a class="x" href="t3-practice.html" aria-label="Về Luyện tập"><svg class="ic"><use href="icons.svg#i-regular-x"/></svg></a>
  <span class="t" id="t"></span><span></span>
</div>
<main id="main"></main>
<div class="foot"><button class="cta" id="cta"></button><p id="hint"></p></div>
<script type="module">
import { $, ic, cta } from './step.js?v=9';
// Entry screens for the two skills that need a grading backend. Honest about what is not built yet.
const LEVEL = 1;   // learner's current HSK level (demo)
const K = {
  noi: {
    title: 'Nói', icon: 'fill-microphone', h: 'Đọc to, app chấm phát âm',
    lead: 'Mỗi lượt vài từ và câu bạn đã học. App nghe bạn đọc rồi chỉ ra chữ nào sai thanh điệu.',
    how: ['Nghe mẫu một lần', 'Bấm giữ micro, đọc to', 'Xem chữ đúng, chữ sai thanh, rồi đọc lại'],
    sample: ['Ví dụ một lượt', '没关系。', 'méi guānxi · Không sao.'],
    note: 'Chưa có trong bản demo: cần máy chấm phát âm (xem kế hoạch chấm điểm Nói trong NOTES).',
  },
  doan: {
    title: 'Viết đoạn', icon: 'fill-notebook', h: 'Viết câu, rồi viết đoạn ngắn',
    lead: 'HSK 3: sắp xếp và viết câu. HSK 4–6: viết đoạn 80–100 chữ theo đề, app chấm và sửa từng câu.',
    how: ['Đọc đề và gợi ý từ', 'Gõ bằng pinyin hoặc viết tay', 'Xem lỗi được đánh dấu, sửa và nộp lại'],
    sample: ['Ví dụ đề HSK 4', '介绍一下你的周末。', 'Giới thiệu cuối tuần của bạn. Dùng: 先…然后…, 因为…所以…'],
    note: LEVEL >= 3 ? 'Chưa có trong bản demo: cần AI chấm bài viết.' : `Mở khi bạn tới HSK 3. Bạn đang ở HSK ${LEVEL}.`,
  },
  thi: (() => {
    const q = new URLSearchParams(location.search), lv = +(q.get('lv') || LEVEL), noi = q.get('m') === 'noi';
    return {
      title: 'Thi thử', icon: noi ? 'fill-microphone' : 'fill-diploma', h: `Thi thử HSK ${lv}${noi ? ' · Nói' : ''}, như thi thật`,
      lead: noi ? 'Nói với máy như vào phòng thi: nhắc lại câu, tả tranh, trả lời câu hỏi. Chấm theo thang HSK.'
        : `Một đề đủ phần nghe, đọc${lv >= 3 ? ', viết' : ''}, có giờ chạy, chấm điểm theo thang HSK.${lv < 6 ? ` Đỗ là mở khoá HSK ${lv + 1}.` : ''}`,
      how: ['Làm hết đề, không xem gợi ý', 'Nộp bài, xem điểm từng phần', 'Câu sai được gom lại để luyện tiếp'],
      sample: ['Ví dụ câu đọc', '我在学校学习汉语。', 'Đúng hay sai: “Tôi học tiếng Trung ở trường.”'],
      demo: lv === 1 && !noi,
      note: lv < LEVEL ? 'Bạn đã đỗ cấp này, làm lại để giữ phong độ. Chưa có đề trong bản demo.'
        : lv === LEVEL ? `Mở khi bạn qua bài cuối của HSK ${lv}.${lv === 1 && !noi ? '' : ' Chưa có đề trong bản demo.'}` : `Mở khi bạn đỗ thi thử HSK ${lv - 1}.`,
    };
  })(),
};
const P = new URLSearchParams(location.search);
const k = K[P.get('k')] || K.noi;
document.title = `${k.title} · Luyện tập`;
$('#t').textContent = k.title;
$('#main').innerHTML = `<div class="step"><div class="ico">${ic(k.icon)}</div><h2>${k.h}</h2><p class="lead">${k.lead}</p>
  <ol class="how">${k.how.map((x) => `<li>${x}</li>`).join('')}</ol>
  <div class="sample"><p class="k">${k.sample[0]}</p><p class="hz">${k.sample[1]}</p><p>${k.sample[2]}</p></div>
  <p class="note">${k.note}</p></div>`;
if (k.demo) {
  let best = null;
  try { best = localStorage.getItem('mock-h1-best'); } catch {}
  let mode = 'exam';
  $('.note').insertAdjacentHTML('beforebegin', `<div class="modes" role="group" aria-label="Chế độ làm bài">
    <button class="mode" data-m="exam" aria-pressed="true"><b>Thi thật</b><small>Có giờ, nghe 2 lần, xem đáp án cuối bài</small></button>
    <button class="mode" data-m="practice" aria-pressed="false"><b>Luyện</b><small>Không giờ, xem đáp án từng câu</small></button></div>
    ${best !== null ? `<p class="best">Điểm thi thật cao nhất: <b>${best}/200</b></p>` : ''}`);
  document.querySelectorAll('.mode').forEach((b) => (b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll('.mode').forEach((x) => x.setAttribute('aria-pressed', x === b));
    $('#cta').dataset.href = `m2-mock.html?mode=${mode}`;
  }));
  $('#cta').dataset.href = 'm2-mock.html?mode=exam';
  cta('Bắt đầu', { onClick: () => (location.href = $('#cta').dataset.href) });
} else cta('Về Luyện tập', { onClick: () => (location.href = 't3-practice.html') });
</script>
</body>
</html>
