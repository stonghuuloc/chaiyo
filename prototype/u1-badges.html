<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Huy hiệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="roots.css?v=2">
<style>
  main { padding: 0 var(--s5) calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .top { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px var(--s2); background: var(--paper); }
  .top .t { text-align: center; font: 600 17px/1.3 var(--font-display); }
  .x { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--ink-2); border-radius: 50%; }
  .x .ic { transform: scaleX(-1); }

  .sum { padding: var(--s3) 0 var(--s5); }
  .sum h1 { font: 700 var(--t-h2)/1.2 var(--font-display); }
  .sum p { margin-top: var(--s1); color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .sum .pg { margin-top: var(--s3); height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
  .sum .pg i { display: block; height: 100%; background: var(--vermilion); border-radius: 3px; }

  section { border-top: 1px solid var(--ink-5); padding-top: var(--s5); margin-top: var(--s5); }
  section h2 { font: 600 19px/1.25 var(--font-display); }
  section > .sub { margin-top: 2px; font-size: var(--t-meta); color: var(--ink-3); }

  .grid { margin-top: var(--s4); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
  .cell { display: block; width: 100%; padding: var(--s3) 4px; border-radius: 18px; background: #fff; text-align: center; -webkit-tap-highlight-color: transparent; transition: transform .12s; }
  .cell:active { transform: scale(.97); }
  .cell img { display: block; margin: 0 auto; width: 88px; height: 88px; border-radius: 50%; }
  .cell b { display: block; margin-top: var(--s2); padding: 0 4px; font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .cell small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }

  .list { margin-top: var(--s4); list-style: none; border-radius: 18px; background: #fff; overflow: hidden; }
  .list li + li { border-top: 1px solid var(--ink-5); }
  .row { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: var(--s3); width: 100%; min-height: 76px; padding: var(--s3) var(--s4) var(--s3) var(--s3); text-align: left; -webkit-tap-highlight-color: transparent; }
  .row:active { background: var(--paper); }
  .row img { width: 56px; height: 56px; border-radius: 50%; }
  .row b { display: block; font-size: 15.5px; font-weight: 600; }
  .row small { display: block; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--ink-3); }
  .lock img, .lockimg { filter: grayscale(1) opacity(.55); }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s2); margin-top: 6px; }
  .bar .pg { height: 5px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
  .bar .pg i { display: block; height: 100%; min-width: 0; background: var(--vermilion); border-radius: 3px; }
  .bar span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .empty { margin-top: var(--s4); padding: var(--s5); border-radius: 18px; border: 1px dashed var(--ink-4); text-align: center; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .empty b { color: var(--ink-1); font-weight: 600; }

  /* bottom sheet */
  .scrim { position: fixed; z-index: 20; inset: 0; background: rgba(30, 24, 18, .42); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: 100%; max-width: 430px; transform: translate(-50%, 100%); visibility: hidden; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s .26s; padding: var(--s6) var(--s5) calc(env(safe-area-inset-bottom, 0px) + var(--s5)); border-radius: 28px 28px 0 0; background: var(--paper); box-shadow: 0 -12px 40px rgba(30, 24, 18, .18); text-align: center; }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .sheet { transform: translate(-50%, 0); visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
  .sheet .close { position: absolute; right: 10px; top: 10px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; color: var(--ink-2); border-radius: 50%; }
  .sheet img { display: block; margin: 0 auto; width: 160px; height: 160px; border-radius: 50%; box-shadow: 0 10px 28px rgba(30, 24, 18, .16); }
  .sheet h3 { margin-top: var(--s4); font: 700 22px/1.25 var(--font-display); }
  .sheet .how { margin-top: var(--s1); color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .sheet .stat { margin-top: var(--s3); font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .sheet .stat.got { color: var(--ink-1); }
  .sheet .bar { margin: var(--s3) auto 0; max-width: 260px; }
  .sheet .share { margin-top: var(--s5); width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: var(--s2); border-radius: var(--r-pill); border: 1px solid var(--ink-4); background: rgba(255,255,255,.6); font: 600 16px var(--font-ui); color: var(--ink-1); }
  .sheet .share:active { background: #fff; }
  .sheet .share .ic { font-size: 19px; }

  .toast { position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translate(-50%, -8px); opacity: 0; pointer-events: none; width: max-content; max-width: calc(100% - 40px); padding: 10px 18px; border-radius: var(--r-pill); background: var(--ink-1); color: #fff; font-size: 14.5px; font-weight: 500; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="top"><a class="x" id="back" href="t4-me.html" aria-label="Quay lại"><svg class="ic"><use href="icons.svg#i-regular-caret-right"/></svg></a><span class="t">Huy hiệu</span><span></span></div>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
if (/t4-me/.test(document.referrer)) document.getElementById('back').onclick = (e) => { e.preventDefault(); history.back(); };
const $ = (s) => document.querySelector(s);
const ic = (id, cls = 'ic') => `<svg class="${cls}"><use href="icons.svg#i-${id}"/></svg>`;
const P = new URLSearchParams(location.search);
const NONE = P.has('none');                          // ?none demo: brand-new learner, nothing earned

// demo learner (same as t4-me.html); earned dates are mock
const ME = NONE ? { best: 0, words: 0, chars: 0, passed0: false } : { best: 12, words: 12, chars: 0, passed0: true };

// fixed set: first five = t4-me.html BADGES; the last four are locked and reuse art (art = grayscale of another badge)
const BADGES = [
  { id: 'first', art: 'first', t: 'Bước đầu tiên', how: 'Qua Bài 0, bước đầu tiên của hành trình.', ok: ME.passed0, on: '12/10', reach: 1 },
  { id: 'streak7', art: 'streak7', t: 'Chuỗi 7 ngày', how: 'Học 7 ngày liền, không bỏ buổi nào.', ok: ME.best >= 7, on: '18/10', have: ME.best, need: 7, reach: 2 },
  { id: 'streak30', art: 'streak30', t: 'Chuỗi 30 ngày', how: 'Học 30 ngày liền. Một tháng không nghỉ!', ok: ME.best >= 30, have: ME.best, need: 30, reach: 4 },
  { id: 'words100', art: 'words100', t: '100 từ', how: 'Học và lưu 100 từ vào Từ của tôi.', ok: ME.words >= 100, have: ME.words, need: 100, reach: 5 },
  { id: 'hsk1', art: 'hsk1', t: 'Đỗ HSK 1', how: 'Qua thi thử HSK 1.', ok: false, reach: 8 },
  { id: 'streak100', art: 'streak30', t: 'Chuỗi 100 ngày', how: 'Học 100 ngày liền. Cao thủ giữ lửa!', ok: ME.best >= 100, have: ME.best, need: 100, reach: 6 },
  { id: 'words300', art: 'words100', t: '300 từ', how: 'Học và lưu 300 từ vào Từ của tôi.', ok: ME.words >= 300, have: ME.words, need: 300, reach: 7 },
  { id: 'hsk2', art: 'hsk1', t: 'Đỗ HSK 2', how: 'Qua thi thử HSK 2.', ok: false, reach: 9 },
  { id: 'write50', art: 'first', t: 'Viết chữ đẹp', how: 'Viết đúng 50 chữ Hán bằng tay.', ok: ME.chars >= 50, have: ME.chars, need: 50, reach: 3 },
];
const BY = Object.fromEntries(BADGES.map((b) => [b.id, b]));
const earned = BADGES.filter((b) => b.ok), locked = BADGES.filter((b) => !b.ok).sort((a, b) => a.reach - b.reach);
const pct = (b) => Math.round((b.have / b.need) * 100);
const art = (b) => `../assets/badges/${b.art}.png?v=1`;

const line = !earned.length ? 'Chưa có cái nào. Cái đầu tiên gần ngay trước mắt rồi!'
  : earned.length === BADGES.length ? 'Đủ bộ rồi, đỉnh của chóp!'
  : `Ngon lành rồi đó. Còn ${locked.length} cái nữa, từ từ mà sưu tầm.`;

const cell = (b) => `<button class="cell" data-id="${b.id}"><img src="${art(b)}" alt="" loading="lazy"><b>${b.t}</b><small>Ngày ${b.on}</small></button>`;
const bar = (b) => b.need ? `<div class="bar"><div class="pg"><i style="width:${pct(b)}%"></i></div><span>${b.have}/${b.need}</span></div>` : '';
const row = (b) => `<li><button class="row lock" data-id="${b.id}"><img src="${art(b)}" alt=""><span><b>${b.t}</b><small>${b.how}</small>${bar(b)}</span></button></li>`;

function render() {
  const soon = NONE ? locked.slice(0, 3) : locked, rest = NONE ? locked.slice(3) : [];
  $('#main').innerHTML = `
    <div class="sum"><h1>Có ${earned.length}/${BADGES.length} huy hiệu</h1><p>${line}</p>
      <div class="pg" role="img" aria-label="${earned.length}/${BADGES.length}"><i style="width:${Math.round((earned.length / BADGES.length) * 100)}%"></i></div></div>
    ${earned.length ? `<section><h2>Đã có</h2><p class="sub">Chạm vào để xem hoặc khoe với bạn bè.</p><div class="grid">${earned.map(cell).join('')}</div></section>` : ''}
    <section><h2>${NONE ? 'Thử mở 3 cái này trước' : 'Sắp mở'}</h2><p class="sub">${NONE ? 'Gần nhất, làm một chút là có.' : 'Chạm vào để xem cách mở.'}</p>
      <ul class="list">${soon.map(row).join('')}</ul></section>
    ${rest.length ? `<section><h2>Còn lại</h2><p class="sub">Để dành cho sau này.</p><ul class="list">${rest.map(row).join('')}</ul></section>` : ''}`;
  document.querySelectorAll('[data-id]').forEach((el) => (el.onclick = () => openSheet(BY[el.dataset.id], el)));
}

let tt; const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2000); };
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-100px;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (_) { return false; }
}

let lastFocus = null;
function openSheet(b, from) {
  lastFocus = from;
  const stat = b.ok ? `<p class="stat got">Đã có từ ngày ${b.on}</p>`
    : b.need ? `<p class="stat">Đang ở ${b.have}/${b.need}</p>${bar(b)}`
    : `<p class="stat">Chưa mở</p>`;
  $('#sheet').innerHTML = `<button class="close" id="sh-x" aria-label="Đóng">${ic('regular-x')}</button>
    <img src="${art(b)}" alt="" class="${b.ok ? '' : 'lockimg'}">
    <h3 id="sh-t">${b.t}</h3><p class="how">${b.how}</p>${stat}
    ${b.ok ? `<button class="share" id="sh-share">${ic('fill-plain')}Khoe với bạn bè</button>` : ''}`;
  $('#sh-x').onclick = closeSheet;
  const sh = $('#sh-share');
  if (sh) sh.onclick = async () => {
    const url = new URL('u1-badges.html', location.href); url.search = '?badge=' + b.id;
    toast(await copy(url.href) ? 'Đã sao chép link' : 'Chưa sao chép được, thử lại nhé');
  };
  $('#sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('open');
  $('#sh-x').focus({ preventScroll: true });
}
function closeSheet() {
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open');
  $('#sheet').setAttribute('aria-hidden', 'true');
  lastFocus && lastFocus.focus({ preventScroll: true });
}
$('#scrim').onclick = closeSheet;
addEventListener('keydown', (e) => e.key === 'Escape' && closeSheet());
render();
</script>
</body>
</html>
