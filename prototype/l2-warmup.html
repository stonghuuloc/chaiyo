<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Khởi động · Ôn Bài 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<style>
  .prompt { display: grid; place-items: center; min-height: 148px; padding: var(--s4); border-top: 1px solid var(--ink-5); border-bottom: 1px solid var(--ink-5); }
  .prompt .hz { font-size: 72px; line-height: 1.1; text-align: center; }
  .prompt .vi { font: 600 var(--t-h2)/1.25 var(--font-display); text-align: center; }
</style>
</head>
<body>
<div class="top">
  <a class="x" href="l1-hub.html" aria-label="Lưu và về bài học"><svg class="ic"><use href="icons.svg#i-regular-x"/></svg></a>
  <div class="seg" id="seg" aria-hidden="true"></div>
  <span class="count" id="count"></span>
</div>
<main id="main"></main>
<div class="foot"><button class="cta" id="cta"></button><p id="hint"></p></div>

<script type="module">
import { choice, bar, doneStep, shuffle } from './step.js?v=9';
import { WORDS as W, word as find } from './data/h1-01.js?v=2';

// 6 cards, four card types rotated (same shapes R1 will use)
const PLAN = [
  ['audio', '对不起'], ['mean', '谢谢'], ['tone', '没关系'],
  ['rev', '再见'],     ['audio', '您'], ['mean', '不客气'],
];
const others = (w, f, n = 3) => shuffle(W.filter((x) => x.hz !== w.hz && (f ? f(x) : true))).slice(0, n);
const TONE = { 没关系: ['méi guānxi', 'měi guānxi', 'mèi guānxi', 'méi guānxī'] };
const explain = (a) => { const w = find(a); return `<span class="hz">${w.hz}</span> ${w.py} · ${w.vi}`; };
const wc = (t) => t.split(/\s+/).length;   // syllable/word count: distractors match the answer's shape
const big = (hz) => `<div class="prompt"><span class="hz">${hz}</span></div>`;

function card(type, hz) {
  const w = find(hz);
  if (type === 'audio') { // audio → hanzi
    const pool = hz.length > 1 ? (x) => x.hz.length > 1 : (x) => x.hz.length === 1;
    return { title: 'Nghe rồi chọn từ đúng', key: w.a, kind: 'hz', ans: w.hz, opts: shuffle([w, ...others(w, pool, hz.length > 1 ? 3 : 2)]).map((x) => x.hz), explain };
  }
  if (type === 'mean') { // hanzi → nghĩa
    return { title: 'Từ này nghĩa là gì?', promptHtml: big(w.hz), kind: 'text', ans: w.vi, opts: shuffle([w, ...others(w, (x) => Math.abs(wc(x.vi) - wc(w.vi)) <= 1 && /[(,]/.test(x.vi) === /[(,]/.test(w.vi))]).map((x) => x.vi), explain: () => explain(w.hz) };
  }
  if (type === 'tone') { // audio → pinyin with the right tones
    return { title: 'Nghe rồi chọn pinyin đúng', key: w.a, kind: 'text', ans: w.py, opts: shuffle(TONE[hz]), explain: () => explain(w.hz) };
  }
  // nghĩa → hanzi
  return { title: 'Chọn từ có nghĩa này', promptHtml: `<div class="prompt"><span class="vi">${w.vi}</span></div>`, kind: 'hz', ans: w.hz, opts: shuffle([w, ...others(w, (x) => x.hz.length > 1)]).map((x) => x.hz), explain };
}

const got = [];
function render(i) {
  if (i === PLAN.length) {
    const ok = got.filter((g) => g.ok).length, miss = PLAN.length - ok;
    bar(PLAN.length, PLAN.length, `${PLAN.length}/${PLAN.length}`);
    return doneStep({
      title: 'Xong phần Khởi động',
      text: `${ok}/${PLAN.length} đúng · ${miss ? 'từ sai sẽ quay lại sớm hơn' : 'cả sáu từ đều chắc tay'}`,
      gridHtml: `<div class="grid">${PLAN.map(([, hz]) => `<span class="hz">${hz}</span>`).join('')}</div>`,
      next: 'Từ mới', label: 'Phần tiếp theo', href: 'l3-words.html',
    });
  }
  bar(i, PLAN.length);
  const [type, hz] = PLAN[i];
  choice({ ask: i === 0 ? 'Ôn lại Bài 1 trước khi học từ mới' : 'Khởi động · Ôn Bài 1', missHint: 'Từ này sẽ quay lại sớm hơn', ...card(type, hz) },
    (ok) => { got.push({ hz, ok }); render(i + 1); });
  scrollTo(0, 0);
}
render(0);
</script>
</body>
</html>
