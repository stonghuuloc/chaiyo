<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<title>Bài học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<style>
  .page { background: var(--paper); min-height: 100dvh; }
  .hero { position: relative; height: 250px; overflow: hidden; background: var(--paper-2); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: auto 0 0; height: 90px; background: linear-gradient(rgba(247,243,234,0), var(--paper) 94%); }
  .gbtn { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 14px); left: var(--s5); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--ink-1);
    background: rgba(250,246,238,.72); -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%); box-shadow: 0 10px 30px rgba(45,25,10,.16); }
  header { position: relative; z-index: 2; padding: 0 var(--s5); margin-top: -30px; }
  .kicker { font-size: var(--t-meta); color: var(--ink-3); }
  h1 { margin-top: 6px; font: 600 var(--t-hero)/1.1 var(--font-display); }
  h1 .hz { display: block; margin-top: 4px; font-size: 28px; color: var(--ink-2); letter-spacing: .04em; }
  .goal { margin-top: var(--s3); font-size: 15px; color: var(--ink-2); }
  .meta { margin-top: var(--s2); font-size: var(--t-meta); color: var(--ink-3); }
  main { padding: 0 var(--s5) calc(env(safe-area-inset-bottom, 0px) + 48px); }
  section { padding-top: var(--s6); margin-top: var(--s5); border-top: 1px solid var(--ink-5); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
  h2 { font: 600 var(--t-h2)/1.2 var(--font-display); }
  h2 small { display: block; margin-top: 2px; font: 400 var(--t-meta)/1.3 var(--font-ui); color: var(--ink-3); }
  .tgs { display: flex; gap: var(--s2); }
  .tg { height: 34px; padding: 0 var(--s3); display: inline-flex; align-items: center; gap: 5px; border-radius: var(--r-pill); border: 1px solid var(--ink-5); background: transparent; color: var(--ink-4); font-size: 13px; font-weight: 600; }
  .tg .ic { font-size: 17px; }
  .tg[aria-pressed="true"] { border-color: var(--ink-3); background: rgba(255,255,255,.55); color: var(--ink-1); }
  .no-py .py, .no-vi .vi { visibility: hidden; height: 0; display: block; overflow: hidden; }

  .words { list-style: none; }
  .words li + li { border-top: 1px solid var(--ink-5); }
  .w { width: 100%; display: grid; grid-template-columns: 64px 1fr 22px; gap: var(--s3); align-items: center; padding: var(--s3) 0; text-align: left; }
  .w img { width: 64px; height: 64px; border-radius: var(--r-cell); object-fit: cover; background: var(--paper-2); }
  .w .hz { font-size: 26px; line-height: 1.15; }
  .w .line { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .w .py { font-size: 15px; color: var(--ink-2); }
  .w .hv { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); text-transform: uppercase; }
  .w .vi { font-size: 14px; color: var(--ink-1); }
  .w .pos { font-size: 12px; color: var(--ink-3); }
  .w .go { transition: transform .2s; color: var(--ink-4); }
  li.open .w .go { transform: rotate(90deg); }
  .more { display: none; padding: 0 0 var(--s4) 76px; }
  li.open .more { display: block; }
  .chars { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); background: var(--paper-2); font-size: 13px; color: var(--ink-2); }
  .chip .hz { font-size: 18px; color: var(--ink-1); }
  .ex { margin-top: var(--s3); }

  .s { width: 100%; display: grid; grid-template-columns: 1fr; gap: 2px; padding: var(--s2) 0; text-align: left; border-radius: var(--r-cell); }
  .s .hz { font-size: 20px; line-height: 1.35; }
  .s .py { font-size: 14px; color: var(--ink-2); }
  .s .vi { font-size: 14px; color: var(--ink-3); }
  .s.on .hz { color: var(--vermilion-text); }

  .ln { width: 100%; display: grid; align-items: center; gap: var(--s3); padding: var(--s3); text-align: left; border-radius: var(--r-cell); border: 1.5px solid transparent; margin-top: var(--s2); }
  .ln.L { grid-template-columns: 40px 1fr; background: rgba(255,255,255,.55); margin-right: 28px; width: calc(100% - 28px); }
  .ln.R { grid-template-columns: 1fr 40px; background: var(--paper-2); margin-left: 28px; width: calc(100% - 28px); text-align: right; }
  .ln.R .av { order: 2; }
  .ln.on { background: var(--vermilion-wash); border-color: var(--ink-1); }
  .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #fff; border: 1px solid var(--ink-5); }
  .ln > span > span { display: block; }
  .ln .hz { font-size: 20px; line-height: 1.35; }
  .ln .py { font-size: 13px; color: var(--ink-2); }
  .ln .vi { font-size: 13px; color: var(--ink-3); }
  .part { margin-top: var(--s4); font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .playall { margin-top: var(--s4); height: 44px; padding: 0 var(--s4); border-radius: var(--r-pill); border: 1.5px solid var(--ink-1); display: inline-flex; align-items: center; gap: var(--s2); font-weight: 600; }

  .reading { padding: var(--s4); border-radius: var(--r-cell); background: rgba(255,255,255,.55); }
  .reading .s + .s { border-top: 1px dashed var(--ink-5); }

  .g + .g { margin-top: var(--s6); }
  .g h3 { font: 600 18px/1.3 var(--font-display); }
  .pattern { margin: var(--s3) 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pattern span { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--ink-1); font-size: 17px; }
  .pattern i { color: var(--ink-4); font-style: normal; }
  .g p { font-size: 15px; line-height: 1.55; color: var(--ink-2); }
  .fix { margin-top: var(--s3); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .fix div { padding: var(--s3); border-radius: var(--r-cell); font-size: 17px; }
  .fix small { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; }
  .fix .no { background: var(--paper-2); color: var(--ink-3); text-decoration: line-through; }
  .fix .no small { text-decoration: none; }
  .fix .yes { background: #fff; border: 1.5px solid var(--ink-1); }

  .write { display: flex; flex-wrap: wrap; gap: var(--s3); }
  .cell { width: 92px; height: 92px; border-radius: var(--r-cell); border: 1px solid var(--ink-5); background: #fff;
    background-image: linear-gradient(var(--ink-5), var(--ink-5)), linear-gradient(var(--ink-5), var(--ink-5)); background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat; }
  .cell svg { display: block; }

  .q { list-style: none; counter-reset: q; }
  .q li { counter-increment: q; padding: var(--s3) 0; }
  .q li + li { border-top: 1px solid var(--ink-5); }
  .q .t { font-size: 15px; font-weight: 600; }
  .q .t::before { content: counter(q) ". "; color: var(--ink-3); }
  .q .opts { margin-top: var(--s2); display: flex; flex-wrap: wrap; gap: 6px; }
  .q .opts span { padding: 6px 12px; border-radius: var(--r-pill); border: 1px solid var(--ink-5); font-size: 14px; }
  .q .opts .hz { font-size: 18px; }
  .q.show .opts .ans { border-color: var(--ink-1); background: #fff; font-weight: 600; }
  .q .kind { font-size: 12px; color: var(--ink-3); }
  .err { padding: 80px var(--s5); text-align: center; color: var(--ink-3); }
</style>
</head>
<body>
<div class="page" id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<script type="module">
import { $, $$, ic, go, play, audio, ended, loadChar, STROKE } from './step.js?v=9';

const id = new URLSearchParams(location.search).get('l') || 'h1-01';
const LV = { 1: 'HSK 1', 2: 'HSK 2', 3: 'HSK 3', 4: 'HSK 4', 5: 'HSK 5' };
const CASTS = { redpanda: { name: 'Gấu Đỏ', avatar: '../assets/avatars/redpanda.png' }, takin: { name: 'Linh Ngưu', avatar: '../assets/avatars/takin.png' } };

// h1-01 predates this format: adapt its exports (audio keys `a`, art `img`)
async function load() {
  const m = await import(`./data/${id}.js?v=4`);
  if (m.LESSON?.words) {
    const L = m.LESSON;
    L.words.forEach((w, i) => { w.key = `${id}/w${String(i + 1).padStart(2, '0')}`; w.pic = `../assets/words/${id}/w${String(i + 1).padStart(2, '0')}.png`; });
    Object.entries(L.sentences).forEach(([sid, s]) => (s.key = `${id}/${sid}`));
    return L;
  }
  const S = Object.fromEntries(Object.entries(m.SENTENCES).map(([k, s]) => [k, { ...s, key: s.a }]));
  const words = m.WORDS.map((w, i) => {
    const exId = `x${i}`; S[exId] = { hz: w.ex[0], py: w.ex[1], vi: w.ex[2], key: w.ex[3] };
    return { ...w, key: w.a, pic: `../assets/words/${w.img}.png`, ex: exId, pos: '' };
  });
  const G = m.GRAMMAR;
  return { ...m.LESSON, goal: 'Chào hỏi, xin lỗi, cảm ơn và tạm biệt', words, sentences: S,
    dialogue: m.DIALOGUE, grammar: [{ ...G, wrong: G.wrong }], writing: [...'你好们'], gate: [] };
}

let L;
try { L = await load(); } catch (e) { $('#root').innerHTML = `<p class="err">Chưa có bài <b>${id}</b>.</p>`; throw e; }
document.title = `${LV[L.level]} · Bài ${L.order} · ${L.title}`;
const font = new FontFace('UKai', `url(fonts/ukai-${id}.woff2)`); font.load().then((f) => document.fonts.add(f)).catch(() => {});
const S = L.sentences;
const show = { py: true, vi: true };
const sLine = (sid, cls = 's') => { const s = S[sid]; return `<button class="${cls}" data-s="${sid}"><span class="hz">${s.hz}</span><span class="py">${s.spoken || s.py}</span><span class="vi">${s.vi}</span></button>`; };
const toggles = (k) => `<div class="tgs" data-tg="${k}"><button class="tg" data-k="py" aria-pressed="true">${ic('regular-eye')}Pinyin</button><button class="tg" data-k="vi" aria-pressed="true">${ic('regular-eye')}Nghĩa</button></div>`;
const lines = L.dialogue.reduce((n, d) => n + d.lines.length, 0);

$('#root').innerHTML = `
<div class="hero"><img src="../assets/lessons/${id}.png" alt="" onerror="this.remove()"><a class="gbtn" href="lessons.html" aria-label="Về danh sách bài">${ic('regular-x')}</a></div>
<header>
  <p class="kicker">${LV[L.level]} · ${L.topic} · Bài ${L.order}</p>
  <h1>${L.title}<span class="hz">${L.titleHanzi}</span></h1>
  <p class="goal">${L.goal || ''}</p>
  <p class="meta">${L.words.length} từ mới · ${L.grammar.length} điểm ngữ pháp · hội thoại ${lines} câu${L.reading ? ` · bài đọc ${L.reading.lines.length} câu` : ''}</p>
</header>
<main>
  <section><div class="head"><h2>Từ mới<small>Bấm từ để nghe, mở ra xem chữ và ví dụ</small></h2></div>
    <ul class="words">${L.words.map((w, i) => `<li>
      <button class="w" data-w="${i}"><img src="${w.pic}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span><span class="line"><span class="hz">${w.hz}</span><span class="py">${w.say ? w.say.slice(0, 2).join('') : w.py}</span></span>
        <span class="line"><span class="hv">${w.hv}</span>${w.pos ? `<span class="pos">${w.pos}</span>` : ''}</span><span class="vi">${w.vi}</span></span>${go()}</button>
      <div class="more"><div class="chars">${(w.chars || []).map((c) => `<span class="chip"><span class="hz">${c[0]}</span>${c[2]} · ${c[3]}</span>`).join('')}${(w.parts || []).map((c) => `<span class="chip"><span class="hz">${c[0]}</span>${c[1]} · ${c[2]}</span>`).join('')}</div>
        <div class="ex">${sLine(w.ex)}</div></div></li>`).join('')}</ul></section>

  <section><div class="head"><h2>Ngữ pháp</h2></div>
    ${L.grammar.map((g) => `<div class="g"><h3>${g.title}</h3>
      <div class="pattern">${g.pattern.map((p) => `<span class="hz">${p}</span>`).join('<i>+</i>')}</div>
      <p>${g.explain}</p>${g.more ? `<p style="margin-top:8px">${g.more}</p>` : ''}
      ${g.examples.map((e) => sLine(e)).join('')}
      ${g.wrong ? `<div class="fix"><div class="no hz">${g.wrong[0]}<small>${ic('regular-x')} Sai</small></div><div class="yes hz">${g.wrong[1]}<small>${ic('bold-check')} Đúng</small></div></div>` : ''}</div>`).join('')}</section>

  <section id="dlg"><div class="head"><h2>Hội thoại</h2>${toggles('dlg')}</div>
    ${L.dialogue.map((d, di) => `<p class="part">Đoạn ${di + 1} · ${d.title}</p>${d.lines.map((sid) => { const s = S[sid], c = CASTS[s.speaker] || CASTS.redpanda, side = s.speaker === 'takin' ? 'R' : 'L';
      return `<button class="ln ${side}" data-s="${sid}"><img class="av" src="${c.avatar}" alt="${c.name}"><span><span class="hz">${s.hz}</span><span class="py">${s.spoken || s.py}</span><span class="vi">${s.vi}</span></span></button>`; }).join('')}`).join('')}
    <button class="playall" data-all="dlg">${ic('fill-play')}Nghe cả hội thoại</button></section>

  ${L.reading ? `<section id="rd"><div class="head"><h2>Bài đọc<small>${L.reading.title}</small></h2>${toggles('rd')}</div>
    <div class="reading">${L.reading.lines.map((sid) => sLine(sid)).join('')}</div>
    <button class="playall" data-all="rd">${ic('fill-play')}Nghe cả bài đọc</button></section>` : ''}

  <section><div class="head"><h2>Luyện viết<small>Bấm chữ để xem thứ tự nét</small></h2></div>
    <div class="write">${L.writing.map((c, i) => `<div class="cell" id="hw${i}" data-c="${c}"></div>`).join('')}</div></section>

  ${L.gate.length ? `<section><div class="head"><h2>Kiểm tra cuối bài<small>${L.gate.length} câu · cần đúng 80%. Bấm câu để xem đáp án</small></h2></div>
    <ol class="q">${L.gate.map((q) => { const isHz = q.kind === 'hz';
      const opts = q.t === 'order' ? q.tiles.map((t) => `<span class="hz">${t}</span>`).join('') + `<span class="ans hz">→ ${q.ans}</span>`
        : q.opts.map((o) => `<span class="${o === q.ans ? 'ans ' : ''}${isHz ? 'hz' : ''}">${o}</span>`).join('');
      return `<li${q.t === 'listen' ? ` data-s="${q.sid}"` : ''}><p class="kind">${{ choice: 'Chọn', listen: 'Nghe (bấm để nghe)', order: 'Xếp câu' }[q.t]}</p><p class="t">${q.title}</p><div class="opts">${opts}</div></li>`; }).join('')}</ol></section>` : ''}
</main>`;

// words: tap plays + opens
$$('.w').forEach((b) => (b.onclick = () => { const li = b.parentElement, w = L.words[+b.dataset.w]; play(w.key); li.classList.toggle('open'); }));
// sentences + dialogue lines
const light = (el) => { $$('.on[data-s]').forEach((x) => x.classList.remove('on')); el?.classList.add('on'); };
$$('button[data-s]').forEach((b) => (b.onclick = () => { light(b); play(S[b.dataset.s].key); ended().then(() => b.classList.remove('on')); }));
$$('.q li').forEach((li) => (li.onclick = () => { li.closest('.q').classList.add('show'); if (li.dataset.s) play(S[li.dataset.s].key); }));
// play all
$$('.playall').forEach((b) => (b.onclick = async () => {
  for (const el of $$(`#${b.dataset.all} button[data-s]`)) { light(el); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); await play(S[el.dataset.s].key); await ended(); }
  light(null);
}));
// pinyin / meaning toggles
$$('[data-tg]').forEach((g) => $$('.tg', g).forEach((t) => (t.onclick = () => {
  const sec = g.closest('section'), k = t.dataset.k, on = t.getAttribute('aria-pressed') !== 'true';
  t.setAttribute('aria-pressed', on); t.firstElementChild.outerHTML = ic(on ? 'regular-eye' : 'regular-eye-slash'); sec.classList.toggle(`no-${k}`, !on);
})));
// stroke order
$$('.cell').forEach((cell) => {
  const w = HanziWriter.create(cell.id, cell.dataset.c, { width: 92, height: 92, padding: 8, showOutline: true, strokeColor: STROKE.rest, radicalColor: STROKE.radical, outlineColor: STROKE.outline,
    strokeAnimationSpeed: 1.4, delayBetweenStrokes: 120, charDataLoader: loadChar });
  cell.onclick = () => w.animateCharacter();
});
</script>
</body>
</html>
