<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Báo lỗi nội dung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="roots.css?v=2">
<style>
  main { padding: 0 var(--s5) calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .top { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px var(--s2); background: var(--paper); }
  .top .t { text-align: center; font: 600 17px/1.3 var(--font-display); }
  .x { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--ink-2); border-radius: 50%; }
  .x .ic { transform: scaleX(-1); }
  .admin { display: inline-flex; align-items: center; gap: 5px; margin-top: var(--s2); padding: 4px 10px; border-radius: var(--r-pill); background: var(--paper-2); border: 1px solid var(--ink-5); font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .admin .ic { font-size: 14px; }
  h1 { margin-top: var(--s3); font: 700 var(--t-h2)/1.25 var(--font-display); }
  .sub { margin-top: 2px; font-size: 14px; color: var(--ink-3); }

  .seg { margin-top: var(--s4); display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: var(--r-pill); background: var(--paper-2); border: 1px solid var(--ink-5); }
  .seg button { min-height: 44px; border-radius: var(--r-pill); font-size: 15px; font-weight: 600; color: var(--ink-3); }
  .seg button small { font-weight: 500; margin-left: 4px; }
  .seg button[aria-pressed="true"] { background: var(--ink-1); color: var(--paper); }

  .chips { margin: var(--s3) calc(-1 * var(--s5)) 0; padding: 0 var(--s5); display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-pill); border: 1px solid var(--ink-5); background: rgba(255,255,255,.6); font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .chips button[aria-pressed="true"] { border-color: var(--ink-1); background: var(--ink-1); color: var(--paper); }

  .list { margin-top: var(--s4); list-style: none; border-radius: 18px; background: rgba(255,255,255,.55); border: 1px solid var(--ink-5); overflow: hidden; }
  .list > li + li { border-top: 1px solid var(--ink-5); }
  .rep { padding: var(--s4); }
  .ctx { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--s3); color: inherit; }
  .ctx .hz { font-size: 30px; line-height: 1.1; min-width: 40px; text-align: center; white-space: nowrap; }
  .ctx .hz.long { font-size: 22px; }
  .ctx .hz.ic-box { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--paper-2); font-size: 22px; color: var(--ink-1); }
  .ctx b { display: block; font-weight: 600; font-size: 15px; }
  .ctx small { display: block; font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: var(--s3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .tag { padding: 3px 10px; border-radius: var(--r-pill); background: var(--paper-2); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .who { font-size: 13px; color: var(--ink-3); }
  .note { margin-top: var(--s2); font-size: 15px; color: var(--ink-1); line-height: 1.45; }
  .note.none { color: var(--ink-4); }
  .act { margin-top: var(--s3); display: flex; }
  .done-btn { min-height: 44px; padding: 0 var(--s4); display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); border: 1px solid var(--ink-1); font-size: 14px; font-weight: 600; color: var(--ink-1); }
  .done-btn .ic { font-size: 18px; }
  .done-btn:active { background: var(--paper-2); }
  .ok { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; color: var(--ink-3); }
  .ok .ic { font-size: 18px; }
  .undo-link { margin-left: auto; min-height: 44px; padding: 0 var(--s2); font-size: 14px; font-weight: 600; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  .empty { margin-top: var(--s8); text-align: center; color: var(--ink-3); padding: 0 var(--s4); }
  .empty .hz { display: block; font-size: 56px; color: var(--ink-4); }
  .empty p { margin-top: var(--s2); }
  .empty b { color: var(--ink-1); font-weight: 600; font-family: var(--font-display); font-size: 19px; }

  .toast { position: fixed; z-index: 11; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; width: max-content; max-width: calc(100% - 40px);
    display: flex; align-items: center; gap: var(--s3); padding: 4px 6px 4px var(--s4); border-radius: var(--r-pill); background: var(--ink-1); color: var(--paper); font-size: 14px; font-weight: 500; transition: opacity .18s, transform .18s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { min-height: 44px; padding: 0 var(--s3); border-radius: var(--r-pill); font-size: 14px; font-weight: 700; color: #fff; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="top"><a class="x" id="back" href="t4-me.html" aria-label="Quay lại"><svg class="ic"><use href="icons.svg#i-regular-caret-right"/></svg></a><span class="t">Báo lỗi nội dung</span><span></span></div>
<main id="main"></main>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-u" type="button">Hoàn tác</button></div>

<script type="module">
if (/t4-me/.test(document.referrer)) document.getElementById('back').onclick = (e) => { e.preventDefault(); history.back(); };
const $ = (s) => document.querySelector(s);
const ic = (id, cls = 'ic') => `<svg class="${cls}"><use href="icons.svg#i-${id}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const KEY = 'chaiyo.a1.resolved';
if (new URLSearchParams(location.search).has('reset')) localStorage.removeItem(KEY);

const CATS = { nghia: 'Nghĩa sai', pinyin: 'Pinyin sai', amthanh: 'Âm thanh lỗi', khac: 'Khác' };
// Mock reports (demo data). w = word, l = lesson step.
const REPORTS = [
  { id: 'r1', cat: 'pinyin', w: '你好', note: 'Thẻ ghi nǐ hǎo nhưng audio đọc ní hǎo, hơi lăn tăn.', by: 'Lan', ago: '12 phút trước' },
  { id: 'r2', cat: 'amthanh', w: '谢谢', note: '', by: 'Minh', ago: '1 giờ trước' },
  { id: 'r3', cat: 'nghia', w: '您', note: 'Nghĩa “ông, bà, thầy cô” hơi dài, mình tưởng chỉ là “bạn (lịch sự)”.', by: 'Huy', ago: '3 giờ trước' },
  { id: 'r4', cat: 'khac', l: ['Bài 1 · Hội thoại · Gặp nhau', 'l3-words.html'], note: 'Câu thứ 3 bị lặp hai lần ở bước nghe.', by: 'Thảo', ago: '5 giờ trước' },
  { id: 'r5', cat: 'pinyin', w: '没关系', note: '', by: 'Quân', ago: 'Hôm qua' },
  { id: 'r6', cat: 'amthanh', w: '不客气', note: 'Audio bị cụt chữ cuối.', by: 'Lan', ago: 'Hôm qua' },
  { id: 'r7', cat: 'nghia', w: '你们', note: 'Muốn thêm ví dụ “các bạn” trong lớp học.', by: 'Minh', ago: '2 ngày trước' },
  { id: 'r8', cat: 'khac', l: ['Bài 1 · Kiểm tra · câu 4', 'l3-words.html'], note: 'Hai đáp án giống hệt nhau.', by: 'Huy', ago: '3 ngày trước' },
  { id: 'r9', cat: 'nghia', w: '再见', note: '', by: 'Thảo', ago: '4 ngày trước' },
  { id: 'r10', cat: 'amthanh', w: '对不起', note: 'Giọng Linh Ngưu nhỏ hơn các câu khác.', by: 'Quân', ago: '5 ngày trước' },
];
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
let resolved = load();
let cat = 'all', view = 'new', tt;
const save = () => localStorage.setItem(KEY, JSON.stringify(resolved));

function ctxHtml(r) {
  if (r.w) {
    const cls = r.w.length > 2 ? 'long' : '';
    return `<a class="ctx" href="w1-word.html?w=${encodeURIComponent(r.w)}"><span class="hz ${cls}">${r.w}</span><span><b>Từ mới · Bài 1</b><small>Mở thẻ từ ${esc(r.w)}</small></span></a>`;
  }
  return `<a class="ctx" href="${r.l[1]}"><span class="hz ic-box">${ic('fill-book-open-text')}</span><span><b>${esc(r.l[0])}</b><small>Mở danh sách từ của bài</small></span></a>`;
}
function card(r, isDone) {
  return `<li class="rep" data-id="${r.id}">${ctxHtml(r)}
    <div class="meta"><span class="tag">${CATS[r.cat]}</span><span class="who">${esc(r.by)} · ${r.ago}</span></div>
    <p class="note ${r.note ? '' : 'none'}">${r.note ? esc(r.note) : 'Không có ghi chú'}</p>
    <div class="act">${isDone
      ? `<span class="ok">${ic('fill-check')}Đã xử lý</span><button class="undo-link" data-undo="${r.id}" type="button">Mở lại</button>`
      : `<button class="done-btn" data-done="${r.id}" type="button">${ic('bold-check')}Đánh dấu đã xử lý</button>`}</div></li>`;
}
function render() {
  const open = REPORTS.filter((r) => !resolved.includes(r.id)), done = REPORTS.filter((r) => resolved.includes(r.id));
  const src = view === 'new' ? open : done;
  const xs = src.filter((r) => cat === 'all' || r.cat === cat);
  const count = (k) => src.filter((r) => k === 'all' || r.cat === k).length;
  let body;
  if (xs.length) body = `<ul class="list">${xs.map((r) => card(r, view === 'done')).join('')}</ul>`;
  else if (view === 'new' && !open.length) body = `<div class="empty"><span class="hz">安</span><p><b>Hộp thư sạch bong!</b></p><p>Không còn báo lỗi nào đang chờ. Nghỉ tay uống miếng trà đi nhé.</p></div>`;
  else if (view === 'new') body = `<div class="empty"><span class="hz">静</span><p><b>Mục này đang yên ắng</b></p><p>Không có báo lỗi “${CATS[cat]}” nào đang chờ.</p></div>`;
  else if (!done.length) body = `<div class="empty"><span class="hz">空</span><p><b>Chưa xử lý cái nào</b></p><p>Báo lỗi bạn đã xử lý sẽ nằm ở đây.</p></div>`;
  else body = `<div class="empty"><span class="hz">静</span><p><b>Mục này đang yên ắng</b></p><p>Chưa có báo lỗi “${CATS[cat]}” nào được xử lý.</p></div>`;
  $('#main').innerHTML = `
    <span class="admin">${ic('fill-shield')}Quản trị</span>
    <h1>Người học báo lỗi</h1><p class="sub">Dữ liệu demo: ${REPORTS.length} báo lỗi mẫu.</p>
    <div class="seg" role="group" aria-label="Trạng thái">
      <button type="button" data-view="new" aria-pressed="${view === 'new'}">Mới<small>${open.length}</small></button>
      <button type="button" data-view="done" aria-pressed="${view === 'done'}">Đã xử lý<small>${done.length}</small></button></div>
    <div class="chips" role="group" aria-label="Loại lỗi">
      ${[['all', 'Tất cả'], ...Object.entries(CATS)].map(([k, n]) => `<button type="button" data-cat="${k}" aria-pressed="${cat === k}">${n} · ${count(k)}</button>`).join('')}</div>
    ${body}`;
}
function toast(msg, undo) {
  $('#toast-t').textContent = msg; $('#toast-u').onclick = () => { undo(); $('#toast').classList.remove('show'); };
  $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), 4500);
}
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view) { view = b.dataset.view; render(); }
  else if (b.dataset.cat) { cat = b.dataset.cat; render(); }
  else if (b.dataset.done) {
    const id = b.dataset.done; resolved = [...resolved, id]; save(); render();
    toast('Đã xử lý xong, gọn gàng!', () => { resolved = resolved.filter((x) => x !== id); save(); render(); });
  } else if (b.dataset.undo) {
    const id = b.dataset.undo; resolved = resolved.filter((x) => x !== id); save(); render(); $('#toast').classList.remove('show');
  }
});
render();
</script>
</body>
</html>
