<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Kết quả xếp lớp · Chaiyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<link rel="stylesheet" href="onboard.css">
<style>
  .top { grid-template-columns: 44px 1fr 44px; }
  .top .t { text-align: center; }
  .eyebrow { margin-top: var(--s5); font-size: var(--t-meta); font-weight: 600; color: var(--vermilion-text); text-transform: uppercase; letter-spacing: .06em; }
  h1 { margin-top: var(--s1); font: 700 34px/1.15 var(--font-display); letter-spacing: -.01em; }
  h1 .hz { font-weight: 400; font-size: 28px; color: var(--ink-2); }
  dl { margin-top: var(--s5); border-top: 1px solid var(--ink-5); }
  dl div { display: grid; grid-template-columns: 96px 1fr; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--ink-5); }
  dt { font-size: var(--t-meta); color: var(--ink-3); padding-top: 2px; }
  dd { font-weight: 600; line-height: 1.4; }
  dd small { display: block; font-weight: 400; font-size: var(--t-meta); color: var(--ink-3); }
  main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); }
</style>
</head>
<body>
<div class="top">
  <a class="x" href="home-glass.html" aria-label="Về Hôm nay"><svg class="ic"><use href="icons.svg#i-regular-x"/></svg></a>
  <span class="t">Kết quả xếp lớp</span>
  <span></span>
</div>
<main id="main"></main>
<div class="foot"><a class="cta" id="cta"></a><a class="link" href="o2-placement.html">Làm lại bài kiểm tra</a></div>

<script type="module">
import { $, go, celebrate } from './step.js?v=9';
import { LEVELS } from './data/roadmap.js';

// From O2 via sessionStorage { passed }; ?p=0..5 demo override
const q = new URLSearchParams(location.search).get('p');
let r = { passed: 0 };
try { r = JSON.parse(sessionStorage.getItem('placement')) || r; } catch {}
if (q !== null) r = { passed: Math.min(Math.max(+q, 0), 5) };

// same global numbering as the roadmap
let n = 0;
const lv = LEVELS.map((L) => {
  const all = L.topics.flatMap((t) => t.lessons).map((x) => ({ n: ++n, vi: Array.isArray(x) ? x[0] : x, hz: Array.isArray(x) ? x[1] : '' }));
  return { ...L, all };
});
const fmt = (x) => x.toLocaleString('vi-VN');
const P = r.passed;

let html, label, href;
if (P === 0) {
  // no shame copy: Bài 0 is the normal start
  html = `<div class="pic"><img src="../assets/onboard/start-b0.png" alt="" onerror="this.src='../assets/home/lesson-next.png'"></div>
    <p class="eyebrow">Bạn bắt đầu ở</p><h1>Bài 0 · Nhập môn <span class="hz">拼音</span></h1>
    <p class="lead">Làm quen pinyin trước: thanh điệu, vận mẫu, thanh mẫu. 5 phần ngắn, nghe là chính. Nền chắc thì các bài sau nhanh hơn.</p>
    <dl><div><dt>Tiếp theo</dt><dd>HSK 1 · ${lv[0].all.length} bài<small>Bắt đầu từ Bài 1 · ${lv[0].all[0].vi}</small></dd></div></dl>`;
  label = 'Bắt đầu Bài 0'; href = 'l0-hub.html';
} else {
  const done = lv.slice(0, P), lastN = done.at(-1).all.at(-1).n;
  const words = done.reduce((s, L) => s + L.words, 0);
  const next = lv[P];
  const range = P > 1 ? `HSK 1–${P}` : 'HSK 1';
  html = `<div class="pic"><img src="../assets/onboard/placed.png" alt="" onerror="this.src='../assets/results/hsk1-pass.png'"></div>
    ${next
      ? `<p class="eyebrow">Bạn bắt đầu ở</p><h1>HSK ${next.level} · Bài ${next.all[0].n}</h1><p class="lead">${next.all[0].vi}${next.all[0].hz ? ` <span class="hz">${next.all[0].hz}</span>` : ''}</p>`
      : `<p class="eyebrow">Bạn đã qua</p><h1>Cả 5 cấp HSK</h1><p class="lead">Mọi bài đã mở. Thử Chuyên đề, hoặc làm thi thử để giữ phong độ.</p>`}
    <dl>
      <div><dt>Đã mở</dt><dd>${range} · Bài 0–${lastN}<small>Đánh dấu “qua bằng kiểm tra” trong lộ trình, học lại được</small></dd></div>
      <div><dt>Từ của tôi</dt><dd>+${fmt(words)} từ, chưa ôn<small>Có trong Luyện tập → Từ của tôi</small></dd></div>
      <div><dt>Ôn dần</dt><dd>~20 từ mỗi ngày<small>Xen với bài mới, không dồn ôn hết trong hôm nay</small></dd></div>
    </dl>`;
  label = next ? `Bắt đầu Bài ${next.all[0].n}` : 'Xem Chuyên đề';
  href = next ? `t2-roadmap.html#lv${next.level}` : 't2-roadmap.html#tracks';   // prototype: only Bài 1 has a lesson page
}
$('#main').innerHTML = `<div class="step">${html}</div>`;
$('#cta').innerHTML = label + go(); $('#cta').href = href;
if (P >= 2) setTimeout(() => celebrate({ big: P >= 4 }), 250);   // start at HSK 3+ only; HSK 5 / all passed = bigger burst
</script>
</body>
</html>
