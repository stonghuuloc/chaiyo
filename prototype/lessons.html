<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<title>Bài đầu tiên mỗi cấp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="lesson.css">
<style>
  .page { background: var(--paper); min-height: 100dvh; padding: calc(env(safe-area-inset-top, 0px) + 28px) var(--s5) 48px; }
  h1 { font: 600 var(--t-hero)/1.1 var(--font-display); }
  .lede { margin-top: var(--s2); font-size: 15px; color: var(--ink-3); }
  ul { list-style: none; margin-top: var(--s5); }
  li + li { border-top: 1px solid var(--ink-5); }
  a { display: grid; grid-template-columns: 96px 1fr 16px; gap: var(--s3); align-items: center; padding: var(--s4) 0; }
  img { width: 96px; height: 64px; border-radius: var(--r-cell); object-fit: cover; background: var(--paper-2); }
  .k { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--vermilion-text); }
  b { display: block; font: 600 17px/1.3 var(--font-display); }
  small { font-size: 13px; color: var(--ink-3); }
  .go { color: var(--ink-4); }
</style>
</head>
<body>
<div class="page">
  <h1>Bài đầu tiên mỗi cấp</h1>
  <p class="lede">Bản xem nhanh nội dung: từ mới, ngữ pháp, hội thoại, bài đọc, luyện viết và bài kiểm tra.</p>
  <ul id="list"></ul>
</div>
<script type="module">
import { ic } from './step.js?v=9';
const ROWS = [
  ['h1-01', 'HSK 1', 'Xin chào', '你好', 'Chào hỏi'],
  ['h2-01', 'HSK 2', 'Mấy giờ bạn dậy?', '你几点起床', 'Thói quen hằng ngày'],
  ['h3-01', 'HSK 3', 'Kỳ thi sắp đến', '考试就要到了', 'Trường lớp'],
  ['h4-01', 'HSK 4', 'Bạn bè thân thiết', '亲密的朋友', 'Quan hệ'],
  ['h5-01', 'HSK 5', 'Thành thị và nông thôn', '城市与乡村', 'Xã hội'],
];
document.getElementById('list').innerHTML = ROWS.map(([id, lv, t, hz, topic]) => `<li><a href="lesson.html?l=${id}">
  <img src="../assets/lessons/${id}.png" alt="" onerror="this.style.visibility='hidden'">
  <span><span class="k">${lv} · Bài 1</span><b>${t}</b><small>${hz} · ${topic}</small></span>${ic('regular-caret-right', 'ic go')}</a></li>`).join('');
</script>
</body>
</html>
