<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Hồ sơ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="roots.css?v=2">
<style>
  main { padding: 0 var(--s5) calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .top { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px var(--s2); background: var(--paper); }
  .top .t { text-align: center; font: 600 17px/1.3 var(--font-display); }
  .x { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--ink-2); border-radius: 50%; }
  .x .ic { transform: scaleX(-1); }

  .head { margin-top: var(--s4); text-align: center; }
  .av { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font: 600 38px var(--font-display); }
  .head h1 { margin-top: var(--s3); font: 600 26px/1.15 var(--font-display); }
  .chip { display: inline-block; margin-top: var(--s2); padding: 4px 12px; border-radius: var(--r-pill); background: var(--paper-2); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }

  .stats { margin-top: var(--s5); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 18px; background: #fff; box-shadow: 0 1px 0 rgba(45,25,10,.04), 0 10px 28px rgba(45,25,10,.08); }
  .stats div { padding: var(--s4) var(--s2); text-align: center; }
  .stats div + div { border-left: 1px solid var(--ink-5); }
  .stats b { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 600 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
  .stats b .ic { font-size: 20px; color: var(--vermilion); --duo: 1; --duo-c: #f2cfc6; }
  .stats span { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-3); }

  .btn { margin-top: var(--s4); width: 100%; height: 58px; display: flex; align-items: center; justify-content: center; gap: var(--s2); border-radius: var(--r-cta); font: 600 var(--t-cta) var(--font-display); transition: transform .12s, background .12s; }
  .btn:active { transform: scale(.985); }
  .btn.pri { background: var(--vermilion); color: #fff; box-shadow: 0 10px 24px rgba(168, 38, 20, .28), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn.pri:active { background: var(--vermilion-press); }
  .btn.out { background: transparent; color: var(--ink-2); border: 1px solid var(--ink-4); }
  .btn .ic { font-size: 20px; }

  section { margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--ink-5); }
  section h2 { font: 600 19px/1.2 var(--font-display); }
  .sub { margin-top: 2px; font-size: 14px; color: var(--ink-3); }
  .badges { margin: var(--s3) calc(-1 * var(--s5)) 0; padding: 0 var(--s5); display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; }
  .badges::-webkit-scrollbar { display: none; }
  .bd { flex: none; width: 116px; padding: var(--s3) var(--s2); border-radius: 18px; background: #fff; text-align: center; }
  .bd img { display: block; margin: 0 auto; width: 84px; height: 84px; border-radius: 50%; }
  .bd b { display: block; margin-top: var(--s2); font-size: 13.5px; font-weight: 600; line-height: 1.25; }

  .hid { margin-top: var(--s8); text-align: center; }
  .hid .ic { font-size: 56px; color: var(--ink-4); }
  .hid h1 { margin-top: var(--s3); font: 600 23px/1.2 var(--font-display); }
  .hid p { margin: var(--s2) auto 0; max-width: 28ch; font-size: 15px; color: var(--ink-3); }

  .toast { position: fixed; z-index: 11; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translate(-50%, -8px); opacity: 0; pointer-events: none; width: max-content; max-width: calc(100% - 40px);
    padding: 10px var(--s4); border-radius: var(--r-pill); background: var(--ink-1); color: var(--paper); font-size: 14px; font-weight: 500; transition: opacity .18s, transform .18s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="top"><a class="x" id="back" href="u2-friends.html" aria-label="Quay lại"><svg class="ic"><use href="icons.svg#i-regular-caret-right"/></svg></a><span class="t">Hồ sơ</span><span></span></div>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { byId, badgesOf, follows, setFollow } from './data/friends.js?v=2';
if (/u2-friends/.test(document.referrer)) document.getElementById('back').onclick = (e) => { e.preventDefault(); history.back(); };
const $ = (s) => document.querySelector(s);
const ic = (id, cls = 'ic') => `<svg class="${cls}"><use href="icons.svg#i-${id}"/></svg>`;
let tt; const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); };
const l = byId(new URLSearchParams(location.search).get('u'));

if (!l) {
  $('#main').innerHTML = `<div class="hid">${ic('fill-magnifer')}<h1>Không thấy người này</h1><p>Link hơi lạc đường rồi. Quay lại tìm bạn nhé.</p></div>`;
} else if (l.hidden) {
  $('#main').innerHTML = `<div class="hid">${ic('fill-user-block')}<h1>Hồ sơ đang ẩn</h1><p>Bạn này chọn giữ hồ sơ cho riêng mình. Tôn trọng nha!</p></div>`;
} else {
  const render = () => {
    const on = follows().includes(l.id);
    const bs = badgesOf(l);
    $('#main').innerHTML = `
      <div class="head"><span class="av" style="background:${l.bg};color:${l.fg}" aria-hidden="true">${l.initial}</span>
        <h1>${l.name}</h1><span class="chip">HSK ${l.hsk}</span></div>
      <div class="stats">
        <div><b>Bài ${l.lesson}</b><span>Đang học</span></div>
        <div><b>${ic('fill-fire')}${l.streak}</b><span>Chuỗi ngày</span></div>
        <div><b>${l.words}</b><span>Từ đã biết</span></div>
      </div>
      <button class="btn ${on ? 'out' : 'pri'}" id="fol" aria-pressed="${on}">${on ? ic('bold-check') + 'Đang theo dõi' : 'Theo dõi ' + l.name}</button>
      <section><h2>Huy hiệu</h2><p class="sub">${l.name} có ${bs.length} huy hiệu.</p>
        <div class="badges">${bs.map((b) => `<div class="bd"><img src="../assets/badges/${b.id}.png?v=1" alt="" loading="lazy"><b>${b.t}</b></div>`).join('')}</div></section>`;
    $('#fol').onclick = () => { const next = !on; setFollow(l.id, next); toast(next ? `Đã theo dõi ${l.name}` : `Đã bỏ theo dõi ${l.name}`); render(); };
  };
  render();
  addEventListener('pageshow', (e) => e.persisted && render());
}
</script>
</body>
</html>
