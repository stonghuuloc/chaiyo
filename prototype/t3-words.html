<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../static/brand/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="../static/brand/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../static/brand/apple-touch-icon.png?v=2">
<title>Từ của tôi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="roots.css?v=2">
<style>
  @font-face { font-family: "UKaiDict"; src: url("fonts/ukai-dict.woff2?v=1") format("woff2"); font-display: swap; }
  :root { --font-hanzi: "UKaiDict", "Kaiti SC", "STKaiti", "KaiTi", serif; }
  main { padding: 0 var(--s5) calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .top { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px var(--s2); background: var(--paper); }
  .top .t { text-align: center; font: 600 17px/1.3 var(--font-display); }
  .x { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--ink-2); border-radius: 50%; }
  .x .ic { transform: scaleX(-1); }
  .cta { margin-top: var(--s4); width: 100%; height: 58px; display: flex; align-items: center; justify-content: center; gap: var(--s3); border-radius: var(--r-cta); background: var(--vermilion); color: #fff; font: 600 var(--t-cta) var(--font-display); box-shadow: 0 10px 24px rgba(168, 38, 20, .28), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .12s, background .12s; }
  .cta:active { transform: scale(.985); background: var(--vermilion-press); }
  .cta .ic { font-size: 22px; } .cta .go { font-size: 18px; opacity: .85; }
  .today.clear { background: transparent; box-shadow: none; border: 1px solid var(--ink-5); }

  .tools { margin-top: var(--s6, 28px); display: grid; gap: var(--s3); }
  .tools h3 { font-size: var(--t-meta); font-weight: 600; color: var(--ink-3); }
  .box { position: relative; }
  .box .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--ink-3); pointer-events: none; }
  .box input { width: 100%; height: 46px; padding: 0 16px 0 42px; border-radius: var(--r-pill); border: 1px solid var(--ink-5); background: rgba(255,255,255,.6); font: 500 16px var(--font-ui); color: var(--ink-1); outline: 0; -webkit-appearance: none; }
  .box input:focus { border-color: var(--ink-1); }

  .words { list-style: none; margin-top: var(--s2); }
  .words li + li { border-top: 1px solid var(--ink-5); }
  .words a { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; gap: var(--s3); min-height: 68px; padding: var(--s2) 0; }
  .words .h { font-size: 28px; line-height: 1.1; white-space: nowrap; }
  .words .h.long { font-size: 21px; }
  .words .h.xl { font-size: 16px; }
  .words b { display: block; font-weight: 600; font-size: 16px; }
  .words b small { font-weight: 400; font-size: 14px; color: var(--ink-3); margin-left: 6px; }
  .words .vi { display: block; margin-top: 2px; font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .mem { justify-self: end; text-align: right; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .mem.now { color: var(--vermilion-text); font-weight: 600; }
  .bars { display: inline-flex; gap: 3px; align-items: flex-end; height: 14px; margin-bottom: 4px; }
  .bars i { width: 5px; border-radius: 2px; background: var(--ink-5); }
  .bars i:nth-child(1) { height: 6px; } .bars i:nth-child(2) { height: 10px; } .bars i:nth-child(3) { height: 14px; }
  .bars.s1 i:nth-child(-n+1), .bars.s2 i:nth-child(-n+2), .bars.s3 i { background: var(--ink-1); }
  .mem small { display: block; }
  .legend { margin-top: var(--s4); font-size: 12.5px; color: var(--ink-4); }

  .empty { margin-top: var(--s8); text-align: center; color: var(--ink-3); }
  .empty .hz { display: block; font-size: 56px; color: var(--ink-4); }
  .empty p { margin-top: var(--s2); }
  .empty b { color: var(--ink-1); font-weight: 600; }
  .none { padding: var(--s5) 0; color: var(--ink-3); font-size: 15px; }
</style>
</head>
<body>

<div class="top"><a class="x" id="back" href="t3-practice.html" aria-label="Quay lại"><svg class="ic"><use href="icons.svg#i-regular-caret-right"/></svg></a><span class="t">Từ của tôi</span><span></span></div>
<main id="main"></main>

<script type="module">
import { lexicon, strength, resetReviews } from './data/lexicon.js?v=5';
if (/t3-practice/.test(document.referrer)) document.getElementById('back').onclick = (e) => { e.preventDefault(); history.back(); };
const $ = (s) => document.querySelector(s);
const ic = (id, cls = 'ic') => `<svg class="${cls}"><use href="icons.svg#i-${id}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const P = new URLSearchParams(location.search);
const EMPTY = P.has('empty');                        // ?empty demo: brand-new learner
if (P.has('reset')) resetReviews();                  // ?reset demo: back to the seeded review state
let q = '';

function row(w) {
  const s = strength(w), now = Object.values(w.sk).some((e) => e.state === 'due');
  const note = now ? 'cần ôn hôm nay' : !w.tries ? 'chưa ôn' : '';
  return `<li><a href="w1-word.html?w=${encodeURIComponent(w.hz)}">
    <span class="hz h ${w.hz.length > 4 ? 'xl' : w.hz.length > 2 ? 'long' : ''}">${w.hz}</span>
    <span><b>${esc(w.py)}<small>${esc(w.hv)}</small></b><span class="vi">${esc(w.vi)}</span></span>
    <span class="mem ${now ? 'now' : ''}"><span class="bars s${s}" role="img" aria-label="Độ nhớ ${s}/3"><i></i><i></i><i></i></span>${note ? `<small>${note}</small>` : ''}</span></a></li>`;
}
const fold = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
function list(all) {
  const f = fold(q.trim());
  const xs = all.filter((w) => !f || [w.hz, w.py, w.hv, w.vi].some((x) => fold(x).includes(f)));
  // words due today first, then weakest
  const due = (w) => (Object.values(w.sk).some((e) => e.state === 'due') ? 0 : 1);
  return xs.length ? [...xs].sort((a, b) => due(a) - due(b) || strength(a) - strength(b)).map(row).join('') : `<li class="none">Không có từ nào khớp “${esc(q)}”.</li>`;
}
function render() {
  const all = EMPTY ? [] : lexicon();
  if (!all.length) {
    $('#main').innerHTML = `<div class="empty"><span class="hz">字</span><p><b>Chưa có từ nào</b></p><p>Học Bài 1 để có từ đầu tiên.</p></div>
      <button class="cta" onclick="location.href='l1-hub.html'">Học Bài 1${ic('regular-caret-right', 'ic go')}</button>`;
    return;
  }
  $('#main').innerHTML = `
    <div class="tools"><h3>${all.length} từ đã học và đã lưu</h3>
      <label class="box">${ic('fill-magnifer')}<input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Tìm trong từ của bạn" aria-label="Tìm trong từ của bạn" value="${esc(q)}"></label></div>
    <ul class="words" id="list">${list(all)}</ul>
    <p class="legend">Cột = độ nhớ trên thẻ từ. Luyện đúng thì cột tăng, quên thì từ quay lại sớm hơn.</p>`;
  $('#q').oninput = (e) => { q = e.target.value; $('#list').innerHTML = list(all); };
}
render();
addEventListener('pageshow', (e) => e.persisted && render());   // back from a session via bfcache
</script>
</body>
</html>
