id: h1-09
level: 1
topic: Quốc tịch và ngôn ngữ
order: 9
title: Ngôn ngữ
titleHanzi: 汉语
goal: Nói mình biết hay không biết tiếng Trung; hỏi bằng câu chính phản
scene:
  file: lessons/h1-09.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They sit at a desk with a stack of Chinese character cards; the red panda holds up one card and the takin reads it with one paw on its chin.
sentences:
  - id: s-h1-09-01
    hanzi: 你会说汉语吗？
    pinyin: nǐ huì shuō Hànyǔ ma?
    vi: Cậu biết nói tiếng Trung không?
    speaker: takin
  - id: s-h1-09-02
    hanzi: 我会说汉语。
    pinyin: wǒ huì shuō Hànyǔ.
    vi: Tớ biết nói tiếng Trung.
    speaker: redpanda
  - id: s-h1-09-03
    hanzi: 你会写汉字吗？
    pinyin: nǐ huì xiě hànzì ma?
    vi: Cậu biết viết chữ Hán không?
    speaker: redpanda
  - id: s-h1-09-04
    hanzi: 我会写，也会读。
    pinyin: wǒ huì xiě, yě huì dú.
    vi: Tớ biết viết, cũng biết đọc.
    speaker: takin
  - id: s-h1-09-05
    hanzi: 你能读这个字吗？
    pinyin: nǐ néng dú zhège zì ma?
    vi: Cậu đọc được chữ này không?
    speaker: redpanda
  - id: s-h1-09-06
    hanzi: 能，这个字是“好”。
    pinyin: néng, zhège zì shì hǎo.
    vi: Được, chữ này là “好”.
    speaker: takin
  - id: s-h1-09-07
    hanzi: 你会不会说中文？
    pinyin: nǐ huì bu huì shuō Zhōngwén?
    vi: Cậu có biết nói tiếng Trung không?
    speaker: redpanda
  - id: s-h1-09-08
    hanzi: 我不会说中文。
    pinyin: wǒ bù huì shuō Zhōngwén.
    vi: Tớ không biết nói tiếng Trung.
    speaker: takin
  - id: s-h1-09-09
    hanzi: 你是不是中国人？
    pinyin: nǐ shì bu shì Zhōngguó rén?
    vi: Cậu có phải người Trung Quốc không?
    speaker: redpanda
  - id: s-h1-09-10
    hanzi: 对，我是中国人。
    pinyin: duì, wǒ shì Zhōngguó rén.
    vi: Đúng, tớ là người Trung Quốc.
    speaker: takin
  - id: s-h1-09-11
    hanzi: 他会说汉语，也会写汉字。
    pinyin: tā huì shuō Hànyǔ, yě huì xiě hànzì.
    vi: Anh ấy biết nói tiếng Trung, cũng biết viết chữ Hán.
  - id: s-h1-09-12
    hanzi: 我不会读这个字。
    pinyin: wǒ bù huì dú zhège zì.
    vi: Tôi không biết đọc chữ này.
  - id: s-h1-09-13
    hanzi: 你能说中文吗？
    pinyin: nǐ néng shuō Zhōngwén ma?
    vi: Bạn nói được tiếng Trung không?
  - id: s-h1-09-14
    hanzi: 她是不是老师？
    pinyin: tā shì bu shì lǎoshī?
    vi: Cô ấy có phải giáo viên không?
  - id: s-h1-09-15
    hanzi: 我不能说汉语。
    pinyin: wǒ bù néng shuō Hànyǔ.
    vi: Tôi không thể nói tiếng Trung.
