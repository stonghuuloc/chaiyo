id: h1-35
level: 1
topic: Mua sắm
order: 35
title: Cửa hàng
titleHanzi: 商店
goal: Nói đã mua bao nhiêu với 了; phủ định việc đã qua với 没; hỏi cửa hàng mở, đóng cửa
scene:
  file: lessons/h1-35.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at the door of a small bookstore inside a shopping mall; the red panda holds a stack of three books and the takin looks into an empty wallet.
sentences:
  - id: s-h1-35-01
    hanzi: 你昨天去书店了吗？
    pinyin: nǐ zuótiān qù shūdiàn le ma?
    vi: Hôm qua cậu có đi nhà sách không?
    speaker: takin
  - id: s-h1-35-02
    hanzi: 去了，我买了三本书。
    pinyin: qù le, wǒ mǎi le sān běn shū.
    vi: Có, tớ mua ba quyển sách.
    speaker: redpanda
  - id: s-h1-35-03
    hanzi: 你买了几本汉语书？
    pinyin: nǐ mǎi le jǐ běn Hànyǔ shū?
    vi: Cậu mua mấy quyển sách tiếng Trung?
    speaker: takin
  - id: s-h1-35-04
    hanzi: 我买了两本，没买别的。
    pinyin: wǒ mǎi le liǎng běn, méi mǎi bié de.
    vi: Tớ mua hai quyển, không mua cái khác.
    speaker: redpanda
  - id: s-h1-35-05
    hanzi: 你的钱包呢？
    pinyin: nǐ de qiánbāo ne?
    vi: Ví của cậu đâu?
    speaker: takin
  - id: s-h1-35-06
    hanzi: 我今天没拿钱包。
    pinyin: wǒ jīntiān méi ná qiánbāo.
    vi: Hôm nay tớ không mang ví.
    speaker: redpanda
  - id: s-h1-35-07
    hanzi: 没关系，我们去商场吧，我有钱。
    pinyin: méi guānxi, wǒmen qù shāngchǎng ba, wǒ yǒu qián.
    vi: Không sao, tụi mình đi trung tâm thương mại đi, tớ có tiền.
    speaker: takin
  - id: s-h1-35-08
    hanzi: 商场几点关门？
    pinyin: shāngchǎng jǐ diǎn guān mén?
    vi: Trung tâm thương mại mấy giờ đóng cửa?
    speaker: redpanda
  - id: s-h1-35-09
    hanzi: 晚上十点关门。
    pinyin: wǎnshang shí diǎn guān mén.
    vi: Mười giờ tối đóng cửa.
    speaker: takin
  - id: s-h1-35-10
    hanzi: 那个商店开门了吗？
    pinyin: nàge shāngdiàn kāi mén le ma?
    vi: Cửa hàng kia mở cửa chưa?
    speaker: redpanda
  - id: s-h1-35-11
    hanzi: 还没开门。
    pinyin: hái méi kāi mén.
    vi: Vẫn chưa mở cửa.
    speaker: takin
  - id: s-h1-35-12
    hanzi: 你买门票了吗？
    pinyin: nǐ mǎi ménpiào le ma?
    vi: Cậu mua vé vào cửa chưa?
    speaker: takin
  - id: s-h1-35-13
    hanzi: 买了，我在门口买了两个人的门票。
    pinyin: mǎi le, wǒ zài ménkǒu mǎi le liǎng ge rén de ménpiào.
    vi: Mua rồi, tớ mua vé cho hai người ở cửa.
    speaker: redpanda
  - id: s-h1-35-14
    hanzi: 妈妈在商店买了一个钱包。
    pinyin: māma zài shāngdiàn mǎi le yí ge qiánbāo.
    vi: Mẹ mua một cái ví ở cửa hàng.
  - id: s-h1-35-15
    hanzi: 我昨天没去商场。
    pinyin: wǒ zuótiān méi qù shāngchǎng.
    vi: Hôm qua tớ không đi trung tâm thương mại.
  - id: s-h1-35-16
    hanzi: 请关门。
    pinyin: qǐng guān mén.
    vi: Làm ơn đóng cửa.
