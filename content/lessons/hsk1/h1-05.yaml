  - { id: s-h1-05-10, hanzi: 我八岁。, pinyin: wǒ bā suì., vi: Tôi tám tuổi. }
  - { id: s-h1-05-11, hanzi: 我十岁，你呢？, pinyin: "wǒ shí suì, nǐ ne?", vi: "Tôi mười tuổi, còn bạn?" }
