id: h1-27
level: 1
topic: Thời tiết và đi lại
order: 27
title: Thời tiết
titleHanzi: 天气
goal: Nói thời tiết hôm nay; nói tình hình đã đổi bằng 了; nói câu thời tiết không cần chủ ngữ
scene:
  file: lessons/h1-27.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a window on a cold, windy, rainy morning; rain runs down the glass, the red panda wraps itself in a scarf and the takin points at the clock.
sentences:
  - id: s-h1-27-01
    hanzi: 今天天气好吗？
    pinyin: jīntiān tiānqì hǎo ma?
    vi: Hôm nay thời tiết có đẹp không?
    speaker: takin
  - id: s-h1-27-02
    hanzi: 不好，下雨了。
    pinyin: bù hǎo, xià yǔ le.
    vi: Không đẹp, mưa rồi.
    speaker: redpanda
  - id: s-h1-27-03
    hanzi: 外边冷吗？
    pinyin: wàibian lěng ma?
    vi: Bên ngoài có lạnh không?
    speaker: takin
  - id: s-h1-27-04
    hanzi: 很冷，还有风。
    pinyin: hěn lěng, hái yǒu fēng.
    vi: Lạnh lắm, còn có gió nữa.
    speaker: redpanda
  - id: s-h1-27-05
    hanzi: 昨天很热，今天冷了。
    pinyin: zuótiān hěn rè, jīntiān lěng le.
    vi: Hôm qua nóng lắm, hôm nay lạnh rồi.
    speaker: takin
  - id: s-h1-27-06
    hanzi: 太冷了！我想在家休息。
    pinyin: tài lěng le! wǒ xiǎng zài jiā xiūxi.
    vi: Lạnh quá! Tớ muốn ở nhà nghỉ ngơi.
    speaker: redpanda
  - id: s-h1-27-07
    hanzi: 现在几点了？
    pinyin: xiànzài jǐ diǎn le?
    vi: Bây giờ mấy giờ rồi?
    speaker: redpanda
  - id: s-h1-27-08
    hanzi: 八点了，你晚了！
    pinyin: bā diǎn le, nǐ wǎn le!
    vi: Tám giờ rồi, cậu muộn rồi!
    speaker: takin
  - id: s-h1-27-09
    hanzi: 外边还下雨吗？
    pinyin: wàibian hái xià yǔ ma?
    vi: Bên ngoài còn mưa không?
    speaker: redpanda
  - id: s-h1-27-10
    hanzi: 不下雨了，你快去学校。
    pinyin: bù xià yǔ le, nǐ kuài qù xuéxiào.
    vi: Hết mưa rồi, cậu đi học nhanh lên.
    speaker: takin
  - id: s-h1-27-11
    hanzi: 白天很热，晚上很冷。
    pinyin: báitiān hěn rè, wǎnshang hěn lěng.
    vi: Ban ngày rất nóng, buổi tối rất lạnh.
  - id: s-h1-27-12
    hanzi: 下雨了，我们回家。
    pinyin: xià yǔ le, wǒmen huí jiā.
    vi: Mưa rồi, chúng tôi về nhà.
  - id: s-h1-27-13
    hanzi: 晚上有风，天气冷了。
    pinyin: wǎnshang yǒu fēng, tiānqì lěng le.
    vi: Buổi tối có gió, trời lạnh rồi.
  - id: s-h1-27-14
    hanzi: 我饿了，想吃饭。
    pinyin: wǒ è le, xiǎng chī fàn.
    vi: Tôi đói rồi, muốn ăn cơm.
  - id: s-h1-27-15
    hanzi: 今天很热，明天下雨。
    pinyin: jīntiān hěn rè, míngtiān xià yǔ.
    vi: Hôm nay nóng, ngày mai mưa.
