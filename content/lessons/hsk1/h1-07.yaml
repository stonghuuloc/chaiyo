id: h1-07
level: 1
topic: Gia đình
order: 7
title: Nghề nghiệp
titleHanzi: 工作
goal: Hỏi và nói nghề nghiệp của người nhà; phủ định bằng 不, nói “đều” bằng 都
scene:
  file: lessons/h1-07.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand outside a small hospital building with a red cross on the door; the red panda points at it with one paw and the takin holds a clipboard.
sentences:
  - id: s-h1-07-01
    hanzi: 你爸爸做什么工作？
    pinyin: nǐ bàba zuò shénme gōngzuò?
    vi: Bố cậu làm nghề gì?
    speaker: takin
  - id: s-h1-07-02
    hanzi: 他是医生。
    pinyin: tā shì yīshēng.
    vi: Bố tớ là bác sĩ.
    speaker: redpanda
  - id: s-h1-07-03
    hanzi: 你妈妈也是医生吗？
    pinyin: nǐ māma yě shì yīshēng ma?
    vi: Mẹ cậu cũng là bác sĩ à?
    speaker: takin
  - id: s-h1-07-04
    hanzi: 不，她不是医生，她是老师。
    pinyin: bù, tā bù shì yīshēng, tā shì lǎoshī.
    vi: Không, mẹ tớ không phải bác sĩ, mẹ là giáo viên.
    speaker: redpanda
  - id: s-h1-07-05
    hanzi: 爸爸、妈妈都有工作。
    pinyin: bàba, māma dōu yǒu gōngzuò.
    vi: Bố mẹ tớ đều có việc làm.
    speaker: redpanda
  - id: s-h1-07-06
    hanzi: 你哥哥、姐姐都是学生吗？
    pinyin: nǐ gēge, jiějie dōu shì xuésheng ma?
    vi: Anh chị cậu đều là học sinh à?
    speaker: takin
  - id: s-h1-07-07
    hanzi: 不，哥哥是工人，姐姐是学生。
    pinyin: bù, gēge shì gōngrén, jiějie shì xuésheng.
    vi: Không, anh tớ là công nhân, chị tớ là học sinh.
    speaker: redpanda
  - id: s-h1-07-08
    hanzi: 这是医院。
    pinyin: zhè shì yīyuàn.
    vi: Đây là bệnh viện.
    speaker: takin
  - id: s-h1-07-09
    hanzi: 那个先生是医生吗？
    pinyin: nàge xiānsheng shì yīshēng ma?
    vi: Ông kia là bác sĩ à?
    speaker: redpanda
  - id: s-h1-07-10
    hanzi: 是，他是医生。那个老人不是医生。
    pinyin: shì, tā shì yīshēng. nàge lǎorén bù shì yīshēng.
    vi: Đúng, ông ấy là bác sĩ. Cụ già kia không phải bác sĩ.
    speaker: takin
  - id: s-h1-07-11
    hanzi: 那个老人是谁？
    pinyin: nàge lǎorén shì shéi?
    vi: Cụ già kia là ai?
    speaker: redpanda
  - id: s-h1-07-12
    hanzi: 他是我爸爸的朋友。
    pinyin: tā shì wǒ bàba de péngyou.
    vi: Cụ ấy là bạn của bố tớ.
    speaker: takin
  - id: s-h1-07-13
    hanzi: 我们都是学生。
    pinyin: wǒmen dōu shì xuésheng.
    vi: Chúng tôi đều là học sinh.
  - id: s-h1-07-14
    hanzi: 我不做医生。
    pinyin: wǒ bù zuò yīshēng.
    vi: Tôi không làm bác sĩ.
  - id: s-h1-07-15
    hanzi: 他爸爸是工人。
    pinyin: tā bàba shì gōngrén.
    vi: Bố anh ấy là công nhân.
