  spelling:
    cards:
      - title: i, u, ü đứng đầu → y, w, yu
        explain: Khi vần bắt đầu bằng i, u, ü mà không có phụ âm đầu, viết thành yi, wu, yu.
        syllables:
          - yī
          - wǔ
          - yú
      - title: ü mất hai chấm sau j, q, x, y
        explain: "Sau j, q, x, y chỉ có thể là ü nên viết u: qù, jú, yú. Sau n, l vẫn giữ hai chấm: nǚ, lǚ."
        syllables:
          - qù
          - jú
          - nǚ
          - lǚ
      - title: iou → iu, uei → ui, uen → un
        explain: "Sau phụ âm, ba vần này viết gọn: liù, duì, chūn, không viết liou, duei, chuen."
        syllables:
          - liù
          - duì
          - chūn
      - title: Dấu thanh đặt ở đâu
        explain: "Ưu tiên a, rồi o hoặc e. Trong iu và ui, dấu đặt ở chữ thứ hai: liù, duì."
        syllables:
          - hǎo
          - ōu
          - yě
          - liù
          - duì
    drills:
      - id: q-h0-00-spelling-01
        type: choice
        tests: {}
