          - wu
          - u
          - vu
        answer: 0
        why: u đứng đầu viết thành w
  sandhi:
    cards:
      - title: Thanh 3 + thanh 3
        explain: Hai thanh 3 liền nhau thì chữ đầu đọc thành thanh 2. Nhưng pinyin vẫn viết nǐ hǎo, không viết ní hǎo.
        syllables:
          - say: nǐ hǎo
            hanzi: 你好
          - say: hěn hǎo
            hanzi: 很好
          - say: shuǐ guǒ
            hanzi: 水果
      - title: Nửa thanh 3
        explain: Thanh 3 đứng trước thanh 1, 2, 4 hoặc thanh nhẹ thì chỉ xuống thấp, không lên lại.
        syllables:
          - say: lǎo shī
            hanzi: 老师
          - say: hǎo chī
            hanzi: 好吃
          - say: nǐ men
            hanzi: 你们
      - title: "不: bù hay bú"
        explain: Trước thanh 4, 不 đổi thành bú và pinyin viết luôn bú. Trước thanh 1, 2, 3 vẫn đọc bù.
        syllables:
          - say: bú shì
            hanzi: 不是
          - say: bú qù
            hanzi: 不去
          - say: bù chī
            hanzi: 不吃
          - say: bù lái
            hanzi: 不来
          - say: bù hǎo
            hanzi: 不好
      - title: "一: yí hay yì"
        explain: Trước thanh 4, 一 đọc yí. Trước thanh 1, 2, 3, 一 đọc yì. Pinyin viết đúng như đọc.
        syllables:
          - say: yí gè
            hanzi: 一个
          - say: yí xià
            hanzi: 一下
          - say: yí dìng
            hanzi: 一定
          - say: yì tiān
            hanzi: 一天
          - say: yì nián
            hanzi: 一年
          - say: yì qǐ
            hanzi: 一起
      - title: "一 đứng một mình: yī"
        explain: Đọc số hoặc đứng ở cuối từ thì 一 giữ nguyên yī.
        syllables:
          - say: shí yī
            hanzi: 十一
      - title: Thanh nhẹ trong từ
        explain: "Âm sau của từ lặp và chữ 不 ở giữa đọc nhẹ và ngắn: māma, duìbuqǐ."
        syllables:
          - say: mā ma
            hanzi: 妈妈
          - say: duì bu qǐ
            hanzi: 对不起
    drills:
      - id: q-h0-00-sandhi-01
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: nǐ hǎo
          spoken: ní hǎo
        optionKind: pinyin
        options:
          - ní
          - nǐ
        answer: 0
        why: "thanh 3 + 3: chữ đầu đọc thành thanh 2, nhưng vẫn viết nǐ"
        ask: Chữ đầu của 你好 (viết nǐ hǎo) thực tế đọc là…
      - id: q-h0-00-sandhi-02
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: bú shì
        optionKind: pinyin
        options:
          - bù
          - bú
        answer: 1
        why: trước thanh 4, 不 thành bú
        ask: Chữ 不 trong 不是 đọc là…
      - id: q-h0-00-sandhi-03
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: yì tiān
        optionKind: pinyin
        options:
          - yī
          - yí
          - yì
        answer: 2
        why: trước thanh 1, 2, 3, 一 đọc yì
        ask: Chữ 一 trong 一天 đọc là…
      - id: q-h0-00-sandhi-04
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: yí gè
        optionKind: pinyin
        options:
          - yī
          - yí
          - yì
        answer: 1
        why: trước thanh 4, 一 đọc yí
        ask: Chữ 一 trong 一个 đọc là…
