kind: primer
id: h0-00
level: 1
order: 0
title: Nhập môn
titleHanzi: 拼音
scene:
  file: assets/home/lesson-next.png
  cast:
    - panda
  prompt: reuse
sections:
  tones:
    cards:
      - title: "Thanh 1: cao đều (55)"
        explain: Thang cao độ chia 5 mức, 5 là cao nhất. Thanh 1 giữ giọng ở mức 5 từ đầu đến cuối, không lên không xuống.
        syllables:
          - say: mā
            hanzi: 妈
      - title: "Thanh 2: lên (35)"
        explain: Giọng bắt đầu ở mức 3 rồi đi lên mức 5, một đường lên liền mạch.
        syllables:
          - say: má
            hanzi: 麻
      - title: "Thanh 3: xuống rồi lên (214)"
        explain: "Giọng hạ từ mức 2 xuống mức 1 rồi nâng lên mức 4. Khi nói nhanh, thường chỉ đọc nửa đầu: xuống thấp rồi dừng."
        syllables:
          - say: mǎ
            hanzi: 马
      - title: "Thanh 4: rơi từ cao (51)"
        explain: Giọng bắt đầu ở mức 5 rồi rơi thẳng xuống mức 1, ngắn và dứt khoát.
        syllables:
          - say: mà
            hanzi: 骂
      - title: Thanh nhẹ
        explain: "Một số chữ đọc nhẹ và ngắn, không nhấn, không có dấu trong pinyin: ma, de, le. Chỉ cần nhớ: gặp chữ không dấu thì đừng nhấn."
        syllables: []
      - title: So sánh bốn thanh
        explain: Cùng một âm ma, mỗi thanh là một chữ khác nhau. Nghe lần lượt từ trái sang phải.
        syllables:
          - say: mā
            hanzi: 妈
          - say: má
            hanzi: 麻
          - say: mǎ
            hanzi: 马
          - say: mà
            hanzi: 骂
    drills:
      - id: q-h0-00-tones-01
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: má
        optionKind: pinyin
        options:
          - mā
          - má
          - mǎ
          - mà
        answer: 1
        why: thanh 2 đi lên
      - id: q-h0-00-tones-02
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: mà
        optionKind: pinyin
        options:
          - mā
          - má
          - mǎ
          - mà
        answer: 3
        why: thanh 4 rơi mạnh
      - id: q-h0-00-tones-03
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: mǎ
        optionKind: pinyin
        options:
          - mā
          - má
          - mǎ
          - mà
        answer: 2
        why: thanh 3 xuống thấp rồi lên
      - id: q-h0-00-tones-04
        type: choice
        tests:
          tone: true
        prompt:
          kind: syllable
          text: mā
        optionKind: pinyin
        options:
          - mā
          - má
          - mǎ
          - mà
        answer: 0
        why: thanh 1 cao và đều
  finals:
    cards:
      - title: a, o, e
        explain: Ba nguyên âm đơn. a miệng mở rộng, lưỡi thấp; o môi tròn; e miệng mở vừa, lưỡi sau, môi không tròn.
        syllables:
          - say: ā
            label: a
          - say: ō
            label: o
          - say: ē
            label: e
      - title: i, u, ü
        explain: i lưỡi trước, môi dẹt; u lưỡi sau, môi tròn; ü lưỡi trước như i nhưng môi tròn. Hãy nghe riêng ü so với i và u.
        syllables:
          - say: yī
            label: i
          - say: wū
            label: u
          - say: yū
            label: ü
      - title: ai, ei, ao, ou
        explain: "Vần ghép: trượt từ âm đầu sang âm sau trong một hơi, không tách ra."
        syllables:
          - say: āi
            label: ai
          - say: éi
            label: ei
          - say: āo
            label: ao
          - say: ōu
            label: ou
      - title: "Vần mũi: -n và -ng"
        explain: -n kết thúc bằng đầu lưỡi chạm lợi trên; -ng bằng cuống lưỡi chạm vòm mềm. Có thêm ong.
        syllables:
          - say: ān
            label: an
          - say: ēn
            label: en
          - say: āng
            label: ang
          - say: dēng
            label: eng
          - say: dōng
            label: ong
      - title: Vần ghép với i-
        explain: "Bắt đầu bằng i rồi trượt sang vần sau: ia, ie, iao, iu. Khi không có phụ âm đầu, i viết thành y (xem phần Quy tắc viết)."
        syllables:
          - say: yā
            label: ia
          - say: yē
            label: ie
          - say: yāo
            label: iao
          - say: yōu
            label: iu
      - title: Vần ghép với u-
        explain: "Bắt đầu bằng u rồi trượt sang vần sau: ui (thực chất là uei), un (thực chất là uen)."
        syllables:
          - say: wēi
            label: ui
          - say: wēn
            label: un
    drills:
      - id: q-h0-00-finals-01
        type: choice
        tests: {}
        prompt:
          kind: syllable
          text: ān
        optionKind: pinyin
