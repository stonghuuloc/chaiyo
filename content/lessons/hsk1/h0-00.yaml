  initials:
    cards:
      - title: b p m f · âm môi
        explain: b, p, m dùng hai môi; f dùng răng trên chạm môi dưới. p bật hơi mạnh, b không bật hơi.
        syllables:
          - say: bō
            label: b
          - say: pō
            label: p
          - say: mō
            label: m
          - say: fó
            label: f
        pairs:
          - - say: bō
              label: b
            - say: pō
              label: p
      - title: d t n l · âm đầu lưỡi
        explain: Đầu lưỡi chạm lợi trên. t bật hơi mạnh, d không bật hơi; n thoát hơi qua mũi, l qua hai bên lưỡi.
        syllables:
          - say: dé
            label: d
          - say: tè
            label: t
          - say: nè
            label: n
          - say: lē
            label: l
        pairs:
          - - say: dé
              label: d
            - say: tè
              label: t
      - title: g k h · âm cuống lưỡi
        explain: Cuống lưỡi nâng lên chạm hoặc gần vòm mềm. k bật hơi mạnh, g không bật hơi; h là âm xát.
        syllables:
          - say: gē
            label: g
          - say: kē
            label: k
          - say: hē
            label: h
        pairs:
          - - say: gē
              label: g
            - say: kē
              label: k
      - title: j q x · âm mặt lưỡi
        explain: Mặt lưỡi áp ngạc cứng, môi dẹt. q là j bật hơi; x là âm xát. Ba âm này chỉ ghép với i và ü.
        syllables:
          - say: jī
            label: j
          - say: qī
            label: q
          - say: xī
            label: x
        pairs:
          - - say: jī
              label: j
            - say: qī
              label: q
      - title: zh ch sh r · âm uốn lưỡi
        explain: Đầu lưỡi cong lên chạm hoặc gần ngạc cứng. ch bật hơi, zh không bật hơi; sh là âm xát, r là âm xát hữu thanh.
        syllables:
          - say: zhī
            label: zh
          - say: chī
            label: ch
          - say: shī
            label: sh
          - say: rì
            label: r
        pairs:
          - - say: zhī
              label: zh
            - say: chī
              label: ch
      - title: z c s · âm đầu lưỡi trước
        explain: Đầu lưỡi phẳng, chạm hoặc gần mặt sau răng cửa trên. c bật hơi, z không bật hơi; s là âm xát.
        syllables:
          - say: zī
            label: z
          - say: cī
            label: c
          - say: sī
            label: s
        pairs:
          - - say: zī
              label: z
            - say: cī
              label: c
      - title: Đối chiếu theo vị trí lưỡi
        explain: "Ba nhóm j q x, zh ch sh, z c s có cùng cách phát âm nhưng khác vị trí lưỡi: mặt lưỡi, đầu lưỡi cong, đầu lưỡi phẳng."
        syllables: []
        pairs:
          - - say: jī
              label: j
            - say: zhī
              label: zh
          - - say: qī
              label: q
            - say: chī
              label: ch
          - - say: xī
              label: x
            - say: shī
              label: sh
          - - say: sī
              label: s
            - say: shī
              label: sh
    drills:
      - id: q-h0-00-initials-01
