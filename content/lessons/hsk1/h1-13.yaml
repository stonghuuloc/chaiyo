id: h1-13
level: 1
topic: Số và thời gian
order: 13
title: Ngày tháng
titleHanzi: 号
goal: Hỏi và nói ngày tháng năm, sinh nhật; đặt thời gian trước động từ
scene:
  file: lessons/h1-13.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand beside a big wall calendar; the red panda marks a date with a paw and the takin holds a small birthday cake.
sentences:
  - id: s-h1-13-01
    hanzi: 今天几月几号？
    pinyin: jīntiān jǐ yuè jǐ hào?
    vi: Hôm nay là ngày mấy tháng mấy?
    speaker: takin
  - id: s-h1-13-02
    hanzi: 今天十一月二十三号。
    pinyin: jīntiān shíyī yuè èrshísān hào.
    vi: Hôm nay là ngày 23 tháng 11.
    speaker: redpanda
  - id: s-h1-13-03
    hanzi: 前天是你的生日吗？
    pinyin: qiántiān shì nǐ de shēngrì ma?
    vi: Hôm kia là sinh nhật cậu à?
    speaker: takin
  - id: s-h1-13-04
    hanzi: 不是，后天是我的生日。
    pinyin: bù shì, hòutiān shì wǒ de shēngrì.
    vi: Không, ngày kia là sinh nhật tớ.
    speaker: redpanda
  - id: s-h1-13-05
    hanzi: 你的生日是几月几号？
    pinyin: nǐ de shēngrì shì jǐ yuè jǐ hào?
    vi: Sinh nhật cậu là ngày mấy tháng mấy?
    speaker: takin
  - id: s-h1-13-06
    hanzi: 我的生日是十二月二十五号。
    pinyin: wǒ de shēngrì shì shí’èr yuè èrshíwǔ hào.
    vi: Sinh nhật tớ là ngày 25 tháng 12.
    speaker: redpanda
  - id: s-h1-13-07
    hanzi: 你今天学习汉语吗？
    pinyin: nǐ jīntiān xuéxí Hànyǔ ma?
    vi: Hôm nay cậu học tiếng Trung không?
    speaker: takin
  - id: s-h1-13-08
    hanzi: 对，我今天学习汉语，后天也学习汉语。
    pinyin: duì, wǒ jīntiān xuéxí Hànyǔ, hòutiān yě xuéxí Hànyǔ.
    vi: Có, hôm nay tớ học tiếng Trung, ngày kia cũng học.
    speaker: redpanda
  - id: s-h1-13-09
    hanzi: 你的朋友前天学习汉语吗？
    pinyin: nǐ de péngyou qiántiān xuéxí Hànyǔ ma?
    vi: Hôm kia bạn cậu có học tiếng Trung không?
    speaker: takin
  - id: s-h1-13-10
    hanzi: 不，他前天不学习汉语。
    pinyin: bù, tā qiántiān bù xuéxí Hànyǔ.
    vi: Không, hôm kia bạn ấy không học tiếng Trung.
    speaker: redpanda
  - id: s-h1-13-11
    hanzi: 今天是我的生日。
    pinyin: jīntiān shì wǒ de shēngrì.
    vi: Hôm nay là sinh nhật tôi.
  - id: s-h1-13-12
    hanzi: 我的生日是三月十号。
    pinyin: wǒ de shēngrì shì sān yuè shí hào.
    vi: Sinh nhật tôi là ngày 10 tháng 3.
  - id: s-h1-13-13
    hanzi: 他后天不学习汉语。
    pinyin: tā hòutiān bù xuéxí Hànyǔ.
    vi: Ngày kia anh ấy không học tiếng Trung.
  - id: s-h1-13-14
    hanzi: 二零二六年十一月二十三日。
    pinyin: èr líng èr liù nián shíyī yuè èrshísān rì.
    vi: Ngày 23 tháng 11 năm 2026.
  - id: s-h1-13-15
    hanzi: 前天是我朋友的生日。
    pinyin: qiántiān shì wǒ péngyou de shēngrì.
    vi: Hôm kia là sinh nhật bạn tôi.
