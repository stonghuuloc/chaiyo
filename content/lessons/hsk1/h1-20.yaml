id: h1-20
level: 1
topic: Ăn uống
order: 20
title: Giá tiền
titleHanzi: 钱
goal: Mua đồ, hỏi giá, nói tiền bằng 块 và 毛; phân biệt 多少 và 几
scene:
  file: lessons/h1-20.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a market stall with a small price sign; the red panda counts coins in its paws and the takin points at a teapot.
sentences:
  - id: s-h1-20-01
    hanzi: 你想买什么？
    pinyin: nǐ xiǎng mǎi shénme?
    vi: Cậu muốn mua gì?
    speaker: takin
  - id: s-h1-20-02
    hanzi: 我想买茶。
    pinyin: wǒ xiǎng mǎi chá.
    vi: Tớ muốn mua trà.
    speaker: redpanda
  - id: s-h1-20-03
    hanzi: 茶多少钱？
    pinyin: chá duōshao qián?
    vi: Trà bao nhiêu tiền?
    speaker: takin
  - id: s-h1-20-04
    hanzi: 一杯十块。
    pinyin: yī bēi shí kuài.
    vi: Một cốc mười đồng.
    speaker: redpanda
  - id: s-h1-20-05
    hanzi: 十块？很贵！
    pinyin: shí kuài? hěn guì!
    vi: Mười đồng? Đắt quá!
    speaker: takin
  - id: s-h1-20-06
    hanzi: 不贵，这是好茶。
    pinyin: bù guì, zhè shì hǎo chá.
    vi: Không đắt, đây là trà ngon.
    speaker: redpanda
  - id: s-h1-20-07
    hanzi: 我想买票，多少钱？
    pinyin: wǒ xiǎng mǎi piào, duōshao qián?
    vi: Tớ muốn mua vé, bao nhiêu tiền?
    speaker: takin
  - id: s-h1-20-08
    hanzi: 票十二块。
    pinyin: piào shí’èr kuài.
    vi: Vé mười hai đồng.
    speaker: redpanda
  - id: s-h1-20-09
    hanzi: 我有二十块。
    pinyin: wǒ yǒu èrshí kuài.
    vi: Tớ có hai mươi đồng.
    speaker: takin
  - id: s-h1-20-10
    hanzi: 好，给你。
    pinyin: hǎo, gěi nǐ.
    vi: Được, đây cho cậu.
    speaker: redpanda
  - id: s-h1-20-11
    hanzi: 这本书多少钱？
    pinyin: zhè běn shū duōshao qián?
    vi: Cuốn sách này bao nhiêu tiền?
  - id: s-h1-20-12
    hanzi: 这本书三十五元。
    pinyin: zhè běn shū sānshíwǔ yuán.
    vi: Cuốn sách này 35 đồng.
  - id: s-h1-20-13
    hanzi: 你有几块钱？
    pinyin: nǐ yǒu jǐ kuài qián?
    vi: Bạn có mấy đồng?
  - id: s-h1-20-14
    hanzi: 一块五毛。
    pinyin: yī kuài wǔ máo.
    vi: Một đồng rưỡi.
  - id: s-h1-20-15
    hanzi: 水不贵，茶很贵。
    pinyin: shuǐ bù guì, chá hěn guì.
    vi: Nước không đắt, trà rất đắt.
