id: h1-19
level: 1
topic: Ăn uống
order: 19
title: Nhà hàng
titleHanzi: 饭店
goal: Nói ăn cơm ở đâu; mời, nhờ và gọi món bằng 请
scene:
  file: lessons/h1-19.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at the door of a small restaurant with a lantern; the takin holds a menu and the red panda bows to welcome.
sentences:
  - id: s-h1-19-01
    hanzi: 你在哪儿吃饭？
    pinyin: nǐ zài nǎr chī fàn?
    vi: Cậu ăn cơm ở đâu?
    speaker: takin
  - id: s-h1-19-02
    hanzi: 我在饭店吃饭。
    pinyin: wǒ zài fàndiàn chī fàn.
    vi: Tớ ăn cơm ở nhà hàng.
    speaker: redpanda
  - id: s-h1-19-03
    hanzi: 这个饭店的米饭好吃吗？
    pinyin: zhège fàndiàn de mǐfàn hǎochī ma?
    vi: Cơm ở nhà hàng này có ngon không?
    speaker: takin
  - id: s-h1-19-04
    hanzi: 好吃，请进！
    pinyin: hǎochī, qǐng jìn!
    vi: Ngon, mời vào!
    speaker: redpanda
  - id: s-h1-19-05
    hanzi: 请给我米饭。
    pinyin: qǐng gěi wǒ mǐfàn.
    vi: Làm ơn cho tôi cơm.
    speaker: takin
  - id: s-h1-19-06
    hanzi: 好，请等一下。
    pinyin: hǎo, qǐng děng yīxià.
    vi: Được, xin đợi một chút.
    speaker: redpanda
  - id: s-h1-19-07
    hanzi: 你好，请进。
    pinyin: nǐ hǎo, qǐng jìn.
    vi: Chào cậu, mời vào.
    speaker: redpanda
  - id: s-h1-19-08
    hanzi: 谢谢，我想吃面条儿。
    pinyin: xièxie, wǒ xiǎng chī miàntiáor.
    vi: Cảm ơn, tớ muốn ăn mì.
    speaker: takin
  - id: s-h1-19-09
    hanzi: 好，请等一下。
    pinyin: hǎo, qǐng děng yīxià.
    vi: Được, xin đợi một chút.
    speaker: redpanda
  - id: s-h1-19-10
    hanzi: 这个饭店的菜真好吃！
    pinyin: zhège fàndiàn de cài zhēn hǎochī!
    vi: Món ở nhà hàng này ngon thật!
    speaker: takin
  - id: s-h1-19-11
    hanzi: 他在饭店工作。
    pinyin: tā zài fàndiàn gōngzuò.
    vi: Anh ấy làm việc ở nhà hàng.
  - id: s-h1-19-12
    hanzi: 我在学校学习汉语。
    pinyin: wǒ zài xuéxiào xuéxí Hànyǔ.
    vi: Tôi học tiếng Trung ở trường.
  - id: s-h1-19-13
    hanzi: 请等一下。
    pinyin: qǐng děng yīxià.
    vi: Xin đợi một chút.
  - id: s-h1-19-14
    hanzi: 请你给我茶。
    pinyin: qǐng nǐ gěi wǒ chá.
    vi: Làm ơn cho tôi trà.
  - id: s-h1-19-15
    hanzi: 老师在家吃饭。
    pinyin: lǎoshī zài jiā chī fàn.
    vi: Cô giáo ăn cơm ở nhà.
