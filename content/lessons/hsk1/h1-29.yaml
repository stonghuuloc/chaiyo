id: h1-29
level: 1
topic: Thời tiết và đi lại
order: 29
title: Máy bay
titleHanzi: 飞机
goal: Nói đi cùng ai bằng 跟 / 和 … 一起 / 一块儿; nói đi bằng máy bay, tàu hỏa, xe
scene:
  file: lessons/h1-29.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand together on a busy train station platform with small suitcases and tickets in their paws; a long train waits beside them and an airplane flies in the sky above.
sentences:
  - id: s-h1-29-01
    hanzi: 明天你去哪儿？
    pinyin: míngtiān nǐ qù nǎr?
    vi: Mai cậu đi đâu?
    speaker: takin
  - id: s-h1-29-02
    hanzi: 我去北京。
    pinyin: wǒ qù Běijīng.
    vi: Tớ đi Bắc Kinh.
    speaker: redpanda
  - id: s-h1-29-03
    hanzi: 你坐飞机去吗？
    pinyin: nǐ zuò fēijī qù ma?
    vi: Cậu đi máy bay à?
    speaker: takin
  - id: s-h1-29-04
    hanzi: 不，我坐火车去。
    pinyin: bù, wǒ zuò huǒchē qù.
    vi: Không, tớ đi tàu hỏa.
    speaker: redpanda
  - id: s-h1-29-05
    hanzi: 我也去北京，我跟你一起去。
    pinyin: wǒ yě qù Běijīng, wǒ gēn nǐ yīqǐ qù.
    vi: Tớ cũng đi Bắc Kinh, tớ đi cùng cậu.
    speaker: takin
  - id: s-h1-29-06
    hanzi: 好！你有车票吗？
    pinyin: hǎo! nǐ yǒu chēpiào ma?
    vi: Được! Cậu có vé tàu chưa?
    speaker: redpanda
  - id: s-h1-29-07
    hanzi: 没有，我现在去买。
    pinyin: méiyǒu, wǒ xiànzài qù mǎi.
    vi: Chưa có, giờ tớ đi mua.
    speaker: takin
  - id: s-h1-29-08
    hanzi: 我们明天几点在车站见？
    pinyin: wǒmen míngtiān jǐ diǎn zài chēzhàn jiàn?
    vi: Mai mấy giờ mình gặp nhau ở ga?
    speaker: redpanda
  - id: s-h1-29-09
    hanzi: 上午八点。
    pinyin: shàngwǔ bā diǎn.
    vi: Tám giờ sáng.
    speaker: takin
  - id: s-h1-29-10
    hanzi: 我们一块儿坐汽车去车站，好吗？
    pinyin: wǒmen yīkuàir zuò qìchē qù chēzhàn, hǎo ma?
    vi: Mình cùng đi xe buýt ra ga nhé?
    speaker: redpanda
  - id: s-h1-29-11
    hanzi: 不，我妈妈会开车。
    pinyin: bù, wǒ māma huì kāichē.
    vi: Khỏi, mẹ tớ biết lái xe.
    speaker: takin
  - id: s-h1-29-12
    hanzi: 她跟我们一起去车站。
    pinyin: tā gēn wǒmen yīqǐ qù chēzhàn.
    vi: Mẹ đi cùng bọn mình ra ga.
    speaker: takin
  - id: s-h1-29-13
    hanzi: 他跟朋友一起坐火车。
    pinyin: tā gēn péngyou yīqǐ zuò huǒchē.
    vi: Anh ấy đi tàu hỏa cùng bạn.
  - id: s-h1-29-14
    hanzi: 我和哥哥一块儿去北京。
    pinyin: wǒ hé gēge yīkuàir qù Běijīng.
    vi: Tôi đi Bắc Kinh cùng anh trai.
  - id: s-h1-29-15
    hanzi: 你跟谁一起去北京？
    pinyin: nǐ gēn shéi yīqǐ qù Běijīng?
    vi: Cậu đi Bắc Kinh cùng ai?
