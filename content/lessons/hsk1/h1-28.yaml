id: h1-28
level: 1
topic: Thời tiết và đi lại
order: 28
title: Nóng và lạnh
titleHanzi: 热
goal: So sánh hơn bằng 比; nói không bằng bằng 没有; nói cao, to, nhỏ, nhiều, ít, chậm
scene:
  file: lessons/h1-28.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. On a hot sunny day they sit at a small outdoor table; the takin holds a big glass of cold water and the red panda holds a small cup of hot tea, both comparing their drinks.
sentences:
  - id: s-h1-28-01
    hanzi: 今天比昨天热吗？
    pinyin: jīntiān bǐ zuótiān rè ma?
    vi: Hôm nay nóng hơn hôm qua không?
    speaker: takin
  - id: s-h1-28-02
    hanzi: 今天比昨天热。
    pinyin: jīntiān bǐ zuótiān rè.
    vi: Hôm nay nóng hơn hôm qua.
    speaker: redpanda
  - id: s-h1-28-03
    hanzi: 我很渴，我想喝冷水。
    pinyin: wǒ hěn kě, wǒ xiǎng hē lěng shuǐ.
    vi: Tớ khát quá, tớ muốn uống nước lạnh.
    speaker: takin
  - id: s-h1-28-04
    hanzi: 我没有你渴，我喝热茶。
    pinyin: wǒ méiyǒu nǐ kě, wǒ hē rè chá.
    vi: Tớ không khát bằng cậu, tớ uống trà nóng.
    speaker: redpanda
  - id: s-h1-28-05
    hanzi: 你的杯子比我的大吗？
    pinyin: nǐ de bēizi bǐ wǒ de dà ma?
    vi: Cốc của cậu to hơn cốc của tớ à?
    speaker: takin
  - id: s-h1-28-06
    hanzi: 我的杯子比你的小，水也比你的少。
    pinyin: wǒ de bēizi bǐ nǐ de xiǎo, shuǐ yě bǐ nǐ de shǎo.
    vi: Cốc của tớ nhỏ hơn cốc của cậu, nước cũng ít hơn của cậu.
    speaker: redpanda
  - id: s-h1-28-07
    hanzi: 你哥哥高吗？
    pinyin: nǐ gēge gāo ma?
    vi: Anh trai cậu có cao không?
    speaker: takin
  - id: s-h1-28-08
    hanzi: 我哥哥比我高，我没有他高。
    pinyin: wǒ gēge bǐ wǒ gāo, wǒ méiyǒu tā gāo.
    vi: Anh trai tớ cao hơn tớ, tớ không cao bằng anh ấy.
    speaker: redpanda
  - id: s-h1-28-09
    hanzi: 我弟弟没有我高，他吃饭比我慢。
    pinyin: wǒ dìdi méiyǒu wǒ gāo, tā chīfàn bǐ wǒ màn.
    vi: Em trai tớ không cao bằng tớ, nó ăn cơm chậm hơn tớ.
    speaker: takin
  - id: s-h1-28-10
    hanzi: 我吃饭很快，他吃饭很慢。
    pinyin: wǒ chīfàn hěn kuài, tā chīfàn hěn màn.
    vi: Tớ ăn cơm rất nhanh, anh ấy ăn cơm rất chậm.
    speaker: redpanda
  - id: s-h1-28-11
    hanzi: 他比我高。
    pinyin: tā bǐ wǒ gāo.
    vi: Anh ấy cao hơn tôi.
  - id: s-h1-28-12
    hanzi: 妹妹没有我高。
    pinyin: mèimei méiyǒu wǒ gāo.
    vi: Em gái không cao bằng tôi.
  - id: s-h1-28-13
    hanzi: 白天比晚上热。
    pinyin: báitiān bǐ wǎnshang rè.
    vi: Ban ngày nóng hơn buổi tối.
  - id: s-h1-28-14
    hanzi: 我的水没有你的多。
    pinyin: wǒ de shuǐ méiyǒu nǐ de duō.
    vi: Nước của tôi không nhiều bằng của cậu.
  - id: s-h1-28-15
    hanzi: 他的杯子比我的大。
    pinyin: tā de bēizi bǐ wǒ de dà.
    vi: Cốc của anh ấy to hơn cốc của tôi.
