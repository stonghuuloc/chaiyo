id: h1-25
level: 1
topic: Nơi chốn
order: 25
title: Bệnh viện
titleHanzi: 医院
goal: Nói đi đâu làm gì, từ đâu đến, làm việc nào trước, việc nào sau
scene:
  file: lessons/h1-25.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They walk toward a small hospital; the takin holds its stomach and the red panda points ahead along the road.
sentences:
  - id: s-h1-25-01
    hanzi: 你去哪儿？
    pinyin: nǐ qù nǎr?
    vi: Cậu đi đâu?
    speaker: takin
  - id: s-h1-25-02
    hanzi: 我去医院看病。
    pinyin: wǒ qù yīyuàn kànbìng.
    vi: Tớ đi bệnh viện khám bệnh.
    speaker: redpanda
  - id: s-h1-25-03
    hanzi: 你生病了吗？
    pinyin: nǐ shēngbìng le ma?
    vi: Cậu bị ốm à?
    speaker: takin
  - id: s-h1-25-04
    hanzi: 我生病了，请你和我去医院。
    pinyin: wǒ shēngbìng le, qǐng nǐ hé wǒ qù yīyuàn.
    vi: Tớ bị ốm, nhờ cậu cùng tớ đến bệnh viện.
    speaker: redpanda
    unknown: &a1
      - hanzi: 了
        pinyin: le
        vi: trợ từ cuối câu
  - id: s-h1-25-05
    hanzi: 好，我们先回家，再去医院。
    pinyin: hǎo, wǒmen xiān huí jiā, zài qù yīyuàn.
    vi: Được, chúng ta về nhà trước, rồi đi bệnh viện.
    speaker: takin
  - id: s-h1-25-06
    hanzi: 你从哪儿来？
    pinyin: nǐ cóng nǎr lái?
    vi: Cậu từ đâu đến?
    speaker: redpanda
  - id: s-h1-25-07
    hanzi: 我从学校来。
    pinyin: wǒ cóng xuéxiào lái.
    vi: Tớ từ trường đến.
    speaker: takin
  - id: s-h1-25-08
    hanzi: 从学校走到医院，你先走。
    pinyin: cóng xuéxiào zǒu dào yīyuàn, nǐ xiān zǒu.
    vi: Từ trường đi bộ đến bệnh viện, cậu đi trước.
    speaker: redpanda
  - id: s-h1-25-09
    hanzi: 我先去图书馆，再去医院。
    pinyin: wǒ xiān qù túshūguǎn, zài qù yīyuàn.
    vi: Tớ đi thư viện trước, rồi đến bệnh viện.
    speaker: takin
  - id: s-h1-25-10
    hanzi: 好，我们医院见。
    pinyin: hǎo, wǒmen yīyuàn jiàn.
    vi: Được, gặp ở bệnh viện.
    speaker: redpanda
  - id: s-h1-25-11
    hanzi: 他生病了，不去学校。
    pinyin: tā shēngbìng le, bù qù xuéxiào.
    vi: Anh ấy bị ốm, không đi học.
    unknown: *a1
  - id: s-h1-25-12
    hanzi: 我先吃饭，再去看病。
    pinyin: wǒ xiān chī fàn, zài qù kànbìng.
    vi: Tôi ăn cơm trước, rồi đi khám bệnh.
  - id: s-h1-25-13
    hanzi: 她从家去学校。
    pinyin: tā cóng jiā qù xuéxiào.
    vi: Cô ấy từ nhà đến trường.
  - id: s-h1-25-14
    hanzi: 我们先喝茶，再走。
    pinyin: wǒmen xiān hē chá, zài zǒu.
    vi: Chúng ta uống trà trước, rồi đi.
  - id: s-h1-25-15
    hanzi: 我想去图书馆看书。
    pinyin: wǒ xiǎng qù túshūguǎn kàn shū.
    vi: Tôi muốn đi thư viện đọc sách.
