id: h1-17
level: 1
topic: Ăn uống
order: 17
title: Đồ uống
titleHanzi: 喝
goal: Nói muốn uống gì, muốn lấy gì; nói đói và khát
scene:
  file: lessons/h1-17.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They sit at a small café table; the red panda holds a teacup and the takin holds a glass of milk.
sentences:
  - id: s-h1-17-01
    hanzi: 你想喝什么？
    pinyin: nǐ xiǎng hē shénme?
    vi: Cậu muốn uống gì?
    speaker: takin
  - id: s-h1-17-02
    hanzi: 我想喝茶。
    pinyin: wǒ xiǎng hē chá.
    vi: Tớ muốn uống trà.
    speaker: redpanda
  - id: s-h1-17-03
    hanzi: 你想喝茶还是喝水？
    pinyin: nǐ xiǎng hē chá háishi hē shuǐ?
    vi: Cậu muốn uống trà hay uống nước?
    speaker: takin
  - id: s-h1-17-04
    hanzi: 我想喝水，我很渴。
    pinyin: wǒ xiǎng hē shuǐ, wǒ hěn kě.
    vi: Tớ muốn uống nước, tớ rất khát.
    speaker: redpanda
  - id: s-h1-17-05
    hanzi: 你要牛奶吗？
    pinyin: nǐ yào niúnǎi ma?
    vi: Cậu muốn sữa không?
    speaker: takin
  - id: s-h1-17-06
    hanzi: 不要，我不想喝牛奶。
    pinyin: bù yào, wǒ bù xiǎng hē niúnǎi.
    vi: Không, tớ không muốn uống sữa.
    speaker: redpanda
  - id: s-h1-17-07
    hanzi: 你饿吗？
    pinyin: nǐ è ma?
    vi: Cậu đói không?
    speaker: takin
  - id: s-h1-17-08
    hanzi: 我不饿，我渴。
    pinyin: wǒ bù è, wǒ kě.
    vi: Tớ không đói, tớ khát.
    speaker: redpanda
  - id: s-h1-17-09
    hanzi: 我很饿，我想回家。
    pinyin: wǒ hěn è, wǒ xiǎng huí jiā.
    vi: Tớ rất đói, tớ muốn về nhà.
    speaker: takin
  - id: s-h1-17-10
    hanzi: 好，我们回家，喝茶。
    pinyin: hǎo, wǒmen huí jiā, hē chá.
    vi: Được, chúng ta về nhà, uống trà.
    speaker: redpanda
  - id: s-h1-17-11
    hanzi: 我想喝水。
    pinyin: wǒ xiǎng hē shuǐ.
    vi: Tôi muốn uống nước.
  - id: s-h1-17-12
    hanzi: 他不想喝茶。
    pinyin: tā bù xiǎng hē chá.
    vi: Anh ấy không muốn uống trà.
  - id: s-h1-17-13
    hanzi: 我要一杯茶。
    pinyin: wǒ yào yī bēi chá.
    vi: Cho tôi một cốc trà.
  - id: s-h1-17-14
    hanzi: 她很渴，想喝水。
    pinyin: tā hěn kě, xiǎng hē shuǐ.
    vi: Cô ấy rất khát, muốn uống nước.
  - id: s-h1-17-15
    hanzi: 你想喝牛奶吗？
    pinyin: nǐ xiǎng hē niúnǎi ma?
    vi: Bạn muốn uống sữa không?
