id: h1-22
level: 1
topic: Nơi chốn
order: 22
title: Vị trí
titleHanzi: 在
goal: Nói vật ở đâu bằng 在 và các từ chỉ phương vị; dùng 这儿 và 那儿
scene:
  file: lessons/h1-22.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand in a school yard; the red panda holds a bag and the takin points to a building behind them.
sentences:
  - id: s-h1-22-01
    hanzi: 你的书在哪儿？
    pinyin: nǐ de shū zài nǎr?
    vi: Sách của cậu ở đâu?
    speaker: takin
  - id: s-h1-22-02
    hanzi: 我的书在书包里。
    pinyin: wǒ de shū zài shūbāo lǐ.
    vi: Sách của tớ ở trong cặp.
    speaker: redpanda
  - id: s-h1-22-03
    hanzi: 你的杯子在哪儿？
    pinyin: nǐ de bēizi zài nǎr?
    vi: Cái cốc của cậu ở đâu?
    speaker: takin
  - id: s-h1-22-04
    hanzi: 我的杯子在你的左边。
    pinyin: wǒ de bēizi zài nǐ de zuǒbiān.
    vi: Cái cốc của tớ ở bên trái cậu.
    speaker: redpanda
    unknown: &a1
      - hanzi: 边
        pinyin: bian
        vi: bên (học ở Bài 23)
  - id: s-h1-22-05
    hanzi: 不在左边，在右边。
    pinyin: bù zài zuǒbiān, zài yòubiān.
    vi: Không ở bên trái, ở bên phải.
    speaker: takin
    unknown: *a1
  - id: s-h1-22-06
    hanzi: 老师在哪儿？
    pinyin: lǎoshī zài nǎr?
    vi: Cô giáo ở đâu?
    speaker: redpanda
  - id: s-h1-22-07
    hanzi: 老师在学校里。
    pinyin: lǎoshī zài xuéxiào lǐ.
    vi: Cô giáo ở trong trường.
    speaker: takin
  - id: s-h1-22-08
    hanzi: 医院在学校前面。
    pinyin: yīyuàn zài xuéxiào qiánmian.
    vi: Bệnh viện ở phía trước trường.
    speaker: redpanda
  - id: s-h1-22-09
    hanzi: 饭店在学校后面。
    pinyin: fàndiàn zài xuéxiào hòumian.
    vi: Nhà hàng ở phía sau trường.
    speaker: takin
  - id: s-h1-22-10
    hanzi: 这儿是学校，那儿是医院。
    pinyin: zhèr shì xuéxiào, nàr shì yīyuàn.
    vi: Đây là trường, kia là bệnh viện.
    speaker: redpanda
  - id: s-h1-22-11
    hanzi: 我的钱在书上。
    pinyin: wǒ de qián zài shū shàng.
    vi: Tiền của tôi ở trên sách.
  - id: s-h1-22-12
    hanzi: 你的杯子在书下面。
    pinyin: nǐ de bēizi zài shū xiàmian.
    vi: Cái cốc của bạn ở dưới sách.
  - id: s-h1-22-13
    hanzi: 你的朋友在学校外面。
    pinyin: nǐ de péngyou zài xuéxiào wàimian.
    vi: Bạn của bạn ở ngoài trường.
  - id: s-h1-22-14
    hanzi: 这儿是我家，那儿是饭店。
    pinyin: zhèr shì wǒ jiā, nàr shì fàndiàn.
    vi: Đây là nhà tôi, kia là nhà hàng.
  - id: s-h1-22-15
    hanzi: 爸爸在医院里工作。
    pinyin: bàba zài yīyuàn lǐ gōngzuò.
    vi: Bố làm việc trong bệnh viện.
