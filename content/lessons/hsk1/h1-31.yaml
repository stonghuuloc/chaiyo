id: h1-31
level: 1
topic: Thời tiết và đi lại
order: 31
title: Phương tiện
titleHanzi: 车
goal: Hỏi đi bằng gì với 怎么; nói 坐 / 开 + phương tiện; nói ra, vào, về
scene:
  file: lessons/h1-31.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand in a busy train station hall in front of a departures board with pictures of a plane, a train and a car; the takin points at the train and the red panda holds two tickets.
sentences:
  - id: s-h1-31-01
    hanzi: 我们明天怎么去北京？
    pinyin: wǒmen míngtiān zěnme qù Běijīng?
    vi: Mai tụi mình đi Bắc Kinh bằng gì?
    speaker: takin
  - id: s-h1-31-02
    hanzi: 坐火车去吧。
    pinyin: zuò huǒchē qù ba.
    vi: Đi tàu hỏa đi.
    speaker: redpanda
  - id: s-h1-31-03
    hanzi: 坐飞机快，坐火车很慢。
    pinyin: zuò fēijī kuài, zuò huǒchē hěn màn.
    vi: Đi máy bay nhanh, đi tàu hỏa chậm lắm.
    speaker: takin
  - id: s-h1-31-04
    hanzi: 坐火车也好，路上能看书。
    pinyin: zuò huǒchē yě hǎo, lùshang néng kàn shū.
    vi: Đi tàu hỏa cũng được, trên đường đọc sách được.
    speaker: redpanda
  - id: s-h1-31-05
    hanzi: 你爸爸怎么来车站？
    pinyin: nǐ bàba zěnme lái chēzhàn?
    vi: Bố cậu đến ga bằng gì?
    speaker: takin
  - id: s-h1-31-06
    hanzi: 他开车来。
    pinyin: tā kāichē lái.
    vi: Bố tớ lái xe đến.
    speaker: redpanda
  - id: s-h1-31-07
    hanzi: 他来了吗？
    pinyin: tā lái le ma?
    vi: Bố cậu đến chưa?
    speaker: takin
  - id: s-h1-31-08
    hanzi: 来了！爸爸，你进来吧！
    pinyin: lái le! bàba, nǐ jìnlái ba!
    vi: Đến rồi! Bố ơi, bố vào đây đi!
    speaker: redpanda
  - id: s-h1-31-09
    hanzi: 我们什么时候回来？
    pinyin: wǒmen shénme shíhou huílai?
    vi: Khi nào tụi mình về lại đây?
    speaker: takin
  - id: s-h1-31-10
    hanzi: 后天回来。
    pinyin: hòutiān huílai.
    vi: Ngày kia về.
    speaker: redpanda
  - id: s-h1-31-11
    hanzi: 晚上我们怎么回去？
    pinyin: wǎnshang wǒmen zěnme huíqu?
    vi: Tối nay tụi mình về nhà bằng gì?
    speaker: takin
  - id: s-h1-31-12
    hanzi: 打车回去吧。
    pinyin: dǎchē huíqu ba.
    vi: Bắt taxi về đi.
    speaker: redpanda
  - id: s-h1-31-13
    hanzi: 他从房间里出来了。
    pinyin: tā cóng fángjiān lǐ chūlái le.
    vi: Anh ấy từ trong phòng đi ra.
  - id: s-h1-31-14
    hanzi: 外边冷，我们进去吧。
    pinyin: wàibian lěng, wǒmen jìnqù ba.
    vi: Ngoài trời lạnh, mình vào trong đi.
  - id: s-h1-31-15
    hanzi: 妈妈出去买水果了。
    pinyin: māma chūqù mǎi shuǐguǒ le.
    vi: Mẹ ra ngoài mua trái cây rồi.
  - id: s-h1-31-16
    hanzi: 你怎么写这个字？
    pinyin: nǐ zěnme xiě zhège zì?
    vi: Chữ này cậu viết thế nào?
