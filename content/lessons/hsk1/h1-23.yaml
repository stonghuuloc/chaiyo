id: h1-23
level: 1
topic: Nơi chốn
order: 23
title: Chỗ ngồi
titleHanzi: 坐
goal: Xin phép ngồi bằng 能; ngăn lại bằng 别; chỉ chỗ bằng 这儿, 那里, 旁边
scene:
  file: lessons/h1-23.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand in a quiet room with two empty chairs; the red panda points at a chair and the takin shakes one paw.
sentences:
  - id: s-h1-23-01
    hanzi: 我能坐这儿吗？
    pinyin: wǒ néng zuò zhèr ma?
    vi: Tớ ngồi đây được không?
    speaker: takin
  - id: s-h1-23-02
    hanzi: 能，请坐。
    pinyin: néng, qǐng zuò.
    vi: Được, mời ngồi.
    speaker: redpanda
  - id: s-h1-23-03
    hanzi: 你能坐我旁边吗？
    pinyin: nǐ néng zuò wǒ pángbiān ma?
    vi: Cậu ngồi cạnh tớ được không?
    speaker: takin
  - id: s-h1-23-04
    hanzi: 谢谢，我坐你旁边。
    pinyin: xièxie, wǒ zuò nǐ pángbiān.
    vi: Cảm ơn, tớ ngồi cạnh cậu.
    speaker: redpanda
  - id: s-h1-23-05
    hanzi: 这里有人吗？
    pinyin: zhèlǐ yǒu rén ma?
    vi: Chỗ này có người không?
    speaker: takin
  - id: s-h1-23-06
    hanzi: 没有，请坐。
    pinyin: méiyǒu, qǐng zuò.
    vi: Không có, mời ngồi.
    speaker: redpanda
  - id: s-h1-23-07
    hanzi: 别坐这儿，那儿好。
    pinyin: bié zuò zhèr, nàr hǎo.
    vi: Đừng ngồi đây, kia tốt hơn.
    speaker: takin
  - id: s-h1-23-08
    hanzi: 好，我们坐那里。
    pinyin: hǎo, wǒmen zuò nàlǐ.
    vi: Được, chúng ta ngồi chỗ đó.
    speaker: redpanda
  - id: s-h1-23-09
    hanzi: 别在这里吃饭。
    pinyin: bié zài zhèlǐ chī fàn.
    vi: Đừng ăn cơm ở đây.
    speaker: takin
  - id: s-h1-23-10
    hanzi: 对不起，我不吃了。
    pinyin: duìbuqǐ, wǒ bù chī le.
    vi: Xin lỗi, tôi không ăn nữa.
    speaker: redpanda
    unknown:
      - hanzi: 了
        pinyin: le
        vi: trợ từ cuối câu
  - id: s-h1-23-11
    hanzi: 我能坐这边吗？
    pinyin: wǒ néng zuò zhèbiān ma?
    vi: Tôi ngồi bên này được không?
  - id: s-h1-23-12
    hanzi: 老师在我旁边。
    pinyin: lǎoshī zài wǒ pángbiān.
    vi: Cô giáo ở cạnh tôi.
  - id: s-h1-23-13
    hanzi: 别喝茶，喝水。
    pinyin: bié hē chá, hē shuǐ.
    vi: Đừng uống trà, uống nước.
  - id: s-h1-23-14
    hanzi: 你能说汉语吗？
    pinyin: nǐ néng shuō Hànyǔ ma?
    vi: Bạn nói được tiếng Trung không?
  - id: s-h1-23-15
    hanzi: 别在那儿等我。
    pinyin: bié zài nàr děng wǒ.
    vi: Đừng đợi tôi ở đó.
