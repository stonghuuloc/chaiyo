id: h1-12
level: 1
topic: Số và thời gian
order: 12
title: Số đếm
titleHanzi: 十
goal: Đếm đến một trăm; đếm sách, cốc, trang, lần; nói một nửa
scene:
  file: lessons/h1-12.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a library shelf stacked with books; the red panda holds one thick book and the takin holds a cup.
sentences:
  - id: s-h1-12-01
    hanzi: 这是你的书吗？
    pinyin: zhè shì nǐ de shū ma?
    vi: Đây là sách của cậu à?
    speaker: takin
  - id: s-h1-12-02
    hanzi: 对，这本书有一百页。
    pinyin: duì, zhè běn shū yǒu yī bǎi yè.
    vi: Đúng, cuốn sách này có một trăm trang.
    speaker: redpanda
  - id: s-h1-12-03
    hanzi: 你有几本书？
    pinyin: nǐ yǒu jǐ běn shū?
    vi: Cậu có mấy quyển sách?
    speaker: takin
  - id: s-h1-12-04
    hanzi: 我有三十本书。
    pinyin: wǒ yǒu sānshí běn shū.
    vi: Tớ có ba mươi quyển sách.
    speaker: redpanda
  - id: s-h1-12-05
    hanzi: 你读这本书吗？
    pinyin: nǐ dú zhè běn shū ma?
    vi: Cậu đọc cuốn sách này không?
    speaker: takin
  - id: s-h1-12-06
    hanzi: 我读半本，你读半本。
    pinyin: wǒ dú bàn běn, nǐ dú bàn běn.
    vi: Tớ đọc nửa quyển, cậu đọc nửa quyển.
    speaker: redpanda
  - id: s-h1-12-07
    hanzi: 这个杯子是你的吗？
    pinyin: zhège bēizi shì nǐ de ma?
    vi: Cái cốc này là của cậu à?
    speaker: takin
  - id: s-h1-12-08
    hanzi: 不是，是老师的。
    pinyin: bù shì, shì lǎoshī de.
    vi: Không, là của cô giáo.
    speaker: redpanda
  - id: s-h1-12-09
    hanzi: 我有一些杯子。
    pinyin: wǒ yǒu yīxiē bēizi.
    vi: Tớ có vài cái cốc.
    speaker: takin
  - id: s-h1-12-10
    hanzi: 老师说一次，我们写一次。
    pinyin: lǎoshī shuō yī cì, wǒmen xiě yī cì.
    vi: Cô giáo nói một lần, chúng ta viết một lần.
    speaker: redpanda
  - id: s-h1-12-11
    hanzi: 我的朋友有一百零五本书。
    pinyin: wǒ de péngyou yǒu yī bǎi líng wǔ běn shū.
    vi: Bạn tôi có 105 quyển sách.
  - id: s-h1-12-12
    hanzi: 我有半本书。
    pinyin: wǒ yǒu bàn běn shū.
    vi: Tôi có nửa quyển sách.
  - id: s-h1-12-13
    hanzi: 这本书有一百一十页。
    pinyin: zhè běn shū yǒu yī bǎi yī shí yè.
    vi: Cuốn sách này có 110 trang.
  - id: s-h1-12-14
    hanzi: 他有三个杯子。
    pinyin: tā yǒu sān gè bēizi.
    vi: Anh ấy có ba cái cốc.
  - id: s-h1-12-15
    hanzi: 老师说两次。
    pinyin: lǎoshī shuō liǎng cì.
    vi: Cô giáo nói hai lần.
