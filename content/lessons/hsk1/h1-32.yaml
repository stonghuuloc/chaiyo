id: h1-32
level: 1
topic: Mua sắm
order: 32
title: Ôn mua sắm
titleHanzi: 买
goal: Ôn 买, 钱, 贵; hỏi lựa chọn với 还是; hỏi 要不要 / 喜欢不喜欢; nối danh từ với 和
scene:
  file: lessons/h1-32.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a small market stall with milk, eggs, fruit and tea on the counter; the red panda holds a shopping basket and looks at a price tag, and the takin holds some coins.
sentences:
  - id: s-h1-32-01
    hanzi: 你想买什么？
    pinyin: nǐ xiǎng mǎi shénme?
    vi: Cậu muốn mua gì?
    speaker: takin
  - id: s-h1-32-02
    hanzi: 我想买牛奶和鸡蛋。
    pinyin: wǒ xiǎng mǎi niúnǎi hé jīdàn.
    vi: Tớ muốn mua sữa và trứng.
    speaker: redpanda
  - id: s-h1-32-03
    hanzi: 你要不要买水果？
    pinyin: nǐ yào bu yào mǎi shuǐguǒ?
    vi: Cậu có mua trái cây không?
    speaker: takin
  - id: s-h1-32-04
    hanzi: 要，我喜欢吃水果。
    pinyin: yào, wǒ xǐhuan chī shuǐguǒ.
    vi: Có, tớ thích ăn trái cây.
    speaker: redpanda
  - id: s-h1-32-05
    hanzi: 这个多少钱？
    pinyin: zhège duōshao qián?
    vi: Cái này bao nhiêu tiền?
    speaker: redpanda
  - id: s-h1-32-06
    hanzi: 三十块。
    pinyin: sānshí kuài.
    vi: Ba mươi đồng.
    speaker: takin
  - id: s-h1-32-07
    hanzi: 太贵了！我们买那个吧。
    pinyin: tài guì le! wǒmen mǎi nàge ba.
    vi: Đắt quá! Tụi mình mua cái kia đi.
    speaker: redpanda
  - id: s-h1-32-08
    hanzi: 那个不贵，也很好吃。
    pinyin: nàge bù guì, yě hěn hǎochī.
    vi: Cái kia không đắt, mà cũng ngon lắm.
    speaker: takin
  - id: s-h1-32-09
    hanzi: 你想喝茶还是喝水？
    pinyin: nǐ xiǎng hē chá háishi hē shuǐ?
    vi: Cậu muốn uống trà hay uống nước?
    speaker: takin
  - id: s-h1-32-10
    hanzi: 我想喝茶。
    pinyin: wǒ xiǎng hē chá.
    vi: Tớ muốn uống trà.
    speaker: redpanda
  - id: s-h1-32-11
    hanzi: 你喜欢不喜欢吃这个菜？
    pinyin: nǐ xǐhuan bu xǐhuan chī zhège cài?
    vi: Cậu có thích ăn món này không?
    speaker: takin
  - id: s-h1-32-12
    hanzi: 喜欢，很好吃！
    pinyin: xǐhuan, hěn hǎochī!
    vi: Thích chứ, ngon lắm!
    speaker: redpanda
  - id: s-h1-32-13
    hanzi: 妈妈和爸爸都喜欢喝茶。
    pinyin: māma hé bàba dōu xǐhuan hē chá.
    vi: Mẹ và bố đều thích uống trà.
  - id: s-h1-32-14
    hanzi: 我们买米还是买面条？
    pinyin: wǒmen mǎi mǐ háishi mǎi miàntiáo?
    vi: Tụi mình mua gạo hay mua mì?
  - id: s-h1-32-15
    hanzi: 你想不想吃饭？
    pinyin: nǐ xiǎng bu xiǎng chī fàn?
    vi: Cậu có muốn ăn cơm không?
  - id: s-h1-32-16
    hanzi: 我的钱不多，不能买。
    pinyin: wǒ de qián bù duō, bù néng mǎi.
    vi: Tiền của tớ không nhiều, không mua được.
