id: h1-14
level: 1
topic: Số và thời gian
order: 14
title: Thứ trong tuần
titleHanzi: 星期
goal: Nói thứ trong tuần và các buổi trong ngày; hỏi lựa chọn bằng 还是
scene:
  file: lessons/h1-14.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They look at a weekly timetable board on a wall; the red panda points at one day and the takin holds a pencil.
sentences:
  - id: s-h1-14-01
    hanzi: 今天星期几？
    pinyin: jīntiān xīngqī jǐ?
    vi: Hôm nay thứ mấy?
    speaker: takin
  - id: s-h1-14-02
    hanzi: 今天星期五。
    pinyin: jīntiān xīngqī wǔ.
    vi: Hôm nay thứ sáu.
    speaker: redpanda
  - id: s-h1-14-03
    hanzi: 前天星期三，后天星期天。
    pinyin: qiántiān xīngqī sān, hòutiān xīngqī tiān.
    vi: Hôm kia thứ tư, ngày kia Chủ nhật.
    speaker: redpanda
  - id: s-h1-14-04
    hanzi: 星期天你学习吗？
    pinyin: xīngqītiān nǐ xuéxí ma?
    vi: Chủ nhật cậu có học không?
    speaker: takin
  - id: s-h1-14-05
    hanzi: 星期天不学习。
    pinyin: xīngqītiān bù xuéxí.
    vi: Chủ nhật tớ không học.
    speaker: redpanda
  - id: s-h1-14-06
    hanzi: 你上午学习还是下午学习？
    pinyin: nǐ shàngwǔ xuéxí háishi xiàwǔ xuéxí?
    vi: Cậu học buổi sáng hay buổi chiều?
    speaker: takin
  - id: s-h1-14-07
    hanzi: 我上午学习。
    pinyin: wǒ shàngwǔ xuéxí.
    vi: Tớ học buổi sáng.
    speaker: redpanda
  - id: s-h1-14-08
    hanzi: 你中午忙吗？
    pinyin: nǐ zhōngwǔ máng ma?
    vi: Buổi trưa cậu bận không?
    speaker: takin
  - id: s-h1-14-09
    hanzi: 我中午不忙，晚上很忙。
    pinyin: wǒ zhōngwǔ bù máng, wǎnshang hěn máng.
    vi: Trưa tớ không bận, tối tớ rất bận.
    speaker: redpanda
  - id: s-h1-14-10
    hanzi: 你上午忙还是下午忙？
    pinyin: nǐ shàngwǔ máng háishi xiàwǔ máng?
    vi: Cậu bận buổi sáng hay buổi chiều?
    speaker: takin
  - id: s-h1-14-11
    hanzi: 今天星期天。
    pinyin: jīntiān xīngqītiān.
    vi: Hôm nay là Chủ nhật.
  - id: s-h1-14-12
    hanzi: 他是中国人还是外国人？
    pinyin: tā shì Zhōngguó rén háishi wàiguó rén?
    vi: Anh ấy là người Trung Quốc hay người nước ngoài?
  - id: s-h1-14-13
    hanzi: 你是学生还是老师？
    pinyin: nǐ shì xuésheng háishi lǎoshī?
    vi: Bạn là học sinh hay giáo viên?
  - id: s-h1-14-14
    hanzi: 我早上很忙。
    pinyin: wǒ zǎoshang hěn máng.
    vi: Buổi sáng sớm tôi rất bận.
  - id: s-h1-14-15
    hanzi: 星期三下午我学习汉语。
    pinyin: xīngqī sān xiàwǔ wǒ xuéxí Hànyǔ.
    vi: Chiều thứ tư tôi học tiếng Trung.
