id: h1-11
level: 1
topic: Quốc tịch và ngôn ngữ
order: 11
title: Làm quen
titleHanzi: 高兴
goal: Chào làm quen; nói mình bận, mệt, vui; khen người khác
scene:
  file: lessons/h1-11.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They meet on a park bench; the red panda bows slightly with its paws together and the takin smiles with a small wave.
sentences:
  - id: s-h1-11-01
    hanzi: 你好，认识你很高兴。
    pinyin: nǐ hǎo, rènshi nǐ hěn gāoxìng.
    vi: Chào cậu, rất vui được quen cậu.
    speaker: takin
  - id: s-h1-11-02
    hanzi: 认识你，我也很高兴。
    pinyin: rènshi nǐ, wǒ yě hěn gāoxìng.
    vi: Quen cậu, tớ cũng rất vui.
    speaker: redpanda
  - id: s-h1-11-03
    hanzi: 你忙吗？
    pinyin: nǐ máng ma?
    vi: Cậu bận không?
    speaker: takin
  - id: s-h1-11-04
    hanzi: 我很忙。你呢？
    pinyin: wǒ hěn máng. nǐ ne?
    vi: Tớ bận. Còn cậu?
    speaker: redpanda
  - id: s-h1-11-05
    hanzi: 我不忙。
    pinyin: wǒ bù máng.
    vi: Tớ không bận.
    speaker: takin
  - id: s-h1-11-06
    hanzi: 你累吗？
    pinyin: nǐ lèi ma?
    vi: Cậu mệt không?
    speaker: redpanda
  - id: s-h1-11-07
    hanzi: 你的汉语真好！
    pinyin: nǐ de Hànyǔ zhēn hǎo!
    vi: Tiếng Trung của cậu thật là tốt!
    speaker: takin
  - id: s-h1-11-08
    hanzi: 谢谢，我的汉语不好。
    pinyin: xièxie, wǒ de Hànyǔ bù hǎo.
    vi: Cảm ơn, tiếng Trung của tớ chưa tốt.
    speaker: redpanda
  - id: s-h1-11-09
    hanzi: 你非常忙吗？
    pinyin: nǐ fēicháng máng ma?
    vi: Cậu rất bận à?
    speaker: takin
  - id: s-h1-11-10
    hanzi: 对，我非常忙，也很累。
    pinyin: duì, wǒ fēicháng máng, yě hěn lèi.
    vi: Đúng, tớ rất bận, cũng rất mệt.
    speaker: redpanda
  - id: s-h1-11-11
    hanzi: 我很高兴。
    pinyin: wǒ hěn gāoxìng.
    vi: Tôi rất vui.
  - id: s-h1-11-12
    hanzi: 他非常忙。
    pinyin: tā fēicháng máng.
    vi: Anh ấy rất bận.
  - id: s-h1-11-13
    hanzi: 她真高兴！
    pinyin: tā zhēn gāoxìng!
    vi: Cô ấy thật là vui!
  - id: s-h1-11-14
    hanzi: 我太累了。
    pinyin: wǒ tài lèi le.
    vi: Tôi mệt quá.
    unknown:
      - hanzi: 了
        pinyin: le
        vi: trợ từ cuối câu (học ở Bài 16)
  - id: s-h1-11-15
    hanzi: 老师很忙。
    pinyin: lǎoshī hěn máng.
    vi: Cô giáo rất bận.
