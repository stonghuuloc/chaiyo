id: h1-21
level: 1
topic: Ăn uống
order: 21
title: Trái cây
titleHanzi: 水果
goal: Nói thích gì, thích nhất gì; khen và cảm thán bằng 太…了
scene:
  file: lessons/h1-21.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They sit on a sofa with a bowl of fruit; the red panda holds a microphone and the takin holds a ball.
sentences:
  - id: s-h1-21-01
    hanzi: 你喜欢吃水果吗？
    pinyin: nǐ xǐhuan chī shuǐguǒ ma?
    vi: Cậu thích ăn trái cây không?
    speaker: takin
  - id: s-h1-21-02
    hanzi: 喜欢，我最喜欢吃水果。
    pinyin: xǐhuan, wǒ zuì xǐhuan chī shuǐguǒ.
    vi: Thích, tớ thích ăn trái cây nhất.
    speaker: redpanda
  - id: s-h1-21-03
    hanzi: 你爱喝茶吗？
    pinyin: nǐ ài hē chá ma?
    vi: Cậu hay uống trà không?
    speaker: takin
  - id: s-h1-21-04
    hanzi: 我爱喝茶，不爱喝牛奶。
    pinyin: wǒ ài hē chá, bù ài hē niúnǎi.
    vi: Tớ hay uống trà, không hay uống sữa.
    speaker: redpanda
  - id: s-h1-21-05
    hanzi: 你喜欢唱歌吗？
    pinyin: nǐ xǐhuan chànggē ma?
    vi: Cậu thích hát không?
    speaker: takin
  - id: s-h1-21-06
    hanzi: 喜欢，我很爱唱歌。
    pinyin: xǐhuan, wǒ hěn ài chànggē.
    vi: Thích, tớ rất mê hát.
    speaker: redpanda
  - id: s-h1-21-07
    hanzi: 你喜欢打球吗？
    pinyin: nǐ xǐhuan dǎqiú ma?
    vi: Cậu thích chơi bóng không?
    speaker: takin
  - id: s-h1-21-08
    hanzi: 我喜欢打球，也喜欢玩儿。
    pinyin: wǒ xǐhuan dǎqiú, yě xǐhuan wánr.
    vi: Tớ thích chơi bóng, cũng thích đi chơi.
    speaker: redpanda
  - id: s-h1-21-09
    hanzi: 你喜欢电影吗？
    pinyin: nǐ xǐhuan diànyǐng ma?
    vi: Cậu thích phim không?
    speaker: takin
  - id: s-h1-21-10
    hanzi: 我最喜欢电影，太好了！
    pinyin: wǒ zuì xǐhuan diànyǐng, tài hǎo le!
    vi: Tớ thích phim nhất, tuyệt quá!
    speaker: redpanda
  - id: s-h1-21-11
    hanzi: 我喜欢唱歌。
    pinyin: wǒ xǐhuan chànggē.
    vi: Tôi thích hát.
  - id: s-h1-21-12
    hanzi: 他最喜欢打球。
    pinyin: tā zuì xǐhuan dǎqiú.
    vi: Anh ấy thích chơi bóng nhất.
  - id: s-h1-21-13
    hanzi: 我太喜欢电影了！
    pinyin: wǒ tài xǐhuan diànyǐng le!
    vi: Tôi thích phim quá!
  - id: s-h1-21-14
    hanzi: 你的汉语太好了！
    pinyin: nǐ de Hànyǔ tài hǎo le!
    vi: Tiếng Trung của bạn giỏi quá!
  - id: s-h1-21-15
    hanzi: 她爱玩儿，不爱学习。
    pinyin: tā ài wánr, bù ài xuéxí.
    vi: Cô ấy thích chơi, không thích học.
