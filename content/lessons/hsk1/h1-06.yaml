id: h1-06
level: 1
topic: Gia đình
order: 6
title: Số người trong nhà
titleHanzi: 口
goal: Nói nhà có mấy người, có anh chị em hay con cái không; đếm bằng 个 và 口
scene:
  file: lessons/h1-06.png
  cast:
    - redpanda
    - takin
    - panda
  prompt: Only the red panda, the takin and the baby panda. The red panda holds a framed family photo with four small round figures; the takin leans in to look; the baby panda holds up two round paws.
sentences:
  - id: s-h1-06-01
    hanzi: 你家有几口人？
    pinyin: nǐ jiā yǒu jǐ kǒu rén?
    vi: Nhà cậu có mấy người?
    speaker: takin
  - id: s-h1-06-02
    hanzi: 我家有四口人。
    pinyin: wǒ jiā yǒu sì kǒu rén.
    vi: Nhà tớ có bốn người.
    speaker: redpanda
  - id: s-h1-06-03
    hanzi: 我家有爸爸、妈妈、哥哥，也有我。
    pinyin: wǒ jiā yǒu bàba, māma, gēge, yě yǒu wǒ.
    vi: Nhà tớ có bố, mẹ, anh trai, và cả tớ nữa.
    speaker: redpanda
  - id: s-h1-06-04
    hanzi: 你有弟弟吗？
    pinyin: nǐ yǒu dìdi ma?
    vi: Cậu có em trai không?
    speaker: takin
  - id: s-h1-06-05
    hanzi: 我没有弟弟，有一个哥哥。
    pinyin: wǒ méiyǒu dìdi, yǒu yī gè gēge.
    vi: Tớ không có em trai, tớ có một anh trai.
    speaker: redpanda
  - id: s-h1-06-06
    hanzi: 你哥哥有孩子吗？
    pinyin: nǐ gēge yǒu háizi ma?
    vi: Anh cậu có con không?
    speaker: takin
  - id: s-h1-06-07
    hanzi: 有，他有两个孩子。
    pinyin: yǒu, tā yǒu liǎng gè háizi.
    vi: Có, anh ấy có hai đứa con.
    speaker: redpanda
  - id: s-h1-06-08
    hanzi: 一个儿子，一个女儿吗？
    pinyin: yī gè érzi, yī gè nǚ'ér ma?
    vi: Một con trai, một con gái à?
    speaker: takin
  - id: s-h1-06-09
    hanzi: 对，一个儿子，一个女儿。
    pinyin: duì, yī gè érzi, yī gè nǚ'ér.
    vi: Đúng, một con trai, một con gái.
    speaker: redpanda
  - id: s-h1-06-10
    hanzi: 我有两个姐姐。
    pinyin: wǒ yǒu liǎng gè jiějie.
    vi: Tôi có hai chị gái.
  - id: s-h1-06-11
    hanzi: 他家有五口人。
    pinyin: tā jiā yǒu wǔ kǒu rén.
    vi: Nhà anh ấy có năm người.
  - id: s-h1-06-12
    hanzi: 你有妹妹吗？
    pinyin: nǐ yǒu mèimei ma?
    vi: Bạn có em gái không?
  - id: s-h1-06-13
    hanzi: 我没有哥哥。
    pinyin: wǒ méiyǒu gēge.
    vi: Tôi không có anh trai.
  - id: s-h1-06-14
    hanzi: 她有一个女儿。
    pinyin: tā yǒu yī gè nǚ'ér.
    vi: Cô ấy có một con gái.
  - id: s-h1-06-15
    hanzi: 我有三个朋友。
    pinyin: wǒ yǒu sān gè péngyou.
    vi: Tôi có ba người bạn.
