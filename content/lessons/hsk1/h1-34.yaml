id: h1-34
level: 1
topic: Mua sắm
order: 34
title: Mua bao nhiêu
titleHanzi: 多
goal: Nói số + lượng từ 杯 / 块 / 本 / 页; hỏi mức độ với 多 + tính từ; mua bánh bao
scene:
  file: lessons/h1-34.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. The takin stands behind a small steamed-bun stall with bamboo steamers and a cup of tea on the counter; the red panda holds out a big fluffy bun in one paw and looks into its school bag for money.
sentences:
  - id: s-h1-34-01
    hanzi: 一个包子多少钱？
    pinyin: yī gè bāozi duōshao qián?
    vi: Một cái bánh bao bao nhiêu tiền?
    speaker: redpanda
  - id: s-h1-34-02
    hanzi: 两块钱一个。
    pinyin: liǎng kuài qián yī gè.
    vi: Hai đồng một cái.
    speaker: takin
  - id: s-h1-34-03
    hanzi: 我要两个包子，一杯茶。
    pinyin: wǒ yào liǎng gè bāozi, yī bēi chá.
    vi: Tớ lấy hai cái bánh bao, một cốc trà.
    speaker: redpanda
  - id: s-h1-34-04
    hanzi: 我们的包子很大，你看一下儿。
    pinyin: wǒmen de bāozi hěn dà, nǐ kàn yīxiàr.
    vi: Bánh bao chỗ tớ to lắm, cậu xem thử đi.
    speaker: takin
  - id: s-h1-34-05
    hanzi: 包子有多大？
    pinyin: bāozi yǒu duō dà?
    vi: Bánh bao to cỡ nào?
    speaker: redpanda
  - id: s-h1-34-06
    hanzi: 很大！你拿一个看看。
    pinyin: hěn dà! nǐ ná yī gè kànkan.
    vi: To lắm! Cậu cầm một cái xem thử.
    speaker: takin
  - id: s-h1-34-07
    hanzi: 茶里放一点儿牛奶吧。
    pinyin: chá lǐ fàng yīdiǎnr niúnǎi ba.
    vi: Cho một chút sữa vào trà nhé.
    speaker: redpanda
  - id: s-h1-34-08
    hanzi: 好，你用这个杯子喝吧。
    pinyin: hǎo, nǐ yòng zhège bēizi hē ba.
    vi: Được, cậu dùng cái cốc này mà uống nhé.
    speaker: takin
  - id: s-h1-34-09
    hanzi: 我的钱呢？我找一下儿。
    pinyin: wǒ de qián ne? wǒ zhǎo yīxiàr.
    vi: Tiền của tớ đâu rồi? Để tớ tìm một chút.
    speaker: redpanda
  - id: s-h1-34-10
    hanzi: 在你的书包里吧？
    pinyin: zài nǐ de shūbāo lǐ ba?
    vi: Chắc ở trong cặp sách của cậu đó?
    speaker: takin
  - id: s-h1-34-11
    hanzi: 对！给你十块钱。
    pinyin: duì! gěi nǐ shí kuài qián.
    vi: Đúng rồi! Gửi cậu mười đồng.
    speaker: redpanda
  - id: s-h1-34-12
    hanzi: 找你三块。我帮你拿包子。
    pinyin: zhǎo nǐ sān kuài. wǒ bāng nǐ ná bāozi.
    vi: Thối cậu ba đồng. Tớ cầm bánh bao giúp cậu.
    speaker: takin
  - id: s-h1-34-13
    hanzi: 从这儿到车站多远？
    pinyin: cóng zhèr dào chēzhàn duō yuǎn?
    vi: Từ đây đến ga bao xa?
  - id: s-h1-34-14
    hanzi: 这本书有一百页。
    pinyin: zhè běn shū yǒu yībǎi yè.
    vi: Cuốn sách này có một trăm trang.
  - id: s-h1-34-15
    hanzi: 你的孩子多大了？
    pinyin: nǐ de háizi duō dà le?
    vi: Con cậu mấy tuổi rồi?
  - id: s-h1-34-16
    hanzi: 我吃了两块面包。
    pinyin: wǒ chī le liǎng kuài miànbāo.
    vi: Tớ ăn hai miếng bánh mì rồi.
