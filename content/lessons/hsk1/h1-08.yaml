id: h1-08
level: 1
topic: Quốc tịch và ngôn ngữ
order: 8
title: Quốc tịch
titleHanzi: 国
goal: Hỏi và nói mình là người nước nào; nói giáo viên là nam hay nữ
scene:
  file: lessons/h1-08.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand before a big world map on a classroom wall; the red panda points at one spot on the map and the takin tilts its head.
sentences:
  - id: s-h1-08-01
    hanzi: 你是哪国人？
    pinyin: nǐ shì nǎ guó rén?
    vi: Bạn là người nước nào?
    speaker: takin
  - id: s-h1-08-02
    hanzi: 我是中国人。
    pinyin: wǒ shì Zhōngguó rén.
    vi: Tớ là người Trung Quốc.
    speaker: redpanda
  - id: s-h1-08-03
    hanzi: 我也是中国人。
    pinyin: wǒ yě shì Zhōngguó rén.
    vi: Tớ cũng là người Trung Quốc.
    speaker: takin
  - id: s-h1-08-04
    hanzi: 你是北京人吗？
    pinyin: nǐ shì Běijīng rén ma?
    vi: Cậu là người Bắc Kinh à?
    speaker: redpanda
  - id: s-h1-08-05
    hanzi: 不是，我不是北京人。
    pinyin: bù shì, wǒ bù shì Běijīng rén.
    vi: Không, tớ không phải người Bắc Kinh.
    speaker: takin
  - id: s-h1-08-06
    hanzi: 你的老师是哪国人？
    pinyin: nǐ de lǎoshī shì nǎ guó rén?
    vi: Giáo viên của cậu là người nước nào?
    speaker: takin
  - id: s-h1-08-07
    hanzi: 他是外国人，不是中国人。
    pinyin: tā shì wàiguó rén, bù shì Zhōngguó rén.
    vi: Thầy là người nước ngoài, không phải người Trung Quốc.
    speaker: redpanda
  - id: s-h1-08-08
    hanzi: 他是男老师吗？
    pinyin: tā shì nán lǎoshī ma?
    vi: Thầy là giáo viên nam à?
    speaker: takin
  - id: s-h1-08-09
    hanzi: 对，他是男老师。
    pinyin: duì, tā shì nán lǎoshī.
    vi: Đúng, thầy là giáo viên nam.
    speaker: redpanda
  - id: s-h1-08-10
    hanzi: 她是外国人。
    pinyin: tā shì wàiguó rén.
    vi: Cô ấy là người nước ngoài.
  - id: s-h1-08-11
    hanzi: 她是女老师。
    pinyin: tā shì nǚ lǎoshī.
    vi: Cô ấy là giáo viên nữ.
  - id: s-h1-08-12
    hanzi: 中国是我的国家。
    pinyin: Zhōngguó shì wǒ de guójiā.
    vi: Trung Quốc là đất nước của tôi.
  - id: s-h1-08-13
    hanzi: 他是哪国人？
    pinyin: tā shì nǎ guó rén?
    vi: Anh ấy là người nước nào?
  - id: s-h1-08-14
    hanzi: 我是男学生。
    pinyin: wǒ shì nán xuésheng.
    vi: Tôi là học sinh nam.
  - id: s-h1-08-15
    hanzi: 你的朋友是哪国人？
    pinyin: nǐ de péngyou shì nǎ guó rén?
    vi: Bạn của bạn là người nước nào?
