id: h1-18
level: 1
topic: Ăn uống
order: 18
title: Món ăn
titleHanzi: 吃
goal: Nói ăn gì; nối món bằng 和; hỏi chọn bằng 还是
scene:
  file: lessons/h1-18.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They sit at a picnic table with a plate of noodles, a boiled egg and a loaf of bread; the red panda points at the noodles.
sentences:
  - id: s-h1-18-01
    hanzi: 你想吃什么？
    pinyin: nǐ xiǎng chī shénme?
    vi: Cậu muốn ăn gì?
    speaker: takin
  - id: s-h1-18-02
    hanzi: 我想吃面条儿。
    pinyin: wǒ xiǎng chī miàntiáor.
    vi: Tớ muốn ăn mì.
    speaker: redpanda
  - id: s-h1-18-03
    hanzi: 你吃肉吗？
    pinyin: nǐ chī ròu ma?
    vi: Cậu ăn thịt không?
    speaker: takin
  - id: s-h1-18-04
    hanzi: 吃，我吃肉和菜。
    pinyin: chī, wǒ chī ròu hé cài.
    vi: Có, tớ ăn thịt và rau.
    speaker: redpanda
  - id: s-h1-18-05
    hanzi: 我吃鸡蛋和面包。
    pinyin: wǒ chī jīdàn hé miànbāo.
    vi: Tớ ăn trứng và bánh mì.
    speaker: takin
  - id: s-h1-18-06
    hanzi: 你早上吃饭还是吃面包？
    pinyin: nǐ zǎoshang chī fàn háishi chī miànbāo?
    vi: Buổi sáng cậu ăn cơm hay ăn bánh mì?
    speaker: redpanda
  - id: s-h1-18-07
    hanzi: 我早上吃面包。你呢？
    pinyin: wǒ zǎoshang chī miànbāo. nǐ ne?
    vi: Sáng tớ ăn bánh mì. Còn cậu?
    speaker: takin
  - id: s-h1-18-08
    hanzi: 我早上吃鸡蛋和面包。
    pinyin: wǒ zǎoshang chī jīdàn hé miànbāo.
    vi: Sáng tớ ăn trứng và bánh mì.
    speaker: redpanda
  - id: s-h1-18-09
    hanzi: 你中午吃饭还是吃面条儿？
    pinyin: nǐ zhōngwǔ chī fàn háishi chī miàntiáor?
    vi: Trưa cậu ăn cơm hay ăn mì?
    speaker: takin
  - id: s-h1-18-10
    hanzi: 我中午吃面条儿，晚上吃饭。
    pinyin: wǒ zhōngwǔ chī miàntiáor, wǎnshang chī fàn.
    vi: Trưa tớ ăn mì, tối ăn cơm.
    speaker: redpanda
  - id: s-h1-18-11
    hanzi: 我吃肉和鸡蛋。
    pinyin: wǒ chī ròu hé jīdàn.
    vi: Tôi ăn thịt và trứng.
  - id: s-h1-18-12
    hanzi: 他不吃肉。
    pinyin: tā bù chī ròu.
    vi: Anh ấy không ăn thịt.
  - id: s-h1-18-13
    hanzi: 你吃饭还是吃面包？
    pinyin: nǐ chī fàn háishi chī miànbāo?
    vi: Bạn ăn cơm hay ăn bánh mì?
  - id: s-h1-18-14
    hanzi: 我和朋友吃面条儿。
    pinyin: wǒ hé péngyou chī miàntiáor.
    vi: Tôi và bạn ăn mì.
  - id: s-h1-18-15
    hanzi: 他吃菜和肉。
    pinyin: tā chī cài hé ròu.
    vi: Anh ấy ăn rau và thịt.
