id: h1-10
level: 1
topic: Quốc tịch và ngôn ngữ
order: 10
title: Giáo viên
titleHanzi: 老师
goal: Nói học với ai, hỏi về giáo viên, sách giáo khoa và trường học
scene:
  file: lessons/h1-10.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a small school desk with a textbook between them; the takin holds a pointer like a teacher and the red panda raises a paw.
sentences:
  - id: s-h1-10-01
    hanzi: 你学习汉语吗？
    pinyin: nǐ xuéxí Hànyǔ ma?
    vi: Cậu học tiếng Trung à?
    speaker: takin
  - id: s-h1-10-02
    hanzi: 学习，我跟老师学习汉语。
    pinyin: xuéxí, wǒ gēn lǎoshī xuéxí Hànyǔ.
    vi: Ừ, tớ học tiếng Trung với thầy.
    speaker: redpanda
  - id: s-h1-10-03
    hanzi: 你的老师是中国人吗？
    pinyin: nǐ de lǎoshī shì Zhōngguó rén ma?
    vi: Thầy của cậu là người Trung Quốc à?
    speaker: takin
  - id: s-h1-10-04
    hanzi: 对，他是汉语老师。
    pinyin: duì, tā shì Hànyǔ lǎoshī.
    vi: Đúng, thầy là giáo viên tiếng Trung.
    speaker: redpanda
  - id: s-h1-10-05
    hanzi: 这是你的汉语课本吗？
    pinyin: zhè shì nǐ de Hànyǔ kèběn ma?
    vi: Đây là sách giáo khoa tiếng Trung của cậu à?
    speaker: takin
  - id: s-h1-10-06
    hanzi: 对，这是我的汉语课本。
    pinyin: duì, zhè shì wǒ de Hànyǔ kèběn.
    vi: Đúng, đây là sách giáo khoa tiếng Trung của tớ.
    speaker: redpanda
  - id: s-h1-10-07
    hanzi: 你是中学生吗？
    pinyin: nǐ shì zhōngxuéshēng ma?
    vi: Cậu là học sinh trung học à?
    speaker: redpanda
  - id: s-h1-10-08
    hanzi: 不是，我是小学生。
    pinyin: bù shì, wǒ shì xiǎoxuéshēng.
    vi: Không, tớ là học sinh tiểu học.
    speaker: takin
  - id: s-h1-10-09
    hanzi: 你们学校有几个老师？
    pinyin: nǐmen xuéxiào yǒu jǐ gè lǎoshī?
    vi: Trường các cậu có mấy giáo viên?
    speaker: redpanda
  - id: s-h1-10-10
    hanzi: 有十个老师。
    pinyin: yǒu shí gè lǎoshī.
    vi: Có mười giáo viên.
    speaker: takin
  - id: s-h1-10-11
    hanzi: 他教汉语。
    pinyin: tā jiāo Hànyǔ.
    vi: Thầy ấy dạy tiếng Trung.
  - id: s-h1-10-12
    hanzi: 我跟朋友学习汉语。
    pinyin: wǒ gēn péngyou xuéxí Hànyǔ.
    vi: Tôi học tiếng Trung với bạn.
  - id: s-h1-10-13
    hanzi: 这是中文书。
    pinyin: zhè shì Zhōngwén shū.
    vi: Đây là sách tiếng Trung.
  - id: s-h1-10-14
    hanzi: 她是中学老师。
    pinyin: tā shì zhōngxué lǎoshī.
    vi: Cô ấy là giáo viên trung học.
  - id: s-h1-10-15
    hanzi: 我们学校有两个汉语老师。
    pinyin: wǒmen xuéxiào yǒu liǎng gè Hànyǔ lǎoshī.
    vi: Trường chúng tôi có hai giáo viên tiếng Trung.
