id: h1-24
level: 1
topic: Nơi chốn
order: 24
title: Trường học
titleHanzi: 学校
goal: Nói nơi nào có gì bằng 有 và 是; kể tên chỗ trong trường
scene:
  file: lessons/h1-24.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand in a bright library with tall shelves; the red panda holds a bag on a table and the takin holds a book.
sentences:
  - id: s-h1-24-01
    hanzi: 学校里有什么？
    pinyin: xuéxiào lǐ yǒu shénme?
    vi: Trong trường có gì?
    speaker: takin
  - id: s-h1-24-02
    hanzi: 学校里有大学生，有老师。
    pinyin: xuéxiào lǐ yǒu dàxuéshēng, yǒu lǎoshī.
    vi: Trong trường có sinh viên, có giáo viên.
    speaker: redpanda
  - id: s-h1-24-03
    hanzi: 学校里有图书馆吗？
    pinyin: xuéxiào lǐ yǒu túshūguǎn ma?
    vi: Trong trường có thư viện không?
    speaker: takin
  - id: s-h1-24-04
    hanzi: 有，图书馆在学校里边。
    pinyin: yǒu, túshūguǎn zài xuéxiào lǐbian.
    vi: Có, thư viện ở bên trong trường.
    speaker: redpanda
  - id: s-h1-24-05
    hanzi: 图书馆里有什么？
    pinyin: túshūguǎn lǐ yǒu shénme?
    vi: Trong thư viện có gì?
    speaker: takin
  - id: s-h1-24-06
    hanzi: 有书，有桌子。
    pinyin: yǒu shū, yǒu zhuōzi.
    vi: Có sách, có bàn.
    speaker: redpanda
  - id: s-h1-24-07
    hanzi: 桌子上有书包吗？
    pinyin: zhuōzi shàng yǒu shūbāo ma?
    vi: Trên bàn có cặp sách không?
    speaker: takin
  - id: s-h1-24-08
    hanzi: 有，桌子上有一个书包。
    pinyin: yǒu, zhuōzi shàng yǒu yī gè shūbāo.
    vi: Có, trên bàn có một cái cặp.
    speaker: redpanda
  - id: s-h1-24-09
    hanzi: 桌子中间是什么？
    pinyin: zhuōzi zhōngjiān shì shénme?
    vi: Ở giữa bàn là gì?
    speaker: takin
  - id: s-h1-24-10
    hanzi: 桌子中间是一杯茶。
    pinyin: zhuōzi zhōngjiān shì yī bēi chá.
    vi: Ở giữa bàn là một cốc trà.
    speaker: redpanda
  - id: s-h1-24-11
    hanzi: 学校前面是大学。
    pinyin: xuéxiào qiánmian shì dàxué.
    vi: Phía trước trường là đại học.
  - id: s-h1-24-12
    hanzi: 这个地方有图书馆吗？
    pinyin: zhège dìfang yǒu túshūguǎn ma?
    vi: Chỗ này có thư viện không?
  - id: s-h1-24-13
    hanzi: 图书馆旁边是大学生的家。
    pinyin: túshūguǎn pángbiān shì dàxuéshēng de jiā.
    vi: Cạnh thư viện là nhà của sinh viên.
  - id: s-h1-24-14
    hanzi: 书包里有书和钱。
    pinyin: shūbāo lǐ yǒu shū hé qián.
    vi: Trong cặp có sách và tiền.
  - id: s-h1-24-15
    hanzi: 你的书包里有什么？
    pinyin: nǐ de shūbāo lǐ yǒu shénme?
    vi: Trong cặp của bạn có gì?
