id: h1-33
level: 1
topic: Mua sắm
order: 33
title: Miêu tả đồ vật
titleHanzi: 漂亮
goal: Chỉ đồ vật với 这个 / 那个; tả đồ vật với 很 / 非常 + tính từ + 的; nói giống nhau với 一样
scene:
  file: lessons/h1-33.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand in a small clothing shop with white shirts on a rack; the red panda holds up a white shirt and the takin shows a new phone.
sentences:
  - id: s-h1-33-01
    hanzi: 这个手机是你的吗？
    pinyin: zhège shǒujī shì nǐ de ma?
    vi: Cái điện thoại này là của cậu à?
    speaker: takin
  - id: s-h1-33-02
    hanzi: 是，是我的新手机。
    pinyin: shì, shì wǒ de xīn shǒujī.
    vi: Ừ, điện thoại mới của tớ đó.
    speaker: redpanda
  - id: s-h1-33-03
    hanzi: 很好看！我也想买一个。
    pinyin: hěn hǎokàn! wǒ yě xiǎng mǎi yí ge.
    vi: Đẹp ghê! Tớ cũng muốn mua một cái.
    speaker: takin
  - id: s-h1-33-04
    hanzi: 你看，那个手机和我的一样。
    pinyin: nǐ kàn, nàge shǒujī hé wǒ de yīyàng.
    vi: Cậu xem, cái điện thoại kia giống của tớ.
    speaker: redpanda
  - id: s-h1-33-05
    hanzi: 我想买很好看的衣服。
    pinyin: wǒ xiǎng mǎi hěn hǎokàn de yīfu.
    vi: Tớ muốn mua quần áo thật đẹp.
    speaker: redpanda
  - id: s-h1-33-06
    hanzi: 你看，这是非常好看的衣服！
    pinyin: nǐ kàn, zhè shì fēicháng hǎokàn de yīfu!
    vi: Cậu xem nè, đây là bộ đồ siêu đẹp!
    speaker: takin
  - id: s-h1-33-07
    hanzi: 太贵了！我不要。
    pinyin: tài guì le! wǒ bú yào.
    vi: Đắt quá! Tớ không lấy đâu.
    speaker: redpanda
  - id: s-h1-33-08
    hanzi: 白的呢？白的很新，也不贵。
    pinyin: bái de ne? bái de hěn xīn, yě bú guì.
    vi: Còn đồ trắng thì sao? Đồ trắng mới tinh, lại không đắt.
    speaker: takin
  - id: s-h1-33-09
    hanzi: 你明天穿什么衣服？
    pinyin: nǐ míngtiān chuān shénme yīfu?
    vi: Mai cậu mặc đồ gì?
    speaker: redpanda
  - id: s-h1-33-10
    hanzi: 我穿白衣服。
    pinyin: wǒ chuān bái yīfu.
    vi: Tớ mặc đồ trắng.
    speaker: takin
  - id: s-h1-33-11
    hanzi: 白衣服要常洗。
    pinyin: bái yīfu yào cháng xǐ.
    vi: Đồ trắng phải giặt thường xuyên đó.
    speaker: redpanda
  - id: s-h1-33-12
    hanzi: 我今天晚上洗。
    pinyin: wǒ jīntiān wǎnshang xǐ.
    vi: Tối nay tớ giặt.
    speaker: takin
  - id: s-h1-33-13
    hanzi: 那个杯子很好看。
    pinyin: nàge bēizi hěn hǎokàn.
    vi: Cái cốc kia đẹp ghê.
  - id: s-h1-33-14
    hanzi: 他有一个很新的手机。
    pinyin: tā yǒu yí ge hěn xīn de shǒujī.
    vi: Anh ấy có một cái điện thoại rất mới.
  - id: s-h1-33-15
    hanzi: 这个学生和那个学生一样高。
    pinyin: zhège xuésheng hé nàge xuésheng yīyàng gāo.
    vi: Bạn học sinh này cao bằng bạn học sinh kia.
  - id: s-h1-33-16
    hanzi: 吃饭前要洗手。
    pinyin: chīfàn qián yào xǐ shǒu.
    vi: Trước khi ăn cơm phải rửa tay.
