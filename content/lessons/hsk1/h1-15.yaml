id: h1-15
level: 1
topic: Số và thời gian
order: 15
title: Giờ giấc
titleHanzi: 点
goal: Hỏi và nói giờ; nói mình dậy và ngủ lúc mấy giờ
scene:
  file: lessons/h1-15.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand under a big round wall clock; the red panda points up at the clock hands and the takin yawns beside a small bed.
sentences:
  - id: s-h1-15-01
    hanzi: 现在几点？
    pinyin: xiànzài jǐ diǎn?
    vi: Bây giờ mấy giờ?
    speaker: takin
  - id: s-h1-15-02
    hanzi: 现在七点半。
    pinyin: xiànzài qī diǎn bàn.
    vi: Bây giờ là 7 giờ rưỡi.
    speaker: redpanda
  - id: s-h1-15-03
    hanzi: 你几点起床？
    pinyin: nǐ jǐ diǎn qǐchuáng?
    vi: Cậu dậy lúc mấy giờ?
    speaker: takin
  - id: s-h1-15-04
    hanzi: 我六点起床。
    pinyin: wǒ liù diǎn qǐchuáng.
    vi: Tớ dậy lúc 6 giờ.
    speaker: redpanda
  - id: s-h1-15-05
    hanzi: 你几点睡觉？
    pinyin: nǐ jǐ diǎn shuìjiào?
    vi: Cậu ngủ lúc mấy giờ?
    speaker: takin
  - id: s-h1-15-06
    hanzi: 我晚上十点睡觉。
    pinyin: wǒ wǎnshang shí diǎn shuìjiào.
    vi: Tớ ngủ lúc 10 giờ tối.
    speaker: redpanda
  - id: s-h1-15-07
    hanzi: 你有时间吗？
    pinyin: nǐ yǒu shíjiān ma?
    vi: Cậu có thời gian không?
    speaker: takin
  - id: s-h1-15-08
    hanzi: 有，我下午两点有时间。
    pinyin: yǒu, wǒ xiàwǔ liǎng diǎn yǒu shíjiān.
    vi: Có, tớ có thời gian lúc 2 giờ chiều.
    speaker: redpanda
  - id: s-h1-15-09
    hanzi: 我学习半个小时，你学习一个小时。
    pinyin: wǒ xuéxí bàn gè xiǎoshí, nǐ xuéxí yī gè xiǎoshí.
    vi: Tớ học nửa tiếng, cậu học một tiếng.
    speaker: takin
  - id: s-h1-15-10
    hanzi: 好，现在是学习的时候。
    pinyin: hǎo, xiànzài shì xuéxí de shíhou.
    vi: Được, bây giờ là lúc học.
    speaker: redpanda
  - id: s-h1-15-11
    hanzi: 现在两点。
    pinyin: xiànzài liǎng diǎn.
    vi: Bây giờ là 2 giờ.
  - id: s-h1-15-12
    hanzi: 她早上七点起床。
    pinyin: tā zǎoshang qī diǎn qǐchuáng.
    vi: Cô ấy dậy lúc 7 giờ sáng.
  - id: s-h1-15-13
    hanzi: 他十点二十分睡觉。
    pinyin: tā shí diǎn èrshí fēn shuìjiào.
    vi: Anh ấy ngủ lúc 10 giờ 20.
  - id: s-h1-15-14
    hanzi: 现在是睡觉的时候。
    pinyin: xiànzài shì shuìjiào de shíhou.
    vi: Bây giờ là lúc đi ngủ.
  - id: s-h1-15-15
    hanzi: 你下午有时间吗？
    pinyin: nǐ xiàwǔ yǒu shíjiān ma?
    vi: Chiều bạn có thời gian không?
