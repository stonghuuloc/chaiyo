id: h1-16
level: 1
topic: Số và thời gian
order: 16
title: Hôm qua và ngày mai
titleHanzi: 昨天
goal: Nói việc đã xong hôm qua, năm ngoái; nói ngày mai, sang năm; phủ định bằng 没
scene:
  file: lessons/h1-16.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They walk along a path; the red panda looks back over its shoulder and the takin points ahead to a school gate.
sentences:
  - id: s-h1-16-01
    hanzi: 你昨天来学校了吗？
    pinyin: nǐ zuótiān lái xuéxiào le ma?
    vi: Hôm qua cậu có đến trường không?
    speaker: takin
  - id: s-h1-16-02
    hanzi: 我昨天来了。
    pinyin: wǒ zuótiān lái le.
    vi: Hôm qua tớ đến rồi.
    speaker: redpanda
  - id: s-h1-16-03
    hanzi: 你前天来了吗？
    pinyin: nǐ qiántiān lái le ma?
    vi: Hôm kia cậu đến chưa?
    speaker: takin
  - id: s-h1-16-04
    hanzi: 前天我没来，我回家了。
    pinyin: qiántiān wǒ méi lái, wǒ huí jiā le.
    vi: Hôm kia tớ không đến, tớ về nhà rồi.
    speaker: redpanda
  - id: s-h1-16-05
    hanzi: 明天你来吗？
    pinyin: míngtiān nǐ lái ma?
    vi: Ngày mai cậu có đến không?
    speaker: takin
  - id: s-h1-16-06
    hanzi: 明天我来。
    pinyin: míngtiān wǒ lái.
    vi: Ngày mai tớ đến.
    speaker: redpanda
  - id: s-h1-16-07
    hanzi: 你去年学习汉语了吗？
    pinyin: nǐ qùnián xuéxí Hànyǔ le ma?
    vi: Năm ngoái cậu học tiếng Trung chưa?
    speaker: takin
  - id: s-h1-16-08
    hanzi: 对，我去年学习汉语了。
    pinyin: duì, wǒ qùnián xuéxí Hànyǔ le.
    vi: Đúng, năm ngoái tớ học tiếng Trung rồi.
    speaker: redpanda
  - id: s-h1-16-09
    hanzi: 明年你学习中文吗？
    pinyin: míngnián nǐ xuéxí Zhōngwén ma?
    vi: Sang năm cậu học tiếng Trung không?
    speaker: takin
  - id: s-h1-16-10
    hanzi: 明年我也学习。
    pinyin: míngnián wǒ yě xuéxí.
    vi: Sang năm tớ cũng học.
    speaker: redpanda
  - id: s-h1-16-11
    hanzi: 他昨天没来。
    pinyin: tā zuótiān méi lái.
    vi: Hôm qua anh ấy không đến.
  - id: s-h1-16-12
    hanzi: 我昨天读了三本书。
    pinyin: wǒ zuótiān dú le sān běn shū.
    vi: Hôm qua tôi đọc ba quyển sách.
  - id: s-h1-16-13
    hanzi: 她去年回中国了。
    pinyin: tā qùnián huí Zhōngguó le.
    vi: Năm ngoái cô ấy về Trung Quốc rồi.
  - id: s-h1-16-14
    hanzi: 明年我回家。
    pinyin: míngnián wǒ huí jiā.
    vi: Sang năm tôi về nhà.
  - id: s-h1-16-15
    hanzi: 昨天我没学习。
    pinyin: zuótiān wǒ méi xuéxí.
    vi: Hôm qua tôi không học.
