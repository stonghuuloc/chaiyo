id: h1-30
level: 1
topic: Thời tiết và đi lại
order: 30
title: Taxi
titleHanzi: 出租车
goal: Rủ bạn làm gì bằng 吧; bảo ai làm gì bằng câu cầu khiến; nói đi taxi hay đi bộ
scene:
  file: lessons/h1-30.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They stand at a city crossroads in light rain; the red panda raises a paw to hail a taxi while the takin waits on the sidewalk.
sentences:
  - id: s-h1-30-01
    hanzi: 车站远吗？
    pinyin: chēzhàn yuǎn ma?
    vi: Ga có xa không?
    speaker: takin
  - id: s-h1-30-02
    hanzi: 车站很远，我们打车吧。
    pinyin: chēzhàn hěn yuǎn, wǒmen dǎchē ba.
    vi: Ga xa lắm, tụi mình đi taxi đi.
    speaker: redpanda
  - id: s-h1-30-03
    hanzi: 我想走路去。
    pinyin: wǒ xiǎng zǒulù qù.
    vi: Tớ muốn đi bộ.
    speaker: takin
  - id: s-h1-30-04
    hanzi: 下雨了，打车吧！
    pinyin: xià yǔ le, dǎchē ba!
    vi: Mưa rồi, đi taxi đi!
    speaker: redpanda
  - id: s-h1-30-05
    hanzi: 好吧。在哪儿打车？
    pinyin: hǎo ba. zài nǎr dǎchē?
    vi: Thôi được. Bắt taxi ở đâu?
    speaker: takin
  - id: s-h1-30-06
    hanzi: 去前边的路口打车。
    pinyin: qù qiánbian de lùkǒu dǎchē.
    vi: Ra ngã tư phía trước bắt taxi.
    speaker: redpanda
  - id: s-h1-30-07
    hanzi: 你送我去车站吧。
    pinyin: nǐ sòng wǒ qù chēzhàn ba.
    vi: Cậu đưa tớ ra ga nhé.
    speaker: takin
  - id: s-h1-30-08
    hanzi: 好，我送你。
    pinyin: hǎo, wǒ sòng nǐ.
    vi: Ừ, tớ đưa cậu đi.
    speaker: redpanda
  - id: s-h1-30-09
    hanzi: 你站在这边等车。
    pinyin: nǐ zhàn zài zhèbiān děng chē.
    vi: Cậu đứng bên này đợi xe.
    speaker: redpanda
  - id: s-h1-30-10
    hanzi: 马路上有很多汽车。
    pinyin: mǎlù shang yǒu hěn duō qìchē.
    vi: Ngoài đường có nhiều xe hơi quá.
    speaker: takin
  - id: s-h1-30-11
    hanzi: 车来了！快上车！
    pinyin: chē lái le! kuài shàng chē!
    vi: Xe tới rồi! Lên xe mau!
    speaker: redpanda
  - id: s-h1-30-12
    hanzi: 我们走吧！
    pinyin: wǒmen zǒu ba!
    vi: Tụi mình đi thôi!
    speaker: takin
  - id: s-h1-30-13
    hanzi: 学校不远，我常常走路去。
    pinyin: xuéxiào bù yuǎn, wǒ chángcháng zǒulù qù.
    vi: Trường không xa, tôi hay đi bộ đến đó.
  - id: s-h1-30-14
    hanzi: 我们一起走路去学校吧。
    pinyin: wǒmen yīqǐ zǒulù qù xuéxiào ba.
    vi: Chúng mình cùng đi bộ đến trường nhé.
  - id: s-h1-30-15
    hanzi: 我送你一本书。
    pinyin: wǒ sòng nǐ yī běn shū.
    vi: Tôi tặng bạn một cuốn sách.
