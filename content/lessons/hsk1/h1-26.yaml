id: h1-26
level: 1
topic: Nơi chốn
order: 26
title: Nhà
titleHanzi: 家
goal: Nói trong nhà có gì; nói thêm bằng 还; nói thường xuyên hay đôi khi
scene:
  file: lessons/h1-26.png
  cast:
    - redpanda
    - takin
  prompt: Only the red panda and the takin. They relax in a cosy living room with a television and a computer; the red panda lies on a sofa and the takin holds a remote.
sentences:
  - id: s-h1-26-01
    hanzi: 你家有几个房间？
    pinyin: nǐ jiā yǒu jǐ gè fángjiān?
    vi: Nhà cậu có mấy phòng?
    speaker: takin
  - id: s-h1-26-02
    hanzi: 我家有三个房间。
    pinyin: wǒ jiā yǒu sān gè fángjiān.
    vi: Nhà tớ có ba phòng.
    speaker: redpanda
  - id: s-h1-26-03
    hanzi: 你的房间里边有什么？
    pinyin: nǐ de fángjiān lǐbian yǒu shénme?
    vi: Trong phòng cậu có gì?
    speaker: takin
  - id: s-h1-26-04
    hanzi: 里边有电脑，还有电视。
    pinyin: lǐbian yǒu diànnǎo, hái yǒu diànshì.
    vi: Bên trong có máy tính, còn có ti vi.
    speaker: redpanda
  - id: s-h1-26-05
    hanzi: 你常常看电视吗？
    pinyin: nǐ chángcháng kàn diànshì ma?
    vi: Cậu có hay xem ti vi không?
    speaker: takin
  - id: s-h1-26-06
    hanzi: 我常常看电视，有时看电影。
    pinyin: wǒ chángcháng kàn diànshì, yǒushí kàn diànyǐng.
    vi: Tớ hay xem ti vi, đôi khi xem phim.
    speaker: redpanda
  - id: s-h1-26-07
    hanzi: 你常常玩电脑吗？
    pinyin: nǐ chángcháng wán diànnǎo ma?
    vi: Cậu có hay chơi máy tính không?
    speaker: takin
  - id: s-h1-26-08
    hanzi: 有时玩，有时看书。
    pinyin: yǒushí wán, yǒushí kàn shū.
    vi: Đôi khi chơi, đôi khi đọc sách.
    speaker: redpanda
  - id: s-h1-26-09
    hanzi: 我还有一个房子。
    pinyin: wǒ hái yǒu yī gè fángzi.
    vi: Tớ còn có một căn nhà nữa.
    speaker: takin
  - id: s-h1-26-10
    hanzi: 我现在想休息。
    pinyin: wǒ xiànzài xiǎng xiūxi.
    vi: Bây giờ tớ muốn nghỉ ngơi.
    speaker: redpanda
  - id: s-h1-26-11
    hanzi: 他家有电视，还有电脑。
    pinyin: tā jiā yǒu diànshì, hái yǒu diànnǎo.
    vi: Nhà anh ấy có ti vi, còn có máy tính.
  - id: s-h1-26-12
    hanzi: 她常常在房间里休息。
    pinyin: tā chángcháng zài fángjiān lǐ xiūxi.
    vi: Cô ấy hay nghỉ ngơi trong phòng.
  - id: s-h1-26-13
    hanzi: 我有时在家里休息。
    pinyin: wǒ yǒushí zài jiā lǐ xiūxi.
    vi: Đôi khi tôi nghỉ ngơi ở nhà.
  - id: s-h1-26-14
    hanzi: 房子里边有几个房间？
    pinyin: fángzi lǐbian yǒu jǐ gè fángjiān?
    vi: Trong nhà có mấy phòng?
  - id: s-h1-26-15
    hanzi: 我还想看电视。
    pinyin: wǒ hái xiǎng kàn diànshì.
    vi: Tôi còn muốn xem ti vi.
