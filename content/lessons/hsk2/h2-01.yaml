id: h2-01
level: 2
topic: Thói quen hằng ngày
order: 1
title: Mấy giờ bạn dậy?
titleHanzi: 你几点起床
goal: Hỏi và nói giờ giấc, kể thói quen buổi sáng của mình
scene:
  file: lessons/h2-01.png
  cast: [ redpanda, takin ]
  prompt: The red panda and the takin stand in a sunny morning garden beside a big round clock with hands, the takin stretching proudly after waking up while the red panda holds a small towel and smiles. Only the red panda and the takin.
sentences:
  - { id: s-h2-01-01, hanzi: 你一般几点起床？, pinyin: nǐ yībān jǐ diǎn qǐchuáng?, spoken: ní yìbān jǐ diǎn qǐchuáng?, vi: Bạn thường mấy giờ dậy?, speaker: redpanda }
  - { id: s-h2-01-02, hanzi: 我一般七点一刻起床。, pinyin: wǒ yībān qī diǎn yī kè qǐchuáng., spoken: wǒ yìbān qī diǎn yí kè qǐchuáng., vi: Tớ thường dậy lúc bảy giờ mười lăm., speaker: takin }
  - { id: s-h2-01-03, hanzi: 起床以后，你先做什么？, pinyin: "qǐchuáng yǐhòu, nǐ xiān zuò shénme?", spoken: "qǐchuáng yǐhòu, ní xiān zuò shénme?", vi: "Sau khi dậy, bạn làm gì trước?", speaker: redpanda }
  - { id: s-h2-01-04, hanzi: 我先洗澡，然后吃早饭。, pinyin: "wǒ xiān xǐzǎo, ránhòu chī zǎofàn.", spoken: "wǒ xiān xízǎo, ránhòu chī zǎofàn.", vi: "Tớ tắm trước, rồi mới ăn sáng.", speaker: takin }
  - { id: s-h2-01-05, hanzi: 你已经有好习惯了！, pinyin: nǐ yǐjīng yǒu hǎo xíguàn le!, spoken: ní yǐjīng yóu hǎo xíguàn le!, vi: Bạn đã có thói quen tốt rồi đó!, speaker: redpanda }
  - { id: s-h2-01-06, hanzi: 我八点出门，二十分钟就到学校。, pinyin: "wǒ bā diǎn chūmén, èrshí fēnzhōng jiù dào xuéxiào.", vi: "Tám giờ tớ ra khỏi nhà, hai mươi phút là tới trường.", speaker: takin }
  - { id: s-h2-01-07, hanzi: 你经常运动吗？, pinyin: nǐ jīngcháng yùndòng ma?, spoken: ní jīngcháng yùndòng ma?, vi: Bạn có thường xuyên tập thể dục không?, speaker: redpanda }
  - { id: s-h2-01-08, hanzi: 经常！我早上运动半个小时。, pinyin: jīngcháng! wǒ zǎoshang yùndòng bàn gè xiǎoshí., spoken: jīngcháng! wó zǎoshang yùndòng bàn gè xiǎoshí., vi: Thường xuyên chứ! Sáng nào tớ cũng tập nửa tiếng., speaker: takin }
  - { id: s-h2-01-09, hanzi: 运动以后，你累不累？, pinyin: "yùndòng yǐhòu, nǐ lèi bu lèi?", vi: "Tập xong, bạn có mệt không?", speaker: redpanda }
  - { id: s-h2-01-10, hanzi: 不累，我觉得很舒服。, pinyin: "bú lèi, wǒ juéde hěn shūfu.", vi: "Không mệt, tớ thấy rất dễ chịu.", speaker: takin }
  - { id: s-h2-01-11, hanzi: 现在七点一刻。, pinyin: xiànzài qī diǎn yī kè., spoken: xiànzài qī diǎn yí kè., vi: Bây giờ là bảy giờ mười lăm. }
  - { id: s-h2-01-12, hanzi: 我八点半出门。, pinyin: wǒ bā diǎn bàn chūmén., vi: Tám rưỡi tớ ra khỏi nhà. }
  - { id: s-h2-01-13, hanzi: 你先洗澡，然后睡觉。, pinyin: "nǐ xiān xǐzǎo, ránhòu shuìjiào.", spoken: "ní xiān xízǎo, ránhòu shuìjiào.", vi: "Bạn tắm trước, rồi đi ngủ." }
