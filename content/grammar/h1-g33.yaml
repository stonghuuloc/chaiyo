id: h1-g33
level: 1
std:
  - 44
title: "Thứ trong tuần: 星期 + số"
pattern: 星期 + 一 … 六 / 天
explain: |-
  Thứ trong tuần là 星期 + số: 星期一, 星期二, … 星期六. Chủ nhật là 星期天. Hỏi thứ: 今天星期几？

  Các buổi trong ngày: 早上, 上午, 中午, 下午, 晚上.
examples:
  - s-h1-14-02
  - s-h1-14-03
pitfalls:
  - wrong: 星期七
    right: 星期天
    why: Chủ nhật là 星期天, không có 星期七.
