# content/grammar/h5-g02.yaml
id: h5-g02
level: 5
std: [ 332 ]
title: "Dù… nhưng…: 尽管…，但是/却…"
pattern: 尽管 + vế nhượng bộ + ， + 但是 / 却 + vế đối lập
explain: 尽管 (tận quản) mở vế nhượng bộ, sự thật đã có thật. Vế sau dùng 但是 hoặc 却 để nói kết quả ngược lại. 却 đứng sau chủ ngữ, 但是 đứng đầu vế.
examples: [ s-h5-01-15, s-h5-01-17 ]
pitfalls:
  - { wrong: 尽管邻居们很少说话，住在同一座楼里, right: 尽管住在同一座楼里，邻居们却很少说话 }
