id: h1-g69
level: 1
std:
  - 4
  - 46
title: "Hỏi cách làm: 怎么 + động từ"
pattern: 主语 + 怎么 + động từ (+ tân ngữ)？
explain: |-
  怎么 (chẩm ma, zěnme) đứng trước động từ để hỏi cách làm: 我们怎么去北京？ = Tụi mình đi Bắc Kinh bằng gì? 你怎么写这个字？ = Chữ này cậu viết thế nào?

  Trả lời bằng cách thay 怎么 bằng cách làm: 坐火车去 = đi tàu hỏa; 开车来 = lái xe đến. Câu có 怎么 đã là câu hỏi, không thêm 吗.
examples:
  - s-h1-31-01
  - s-h1-31-05
  - s-h1-31-16
pitfalls:
  - wrong: 我们去北京怎么？
    right: 我们怎么去北京？
    why: 怎么 đứng trước động từ, không đứng cuối câu.
  - wrong: 你爸爸怎么来车站吗？
    right: 你爸爸怎么来车站？
    why: Câu đã hỏi bằng 怎么 thì không thêm 吗.
