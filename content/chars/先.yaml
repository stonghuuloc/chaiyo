hanzi: 先
readings:
  - pinyin: xiān
    hanviet: tiên
radical: 儿
ids: ⿱𠂒儿
strokes: 6
mnemonic:
  hinh: Một bước chân (𠂒, biến thể của 止) đặt lên TRÊN đầu 儿 (người) → chân bước RA TRƯỚC người → 先 = đi trước, trước tiên.
  am: Hán-Việt **tiên** — từ "đầu tiên" nói hằng ngày chính là chữ 先 này; cũng "tiên phong", "tiên tiến".
  doiThat: dòng chữ "请先登录" (vui lòng đăng nhập trước) hiện đầu tiên khi mở app Trung Quốc lần đầu.
  tuongPhan: 先 (𠂒+儿, "trước, đầu tiên") ≠ 兄 (口+儿, "anh trai", đã học) — cùng đáy 儿 nhưng đỉnh khác hẳn (𠂒 vs 口).
  kind: etymology
