mnemonic:
  hinh: Hình vuông có một nét ngang ở giữa — mặt trời tròn bị vẽ vuông lại, nét giữa là vệt sáng.
  am: nhật — "nhật ký", "sinh nhật", "Nhật Bản" (日本) đều dùng thẳng âm này.
  doiThat: 生日 trên thiệp sinh nhật, 日期 trên form đặt vé, 今日 trên banner khuyến mãi.
  tuongPhan: ≠ 曰 (yuē, "nói rằng" — cổ văn) — 曰 dẹt và rộng hơn, hiếm gặp trong văn hiện đại.
  kind: etymology
