hanzi: 回
readings:
  - pinyin: huí
    hanviet: hồi
radical: 囗
ids: ⿴囗口
strokes: 6
mnemonic:
  hinh: Hình vẽ vòng xoáy nước lồng nhau — khung lớn [[囗]] bao ngoài khung nhỏ [[口]], như đi một vòng rồi quay lại chỗ cũ.
  am: hồi (hồi hương = về quê, hồi âm = trả lời thư — âm HV rất quen).
  doiThat: '"回家" trong tin nhắn báo về nhà; nút "返回" trên app khi muốn quay lại màn hình trước.'
  tuongPhan: ≠ 田 (ruộng, đang học cùng bài) — 回 là 2 lớp khung lồng nhau (囗+口), 田 chỉ là 1 khung chia 4 ô bởi dấu +.
  kind: etymology
