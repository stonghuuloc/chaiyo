hanzi: 吧
readings:
  - pinyin: ba
    hanviet: ba
radical: 口
ids: ⿰口巴
strokes: 7
mnemonic:
  hinh: Miệng (口) buông lời rủ rê, đề nghị — bên phải 巴 chỉ gợi âm đọc "ba", không mang nghĩa riêng ở đây.
  am: Hán-Việt **ba** — cùng âm với phần biểu âm 巴 (ba), chính là chữ 巴 trong 巴黎 = **Ba Lê** (Paris). Nhớ Ba Lê là ra âm của 吧.
  doiThat: '"走吧" (đi thôi) khi rủ bạn ra ngoài; "好吧" (được rồi) khi miễn cưỡng đồng ý trong tin nhắn.'
  tuongPhan: ≠ 吗 — cùng bộ 口, cùng đứng cuối câu, nhưng 吗 hỏi thẳng cần trả lời có/không, còn 吧 không phải câu hỏi thật, chỉ là đề nghị hoặc phỏng đoán.
  kind: invented
