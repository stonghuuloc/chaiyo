hanzi: 谢
readings:
  - pinyin: xiè
    hanviet: tạ
radical: 讠
ids: ⿰讠射
strokes: 12
mnemonic:
  hinh: Lời nói (讠) bắn thẳng ra (射) — lời cảm ơn nói ngay, chân thành, không vòng vo.
  am: Hán-Việt "tạ" — chính là chữ trong "cảm tạ" (感谢), "tạ ơn".
  doiThat: Card cảm ơn, banner "感谢惠顾" (cảm ơn quý khách) khi thanh toán ở quán ăn.
  tuongPhan: ≠ 射 (bắn, đứng riêng không có nghĩa cảm ơn) — đừng lẫn với chữ gốc phonetic.
  kind: invented
