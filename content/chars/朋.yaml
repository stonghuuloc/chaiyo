hanzi: 朋
readings:
  - pinyin: péng
    hanviet: bằng
radical: 月
ids: ⿰月月
strokes: 8
mnemonic:
  hinh: Hai chữ 月 đứng sát nhau — hai vầng trăng cùng soi, tượng trưng cho hai người thân thiết luôn đi cùng nhau.
  am: '"bằng" — sống trong "bằng hữu" (bạn bè), dù ít dùng độc lập trong tiếng Việt hiện đại.'
  doiThat: '"朋友圈" (Khoảnh khắc — tính năng đăng ảnh trên WeChat) là chỗ học viên gặp chữ này gần như mỗi ngày.'
  tuongPhan: 朋 = hai 月 chồng nhau, ≠ 明 (đã học — sáng, gồm 日+月, hình gần giống nếu đọc lướt); và 友 ≠ 右 (友 dưới là 又, 右 dưới là 口, dễ lẫn khi viết tay).
  kind: invented
