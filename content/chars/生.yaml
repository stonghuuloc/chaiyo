hanzi: 生
readings:
  - pinyin: shēng
    hanviet: sinh
radical: 生
ids: 生
strokes: 5
mnemonic:
  hinh: hình cây non đâm chồi khỏi mặt đất — nghĩa gốc "mọc, sinh trưởng"
  am: 生 = sinh, y hệt "sinh" trong "học sinh, sinh nhật, sinh viên"
  doiThat: biển "医生" (bác sĩ) ở cổng bệnh viện; form khai "出生日期" (ngày sinh)
  tuongPhan: ≠ 性 (xìng, tính chất/giới tính) — khác bộ (忄), khác nghĩa, dễ nhìn lẫn vì cùng thành phần 生 bên phải
  kind: etymology
