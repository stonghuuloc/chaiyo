hanzi: 新
readings:
  - pinyin: xīn
    hanviet: tân
radical: 斤
ids: ⿰亲斤
strokes: 13
mnemonic:
  hinh: '立 (đứng) + 木 (cây) + 斤 (rìu) — dựng cây rồi vung rìu chặt cành, cây vừa chặt nên "mới". Từ nguyên thật là hình thanh: phần trên vốn là 辛 (âm cổ) đọc gần "tân", ghép với 斤 chỉ hành động chặt củi — nghĩa gốc là "củi mới chặt" (nay viết 薪), mượn âm sang nghĩa "mới"'
  am: Hán-Việt "tân" — tân binh (lính mới), tân niên (năm mới), cách tân (đổi mới, cải cách)
  doiThat: Nhãn "新品" (hàng mới) trên app mua sắm; tab "最新" (mới nhất) trong app tin tức/mạng xã hội
  tuongPhan: ≠ 亲 (qīn, thân thiết, thân nhân) — 新 thừa bộ 斤 bên phải, 亲 thì không có
  kind: etymology
