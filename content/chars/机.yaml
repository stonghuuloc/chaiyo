hanzi: 机
readings:
  - pinyin: jī
    hanviet: cơ
radical: 木
ids: ⿰木几
strokes: 6
mnemonic:
  hinh: Khung gỗ (木) ghép với một bộ phận nhỏ (几) vận hành được — 机 = cỗ máy.
  am: 'cơ — cơ hội, cơ khí, cơ quan, nguy cơ, động cơ: âm "cơ" sống rất mạnh trong tiếng Việt hằng ngày, đây là đòn bẩy chính để nhớ chữ này.'
  doiThat: chữ đầu trong 手机 (điện thoại) — từ học viên gõ mỗi ngày; ở sân bay có 登机口 (cửa lên máy bay, dùng 机 từ 飞机).
  tuongPhan: '≠ 杯 (bēi, đã học — bôi, cái cốc). Cùng mang bộ 木 bên trái, dễ lẫn nếu chỉ nhớ mang máng "có chữ mộc": 机 ghép với 几, 杯 ghép với 不.'
  kind: etymology
