hanzi: 儿
readings:
  - pinyin: ér
    hanviet: nhi
radical: 儿
ids: ⿰丿乚
strokes: 2
mnemonic:
  hinh: Hình vẽ hai chân người đang bước/quỳ — nghĩa gốc "đứa trẻ, con" (dáng đi lom khom của trẻ nhỏ).
  am: '"nhi" — như trong 儿子 (nhi tử, con trai), 儿童 (nhi đồng, trẻ em).'
  doiThat: biển "儿童乐园" (khu vui chơi trẻ em) ở trung tâm thương mại; "哪儿" khi hỏi đường/hỏi vị trí kiểu khẩu ngữ.
  tuongPhan: ≠ 几 (học cùng lesson này) — 儿 chỉ có 2 nét cong mềm không móc, 几 có móc nhọn ở cuối nét ngang.
  kind: etymology
