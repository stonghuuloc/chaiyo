hanzi: 昨
readings:
  - pinyin: zuó
    hanviet: tạc
radical: 日
ids: ⿰日乍
strokes: 9
mnemonic:
  hinh: Ngày (日) vừa chợt (乍) trôi qua → ngày hôm qua.
  am: '"tạc" — âm cổ, chỉ còn thấy trong từ Hán Việt hiếm như "tạc dạ" (đêm qua), ít dùng trong tiếng Việt hiện đại.'
  doiThat: '"昨天" trong tin nhắn, lịch, tiêu đề tin tức "昨日新闻".'
  tuongPhan: ≠ 作 (zuò, làm — đã học) — phát âm gần giống nhưng khác thanh và nghĩa hẳn ("làm" vs "hôm qua").
  kind: etymology
