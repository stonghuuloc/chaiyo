hanzi: 出
readings:
  - pinyin: chū
    hanviet: xuất
radical: 凵
ids: ⿱屮凵
strokes: 5
mnemonic:
  hinh: hai ngọn núi 山 chồng lên nhau — trèo qua núi này tới núi kia mới "ra" được ngoài. (Từ nguyên thật là hình bàn chân ra khỏi hang, đây chỉ là mẹo dễ nhớ.)
  am: Hán Việt "xuất" không gần âm nào khác trong bộ này — nhớ qua từ ghép 出口 xuất khẩu, 出发 xuất phát, 出席 xuất tịch.
  doiThat: biển 出口 (lối ra) ở sân bay/ga tàu điện, nút 出发 trên app bản đồ, 出发时间 giờ khởi hành trên vé.
  tuongPhan: ≠ 山 (shān, núi, chỉ 1 chữ 山 không chồng đôi), ≠ 击 (jī, khác hẳn nghĩa nhưng dễ lẫn khi viết tay nhanh).
  kind: etymology
