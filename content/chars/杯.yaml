hanzi: 杯
readings:
  - pinyin: bēi
    hanviet: bôi
radical: 木
ids: ⿰木不
strokes: 8
mnemonic:
  hinh: 木 (gỗ) + 不 — cốc uống nước thuở xưa làm bằng gỗ, ghép với âm gợi 不.
  am: bôi — ít dùng độc lập trong tiếng Việt hiện đại, còn sót trong "干杯" dịch là "cạn bôi/cạn ly".
  doiThat: menu quán cà phê ghi "大杯/中杯/小杯" (size cốc); nâng ly hô "干杯!".
  tuongPhan: ≠ 林 (rừng, đã học) — cùng bộ 木 nhưng 林 là hai chữ 木 chồng lên nhau, 杯 là 木 + 不.
  kind: etymology
