hanzi: 们
readings:
  - pinyin: men
    hanviet: môn
radical: 亻
ids: ⿰亻门
strokes: 5
mnemonic:
  hinh: Người (亻) đứng thành nhóm sau cánh cửa (门) — nhiều người thì thêm 们.
  am: Hán-Việt **môn** (phồn thể 們) — cùng âm HV với phần biểu âm [[门]] (môn = cửa). Nhớ 门 là ra âm HV của 们, dù nghĩa hai chữ không liên quan.
  doiThat: 你们 trong group chat, 我们 trên slogan công ty, MC livestream mở đầu bằng 朋友们.
  tuongPhan: 门 (mén, cửa) đứng một mình — thêm 亻 bên trái mới thành hậu tố số nhiều 们.
  kind: etymology
