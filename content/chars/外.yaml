hanzi: 外
readings:
  - pinyin: wài
    hanviet: ngoại
radical: 夕
ids: ⿰夕卜
strokes: 5
mnemonic:
  hinh: Bình thường bói toán làm vào buổi sáng; bói vào buổi tối (夕+卜) là chuyện khác thường, nằm ngoài lệ thường → nghĩa "bên ngoài, ngoại lệ".
  am: "ngoại — sống rất mạnh trong tiếng Việt: ngoại quốc, ngoại tệ, ngoại ô, người ngoài."
  doiThat: '"外卖" (đồ ăn giao tận nơi) dán trên app đặt đồ ăn Trung Quốc; "外国人" trên tờ khai nhập cảnh.'
  tuongPhan: ≠ 里 (đã học — bên trong) — cặp nghĩa đối lập ngoài/trong, dễ nói ngược khi dịch nhanh.
  kind: etymology
