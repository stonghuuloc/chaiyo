hanzi: 有
readings:
  - pinyin: yǒu
    hanviet: hữu
radical: 月
ids: ⿸𠂇月
strokes: 6
mnemonic:
  hinh: tay (𠂇) cầm miếng thịt (月 = biến thể của 肉) — có thịt trong tay tức là "có".
  am: Hán-Việt "hữu" — sở hữu, hữu ích, hữu hạn.
  doiThat: 有货 (còn hàng) trên shop online, 有效期 (hạn dùng) trên bao bì, 所有 (tất cả) trong điều khoản app.
  tuongPhan: 月 trong 有 là biến thể của 肉 (thịt), khác 月 nghĩa "trăng/tháng" trong 月亮, 月份 — cùng hình, khác gốc.
  kind: etymology
