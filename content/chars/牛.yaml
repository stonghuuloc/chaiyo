hanzi: 牛
readings:
  - pinyin: niú
    hanviet: ngưu
radical: 牛
ids: 牛
strokes: 4
mnemonic:
  hinh: "Tượng hình cổ: hai nét chéo phía trên là sừng, nét ngang + dọc phía dưới là đầu và thân trâu/bò."
  am: ngưu — sống trong "kim ngưu" (chòm sao Kim Ngưu/Taurus), "ngưu nhục" (thịt bò, văn viết cổ, ít dùng).
  doiThat: hộp "牛奶" (sữa bò) ở siêu thị; menu "牛肉面" (mì bò) quán ăn Tàu.
  tuongPhan: ≠ 午 (giờ ngọ/buổi trưa, đã học) — 牛 có thêm nét phẩy chéo phía trên bên trái, 午 chỉ là chữ thập gọn hơn.
  kind: etymology
