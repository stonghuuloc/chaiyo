hanzi: 太
readings:
  - pinyin: tài
    hanviet: thái
radical: 大
ids: ⿵大丶
strokes: 4
mnemonic:
  hinh: 大 (to) thêm một chấm (丶) phía dưới — to đến mức tràn ra thêm, tức là "thái quá".
  am: 'Hán-Việt "thái" — 太后 (Thái hậu), 太子 (Thái tử), 太平洋 (Thái Bình Dương): âm rất quen.'
  doiThat: '"太好了!" trên sticker chat, review "太贵了", biển giảm giá "太划算了".'
  tuongPhan: 大 (dà, to) — 太 = 大 + chấm, nghĩa lệch từ "to" sang "quá, thái quá"; dễ gõ thiếu dấu chấm.
  kind: etymology
