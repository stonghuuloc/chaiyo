hanzi: 来
readings:
  - pinyin: lái
    hanviet: lai
radical: 木
ids: 来
strokes: 7
mnemonic:
  hinh: Hình cây lúa mạch trổ bông — mượn âm để chỉ "đến", nghĩa "lúa" đã bỏ từ lâu.
  am: lai — tương lai, lai lịch, ngoại lai.
  doiThat: Poster công nghệ ghi 未来 (tương lai), tin nhắn giao hàng "来了" (đến rồi), biển 欢迎光临/进来.
  tuongPhan: ≠ 去 (khứ, chiều ngược lại) — 来去 là cặp đối lập kinh điển.
  kind: invented
