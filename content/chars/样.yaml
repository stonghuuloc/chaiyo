hanzi: 样
readings:
  - pinyin: yàng
    hanviet: dạng
radical: 木
ids: ⿰木羊
strokes: 10
mnemonic:
  hinh: khúc GỖ (木) được đẽo theo hình con DÊ (羊) mẫu → KIỂU, DẠNG, hình mẫu để làm theo.
  am: Hán-Việt **dạng** — đa dạng, hình dạng, kiểu dạng.
  doiThat: câu hỏi "怎么样?" (thế nào?) xuất hiện trong mọi cuộc trò chuyện, tin nhắn hàng ngày.
  tuongPhan: 样 (木+羊, "kiểu dạng") ≠ 美 (đã học, "đẹp", 羊+大) — cùng chứa 羊 nhưng cấu trúc và vị trí khác hẳn.
  kind: etymology
