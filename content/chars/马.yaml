hanzi: 马
readings:
  - pinyin: mǎ
    hanviet: mã
radical: 馬
ids: 马
strokes: 3
mnemonic:
  hinh: "Tượng hình ngựa nhìn nghiêng: đầu ở trên, bờm và bốn chân bị giản lược thành các nét ngang/móc."
  am: mã — "mã lực" (sức ngựa = công suất động cơ), "xa mã" (xe ngựa, văn viết).
  doiThat: '"马上" (ngay lập tức) trong tin nhắn bạn bè; biển "马路" (đường lớn) ngoài phố.'
  tuongPhan: ≠ 妈 (mẹ, đã học) — 妈 = 女 + 马, dễ thấy 马 lồng bên trong 妈 nhưng thêm bộ nữ ở bên trái.
  kind: etymology
