hanzi: 年
readings:
  - pinyin: nián
    hanviet: niên
radical: 干
ids: 年
strokes: 6
mnemonic:
  hinh: Một cây cột (十) cắm giữa hai vạch ngang — mỗi vạch là một mùa gặt, cả năm gộp lại thành một chữ.
  am: niên — "niên học", "thường niên", "niên đại" đều dùng thẳng âm Hán-Việt này.
  doiThat: 新年快乐 trên thiệp Tết, 年龄 trên form khai báo, 三年级 trên bảng lớp học.
  tuongPhan: ≠ 午 (wǔ, buổi trưa) — 午 ngắn hơn, không có nét phẩy chéo dài như 年.
  kind: invented
