hanzi: 吃
readings:
  - pinyin: chī
    hanviet: cật
radical: 口
ids: ⿰口乞
strokes: 6
mnemonic:
  hinh: miệng 口 ghép với 乞 (người ăn xin, xin ăn) — mở miệng để xin ăn, dần thành nghĩa "ăn".
  am: âm Hán-Việt gốc của 吃 là "ngật" nhưng không thông dụng trong tiếng Việt hiện đại → dựa vào họ phonetic 乞 = "khất" (như "khất thực" = xin ăn) để neo âm.
  doiThat: 吃饭了吗? câu hỏi thăm quen thuộc thay lời chào, nút 吃货 (hội mê ăn) trên mạng xã hội, review quán ăn ghi 好吃/难吃.
  tuongPhan: ≠ 乞 đứng riêng (chỉ mang nghĩa "xin", không có nghĩa "ăn") — 吃 cần thêm 口 mới ra nghĩa ăn.
  kind: etymology
