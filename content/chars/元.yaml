hanzi: 元
readings:
  - pinyin: yuán
    hanviet: nguyên
radical: 儿
ids: ⿱一兀
strokes: 4
mnemonic:
  hinh: Hai nét ngang (二) đội trên đầu người đang đứng (儿) — cái ở trên cùng đầu, nên 元 mang nghĩa "đầu tiên, gốc".
  am: 'Hán-Việt "nguyên" (nguyên nhân, nguyên tắc). Họ chữ cùng gốc: 元→园 (yuán, vườn), 元→远 (yuǎn, xa).'
  doiThat: 'Giá tiền trên menu/hóa đơn: "38元", app thanh toán hiện số tiền bằng 元.'
  tuongPhan: ≠ 无 (wú, không có) — nét trên khác, đừng lẫn khi viết tay nhanh.
  kind: invented
