hanzi: 慢
readings:
  - pinyin: màn
    hanviet: mạn
radical: 心
ids: ⿰忄曼
strokes: 14
mnemonic:
  hinh: Tâm (忄) mà cứ kéo dài mãi (曼) thì thành ra chậm — 慢
  am: mạn, như trong "mạn đàm" (nói chuyện thong thả), "chậm rãi" mang hơi hướng "mạn"
  doiThat: biển giao thông "减速慢行" (giảm tốc đi chậm), lời chào khi tiễn khách "慢走" ở cửa hàng/nhà hàng
  tuongPhan: "≠ 漫 (màn, tràn lan/lan man, bộ 氵) — cùng âm cùng phần phải 曼, khác bộ: 慢 là tâm (chậm), 漫 là nước (tràn)"
  kind: etymology
