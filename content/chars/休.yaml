hanzi: 休
readings:
  - pinyin: xiū
    hanviet: hưu
radical: 人
ids: ⿰亻木
strokes: 6
mnemonic:
  hinh: Người (亻) dựa vào cây (木) để nghỉ ngơi — đúng nghĩa gốc của chữ 休.
  am: '"hưu" — sống trong từ "nghỉ hưu" (退休), rất quen với người Việt.'
  doiThat: biển "休息中" (đang nghỉ, tạm đóng cửa) ở quán/cửa hàng; "休息室" phòng nghỉ ở sân bay, bệnh viện.
  tuongPhan: ≠ 体 (thân thể, đã học) — cũng có 亻 bên trái nhưng phần phải khác hẳn (亻+本 vs 亻+木).
  kind: etymology
