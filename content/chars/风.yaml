hanzi: 风
readings:
  - pinyin: fēng
    hanviet: phong
radical: 風
ids: ⿵几㐅
strokes: 4
mnemonic:
  hinh: Khung bao ngoài như một cái túi hứng gió, nét chéo bên trong là luồng gió lùa qua.
  am: '"phong" — quen qua "phong cách", "phong cảnh", "táo phong" (bão).'
  doiThat: '"台风" (bão) trên bản tin thời tiết; "风景" (phong cảnh) trên tour du lịch, bưu thiếp.'
  tuongPhan: ≠ 冈 (chưa học, hình gần giống khung bao) — không cần lo, chỉ nhắc để không viết lẫn khung ngoài.
  kind: etymology
