hanzi: 他
readings:
  - pinyin: tā
    hanviet: tha
radical: 亻
ids: ⿰亻也
strokes: 5
mnemonic:
  hinh: Người (亻) khác — một người (也) khác cũng là người — ANH ẤY/NÓ (thật ra 也 chỉ biểu âm, không mang nghĩa "cũng" ở đây)
  am: 'Hán Việt "tha" — tha nhân, kỳ tha, vị tha. Họ biểu âm 也: 他/她/地(dì)/池(chí)'
  doiThat: phụ đề phim ("他说..."), tin nhắn kể chuyện người thứ ba
  tuongPhan: ≠ 她 (cùng âm tā, bộ 女, chỉ nữ giới) ≠ 它 (tā, chỉ đồ vật/con vật)
  kind: invented
