hanzi: 文
readings:
  - pinyin: wén
    hanviet: văn
radical: 文
ids: ⿱亠乂
strokes: 4
mnemonic:
  hinh: Nhìn 文 như nét chấm (亠) trên nét chéo giao nhau (乂) — đây là mẹo tự dựng để nhớ mặt chữ, không phải chiết tự thật.
  am: "văn — sống rất mạnh trong tiếng Việt: văn hóa, văn học, văn bản, văn phòng, công văn."
  doiThat: '"中文" (tiếng Trung) trên app học ngôn ngữ, bàn phím gõ chọn "中文输入法".'
  tuongPhan: ≠ 又 (đã học — lại, và) — nét chéo gần giống nhưng 又 chỉ có 2 nét, 文 có thêm nét chấm phía trên.
  kind: etymology
