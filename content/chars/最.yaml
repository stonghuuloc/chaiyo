hanzi: 最
readings:
  - pinyin: zuì
    hanviet: tối
radical: 曰
ids: ⿱日取
strokes: 12
mnemonic:
  hinh: Trên là dạng giản lược của 冒 (liều lĩnh), dưới là 取 (lấy) — liều mình giành lấy phần nhiều nhất = cực điểm, nhất.
  am: tối — tối đa, tối thiểu, tối cao, tối ưu (rất quen thuộc trong tiếng Việt).
  doiThat: nút "最新" (mới nhất) trên app tin tức, "最低价" (giá thấp nhất) trên app mua sắm, bảng xếp hạng "最受欢迎".
  tuongPhan: dễ lẫn với 冒 (mào — liều lĩnh; cảm mạo 感冒) vì đây chính là gốc từ nguyên của phần trên 最, nhưng 冒 đứng riêng nghĩa khác hẳn.
  kind: etymology
