hanzi: 明
readings:
  - pinyin: míng
    hanviet: minh
radical: 日
ids: ⿰日月
strokes: 8
mnemonic:
  hinh: mặt trời (日) và mặt trăng (月) cùng chiếu sáng = "sáng, rõ"
  am: 明 = minh, y hệt "minh" trong "minh bạch, thông minh, quang minh"
  doiThat: biển "说明书" (hướng dẫn sử dụng) trên hộp sản phẩm; app lịch ghi "明天"
  tuongPhan: ≠ 朋 (péng, bạn) — cùng có 月 nhưng bên trái là 月 chứ không phải 日, dễ nhìn lẫn
  kind: etymology
