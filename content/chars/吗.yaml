hanzi: 吗
readings:
  - pinyin: ma
    hanviet: ma
radical: 口
ids: ⿰口马
strokes: 6
mnemonic:
  hinh: Miệng (口) hỏi về con ngựa (马) — "con ngựa đâu?" là hình ảnh vui để nhớ 口+马 tạo thành trợ từ hỏi.
  am: Hán-Việt **ma** (phồn thể 嗎) — cùng âm với phần biểu âm [[马]] (mã). Nhớ 口 + mã → "ma", trùng luôn pinyin `ma`, nên chữ này là hình thanh đọc thẳng ra âm.
  doiThat: câu chào phổ biến nhất "你好吗？" trên tin nhắn, app chat.
  tuongPhan: ≠ 马 đứng một mình (con ngựa, đã học) — 吗 luôn có thêm 口 bên trái và chỉ dùng làm trợ từ hỏi, không còn mang nghĩa con vật.
  kind: invented
