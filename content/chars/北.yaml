mnemonic:
  hinh: Hai người đứng quay lưng vào nhau — quay lưng về hướng nam thì mặt hướng về phía bắc.
  am: Bắc — như "phương Bắc", "miền Bắc", "Bắc Kinh".
  doiThat: '"北京" tên thủ đô hay gặp; biển chỉ đường "北" ở ga tàu, sân bay.'
  tuongPhan: ≠ 南 (đang học cùng lesson) — đối hướng, hay ghép chung 南北.
  kind: etymology
