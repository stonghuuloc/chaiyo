hanzi: 很
readings:
  - pinyin: hěn
    hanviet: ngận
radical: 彳
ids: ⿰彳艮
strokes: 9
mnemonic:
  hinh: 彳 (bước chân) đi rất (很) xa thì gặp quẻ Cấn (艮 - dừng lại), phải dừng vì "rất" mệt.
  am: "Hán-Việt **ngận**. Không sống độc lập trong tiếng Việt hiện đại. Mẹo: 很 và 恨 (hận, thù ghét) cùng phần phải 艮 — 很 = 彳+艮 (ngận), 恨 = 忄+艮 (hận); âm HV chỉ khác một dấu."
  doiThat: 很好 trên nút feedback/rating app, 很多 trong review sản phẩm, phụ đề phim "我很好".
  tuongPhan: 狠 (hěn, hung dữ, tàn nhẫn — 狠心) — cùng âm hệt nhau, thêm 犭(khuyển) đổi hẳn từ phó từ sang tính từ.
  kind: etymology
