hanzi: 进
readings:
  - pinyin: jìn
    hanviet: tiến
radical: 辵
ids: ⿺辶井
strokes: 7
mnemonic:
  hinh: Đi (辶) tới giếng (井, gợi âm jìn) phía trước — tiến tới, đi vào.
  am: tiến — "tiến bộ", "tiên tiến", "cải tiến".
  doiThat: biển "禁止进入" (cấm vào) ở công trường; nút "进入" (vào) trên app đăng nhập.
  tuongPhan: ≠ 到 (đã học lượt này — cùng bộ 辶 nhưng phần còn lại khác, dễ nhầm khi viết nhanh).
  kind: etymology
