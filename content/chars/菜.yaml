hanzi: 菜
readings:
  - pinyin: cài
    hanviet: thái
radical: 艸
ids: ⿱艹采
strokes: 11
mnemonic:
  hinh: 艹 (cây cỏ) + 采 (hái) — hái cây cỏ về ăn, thành rau/món ăn.
  am: Hán-Việt "thái" — trùng nghĩa "hái" của 采, dễ nhớ vì âm và nghĩa liên quan nhau.
  doiThat: Menu quán ăn ghi "点菜" (gọi món), biển "家常菜" ở quán cơm bình dân.
  tuongPhan: ≠ 采 (cǎi, hái — không có bộ 艹) và ≠ 彩 (cǎi, màu sắc — bộ 彡).
  kind: etymology
