hanzi: 火
readings:
  - pinyin: huǒ
    hanviet: hoả
radical: 火
ids: ⿱八人
strokes: 4
mnemonic:
  hinh: Hai tia lửa bắn chéo hai bên một ngọn lửa trung tâm đang bốc cao — dáng lửa cháy thật.
  am: hỏa — "hỏa hoạn", "phòng hỏa", "cứu hỏa" đều dùng thẳng âm này.
  doiThat: 火锅 trên biển hiệu quán lẩu, 上火 trên app sức khỏe, 火车 trên bảng ga tàu.
  tuongPhan: ≠ 大 (dà, to lớn) — 大 không có hai chấm/nét chéo nhỏ hai bên như 火.
  kind: etymology
