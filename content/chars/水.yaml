mnemonic:
  hinh: Một trục dọc ở giữa (dòng chảy chính) với các tia nước bắn ra hai bên — dòng sông nhìn từ trên.
  am: thủy — "thủy sản", "thủy điện", "phong thủy" đều dùng thẳng âm này.
  doiThat: 开水/热水 trên bình nước khách sạn, 水果 trên biển hiệu chợ, 水电费 trên hóa đơn.
  tuongPhan: ≠ 冰 (bīng, băng/đá) — 冰 có thêm hai chấm (冫, bộ băng) bên trái chỉ giá lạnh.
  kind: etymology
