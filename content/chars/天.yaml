hanzi: 天
readings:
  - pinyin: tiān
    hanviet: thiên
radical: 大
ids: ⿱一大
strokes: 4
mnemonic:
  hinh: Người dang tay (大) đội trên đầu một vạch ngang (一) — vạch đó chính là bầu trời cao nhất.
  am: thiên — "thiên nhiên", "thiên tài", "lạc thiên" đều dùng thẳng âm này.
  doiThat: 天气 trên app thời tiết, 明天/今天 khắp lịch hẹn, 聊天 tên app chat.
  tuongPhan: ≠ 夫 (fū, chồng/phu) — 夫 có nét phẩy chéo xuyên qua đỉnh, 天 thì không.
  kind: etymology
