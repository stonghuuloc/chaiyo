hanzi: 七
readings:
  - pinyin: qī
    hanviet: thất
radical: 一
ids: ⿻㇀乚
strokes: 2
mnemonic:
  hinh: nét ngang trên + nét sổ móc bên phải — hình nhát cắt chéo cổ, mượn làm số 7
  am: qī ≈ "thất" — thất tuần (70 tuổi), thất tinh, thất ngôn (thơ 7 chữ/câu)
  doiThat: biển 7-Eleven (đọc số Ả Rập bình thường), 七夕 (lễ Thất tịch) trên app/mạng xã hội dịp tháng 7 âm lịch
  tuongPhan: ≠ 匕 (bǐ, thìa/dao găm — nét móc bên trái); ≠ 十 (shí, chữ thập, không có móc)
  kind: etymology
