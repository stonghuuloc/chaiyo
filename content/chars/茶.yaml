hanzi: 茶
readings:
  - pinyin: chá
    hanviet: trà
radical: 艸
ids: ⿳艹人朩
strokes: 9
mnemonic:
  hinh: Dưới bộ cỏ/cây (艹) có người (人) đứng cạnh cây gỗ (木) — người hái lá cây trà.
  am: 'Hán-Việt "trà" — dùng thẳng: trà đá, trà sữa, trà đạo.'
  doiThat: Biển "茶馆" (trà quán), menu trà sữa "奶茶", nút gọi đồ uống trong app giao đồ ăn.
  tuongPhan: ≠ 茉 (mò, trong 茉莉 hoa nhài) — cùng bộ 艹 nhưng phần dưới khác.
  kind: etymology
