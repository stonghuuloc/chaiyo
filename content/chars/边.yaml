hanzi: 边
readings:
  - pinyin: biān
    hanviet: biên
radical: 辵
ids: ⿺辶力
strokes: 5
mnemonic:
  hinh: 辶 (đi) + 力 (chỉ còn là ký hiệu giản lược) — hình dung "đi (辶) đến hết sức (力) thì tới rìa, tới biên".
  am: biên — "biên giới", "biên phòng", "vùng biên" đều dùng âm này.
  doiThat: biển "路边摊" (quán hàng vỉa hè) ven đường; app bản đồ chỉ đường nói "在...旁边" (ở cạnh...).
  tuongPhan: ≠ 过 (đã học — đi qua, vượt qua) — cả hai đều có bộ 辶 (liên quan di chuyển), nhưng 边 chỉ vị trí "bên/rìa", 过 chỉ hành động "đi ngang qua".
  kind: etymology
