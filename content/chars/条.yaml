hanzi: 条
readings:
  - pinyin: tiáo
    hanviet: điều
radical: 木
ids: ⿱夂朩
strokes: 7
mnemonic:
  hinh: Nét phía trên (夂) như một dải dây rủ xuống một cành cây (朩, biến thể 木) — hình ảnh vật dài mảnh.
  am: '"điều" — điều kiện, quy điều.'
  doiThat: Menu "面条" (mì sợi); hợp đồng "条件"/"条款" (điều kiện/điều khoản).
  tuongPhan: ≠ 各 (gè, mỗi — chưa học, phần trên cũng là 夂, dễ lẫn nét đầu khi viết nhanh, nhưng phần dưới là 口 chứ không phải 木).
  kind: invented
