hanzi: 常
readings:
  - pinyin: cháng
    hanviet: thường
radical: 巾
ids: ⿱𫩠巾
strokes: 11
mnemonic:
  hinh: phần trên (𫩠, dáng gần giống 尚 — cao) phủ xuống tấm KHĂN (巾) mặc mỗi ngày → THƯỜNG XUYÊN, BÌNH THƯỜNG.
  am: "Hán-Việt **thường** — quá quen: *thường xuyên, bình thường, thường dân*."
  doiThat: quảng cáo "非常好吃" (rất/cực ngon) khắp nơi; app quản lý chi tiêu ghi tab "日常" (hằng ngày).
  tuongPhan: 常 (cháng, thường xuyên/bình thường) ≠ 长 (cháng/zhǎng, dài/trưởng, đã học) — cùng âm cháng, dễ lẫn khi nghe.
  kind: etymology
