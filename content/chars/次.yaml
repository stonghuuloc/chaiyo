hanzi: 次
readings:
  - pinyin: cì
    hanviet: thứ
radical: 欠
ids: ⿰冫欠
strokes: 6
mnemonic:
  hinh: trời lạnh (冫) mà bụng vẫn THIẾU đồ ăn (欠) → phải ăn thêm LẦN NỮA mới no → LẦN, THỨ TỰ.
  am: 'Hán-Việt **thứ** — quen dùng: *thứ tự, lần thứ hai, thứ yếu* (còn âm cổ "tư", ít dùng độc lập trong tiếng Việt hiện đại).'
  doiThat: vé xem phim/tàu ghi "第一次" (lần đầu tiên); app đặt đồ ăn hiện nút "再来一次" (đặt lại lần nữa).
  tuongPhan: '次 (冫+欠, "lần/thứ") ≠ 欢 (又+欠, "vui", đã học) — cùng 欠 bên phải nhưng bộ trái khác hẳn: băng (冫) so với tay (又).'
  kind: etymology
