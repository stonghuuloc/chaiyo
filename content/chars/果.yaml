hanzi: 果
readings:
  - pinyin: guǒ
    hanviet: quả
radical: 木
ids: ⿻日木
strokes: 8
mnemonic:
  hinh: Hình quả tròn (phần trên) mọc trên cây (木) — chữ tượng hình quả.
  am: '"quả" — kết quả, quả cảm, như quả (如果).'
  doiThat: Biển "水果店" (cửa hàng trái cây); menu "果汁" (nước ép).
  tuongPhan: ≠ 呆 (dại/ngốc, chưa học — cùng có 木 ở dưới nhưng phần trên là 口 chứ không phải hình quả).
  kind: etymology
