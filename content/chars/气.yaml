hanzi: 气
readings:
  - pinyin: qì
    hanviet: khí
radical: 气
ids: ⿳𠂉一乁
strokes: 4
mnemonic:
  hinh: 3 nét ngang cong xếp lớp, mô phỏng làn hơi/khí bốc lên khỏi mặt đất.
  am: "khí — sống rất mạnh trong tiếng Việt: khí hậu, không khí, sinh khí, khí chất."
  doiThat: '"天气" (thời tiết) trên app dự báo; "生气" (giận) trong tin nhắn bạn bè cãi nhau.'
  tuongPhan: ≠ 汽 (hơi nước, chưa học, thêm bộ 水) — 气 là khí nói chung, 汽 thiên về hơi nước/xe hơi.
  kind: etymology
