hanzi: 服
readings:
  - pinyin: fú
    hanviet: phục
radical: 月
ids: ⿰月𠬝
strokes: 8
mnemonic:
  hinh: 月 bên trái (chỉ là hình, không phải "trăng" ở đây) + 𠬝 bên phải — 𠬝 vừa gợi âm "phục" vừa gợi nghĩa "phục tùng".
  am: '"phục" — giữ nguyên trong "phục trang, y phục, phục sức, đồng phục, phục tùng, khâm phục".'
  doiThat: nhãn "校服" (đồng phục) trên áo học sinh; biển cửa hàng thời trang hay ghi chữ 服.
  tuongPhan: "≠ 报 (báo — cũng chứa 𠬝 bên phải, chưa học) — phân biệt theo bộ bên trái: 服 có 月, 报 có 扌."
  kind: etymology
