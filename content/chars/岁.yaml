hanzi: 岁
readings:
  - pinyin: suì
    hanviet: tuế
radical: 山
ids: ⿱山夕
strokes: 6
mnemonic:
  hinh: Trên là 山 (núi), dưới là 夕 (nét giản lược) — cứ tưởng tượng "leo qua một ngọn núi" là thêm một tuổi.
  am: tuế — như trong "vạn tuế", "tứ tuế".
  doiThat: '"你今年几岁了" hỏi tuổi trẻ con; "万岁" trong phim cổ trang.'
  tuongPhan: ≠ 山 (shān, núi, đã học) — 岁 chứa trọn 山 ở trên nhưng đọc suì và nghĩa hoàn toàn khác (tuổi, không phải núi).
  kind: invented
