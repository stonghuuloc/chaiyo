hanzi: 也
readings:
  - pinyin: yě
    hanviet: dã
radical: 乙
ids: 也
strokes: 3
mnemonic:
  hinh: 也 giống hình con rắn uốn éo — "cũng vậy, cũng thế" như cứ lặp lại đường cong cũ.
  am: Hán-Việt **dã** — chính là chữ 也 trong thành ngữ "chi hồ giả dã" (之乎者也), câu người Việt vẫn dùng để nói về lối văn chữ Hán. Đây là neo âm mạnh nhất của chữ này.
  doiThat: '"我也是" trả lời đồng tình trong chat, "也可以" trên nút xác nhận tùy chọn trong app.'
  tuongPhan: 他 (tā, anh ấy) — cùng mang 也 nhưng thêm 亻(nhân) đổi hẳn từ phó từ "cũng" sang đại từ nhân xưng.
  kind: invented
