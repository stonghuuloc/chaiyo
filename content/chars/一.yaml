mnemonic:
  hinh: Một nét ngang duy nhất — đúng MỘT (chữ chỉ sự cổ nhất, vẽ đúng 1 vạch để biểu thị số 1)
  am: Hán Việt "nhất" — đệ nhất, nhất trí, thống nhất, duy nhất
  doiThat: menu ghi "一份" (một phần), đếm số trong game, giá "一杯" trên bảng giá
  tuongPhan: ≠ 二 (hai nét ngang) ≠ 三 (ba nét ngang) — đếm số nét ngang là ra số
  kind: etymology
