hanzi: 都
readings:
  - pinyin: dōu
    hanviet: đô
  - pinyin: dū
    hanviet: đô
radical: 邑
ids: ⿰者阝
strokes: 10
mnemonic:
  hinh: 者 (người ta) tụ tập quanh 阝(thành ấp) — nơi đông người tụ hội thành đô thị, nghĩa gốc "kinh đô".
  am: 'Hán-Việt "đô" — 首都 (thủ đô), 都市 (đô thị): âm rất quen.'
  doiThat: '"大家都" trong caption đồng tình tập thể, "首都" trên bản đồ/app du lịch, "都可以" khi rủ đi ăn ai cũng ok.'
  tuongPhan: 者 (zhě, kẻ, người — 记者 nhà báo) — 都 thêm 阝(ấp) đổi hẳn từ hậu tố chỉ người sang phó từ "đều"/danh từ "đô thị".
  kind: etymology
