mnemonic:
  hinh: Phụ nữ (女) cũng (也) cần một chữ riêng — CÔ ẤY (她 do học giả Lưu Bán Nông tạo đầu TK 20 để dịch "she", tách khỏi 他 trung tính)
  am: cùng âm HV "tha" với 他 nhưng không dùng trong từ ghép tiếng Việt hiện đại
  doiThat: phụ đề phim khi người kể là nữ, bài báo viết về nhân vật nữ cụ thể
  tuongPhan: ≠ 他 (nam/trung tính) ≠ 它 (đồ vật/con vật)
  kind: etymology
