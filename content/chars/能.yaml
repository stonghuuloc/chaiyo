hanzi: 能
readings:
  - pinyin: néng
    hanviet: năng
radical: 肉
ids: ⿰䏍𫧇
strokes: 10
mnemonic:
  hinh: 能 vốn là hình con gấu (đầu 厶, thân 月, bốn chân 匕匕) — gấu khỏe, có sức, nên 能 nghĩa là "có khả năng".
  am: 'Hán-Việt "năng" — 能力 (năng lực), 可能 (khả năng), 能量 (năng lượng): âm rất quen.'
  doiThat: '"不可能!" câu cảm thán, "太阳能" (năng lượng mặt trời) trên nhãn sản phẩm, "能不能" khi xin phép qua tin nhắn.'
  tuongPhan: 熊 (xióng, con gấu) — chính là 能 gốc, thêm 灬(hỏa, 4 chấm) để tách riêng nghĩa "con gấu" khỏi nghĩa "có thể" mà 能 đã chiếm mất.
  kind: etymology
