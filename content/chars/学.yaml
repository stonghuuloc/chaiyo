hanzi: 学
readings:
  - pinyin: xué
    hanviet: học
radical: 子
ids: ⿳𭕄冖子
strokes: 8
mnemonic:
  hinh: đứa trẻ (子) ngồi dưới mái nhà đầy chữ (phần trên) — hình ảnh "đứa trẻ đi học"
  am: 学 = học, y hệt "học" trong "học sinh, đi học, học tập"
  doiThat: icon "学习" trong app từ điển/app học tiếng Trung; biển "xxx学校" trước cổng trường
  tuongPhan: ≠ 字 (zì, chữ viết) — 学 là hành động tiếp thu, 字 là ký tự cụ thể
  kind: invented
