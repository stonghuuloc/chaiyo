mnemonic:
  hinh: Giáp cốt văn vẽ hình ánh sáng/tia nắng tỏa từ một điểm — gốc nghĩa "sáng, trắng".
  am: 白 = bạch, y hệt "bạch" trong bạch tuộc, bạch cầu, thanh bạch.
  doiThat: Nhãn size quần áo, menu quán (白酒, 白粥), tên món ăn, subtitle phim (白領 dân văn phòng).
  tuongPhan: ≠ 百 (bǎi, trăm) — 百 = 白 + thêm 1 nét ngang trên đầu, rất dễ viết lẫn.
  kind: etymology
