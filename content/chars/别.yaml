hanzi: 别
readings:
  - pinyin: bié
    hanviet: biệt
radical: 刀
ids: ⿰另刂
strokes: 7
mnemonic:
  hinh: Bên trái 另 (khác, tách riêng) + bên phải 刂 (dao) — dùng dao tách riêng ra, thành nghĩa "phân biệt, chia tách", rồi mở rộng thành "khác" và "đừng" (ngăn lại như dao chặn).
  am: biệt (biệt ly, đặc biệt, phân biệt — âm HV rất quen).
  doiThat: '"别说了" (đừng nói nữa) trong tin nhắn bạn bè; "特别" (đặc biệt) trên menu món đặc trưng của quán.'
  tuongPhan: ≠ 刀 (dao, đang học cùng bài) — 别 có thêm phần 另 bên trái nên 7 nét, 刀 chỉ đứng một mình với 2 nét.
  kind: etymology
