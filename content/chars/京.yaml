hanzi: 京
readings:
  - pinyin: jīng
    hanviet: kinh
radical: 亠
ids: ⿳亠口小
strokes: 8
mnemonic:
  hinh: 亠 (mái nhọn trên đỉnh) + 口 (thành quách vuông) + 小 (thu nhỏ dần) → hình dung một toà cao có mái nhọn, dưới là thành quách bao quanh — kinh đô có thành cao, cung điện lớn.
  am: '"kinh" — Bắc Kinh, Nam Kinh, Đông Kinh (Tokyo), kinh đô, kinh thành.'
  doiThat: bản tin thời tiết "北京"/"东京"; món trên menu "京酱肉丝" (thịt xào tương kiểu Bắc Kinh).
  tuongPhan: ≠ 高 (cao, đã học) — cùng gợi "lớn/cao" nhưng 高 là tính từ chỉ độ cao, 京 là danh từ riêng chỉ kinh đô.
  kind: etymology
