hanzi: 是
readings:
  - pinyin: shì
    hanviet: thị
radical: 日
ids: ⿱日𤴓
strokes: 9
mnemonic:
  hinh: mặt trời (日) là thứ luôn đúng giờ, đúng chỗ (正) → 是 mang nghĩa "đúng, là".
  am: 'Hán-Việt "thị" — như trong 是非 (thị phi: chuyện đúng sai).'
  doiThat: 是的 khi nghe điện thoại/trả lời khách; app hỏi xác nhận kiểu 是否继续 (có tiếp tục không).
  tuongPhan: "是 (bộ 日, 9 nét) dễ nhìn lướt nhầm dáng với 走 (bộ 走) — phân biệt bằng phần trên: 日 chứ không phải 土."
  kind: etymology
