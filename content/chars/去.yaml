hanzi: 去
readings:
  - pinyin: qù
    hanviet: khứ
radical: 厶
ids: ⿱土厶
strokes: 5
mnemonic:
  hinh: Người (biến thể của 大) rời khỏi miệng hang (厶) = rời đi, đi khỏi.
  am: khứ — quá khứ, khứ hồi (vé khứ hồi!).
  doiThat: Vé "khứ hồi" ở sân bay (去+回), nút 去 trên app gọi xe/bản đồ (去公司, 去机场).
  tuongPhan: ≠ 来 (来去 là cặp đối lập, luôn nhớ theo cặp).
  kind: invented
