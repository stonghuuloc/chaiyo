hanzi: 午
readings:
  - pinyin: wǔ
    hanviet: ngọ
radical: 十
ids: ⿱𠂉十
strokes: 4
mnemonic:
  hinh: 午 giống chữ 十 (mười) có thêm một nét phẩy ở đầu — giờ Ngọ là mốc chia đôi ngày, giống 十 đứng thẳng chia đôi.
  am: '"ngọ" — giờ Ngọ, năm Ngọ (tuổi Ngọ, con ngựa trong 12 con giáp) — âm quen thuộc với người Việt.'
  doiThat: '"中午" "下午" trên đồng hồ/lịch của điện thoại; "午睡" (ngủ trưa) trong thói quen sinh hoạt TQ.'
  tuongPhan: ≠ 十 (đã học — số mười) — 午 thêm một nét phẩy ở đầu so với 十, dễ viết lẫn khi viết nhanh.
  kind: invented
