hanzi: 你
readings:
  - pinyin: nǐ
    hanviet: nhĩ
radical: 亻
ids: ⿰亻尔
strokes: 7
mnemonic:
  hinh: Người (亻) đứng trước mặt bạn, chính là 尔 (ngươi) — NGƯƠI/BẠN
  am: Hán-Việt **nhĩ** — 你好 đọc lối Hán-Việt là "nhĩ hảo". Không đứng lẻ trong tiếng Việt hiện đại, nhưng khớp thẳng với phần biểu âm 尔 (cũng âm HV "nhĩ") nên nhớ một lần được cả hai chữ.
  doiThat: câu chào "你好" khắp biển hiệu, nút "关注你" trên app mạng xã hội TQ
  tuongPhan: ≠ 您 (nín, kính ngữ, trang trọng hơn) ≠ 他 (tā, ngôi 3)
  kind: etymology
