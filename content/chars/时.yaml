hanzi: 时
readings:
  - pinyin: shí
    hanviet: thời
radical: 日
ids: ⿰日寸
strokes: 7
mnemonic:
  hinh: Mặt trời (日) di chuyển từng "tấc" (寸) trên trời — mỗi tấc là một khắc thời gian.
  am: thời — "thời gian", "thời tiết", "cổ thời" đều dùng thẳng âm Hán-Việt này.
  doiThat: 实时 trên app tin tức (real-time), 时间 trên đồng hồ điện thoại, 准时 trên vé tàu.
  tuongPhan: ≠ 对 (duì, đúng/đối) — 对 có bộ 寸 giống nhưng bên trái là 又/x không phải 日.
  kind: etymology
