mnemonic:
  hinh: 扌 bàn tay + 戈 cây qua → tay cầm vũ khí lục tìm khắp nơi = tìm, kiếm
  am: '"trảo" trong trảo (tìm); zhǎo đọc gần "chảo"'
  doiThat: 找钱 khi thối tiền; app tìm đường ghi "找路"
  tuongPhan: "≠ 我 (wǒ, tôi): 找 có 扌 bên trái, 我 không có"
  kind: etymology
