mnemonic:
  hinh: mái nhà (宀) trùm lên con lợn (豕) — nông hộ cổ nuôi heo dưới mái nhà = gia đình
  am: gia — "gia đình", "gia vị", "quốc gia"
  doiThat: tin nhắn "回家" (về nhà), app gọi xe ghi địa chỉ nhà, biển quán "家常菜" (món ăn gia đình)
  tuongPhan: dễ lẫn 客 (kè, "khách") — trên cũng có 宀 nhưng dưới là 各, không phải 豕
  kind: etymology
