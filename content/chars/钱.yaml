hanzi: 钱
readings:
  - pinyin: qián
    hanviet: tiền
radical: 金
ids: ⿰钅戋
strokes: 10
mnemonic:
  hinh: Tiền xưa đúc bằng kim loại (钅), 戋 vốn nghĩa "nhỏ vụn" — tiền là những mảnh kim loại nhỏ.
  am: Hán-Việt "tiền" — dùng thẳng trong "tiền tệ", "kim tiền".
  doiThat: Nút "钱包" (ví tiền) trong app thanh toán, màn hình chuyển khoản, biển đổi tiền.
  tuongPhan: ≠ 浅 (qiǎn, nông cạn) — cùng 戋 nhưng bộ 氵 chứ không phải 钅.
  kind: etymology
