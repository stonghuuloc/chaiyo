hanzi: 些
readings:
  - pinyin: xiē
    hanviet: ta
radical: 二
ids: ⿱此二
strokes: 8
mnemonic:
  hinh: từ chỗ NÀY (此) nhân lên thành HAI (二) trở lên → MỘT SỐ, VÀI, số lượng không xác định.
  am: Hán-Việt **ta** — ít dùng độc lập trong tiếng Việt hiện đại (gốc Nôm "ta"), nhớ chủ yếu qua HÌNH và họ chữ 此.
  doiThat: câu hàng ngày "这些/那些" xuất hiện trong mọi tin nhắn, phụ đề phim.
  tuongPhan: 些 (lượng từ mơ hồ "vài, một số", luôn đi SAU 这/那) ≠ 此 (đại từ chỉ định, đứng ĐẦU, chính là thành phần cấu tạo bên trong 些).
  kind: invented
