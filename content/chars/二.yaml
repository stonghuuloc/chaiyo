mnemonic:
  hinh: Hai nét ngang chồng lên nhau — đúng HAI
  am: 'Hán Việt "nhị" — nhị thập (Hán Việt cổ: hai mươi), độc nhất vô nhị, nhị vị'
  doiThat: biển "二楼" (tầng 2), menu "二人套餐" (set 2 người)
  tuongPhan: ≠ 两 (liǎng, cũng là "hai" nhưng dùng trước lượng từ) ≠ 十二 (shí'èr, mười hai — dễ nghe nhầm khi nói nhanh)
  kind: etymology
