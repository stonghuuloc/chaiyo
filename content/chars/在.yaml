hanzi: 在
readings:
  - pinyin: zài
    hanviet: tại
radical: 土
ids: ⿸才土
strokes: 6
mnemonic:
  hinh: 才 (mầm cây vừa nhô lên) cắm trên 土 (đất) — mầm mọc tại một chỗ trên đất = "ở, tại".
  am: Hán Việt "tại" gần vần với 才 = "tài" — nhớ cặp vần "tại...tài".
  doiThat: 现在 (bây giờ) trên đồng hồ điện thoại, 在吗? mở đầu tin nhắn hỏi thăm, 不在 báo vắng mặt trên app chấm công.
  tuongPhan: ≠ 再 (zài, "lại, thêm lần nữa") — không có bộ 土, phần trên là 冂+一 chứ không phải 才.
  kind: etymology
