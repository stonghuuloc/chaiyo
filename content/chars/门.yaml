hanzi: 门
readings:
  - pinyin: mén
    hanviet: môn
radical: 門
ids: 门
strokes: 3
mnemonic:
  hinh: hình 2 cánh cửa khép lại nhìn từ ngoài vào — giữ nguyên hình tượng từ chữ phồn thể 門
  am: môn — "gia môn" (cửa nhà), thường gặp hơn khi 门 làm bộ thủ trong 问 (vấn), 闻 (văn)
  doiThat: biển "校门" (cổng trường), tin nhắn hẹn "家门口见" (gặp trước cửa nhà), nút "热门" (hot) trong app
  tuongPhan: dễ lẫn 们 (men, hậu tố số nhiều "我们") — 们 có thêm bộ 亻 bên trái
  kind: etymology
