hanzi: 妹
readings:
  - pinyin: mèi
    hanviet: muội
radical: 女
ids: ⿰女未
strokes: 8
mnemonic:
  hinh: 女 (nữ) bên trái + 未 (chưa) bên phải — người con gái "chưa" lớn bằng chị/anh, tức em gái.
  am: '"muội" — như trong "tỷ muội, sư muội, biểu muội".'
  doiThat: xưng hô phim kiếm hiệp "师妹" (sư muội); từ "妹妹" (em gái) trong hội thoại gia đình hàng ngày.
  tuongPhan: ≠ 未 (chưa — đứng độc lập nghĩa hoàn toàn khác, chỉ mượn làm âm trong 妹, không liên quan nghĩa "em gái").
  kind: invented
