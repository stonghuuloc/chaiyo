hanzi: 比
readings:
  - pinyin: bǐ
    hanviet: tỷ
radical: 比
ids: 比
strokes: 4
mnemonic:
  hinh: Có thuyết cho là hình hai người đứng cạnh nhau cùng quay một hướng để so sánh — hai nét móc song song rất dễ nhận.
  am: tỷ — "so tỷ", "tỷ lệ", "tỷ như" đều dùng âm này, khá quen thuộc trong tiếng Việt.
  doiThat: tỷ số trận đấu trên TV ghi kiểu "3比2"; câu cửa miệng "一比一" khi chia đều thắng thua.
  tuongPhan: ≠ 北 (đã học — phương bắc) — cả hai đều có 2 nét móc dọc song song, nhưng 北 có thêm nét ngang phía dưới bên trái, 比 thì không.
  kind: etymology
