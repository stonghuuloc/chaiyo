hanzi: 买
readings:
  - pinyin: mǎi
    hanviet: mãi
radical: 大
ids: ⿱乛头
strokes: 6
mnemonic:
  hinh: Dùng lưới (网) hốt của cải/tiền (贝) về tay mình = mua vào.
  am: mãi — khuyến mại (thường viết nhầm "khuyến mãi" trong tiếng Việt), mãi lực (sức mua).
  doiThat: Nút "mua ngay" trên app, biển 买一送一 (mua 1 tặng 1), câu 买单 (tính tiền) ở quán ăn.
  tuongPhan: "≠ 卖 (chỉ khác 1 bộ 十 trên đầu: 十+买 = 卖) — cực dễ lẫn, phải nhớ theo cặp."
  kind: invented
