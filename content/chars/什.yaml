hanzi: 什
readings:
  - pinyin: shén
    hanviet: thậm
radical: 亻
ids: ⿰亻十
strokes: 4
mnemonic:
  hinh: người (亻) đứng thành nhóm mười (十) → nghĩa gốc "tốp mười người"; nghĩa "gì" ngày nay chỉ mượn âm đọc.
  am: 'Âm Hán-Việt của 什 là thập / thậm — khi đọc shí, ví dụ 什物 (thập vật: đồ lặt vặt); khi đọc shén trong 什么 thì đó là dùng chữ để ghi âm khẩu ngữ (giả tá), bản thân chữ 什 vẫn có âm HV như trên, chỉ là âm đó không gắn với nghĩa "gì".'
  doiThat: 什么 xuất hiện dày đặc trong hỏi đáp hằng ngày; 什锦 (thập cẩm) trên menu — 什锦炒饭, 什锦水果.
  tuongPhan: 什 không tự đứng một mình mang nghĩa "gì" — luôn phải ghép 么 (什么). Đứng một mình chỉ mang nghĩa "mười/nhóm mười" (hiếm dùng).
  kind: etymology
