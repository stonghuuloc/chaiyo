hanzi: 等
readings:
  - pinyin: děng
    hanviet: đẳng
radical: 竹
ids: ⿱竹寺
strokes: 12
mnemonic:
  hinh: Thẻ TRE (竹) đóng dấu ở SỞ QUAN (寺, nghĩa cổ) — nơi ai nộp đơn cũng phải xếp theo thứ tự rồi CHỜ tới lượt mình.
  am: đẳng — *bình đẳng* (ngang hàng), *cao đẳng* (trường cao đẳng), *đẳng cấp* — cực quen thuộc trong tiếng Việt hằng ngày.
  doiThat: menu chọn độ cay ghi *中等* (vừa) giữa hai mức; hộp trà quà tặng ghi *上等* (thượng hạng) trên nhãn.
  tuongPhan: ≠ 第 (竹+弟, "thứ tự", đã học) — cùng bắt đầu bằng bộ 竹 nhưng phần dưới khác (寺 so với 弟); 等 = chờ/đẳng cấp, 第 = đánh số thứ tự.
  kind: etymology
