mnemonic:
  hinh: Hình miếng thịt cắt ra, đường nét gấp khúc bên trong mô phỏng vân/gân thịt.
  am: '"nhục" — nhục thể, cốt nhục (tình máu mủ), âm còn dùng trong văn viết tiếng Việt.'
  doiThat: Menu "鱼香肉丝", biển thịt "牛肉", "猪肉" ở chợ/siêu thị.
  tuongPhan: ≠ 月 (tháng/trăng, đã học) — khi làm bộ thủ trong chữ khác (như 脚, 胡 đã học), 肉 thường viết giống 月, nhưng đứng riêng một mình 肉 có nét gấp khúc bên trong khác hẳn 月.
  kind: etymology
