mnemonic:
  hinh: Hai buổi tối (夕) chồng lên nhau — đêm này qua đêm khác cộng dồn = nhiều.
  am: đa — đa số, đa dạng, đa nghi, đa mang.
  doiThat: Câu hỏi giá cửa miệng 多少钱, nhãn dán 差不多, thiệp cảm ơn 多谢.
  tuongPhan: ≠ 夕 (chỉ một nửa của 多, nghĩa "buổi tối" hoàn toàn khác "nhiều").
  kind: etymology
