hanzi: 请
readings:
  - pinyin: qǐng
    hanviet: thỉnh
radical: 言
ids: ⿰讠青
strokes: 10
mnemonic:
  hinh: Lời nói (讠) trong trẻo (青) — lời mời nhẹ nhàng, lịch sự.
  am: Hán-Việt "thỉnh" — như trong "thỉnh cầu", "thỉnh giảng".
  doiThat: Biển "请勿吸烟" (xin đừng hút thuốc), nút "申请" (apply) trên form/app.
  tuongPhan: "≠ 情/清/晴 (cùng họ 青 nhưng bộ khác: 忄tình cảm, 氵trong, 日nắng)."
  kind: etymology
