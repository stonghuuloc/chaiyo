hanzi: 零
readings:
  - pinyin: líng
    hanviet: linh
radical: 雨
ids: ⿱雨令
strokes: 13
mnemonic:
  hinh: 雨 (mưa) ở trên + 令 (lệnh, gợi âm) ở dưới — nghĩa gốc là mưa rơi lất phất từng giọt nhỏ, lẻ tẻ → nghĩa mở rộng "số không, vụn, lẻ".
  am: '"linh" — rất quen thuộc: "một trăm linh năm" (105), "chín giờ linh năm phút".'
  doiThat: đồng hồ điện tử, giá "0 đồng", đọc số điện thoại có số 0 đều là 零.
  tuongPhan: ≠ 雨 (mưa, đã học) — 零 thêm 令 phía dưới, nghĩa đã trừu tượng hoá thành "số 0", không còn chỉ mưa cụ thể nữa.
  kind: etymology
