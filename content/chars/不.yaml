hanzi: 不
readings:
  - pinyin: bù
    hanviet: bất
radical: 一
ids: 不
strokes: 4
mnemonic:
  hinh: nét ngang trên (一) như thanh chắn ngang, phần dưới như hai chân bị chặn lại → "không, chẳng".
  am: Hán-Việt "bất" — bất an, bất ngờ, bất đồng, cực quen thuộc làm tiền tố phủ định.
  doiThat: 不客气 (không có chi), 不可以 trên biển cấm, 对不起 khi xin lỗi — khắp nơi.
  tuongPhan: 不 (4 nét, có thêm nét phẩy chéo) dễ nhìn lướt nhầm 下 (3 nét, "dưới") vì dáng gần giống — 不 có thêm nét 丿 mà 下 không có.
  kind: invented
