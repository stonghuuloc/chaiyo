hanzi: 叫
readings:
  - pinyin: jiào
    hanviet: khiếu
radical: 口
ids: ⿰口丩
strokes: 5
mnemonic:
  hinh: "口 (miệng) mở ra phát tiếng, phần bên phải chỉ gợi âm — chữ hình thanh: nghĩa từ 口, âm từ phần còn lại."
  am: khiếu — ít dùng độc lập trong tiếng Việt hiện đại, không phải đòn bẩy mạnh cho chữ này.
  doiThat: nút "叫外卖" (gọi đồ ăn giao) trong app giao đồ ăn, nút "叫车" (gọi xe) trong app taxi.
  tuongPhan: dễ lẫn với 叹 (tàn — than thở) vì cùng có 口 bên trái, phải nhìn kỹ phần bên phải.
  kind: etymology
