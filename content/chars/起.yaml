hanzi: 起
readings:
  - pinyin: qǐ
    hanviet: khởi
radical: 走
ids: ⿺走巳
strokes: 10
mnemonic:
  hinh: Tự mình (己) đi/chạy (走) — tự mình đứng dậy, bắt đầu = 起.
  am: khởi — "khởi đầu", "khởi hành", "khởi nghiệp".
  doiThat: nút "一起" (cùng nhau) mời bạn chơi game chung; "起床" trên app báo thức buổi sáng.
  tuongPhan: ≠ 走 (đã học — chỉ là "đi") — 起 thêm 己 mới thành "tự đứng dậy, bắt đầu".
  kind: etymology
