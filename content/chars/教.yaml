hanzi: 教
readings:
  - pinyin: jiāo
    hanviet: giao
  - pinyin: jiào
    hanviet: giáo
radical: 攴
ids: ⿰孝攵
strokes: 11
mnemonic:
  hinh: 孝 (hiếu thảo) + 攵 (tay cầm roi) → dạy con biết HIẾU THẢO bằng kỷ luật = GIÁO DỤC, dạy dỗ.
  am: "họ biểu âm thật: 孝 xiào gần âm với 教 jiào; Hán-Việt **giáo** sống mạnh: giáo dục, giáo viên, tôn giáo, gia giáo."
  doiThat: tìm "家教" (gia sư) trên app rao vặt/dạy kèm; mục "宗教" (tôn giáo) trên form khai thông tin cá nhân.
  tuongPhan: 教 (孝+攵, "dạy dỗ") ≠ 政 (正+攵, "chính sự, cai trị" — đã học) — cùng có 攵 bên phải (hành động) nhưng phần trái khác hẳn (孝 vs 正), nghĩa khác nhau rõ.
  kind: etymology
