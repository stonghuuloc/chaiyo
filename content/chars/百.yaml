hanzi: 百
readings:
  - pinyin: bǎi
    hanviet: bách
radical: 白
ids: ⿱一白
strokes: 6
mnemonic:
  hinh: Chữ 白 (trắng, đã học) đội thêm một vạch ngang (一) lên đỉnh đầu — như con số 100 đội thêm một "mũ" lên trên chữ trắng.
  am: bách / bá — "bách khoa" (nhiều lĩnh vực), "bách phân" (chia trăm phần, thang bách phân), "bách tuổi" (sống thọ trăm tuổi, gần nghĩa "bách niên giai lão" — chúc sống bên nhau trăm năm).
  doiThat: biển giá "100元" luôn đọc là 一百元; tủ sách "百科全书" (bách khoa toàn thư) ở hiệu sách.
  tuongPhan: ≠ 白 (bái, trắng, đã học) — 百 CHỈ THÊM MỘT VẠCH NGANG ở trên so với 白; âm Hán Việt cũng gần giống nhau (bách/bạch) → cặp cực dễ lẫn cả mặt chữ lẫn âm đọc.
  kind: invented
