hanzi: 累
readings:
  - pinyin: lèi
    hanviet: luỵ
  - pinyin: lěi
    hanviet: luỵ
    rare: true
radical: 糸
ids: ⿱田糸
strokes: 11
mnemonic:
  hinh: 田 (ruộng) trên + 糸 (tơ, chỉ) dưới — cày ruộng cả ngày rồi về ngồi xe chỉ, ai cũng mệt lử = 累. (Mẹo dân gian; gốc thật là "dây, trói buộc" — 田 chỉ là phần biểu âm bị giản lược, không phải "ruộng" thật.)
  am: luỹ/luỵ — "tích luỹ" (dồn thêm dần, khớp nghĩa "accumulate"), "liên luỵ"/"mệt mỏi" (khớp nghĩa "tired, involve, bother").
  doiThat: tin nhắn cuối ngày "今天好累", than thở "累死了" sau giờ làm, caption ảnh than mệt trên mạng xã hội.
  tuongPhan: dễ lẫn với 思 (sī — suy nghĩ) vì cùng có 田 ở trên; 累 có 糸 (tơ) ở dưới, 思 có 心 (tâm) ở dưới.
  kind: etymology
