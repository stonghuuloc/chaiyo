hanzi: 坐
readings:
  - pinyin: zuò
    hanviet: toạ
radical: 土
ids: ⿻土从
strokes: 7
mnemonic:
  hinh: Hai người (从) ngồi song song trên mặt đất (土) — chính là hình ảnh "ngồi".
  am: toạ — như trong "toạ độ" (坐标), "an toạ", "toạ thiền" (打坐).
  doiThat: biển "请坐" (mời ngồi) ở phòng chờ/quán ăn; nút "坐车"/"坐飞机" khi đặt vé trên app.
  tuongPhan: ≠ 从 (cóng, đã học — nghĩa "theo") — chính là thành phần bên trong 坐 nhưng đứng riêng lại mang nghĩa khác hẳn, đừng lẫn.
  kind: etymology
