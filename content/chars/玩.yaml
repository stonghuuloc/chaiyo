hanzi: 玩
readings:
  - pinyin: wán
    hanviet: ngoạn
radical: 玉
ids: ⿰王元
strokes: 8
mnemonic:
  hinh: 玩 vốn nghĩa "mân mê, thưởng ngoạn đồ ngọc" — bộ 玉/王 (ngọc) + 元 cho âm đọc, sau mở rộng thành "chơi, đùa" nói chung.
  am: '"ngoạn" — sống trong "du ngoạn" (đi chơi ngắm cảnh), "cổ ngoạn" (đồ cổ để ngắm chơi).'
  doiThat: '"玩具" (đồ chơi) in trên hộp/bao bì; "好玩" (hay, thú vị) trong bình luận mạng xã hội, review game/app.'
  tuongPhan: '≠ 现 (đã học — "hiện, hiện ra") cùng có bộ 王 bên trái nên dễ lẫn hình, phải nhìn phần bên phải: 元 (玩) khác 见 (现).'
  kind: etymology
