hanzi: 觉
readings:
  - pinyin: jiào
    hanviet: giáo
  - pinyin: jué
    hanviet: giác
radical: 见
ids: ⿳𭕄冖见
strokes: 9
mnemonic:
  hinh: phần trên giống 学 (học) + 冖 (che lại, như nhắm mắt ngủ) + [[见]] (nhìn thấy) ở dưới — từ "che mắt ngủ" đến lúc "mở mắt nhìn thấy" = tỉnh giấc, nhận ra, cảm nhận.
  am: '"giác" — cảm giác, giác ngộ, phát giác, tri giác.'
  doiThat: '"睡觉" (đi ngủ) cực phổ biến khi nhắn tin bạn bè "我要睡觉了"; "觉得" mở đầu câu nêu ý kiến trong chat, review app.'
  tuongPhan: ≠ 学 (học — đã học) — phần trên giống nhau, nhưng 学 có 子 (con) ở dưới, còn 觉 có [[见]] (nhìn thấy) ở dưới.
  kind: etymology
