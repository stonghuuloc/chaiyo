hanzi: 九
readings:
  - pinyin: jiǔ
    hanviet: cửu
radical: 乙
ids: 九
strokes: 2
mnemonic:
  hinh: nét phẩy chéo + nét móc cong — gợi hình khuỷu tay/móc câu uốn cong, chữ cổ mượn làm số 9
  am: jiǔ ≈ "cửu" — vĩnh cửu, Cửu Long (sông Cửu Long)
  doiThat: giá 九块九 (9.9 tệ) phổ biến trên Taobao/Pinduoduo với nhãn "9.9包邮"; Tết Trùng Cửu 九月九 (重阳节, lễ người già TQ)
  tuongPhan: ≠ 几 (jǐ, mấy — có thêm nét ngang trên); ≠ 力 (lì, sức — nét móc dài hơn xuống dưới)
  kind: etymology
