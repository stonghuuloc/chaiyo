mnemonic:
  hinh: 囗 (vòng biên giới) bao quanh 玉 (báu vật) → đất nước là nơi có biên giới bảo vệ báu vật/dân
  am: quốc — "quốc gia", "ái quốc", "Trung Quốc"
  doiThat: hộ chiếu (国籍 quốc tịch), sân bay (国际 quốc tế), tên nước 中国/美国/韩国
  tuongPhan: dễ lẫn 固 (gù, "vững chắc") — bên trong là 古 (cổ) chứ không phải 玉
  kind: etymology
