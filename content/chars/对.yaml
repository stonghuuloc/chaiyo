hanzi: 对
readings:
  - pinyin: duì
    hanviet: đối
radical: 寸
ids: ⿰又寸
strokes: 5
mnemonic:
  hinh: 又 (tay) cầm 寸 (thước đo) để so đối, kiểm tra cho đúng — mẹo dễ nhớ, không phải từ nguyên chuẩn (phồn thể 對 gốc phức tạp hơn nhiều).
  am: đối — đối diện, đối thoại, tuyệt đối, phản đối (cực quen thuộc).
  doiThat: nút xác nhận "对" khi ai đó đồng ý trong tin nhắn, tính năng gọi video "面对面".
  tuongPhan: dễ lẫn với 又 đứng một mình (yòu — lại, cũng) vì 对 chứa 又 bên trong, thêm 寸 bên phải đổi hẳn nghĩa.
  kind: invented
