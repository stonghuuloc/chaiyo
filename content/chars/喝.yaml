hanzi: 喝
readings:
  - pinyin: hē
    hanviet: hát
radical: 口
ids: ⿰口曷
strokes: 12
mnemonic:
  hinh: miệng 口 ghép với 曷 (âm gợi) — hành động dùng miệng đưa chất lỏng vào = "uống"; khi đọc hè lại mang nghĩa "hò hét" (喝彩).
  am: Hán Việt "hát" — nhớ qua từ 喝彩 (hát thái, nghĩa "hoan hô, tán thưởng"), âm "hát" gần hē về mặt lịch sử ngữ âm.
  doiThat: menu trà sữa hỏi 喝什么 (uống gì), nút 干杯 cạnh 喝酒 trong bài đăng mạng xã hội, biển quán 喝汤 (dùng súp) ở quán ăn kiểu Quảng.
  tuongPhan: ≠ 渴 (kě, "khát", bộ 氵 chỉ trạng thái khát nước) — dễ lẫn vì cùng đọc gần và cùng liên quan tới nước uống.
  kind: etymology
