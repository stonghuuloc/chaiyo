hanzi: 月
readings:
  - pinyin: yuè
    hanviet: nguyệt
radical: 月
ids: 月
strokes: 4
mnemonic:
  hinh: Hình trăng lưỡi liềm bị kẻ vuông lại, hai nét ngang bên trong là vệt sáng tối trên trăng.
  am: nguyệt — "nguyệt san", "tứ nguyệt" (không thông dụng), nhưng "tháng" trong 一月 lại đọc theo số + 月 chứ không đọc "nguyệt".
  doiThat: 月底 trên hóa đơn/lương, 蜜月 trên quảng cáo du lịch, số tháng 一月~十二月 trên lịch app.
  tuongPhan: ≠ 肉 (ròu, thịt) — 肉 có hai nét chéo bên trong khác 月; cũng cẩn thận bộ "肉" viết tắt trong chữ ghép (胖, 脑…) trông giống 月 nhưng mang nghĩa "thịt/thân thể".
  kind: etymology
