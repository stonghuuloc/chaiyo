hanzi: 还
readings:
  - pinyin: hái
    hanviet: hoàn
  - pinyin: huán
    hanviet: hoàn
radical: 辵
ids: ⿺辶不
strokes: 7
mnemonic:
  hinh: '"không (不) đi (辶) đâu cả, vẫn còn ở đây" → 还 = còn, vẫn.'
  am: "还 (phồn thể 還) có âm HV duy nhất là hoàn — hoàn trả, hoàn lại, hoàn thành; âm HV không đổi theo việc chữ đọc hái hay huán trong tiếng Trung. Ví dụ đọc huán: 还钱 (hoàn tiền, trả tiền), 归还 (hoàn trả, trả lại)."
  doiThat: App giao hàng "还没到" (chưa tới); tin nhắn "我还在忙" (vẫn đang bận); thư viện "还书处" (chỗ trả sách, đọc huán).
  tuongPhan: ≠ 这 (zhè, "này") — cùng có 辶 dưới nhưng phần trên là 文, không phải 不, dễ lẫn khi viết nhanh.
  kind: etymology
