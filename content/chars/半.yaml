hanzi: 半
readings:
  - pinyin: bàn
    hanviet: bán
radical: 十
ids: ⿱丷⿻二丨
strokes: 5
mnemonic:
  hinh: 'theo Thuyết Văn Giải Tự: 半 = 八 (chia đôi, trên) + 牛 (con bò, dưới, nay chỉ còn nét vết) → "dùng dao chia đôi con bò" = nửa.'
  am: '"bán" — như "bán nguyệt" (nửa vầng trăng), "bán kính" (bán kính hình tròn).'
  doiThat: '"三点半" (ba giờ rưỡi) khi hẹn giờ; "半价" (nửa giá) trên biển giảm giá.'
  tuongPhan: ≠ 平 (đã học — bằng phẳng) — hình gần giống (đều có nét ngang trên + sổ dọc giữa), dễ viết lẫn.
  kind: invented
