hanzi: 快
readings:
  - pinyin: kuài
    hanviet: khoái
radical: 心
ids: ⿰忄夬
strokes: 7
mnemonic:
  hinh: Tâm (忄) mà dứt khoát (夬) thì làm gì cũng lẹ — 快
  am: khoái, như trong "khoái lạc", "khoái chí" — chính là cảm giác "sướng vì nhanh, vì đã"
  doiThat: nút "快进" (tua nhanh) trên app video, biển "快餐" (cơm nhanh/fast food) ở quán ăn
  tuongPhan: "≠ 块 (kuài, đơn vị tiền/miếng) — cùng âm khác bộ: 快 bộ 忄, 块 bộ 土 (đất, tiền/khối)"
  kind: etymology
