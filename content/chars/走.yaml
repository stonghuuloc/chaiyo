mnemonic:
  hinh: Phần trên là hình người nghiêng vung tay, phần dưới là chân bước — cả chữ là dáng người đang đi/chạy.
  am: Hán-Việt "tẩu" — như trong "đào tẩu" (逃走), "tẩu thoát".
  doiThat: Nút đếm bước trong app WeChat运动, lệnh "走位" (di chuyển vị trí) trong game.
  tuongPhan: ≠ 去 (đi ĐẾN đâu, có đích) và ≠ 跑 (chạy, nhanh hơn).
  kind: etymology
