hanzi: 本
readings:
  - pinyin: běn
    hanviet: bản
radical: 木
ids: 本
strokes: 5
mnemonic:
  hinh: 木 (cây) có một vạch ngang đè ngay GỐC rễ, phía DƯỚI thân — chỉ đúng vào chỗ "gốc" → nghĩa "căn bản, nguồn gốc".
  am: bản/bổn — học viên đã dùng "căn bản", "bản thân", "nguyên bản", "bản địa" hằng ngày.
  doiThat: '"版本" (phiên bản) trong thông báo cập nhật app; "成本" (giá vốn, chi phí gốc) khi nói chuyện mua bán.'
  tuongPhan: ≠ 末 (mạt, đã học ở [[L093-周末]]) — cùng là 木 + một vạch ngang, nhưng 本 vạch ở GỐC (dưới), 末 vạch ở NGỌN (trên). Gốc ↔ ngọn.
  kind: etymology
