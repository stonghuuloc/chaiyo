hanzi: 做
readings:
  - pinyin: zuò
    hanviet: tố
radical: 人
ids: ⿰亻故
strokes: 11
mnemonic:
  hinh: 亻(người) + 故(chuyện, việc) → người xử lý một việc/chuyện → "làm".
  am: 'Hán-Việt **tố**. Ít gặp trong từ Hán-Việt tiếng Việt vì 做 là chữ xuất hiện muộn, thay cho 作. Neo kép: 作 (cùng nghĩa "làm") mang âm HV quen thuộc **tác** — công tác, tác phẩm; 做 = tố là biến thể khẩu ngữ của chính chữ đó.'
  doiThat: 做饭 trên công thức nấu ăn; 做作业 trên app học tập; 怎么做 trong hướng dẫn sử dụng.
  tuongPhan: ≠ 作 (zuò, cùng nghĩa "làm" nhưng trừu tượng/trang trọng hơn — 工作, 作品, 合作; 做 thiên về cụ thể/khẩu ngữ — 做饭, 做人, 做事).
  kind: etymology
