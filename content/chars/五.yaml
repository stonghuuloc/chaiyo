mnemonic:
  hinh: hai nét ngang kẹp một dấu chéo giữa — ký hiệu đếm cổ, không phải chữ ghép nghĩa
  am: wǔ ≈ "ngũ" — ngũ vị, ngũ hành, ngũ cốc, những từ học viên đã dùng quen
  doiThat: số 5 trên bàn phím gọi điện, giá menu 五元, tầng 5 thang máy 五楼
  tuongPhan: ≠ 二 (èr, chỉ hai nét ngang, không có gạch chéo giữa); ≠ 王 (wáng, có thêm nét dọc xuyên)
  kind: etymology
