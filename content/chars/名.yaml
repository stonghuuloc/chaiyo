hanzi: 名
readings:
  - pinyin: míng
    hanviet: danh
radical: 口
ids: ⿱夕口
strokes: 6
mnemonic:
  hinh: Trời tối (夕) không nhìn rõ mặt nhau, phải dùng miệng (口) gọi tên ra mới biết là ai — đó là 名 (tên).
  am: '"danh" — danh từ, danh sách, nổi danh, đều đọc gần giống 名.'
  doiThat: Ô "姓名/名字" (họ tên) trong form đăng ký; "有名" (nổi tiếng) trên biển quán ăn.
  tuongPhan: ≠ 多 (nhiều — đã học) — 多 là hai chữ 夕 chồng lên nhau, 名 chỉ có một 夕 trên 口.
  kind: etymology
