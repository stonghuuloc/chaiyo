hanzi: 衣
readings:
  - pinyin: yī
    hanviet: y
radical: 衣
ids: ⿱亠𧘇
strokes: 6
mnemonic:
  hinh: Tượng hình cổ áo (nét trên) và hai vạt áo xoè sang hai bên (nét dưới) — hình dáng một chiếc áo choàng cổ.
  am: '"y" — như trong "y phục" (quần áo) — âm HV vẫn dùng nhưng ít gặp hơn "phục".'
  doiThat: biển "洗衣店" (tiệm giặt) ngoài phố; nhãn "干洗" trên túi đồ giặt khô có chữ 衣.
  tuongPhan: ≠ 衤 (bộ y phục dạng viết tắt bên trái các chữ như 裤, 裙 — chưa học) — 衣 đứng riêng là chữ độc lập, 衤 chỉ là dạng rút gọn khi ghép trái.
  kind: etymology
