hanzi: 想
readings:
  - pinyin: xiǎng
    hanviet: tưởng
radical: 心
ids: ⿱相心
strokes: 13
mnemonic:
  hinh: 相 (nhìn, xem xét) đặt trên 心 (tim, lòng) → nhìn bằng lòng, ngẫm bằng tim = suy nghĩ, tưởng nhớ.
  am: Hán-Việt "tưởng" — tư tưởng, lý tưởng, ý tưởng, mộng tưởng, tưởng tượng.
  doiThat: Nút "我想要" trong app mua hàng; tin nhắn "我想你了" (nhớ bạn); phụ đề phim khi nhân vật lưỡng lự.
  tuongPhan: ≠ 相 (thành phần trên, không có 心 dưới) — 相 chỉ là "nhìn/lẫn nhau", không mang nghĩa "nghĩ, muốn".
  kind: etymology
