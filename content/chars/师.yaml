hanzi: 师
readings:
  - pinyin: shī
    hanviet: sư
radical: 巾
ids: ⿰⿰丨丿帀
strokes: 6
mnemonic:
  hinh: người cầm khăn (巾) đứng đầu một nhóm đông người (𠂤) — hình ảnh người dẫn dắt
  am: 师 = sư, y hệt "sư" trong "sư phụ, kỹ sư, giáo sư"
  doiThat: thẻ tên "王师傅" của thợ sửa xe, tài xế; chức danh "工程师" trên card visit
  tuongPhan: ≠ 帅 (shuài, soái/đẹp trai) — cùng gốc 𠂤 bên trái nhưng phải là 巾 (师) hay 巾 khác vị trí (帅), dễ viết lẫn
  kind: invented
