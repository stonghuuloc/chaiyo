hanzi: 非
readings:
  - pinyin: fēi
    hanviet: phi
radical: 非
ids: 非
strokes: 8
mnemonic:
  hinh: Hai nét đối xứng như hai cánh chim xoè ngược chiều nhau — hình ảnh "trái ngược nhau" cho ra nghĩa "không phải, trái với".
  am: '"phi" — âm HV sống rất khoẻ trong tiếng Việt: phi lý, phi pháp, phi thường, đọc gần như y hệt.'
  doiThat: '"非常" (rất, vô cùng) nghe khắp nơi trong hội thoại; "是非" (thị phi, chuyện đúng sai) trong phim, chuyện tám.'
  tuongPhan: ≠ 韭 (jiǔ, lá hẹ — chưa học) hình gần giống nhưng 韭 có thêm nét ngang ở giữa tượng trưng lá mọc từ đất.
  kind: etymology
