mnemonic:
  hinh: Ngọc (王/玉) hiện ra để mắt (见) nhìn thấy — xuất hiện, hiện ra.
  am: hiện — "hiện tại", "hiện nay", "xuất hiện" — cực thông dụng.
  doiThat: '"现在" đầu mọi câu nói về hiện tại; tiêu đề khoa học "科学家发现" (nhà khoa học phát hiện).'
  tuongPhan: ≠ 见 (đã đọc được — chỉ là "thấy"); 现 thêm 王 bên trái mới thành "hiện ra".
  kind: etymology
