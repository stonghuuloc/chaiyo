hanzi: 小
readings:
  - pinyin: xiǎo
    hanviet: tiểu
radical: 小
ids: 小
strokes: 3
mnemonic:
  hinh: Một vật bị tách thành hai mảnh vụn hai bên một đường thẳng đứng = nhỏ, vụn.
  am: tiểu — tiểu học, tiểu đội, tiểu thuyết, đại tiểu tiện.
  doiThat: Size "小" trà sữa, 小费 (tiền tip), biển 小心地滑 (cẩn thận trơn trượt), gọi thân mật 小+họ (小王).
  tuongPhan: ≠ 少 (ít về số lượng, không phải kích thước) — 小 và 少 hay bị lẫn vì cùng bộ 小.
  kind: etymology
