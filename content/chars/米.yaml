hanzi: 米
readings:
  - pinyin: mǐ
    hanviet: mễ
radical: 米
ids: 米
strokes: 6
mnemonic:
  hinh: Tượng hình hạt gạo rơi tứ phía quanh trục giữa (nét ngang dọc + 4 chấm) — hạt lúa tẽ ra khi giã gạo.
  am: mễ (bạch mễ = gạo trắng) — ít dùng độc lập trong tiếng Việt hiện đại, còn sót trong từ ghép Hán Việt.
  doiThat: 米粉 (bún gạo) trên menu quán ăn; 米饭 (cơm) trong nhà hàng.
  tuongPhan: ≠ 木 (mù, gỗ/cây — đã học) — 米 thêm 4 nét chấm nhỏ quanh chữ 木, dễ nhầm khi viết nhanh.
  kind: etymology
