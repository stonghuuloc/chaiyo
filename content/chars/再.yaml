hanzi: 再
readings:
  - pinyin: zài
    hanviet: tái
radical: 冂
ids: ⿱一冉
strokes: 6
mnemonic:
  hinh: Một vạch [[一]] (thêm) đặt trên [[冉]] → thêm một lần nữa, làm lại.
  am: '"tái" — như trong 再生 (tái sinh), 再婚 (tái hôn), 再版 (tái bản).'
  doiThat: '"再见" cuối tin nhắn/cuộc gọi; "再说" khi ai đó muốn hoãn quyết định lại.'
  tuongPhan: ≠ 又 (đã học — cũng nghĩa "lại/nữa" nhưng dùng cho việc ĐÃ xảy ra rồi; 再 dùng cho việc CHƯA xảy ra/mệnh lệnh) — dễ lẫn nghĩa hơn là lẫn mặt chữ.
  kind: invented
