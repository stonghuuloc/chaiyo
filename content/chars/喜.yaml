hanzi: 喜
readings:
  - pinyin: xǐ
    hanviet: hỷ
radical: 口
ids: ⿱壴口
strokes: 12
mnemonic:
  hinh: Trên là hình cái trống (壴), dưới là 口 miệng — đánh trống rộn ràng, miệng cười nói = niềm vui.
  am: hỷ — hoan hỷ, báo hỷ, hỷ sự (thiệp cưới).
  doiThat: chữ 囍 (song hỷ) dán ở đám cưới, câu chúc Tết "恭喜发财", nút "喜欢" (thích) trên app mạng xã hội.
  tuongPhan: dễ lẫn với 嘻 (xī — cười hì hì, trong 嘻嘻/嘻哈) vì 嘻 chứa nguyên 喜 bên trong, chỉ thêm một 口 nữa.
  kind: etymology
