hanzi: 四
readings:
  - pinyin: sì
    hanviet: tứ
radical: 囗
ids: ⿴囗儿
strokes: 5
mnemonic:
  hinh: 'Bốn hướng bị đóng khung (囗) kín — BỐN phía (gốc thật: chữ cổ vẽ hơi thở qua mũi, mượn âm chỉ số 4, không liên quan "vây kín")'
  am: Hán Việt "tứ" — tứ giác, đệ tứ, tứ phía
  doiThat: biển "四楼" — nhiều tòa nhà TQ/HK/Đài Loan BỎ QUA tầng 4 vì gần âm 死 (sǐ, chết); menu "四人桌"
  tuongPhan: ≠ 西 (xī, hướng tây — cũng có khung nhưng nét trong khác) ≠ 三 (sān, ba — không có khung 囗)
  kind: invented
