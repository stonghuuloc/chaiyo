hanzi: 认
readings:
  - pinyin: rèn
    hanviet: nhận
radical: 言
ids: ⿰讠人
strokes: 4
mnemonic:
  hinh: lời nói (讠) + người (人) = dùng lời để chỉ ra người/vật mình biết → nhận ra, nhận biết.
  am: nhận (nhận biết, nhận ra, thừa nhận) — âm rất gần nghĩa gốc, dễ nhớ.
  doiThat: '"认识你，很高兴" câu chào làm quen kinh điển; nút "确认" (xác nhận) trên app.'
  tuongPhan: ≠ 记 (chưa học — 讠+己, "ghi nhớ") — cùng có bộ 讠 nhưng 记 là nhớ lại thông tin, 认 là nhận ra/nhận biết.
  kind: etymology
