hanzi: 今
readings:
  - pinyin: jīn
    hanviet: kim
radical: 人
ids: ⿱亽㇇
strokes: 4
mnemonic:
  hinh: một nét che (亼) đậy lên một vạch (一) — "giữ lại khoảnh khắc ngay lúc này"
  am: 今 = kim, còn giữ trong "cổ kim" (xưa và nay), tuy ít dùng độc lập trong tiếng Việt hiện đại
  doiThat: app lịch ghi "今天" ở đầu trang; tin nhắn công việc "今晚有空吗?"
  tuongPhan: ≠ 令 (lìng, mệnh lệnh) — rất dễ viết lẫn vì hình gần giống, khác ở nét cuối
  kind: etymology
