hanzi: 怎
readings:
  - pinyin: zěn
    hanviet: chẩm
radical: 心
ids: ⿱乍心
strokes: 9
mnemonic:
  hinh: 乍 chợt + 心 tim → chợt băn khoăn trong lòng "làm sao đây?" = thế nào, làm sao
  am: '"chẩm" trong 怎么 (chẩm ma); zěn đọc gần "zẩn"'
  doiThat: 怎么办？ 怎么走？ — câu hỏi cách làm hằng ngày
  tuongPhan: "≠ 作 (zuò, làm): 怎 có 心 ở dưới, 作 có 亻 ở bên"
  kind: invented
