hanzi: 两
readings:
  - pinyin: liǎng
    hanviet: lưỡng
radical: 一
ids: ⿱一⿻冂从
strokes: 7
mnemonic:
  hinh: 一 (nắp) đậy trên khung 冂 chứa 从 (hai người 人人 đã học, "đi theo nhau") — hai người đứng chung một khung = "CẢ HAI".
  am: '"lưỡng" — như thành ngữ "tiến thoái lưỡng nan".'
  doiThat: gọi món "两个" (hai suất), "两杯" (hai ly) ở quán; "两" còn là đơn vị cân "lạng" ở chợ Trung Quốc.
  tuongPhan: ≠ 二 (đã học — hai) — 二 đếm số thuần (第二, 二零二六), 两 đếm trước lượng từ (两个, 两杯), không nói "二个".
  kind: invented
