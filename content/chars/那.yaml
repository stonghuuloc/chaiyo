hanzi: 那
readings:
  - pinyin: nà
    hanviet: na
radical: 阝
ids: ⿰⿻刀二阝
strokes: 6
mnemonic:
  hinh: vốn là tên một nước cổ (阝 = ấp, thành), sau mượn âm chỉ "cái đó, ở đó".
  am: 'Hán-Việt "na" — như trong "sát-na" (刹那: khoảnh khắc cực ngắn, từ Phật giáo quen tai người Việt).'
  doiThat: 那里/那个 khi chỉ đường, kể chuyện; 那么 mở đầu câu chuyển ý cực hay gặp khi tám chuyện.
  tuongPhan: 那 (阝bên phải, xa) khác 这 (文 bên phải, gần) — nhớ theo cặp gần/xa.
  kind: etymology
