mnemonic:
  hinh: Hai khối 可 xếp chồng lên nhau — như gọi "ca ca" hai lần liên tiếp.
  am: ca — 哥哥 = "ca ca" (anh trai), đại ca cũng dùng âm này.
  doiThat: 哥哥/大哥 cách gọi anh trai trong nhà; 老哥 gọi thân mật đàn ông lớn tuổi hơn.
  tuongPhan: ≠ 可 (kě, có thể — đã học) — 可 chỉ là 1 khối, 哥 là 2 khối 可 xếp chồng.
  kind: invented
