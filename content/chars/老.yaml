hanzi: 老
readings:
  - pinyin: lǎo
    hanviet: lão
radical: 老
ids: ⿸耂匕
strokes: 6
mnemonic:
  hinh: người tóc dài (耂) lưng còng (匕) — dáng một cụ già
  am: 老 = lão, y hệt "lão" trong "giáo dục lão hóa, phụ lão"
  doiThat: biển "老字号" (thương hiệu lâu đời) trước tiệm ăn cổ; cách gọi thân mật "老王, 老李"
  tuongPhan: ≠ 考 (kǎo, thi/khảo) — cùng có 耂 phía trên nhưng phần dưới khác hẳn (丂 vs 匕)
  kind: etymology
