hanzi: 同
readings:
  - pinyin: tóng
    hanviet: đồng
radical: 口
ids: ⿵𠔼口
strokes: 6
mnemonic:
  hinh: Một khung bao (冂) trùm lên một nét ngang và 口 (miệng, đã học) bên dưới — nhiều tiếng nói cùng gộp vào chung một khung, gợi nghĩa "cùng nhau, giống nhau".
  am: "âm HV là **đồng** — cực nhiều từ Hán-Việt còn sống hàng ngày: đồng ý, đồng nghiệp, đồng thời, đồng hương, bất đồng, hợp đồng."
  doiThat: '"合同" (hợp đồng) trên giấy tờ, hợp đồng lao động; "同事" gọi người làm cùng công ty mỗi ngày.'
  tuongPhan: ≠ 回 (đã học — quay về, trở lại) — cả hai đều là chữ dạng khung/hộp, nhưng 回 là khung lồng khung (口 nằm trong 口), còn 同 là khung hở phía trên (冂) trùm lên 一 và 口.
  kind: invented
