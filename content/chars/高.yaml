hanzi: 高
readings:
  - pinyin: gāo
    hanviet: cao
radical: 高
ids: ⿳亠口冋
strokes: 10
mnemonic:
  hinh: 高 vẽ hình một tòa gác/tháp có mái trên, cửa giữa, nền dưới — hình dáng thật của một công trình cao tầng thời cổ.
  am: Hán-Việt "cao" — dùng thẳng trong "cao tốc", "cao thủ", "cao su".
  doiThat: Biển "高速公路" (cao tốc) trên đường; nút 最高 (cao nhất) trong app đặt phòng/lọc giá.
  tuongPhan: Không lẫn nét vì 高 không có chữ nào giống hình — phân biệt về NGHĨA với 低 (thấp) ở phần so sánh cuối bài.
  kind: etymology
