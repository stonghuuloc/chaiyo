hanzi: 方
readings:
  - pinyin: fāng
    hanviet: phương
radical: 方
ids: ⿱亠⿰丿𠃌
strokes: 4
mnemonic:
  hinh: 方 là khối vuông góc cạnh, gợi "bốn phương tám hướng" tỏa ra từ một điểm — cán cày/lá cờ cổ cắm giữa đất, chỉ hướng.
  am: phương — sống mạnh trong "phương pháp", "phương hướng", "phương tiện", "địa phương".
  doiThat: mục "支付方式" (phương thức thanh toán) khi đặt hàng trên app TQ; câu hỏi cửa miệng "有什么方法" (có cách nào không) khi hỏi cách làm.
  tuongPhan: '≠ 万 (wàn — đã học, "vạn/mười nghìn") — dáng chữ gọn, nét đầu + móc gần giống nhau nên dễ viết lẫn khi viết nhanh; nghĩa khác hẳn: 万 là con số, 方 là hướng/cách thức/bên nào đó.'
  kind: etymology
