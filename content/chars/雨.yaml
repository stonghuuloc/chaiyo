hanzi: 雨
readings:
  - pinyin: yǔ
    hanviet: vũ
radical: 雨
ids: ⿱一𠕒
strokes: 8
mnemonic:
  hinh: Tượng hình giọt mưa (các nét chấm/ngắn bên trong) rơi xuống từ bầu trời (nét ngang trên cùng và khung bao quanh).
  am: vũ (phong vũ = gió mưa, vũ lượng = lượng mưa) — ít dùng độc lập trong tiếng Việt hiện đại, còn trong từ ghép Hán Việt.
  doiThat: 下雨 (trời mưa) trong dự báo thời tiết hàng ngày, tin nhắn rủ nhau đi chơi.
  tuongPhan: ≠ 雪 (xuě, tuyết — chưa học) 雪 = 雨 + 彐, tức 雨 làm bộ thủ bên trên cho chữ chỉ hiện tượng thời tiết khác.
  kind: etymology
