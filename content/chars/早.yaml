hanzi: 早
readings:
  - pinyin: zǎo
    hanviet: tảo
radical: 日
ids: ⿱日十
strokes: 6
mnemonic:
  hinh: Mặt trời (日) mọc lên trên cây/cỏ (dạng gốc gần 屮) — chỉ lúc trời còn sớm.
  am: tảo — "tảo hôn", "cảnh tảo" (báo động sớm) đều dùng gốc "tảo" = sớm.
  doiThat: 早安/早上好 trên tin nhắn buổi sáng, 早餐 trên bảng hiệu quán ăn sáng.
  tuongPhan: ≠ 草 (cǎo, cỏ) — 草 có bộ 艹 ở trên, 早 không có.
  kind: etymology
