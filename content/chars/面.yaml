    hanviet: diện
  - pinyin: miàn
    hanviet: miến
    rare: true
radical: 面
ids: ⿱丆囬
strokes: 9
mnemonic:
  hinh: Khung ngoài là viền khuôn mặt, nét ngang bên trong gợi mắt/gò má — giống [[目]] (mắt) phóng to thành cả khuôn mặt.
  am: diện — sống mạnh trong "diện tích", "diện mạo", "phương diện", "thể diện".
  doiThat: nút gọi video ghi "面对面" (mặt đối mặt); menu quán ăn TQ ghi "牛肉面" (mì bò), "炒面" (mì xào).
  tuongPhan: ≠ [[目]] (đã học, "mắt") — 面 nhìn giống 目 vì cùng có khung + nét ngang bên trong, nhưng 面 = cả khuôn mặt/bề mặt, 目 chỉ là con mắt bên trong khuôn mặt đó.
  kind: invented
