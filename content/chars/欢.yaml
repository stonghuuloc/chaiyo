hanzi: 欢
readings:
  - pinyin: huān
    hanviet: hoan
radical: 欠
ids: ⿰又欠
strokes: 6
mnemonic:
  hinh: Bên phải 欠 (há miệng thở ra) — vui quá bật cười thành tiếng, bên trái 又 chỉ là nét giản lược.
  am: hoan — quen trong "hoan hỉ", "hoan nghênh", "hoan ca".
  doiThat: '"喜欢" trong mọi câu nói thích cái gì; "欢迎光临" ở cửa hàng, nhà hàng.'
  tuongPhan: '≠ 次 (cì, "lần", chưa học) — 次 = 冫 + 欠, 欢 = 又 + 欠: cùng có 欠 bên phải, khác nhau ở bên trái. 欢 nói niềm vui, 次 đếm số lần.'
  kind: etymology
