mnemonic:
  hinh: nét ngang cắt nét dọc thành hình chữ thập — biểu thị số tròn (bó que tính buộc thành 10)
  am: shí ≈ "thập" — thập niên, thập tự (hồng thập tự), thập toàn thập mỹ
  doiThat: biển giao thông 十字路口 (ngã tư); 双十一 (11/11, lễ hội mua sắm lớn nhất TQ)
  tuongPhan: ≠ 千 (qiān, nghìn — có thêm nét phẩy phía trên); ≠ 干 (gān, khô/làm — nét ngang khác vị trí)
  kind: etymology
