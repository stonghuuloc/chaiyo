hanzi: 点
readings:
  - pinyin: diǎn
    hanviet: điểm
radical: 火
ids: ⿱占灬
strokes: 9
mnemonic:
  hinh: Trên là 占 (chiếm), dưới là 灬 (lửa) — ngọn lửa nhỏ chiếm một chỗ, chỉ một "điểm" sáng, một chấm.
  am: 'điểm — sống rất khỏe trong tiếng Việt: "điểm danh", "địa điểm", "quan điểm", "điểm số".'
  doiThat: menu quán ăn ghi "点菜" (gọi món); đồng hồ điện thoại hiện "几点了" (mấy giờ rồi).
  tuongPhan: ≠ 店 (đã học — cửa hàng) — cùng âm "diàn/diǎn" gần giống nhưng 店 có bộ 广 (mái nhà), không phải bộ lửa.
  kind: etymology
