hanzi: 里
readings:
  - pinyin: lǐ
    hanviet: lý
radical: 里
ids: ⿱⿻甲一一
strokes: 7
mnemonic:
  hinh: 田 (ruộng) trên 土 (đất) — nơi có ruộng và đất ở = làng xóm; nghĩa "bên trong" là nghĩa mượn phát triển sau.
  am: 'lý — như "dặm" cổ, ít dùng độc lập trong tiếng Việt hiện đại. Cẩn thận: KHÔNG liên quan đến 理 (lý — đạo lý, quản lý), tuy đồng âm Hán-Việt nhưng khác chữ, khác bộ.'
  doiThat: '"这里/那里/哪里" (ở đây/ở đó/ở đâu) cực phổ biến, "手机里" (trong điện thoại), "包里" (trong túi/balo).'
  tuongPhan: dễ lẫn với 理 (lǐ — lý lẽ, quản lý; bộ 王/玉 chứ không phải 田+土), đồng âm hoàn toàn nên dễ gõ nhầm.
  kind: invented
