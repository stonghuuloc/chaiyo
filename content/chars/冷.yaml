hanzi: 冷
readings:
  - pinyin: lěng
    hanviet: lãnh
radical: 冫
ids: ⿰冫令
strokes: 7
mnemonic:
  hinh: 令 (ra lệnh) đứng cạnh 冫 (băng giá) — như bị ra lệnh đứng giữa trời lạnh, rét run
  am: 冷 = **lãnh** — như "lãnh đạm", "lãnh cảm" trong tiếng Việt, đúng nghĩa lạnh/thờ ơ
  doiThat: menu quán ghi 冷饮 (đồ uống lạnh) cạnh 热饮; tủ lạnh siêu thị dán nhãn 冷藏 (bảo quản lạnh) / 冷冻 (đông lạnh)
  tuongPhan: "≠ 洽 (hợp, hòa hợp) hay bất kỳ chữ dùng 氵 — nhớ đếm nét: 冫 (2 nét chéo, lạnh) khác 氵 (3 chấm, nước)"
  kind: etymology
