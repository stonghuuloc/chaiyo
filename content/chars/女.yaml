mnemonic:
  hinh: Giáp cốt văn vẽ dáng người quỳ, tay khoanh trước ngực — hình người phụ nữ thời cổ.
  am: 女 = nữ, y hệt "nữ" trong nữ sinh, phụ nữ, nữ giới.
  doiThat: Bảng nhà vệ sinh, nút chọn giới tính trong app, danh sách lớp (男/女).
  tuongPhan: ≠ 母 (mẫu) — 母 thêm hai chấm bên trong (chỉ bầu vú), nghĩa hẹp lại thành "mẹ".
  kind: etymology
