hanzi: 热
readings:
  - pinyin: rè
    hanviet: nhiệt
radical: 火
ids: ⿱执灬
strokes: 10
mnemonic:
  hinh: 执 cầm cái gì đó nóng, bên dưới bốc 4 tia lửa 灬 — cầm phải đồ nóng thì nhiệt độ lên
  am: 热 = **nhiệt** — dùng thẳng trong "nhiệt độ", "nhiệt tình" tiếng Việt, không cần suy diễn
  doiThat: app thời tiết báo 炎热 (nóng gắt), nút "热门" (hot/thịnh hành) trên Taobao/Douyin, menu quán ghi 热饮 (đồ uống nóng)
  tuongPhan: ≠ 烈 (liệt, mãnh liệt) — cùng có 灬 nhưng phần trên là 列 chứ không phải 执
  kind: etymology
