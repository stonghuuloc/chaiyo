hanzi: 饭
readings:
  - pinyin: fàn
    hanviet: phạn
radical: 食
ids: ⿰饣反
strokes: 7
mnemonic:
  hinh: 饣 (ăn) + 反 (âm gần fàn) — chữ ghép hình-thanh, phần trái cho biết liên quan đến ăn uống, phần phải cho âm đọc.
  am: Hán-Việt "phạn" — dùng trong "cơm phạn", "ngọ phạn" (bữa trưa) khi đọc Hán Việt trang trọng.
  doiThat: Biển "饭店" (nhà hàng/khách sạn), "盒饭" (cơm hộp) bán ở quán ăn, tủ lạnh tiện lợi.
  tuongPhan: ≠ 饱 (bǎo, no bụng) — cùng bộ 饣 nhưng phần phải khác, đừng lẫn khi đọc lướt.
  kind: etymology
