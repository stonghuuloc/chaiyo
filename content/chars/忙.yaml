hanzi: 忙
readings:
  - pinyin: máng
    hanviet: mang
radical: 心
ids: ⿰忄亡
strokes: 6
mnemonic:
  hinh: '忙 là chữ hài thanh: 忄 (tâm) biểu nghĩa, 亡 (mất) vừa gợi âm "mang" vừa gợi nghĩa — tâm trí bị việc cuốn mất = bận. Cùng gốc 亡 với 忘 (wàng — quên): cả hai đều là "tâm bị 亡 chi phối" theo hai kiểu khác nhau.'
  am: mang — xuất hiện ngay trong "hoang mang" (慌忙, dù nghĩa đã lệch sang bối rối) và "đa mang" (多忙 — ôm đồm nhiều việc/tình cảm).
  doiThat: dòng trạng thái "最近很忙" trên WeChat Moments, câu cửa miệng "我很忙" khi ai rủ đi chơi, tin nhắn xin lỗi trễ "不好意思，太忙了".
  tuongPhan: dễ lẫn với 忘 (wàng — quên) vì cùng chứa 忄/心 + 亡; 忙 xếp 忄 trái — 亡 phải (ngang hàng), 忘 xếp 亡 trên — 心 dưới (chồng lên nhau).
  kind: etymology
