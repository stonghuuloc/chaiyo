hanzi: 从
readings:
  - pinyin: cóng
    hanviet: tòng
radical: 人
ids: ⿰人人
strokes: 4
mnemonic:
  hinh: Hai chữ 人 (người) đứng nối đuôi nhau — người theo sau người, 从 = đi theo, đi từ.
  am: tùng — "phục tùng" (服从), "tùng phục".
  doiThat: vé xe lửa TQ ghi "从北京到南京" (từ Bắc Kinh đến Nam Kinh) — chỉ điểm xuất phát.
  tuongPhan: ≠ 以 (yǐ — cũng là giới từ ngữ pháp nhưng nghĩa "dùng, lấy", không chỉ điểm xuất phát).
  kind: etymology
