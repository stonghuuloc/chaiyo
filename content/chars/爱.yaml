hanzi: 爱
readings:
  - pinyin: ài
    hanviet: ái
radical: 爪
ids: ⿱⿱爫冖友
strokes: 10
mnemonic:
  hinh: Phồn thể 愛 có 心 (tim) ở giữa 爫(tay)+友(bạn) — ôm giữ bạn bằng cả trái tim; giản thể 爱 bỏ 心, dân gian hay đùa "爱无心".
  am: ái — ái tình, ái mộ, bác ái.
  doiThat: nút trái tim ❤️ trên mạng xã hội, câu "我爱你" phổ biến nhất khi học tiếng Trung, tên phim/bài hát 爱情.
  tuongPhan: dễ lẫn với 受 (shòu — chịu, nhận) vì cùng có 爫 ở trên; 爱 có 友 ở dưới, 受 có 又 ở dưới.
  kind: invented
