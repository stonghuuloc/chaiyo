hanzi: 到
readings:
  - pinyin: dào
    hanviet: đáo
radical: 刀
ids: ⿰至刂
strokes: 8
mnemonic:
  hinh: Đi đến nơi (至) thẳng như mũi dao (刂) cắm tới đích — 到 = đã tới.
  am: đáo — "đáo hạn" (đến hạn), "chu đáo" (nghĩ tới nơi tới chốn).
  doiThat: nút "到达" (đã đến) trên app gọi xe/giao hàng TQ (滴滴, 美团) báo tài xế tới nơi.
  tuongPhan: '≠ 道 (dào — cùng âm, nghĩa "đường/nói", khác bộ: 到=刀, 道=辵).'
  kind: etymology
