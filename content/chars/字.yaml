hanzi: 字
readings:
  - pinyin: zì
    hanviet: tự
radical: 子
ids: ⿱宀子
strokes: 6
mnemonic:
  hinh: Đứa con (子) được nuôi dưỡng trong nhà (宀) — nghĩa gốc là "sinh sôi, nuôi lớn", sau mở rộng thành "chữ viết" vì chữ ghép được "sinh ra" từ các chữ đơn giản.
  am: '"tự" — tự điển, văn tự, chữ ký (chữ 字 chính là gốc của "tự" trong các từ này).'
  doiThat: App "字典" (từ điển) trên điện thoại; vở luyện "写字" (tập viết chữ) của học sinh.
  tuongPhan: ≠ 学 (học — đã học) — cả hai đều có 子 ở dưới, nhưng 字 trên là 宀 (mái nhà, không nét ngang giữa), 学 trên phức tạp hơn nhiều nét.
  kind: etymology
