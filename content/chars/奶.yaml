hanzi: 奶
readings:
  - pinyin: nǎi
    hanviet: nãi
radical: 女
ids: ⿰女乃
strokes: 5
mnemonic:
  hinh: Trái 女 (phụ nữ), phải 乃 (đã học, đọc y hệt "nǎi") — người phụ nữ (mẹ) nuôi con bằng sữa.
  am: nãi — 奶奶 = "nãi nãi" (bà nội); phần 乃 đọc giống hệt nǎi nên rất dễ nhớ âm.
  doiThat: 牛奶 (sữa bò) trên hộp sữa/siêu thị; 奶奶 gọi bà nội trong gia đình; 奶茶 (trà sữa) trên menu quán.
  tuongPhan: ≠ 如 (rú, như — đã học) cùng có 女 bên trái, nhưng bên phải khác hẳn (乃 vs 口).
  kind: etymology
