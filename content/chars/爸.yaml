hanzi: 爸
readings:
  - pinyin: bà
    hanviet: bả
radical: 父
ids: ⿱父巴
strokes: 8
mnemonic:
  hinh: "父 (cha, biểu nghĩa) + 巴 (ba, biểu âm) — chữ hình thanh chuẩn: nửa trên chỉ nghĩa, nửa dưới chỉ âm."
  am: 'Âm Hán-Việt "bá" ít ai dùng, nhưng phần biểu âm 巴 đọc "ba" — trùng thẳng với từ "ba" (bố) tiếng Việt. Cùng họ 巴: 吧 (ba, trợ từ), 把 (bǎ).'
  doiThat: Tin nhắn gia đình, gọi điện video, thiệp mừng ("献给爸爸的礼物").
  tuongPhan: ≠ 父 (phụ) — 父 là chữ trang trọng/văn viết (父亲); 爸 là khẩu ngữ thân mật.
  kind: etymology
