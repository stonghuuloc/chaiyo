hanzi: 飞
readings:
  - pinyin: fēi
    hanviet: phi
radical: 乙
ids: 飞
strokes: 3
mnemonic:
  hinh: Chữ tượng hình cổ vẽ hình cánh vật đang bay vun vút — nét ngang, móc, nét xiên gợi chuyển động lướt qua không trung.
  am: phi — phi cơ (máy bay), phi hành (bay), phi công (người lái máy bay).
  doiThat: '"飞机" (máy bay) trên vé/biển sân bay; câu khen "跑得飞快" (chạy nhanh như bay).'
  tuongPhan: ≠ 非 (đã học — không phải/sai) — cùng đọc fēi nhưng 非 mang nghĩa phủ định (非常, 是非), không liên quan gì đến chuyện bay.
  kind: etymology
