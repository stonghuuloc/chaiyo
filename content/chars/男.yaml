hanzi: 男
readings:
  - pinyin: nán
    hanviet: nam
radical: 田
ids: ⿱田力
strokes: 7
mnemonic:
  hinh: Người dùng sức (力) lao động ngoài ruộng (田) — đó là 男, nghĩa gốc trong Thuyết Văn Giải Tự.
  am: 男 = nam, y hệt "nam" trong nam giới, nam sinh, Việt Nam.
  doiThat: Bảng chỉ dẫn nhà vệ sinh (男/女), form đăng ký khai giới tính.
  tuongPhan: ≠ 生 (sinh) — cả hai đều có khối nét ngang xếp trên một trục dọc, viết nhanh dễ lẫn.
  kind: etymology
