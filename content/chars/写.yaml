hanzi: 写
readings:
  - pinyin: xiě
    hanviet: tả
radical: 冖
ids: ⿱冖与
strokes: 5
mnemonic:
  hinh: Mái che (冖) trùm lên bàn — ngồi dưới mái nhà cặm cụi viết.
  am: Hán-Việt "tả" — như trong "miêu tả" (描写), "tả chân" (写真).
  doiThat: Nút "写评论" trên app mua sắm, biển "代写" (viết thuê) ở tiệm photocopy.
  tuongPhan: ≠ 与 (yǔ, phần dưới nhìn giống nhưng là chữ khác hẳn).
  kind: invented
