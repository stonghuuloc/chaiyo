hanzi: 饿
readings:
  - pinyin: è
    hanviet: ngạ
radical: 食
ids: ⿰饣我
strokes: 10
mnemonic:
  hinh: 饣 (ăn) + 我 (tôi) → "tôi cần ăn" — cơn đói.
  am: ngạ — sống trong từ "ngạ quỷ" (quỷ đói, quen thuộc qua phim/truyện).
  doiThat: app giao đồ ăn Trung Quốc "饿了么" (đói chưa?) — tên app cực nổi.
  tuongPhan: ≠ 我 (đã học, wǒ = tôi) — bên phải giống hệt 我, nhưng thêm bộ 饣 bên trái đổi hẳn thành "đói".
  kind: etymology
