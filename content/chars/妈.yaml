hanzi: 妈
readings:
  - pinyin: mā
    hanviet: ma
radical: 女
ids: ⿰女马
strokes: 6
mnemonic:
  hinh: "女 (phụ nữ, biểu nghĩa) + 马 (mã, biểu âm) — hình thanh: nửa trái chỉ nghĩa, nửa phải chỉ âm."
  am: 'Âm Hán-Việt "ma" ít dùng riêng, nhưng xuất hiện trong 妈祖 = "Ma Tổ" — miếu Ma Tổ ở Hội An, Chợ Lớn đều gọi vậy. Họ 马 cùng âm: 吗 (ma, trợ từ hỏi), 骂 (mà, mắng).'
  doiThat: Tin nhắn gia đình, video call, thiệp mừng ngày của Mẹ.
  tuongPhan: ≠ 母 (mẫu) — 母 trang trọng/văn viết (母亲); 妈 là khẩu ngữ thân mật.
  kind: etymology
