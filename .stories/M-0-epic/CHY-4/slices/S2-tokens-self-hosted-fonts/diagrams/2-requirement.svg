<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement: fonts self-hosted, colours from tokens only</title><desc id="d2-desc">AC4 flow: load a lesson page, finish loading, fonts come from the app origin and none from a CDN. AC5 flow: run the tokens command, variables match tokens, no hex literal in components.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="20" width="260" height="40" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="150.0" y="44.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC4 · Bài 1 page loads</text><rect x="20" y="90" width="260" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="150.0" y="110.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Fonts served</text><text x="150.0" y="126.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">from the app's own origin</text><rect x="20" y="170" width="260" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="150.0" y="194.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">No request to a font CDN</text><text x="150.0" y="210.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">including Kaishu for the lesson</text><rect x="360" y="20" width="260" height="40" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="490.0" y="44.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC5 · design tokens run</text><rect x="360" y="90" width="260" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="490.0" y="110.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">CSS variables match</text><text x="490.0" y="126.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">every token</text><rect x="360" y="170" width="260" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="490.0" y="194.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Component files hold</text><text x="490.0" y="210.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">no colour literal</text><path d="M150 60 L150 90" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M150 138 L150 170" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M490 60 L490 90" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M490 138 L490 170" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/></svg>