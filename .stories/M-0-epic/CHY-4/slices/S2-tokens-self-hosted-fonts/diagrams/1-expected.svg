<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: every font comes from our own origin, online or off</title><desc id="d1-desc">A learner opens a lesson page. Text shows in Be Vietnam Pro, Literata, Onest and Kaishu, all fetched from the app origin. No request goes to Google Fonts. With the network off after first load, the same fonts still show.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="200" y="14" width="240" height="40" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="38.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Learner opens a lesson page</text><rect x="200" y="84" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="104.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Page text is drawn</text><text x="320.0" y="120.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">Be Vietnam Pro · Literata · Onest · Kaishu</text><rect x="200" y="164" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="184.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Network panel</text><text x="320.0" y="200.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">every font request is our own origin</text><rect x="200" y="244" width="240" height="40" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="268.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">No Google Fonts request</text><rect x="200" y="314" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="334.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Network off, reload</text><text x="320.0" y="350.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">same fonts still show</text><rect x="200" y="392" width="240" height="30" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="411.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Colours come from tokens</text><path d="M320 54 L320 84" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 132 L320 164" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 212 L320 244" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 284 L320 314" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 362 L320 392" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/></svg>