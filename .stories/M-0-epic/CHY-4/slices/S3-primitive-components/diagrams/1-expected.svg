<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: six building blocks, each with its variants, all motion animated</title><desc id="d1-desc">A developer imports Button, Sheet, Dialog, Chip, Section and Toast. Each renders its variants. Opening and closing animate; with reduced motion they shorten to a quick fade.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="200" y="14" width="240" height="40" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="38.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Developer imports a primitive</text><rect x="200" y="84" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="104.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Button · Sheet · Dialog</text><text x="320.0" y="120.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">Chip · Section · Toast</text><rect x="200" y="164" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="184.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Each shows its variants</text><text x="320.0" y="200.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">red · ink · outline, 340px dialog</text><rect x="200" y="244" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="264.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Open / close animates</text><text x="320.0" y="280.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">slide, pop, rise, fade</text><rect x="200" y="324" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="344.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Reduced motion</text><text x="320.0" y="360.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">150ms fade, no movement</text><rect x="200" y="394" width="240" height="30" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="413.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Colours from tokens</text><path d="M320 54 L320 84" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 132 L320 164" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 212 L320 244" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 292 L320 324" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 372 L320 394" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/></svg>