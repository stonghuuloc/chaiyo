<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement: a frosted bar that stays put, and an icon that fades to its filled self</title><desc id="d2-desc">Business flow for AC3 and AC4. AC3: the learner scrolls and the bar stays at the bottom, the page blurs through it, and it sits above the phone home indicator. AC4: the learner taps another tab, the old icon fades from filled back to line, the new icon fades from line to filled, and the motion matches the prototype on a real phone.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d2-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="14" width="280" height="34" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="160.0" y="35.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC3 · Learner scrolls a tab root</text><rect x="340" y="14" width="280" height="34" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="480.0" y="35.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC4 · Learner taps another tab</text><path d="M160 48 V72" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M480 48 V72" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><rect x="20" y="72" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="102.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">The bar stays at the bottom</text><rect x="340" y="72" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="480.0" y="102.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Old tab: filled icon fades to line</text><path d="M160 124 V148" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M480 124 V148" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><rect x="20" y="148" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="178.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Page content blurs through it</text><rect x="340" y="148" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="480.0" y="178.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">New tab: line fades out, filled in</text><path d="M160 200 V224" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M480 200 V224" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><rect x="20" y="224" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="254.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Padding clears the home indicator</text><rect x="340" y="224" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="480.0" y="254.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Same motion as the prototype</text><path d="M480 276 V300" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d2-ac)"/><rect x="340" y="300" width="280" height="40" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="480.0" y="324.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Checked on a real phone</text><path d="M160 276 V366" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d2-ac)"/><path d="M480 340 V366" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d2-ac)"/><rect x="20" y="366" width="600" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="320.0" y="387.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Nothing snaps: label colour and the bar entering or leaving move too</text><text x="320.0" y="404.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">Loc directive, 2026-10-29</text></svg>