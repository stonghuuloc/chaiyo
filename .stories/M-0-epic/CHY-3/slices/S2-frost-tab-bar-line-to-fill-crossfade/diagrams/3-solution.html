</head><body><div class="frame"><p class="eyebrow">Architecture delta · new/changed = accent, unchanged = dashed</p><h1>Solution: one always-mounted TabBar owns the bar, its icons and its slide</h1><div class="diagram-container">

ke="#f08a59" stroke-width="1.6"/><text x="340.0" y="231.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">TabBar.svelte</text><text x="340.0" y="248.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">{#if tab root} · 2 icons</text><rect x="470" y="196" width="150" height="76" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="545.0" y="231.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">tabFor(pathname)</text><text x="545.0" y="248.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">tabs.ts + icon name</text><path d="M470 234 H440" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d3-a)"/><path d="M270 272 V316" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d3-ac)"/><path d="M340 272 V316" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d3-ac)"/><path d="M410 272 V316" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d3-ac)"/><rect x="20" y="316" width="190" height="60" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="115.0" y="343.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">motion.ts</text><text x="115.0" y="360.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">barSlide · 260 ms / 0 ms</text><rect x="235" y="316" width="190" height="60" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="330.0" y="343.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">tab-icons.svg</text><text x="330.0" y="360.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">8 symbols · 8,120 B</text><rect x="450" y="316" width="170" height="60" rx="6" fill="#363a4d" stroke="#f08a
