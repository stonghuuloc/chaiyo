<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: the bar stays put, tab changes fade, pushed screens slide it away</title><desc id="d1-desc">A learner on a tab root can scroll, tap another tab, or open a pushed screen. Scrolling keeps the frosted bar fixed over blurred content. Tapping another tab fades icons and label colour in 0.26 seconds without moving the bar. Opening a pushed screen slides the bar down and away; coming back slides it up.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d1-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="220" y="14" width="200" height="40" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="320.0" y="38.5" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Learner on a tab root</text><path d="M320 54 V84" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><rect x="220" y="84" width="200" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="105.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">What does the learner do?</text><text x="320.0" y="122.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">one of three</text><path d="M250 132 V150 H105 V186" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d1-ac)"/><text x="40" y="172" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">scrolls</text><path d="M320 132 V186" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d1-ac)"/><text x="328" y="168" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">taps a tab</text><path d="M390 132 V150 H535 V186" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d1-ac)"/><text x="527" y="172" text-anchor="end" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">opens lesson</text><rect x="20" y="186" width="170" height="80" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="105.0" y="223.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Bar stays fixed</text><text x="105.0" y="240.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">content blurs beneath</text><rect x="235" y="186" width="170" height="80" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="320.0" y="223.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Icons + label fade</text><text x="320.0" y="240.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">line⇄fill · grey→ink</text><rect x="450" y="186" width="170" height="80" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="535.0" y="223.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Bar slides away</text><text x="535.0" y="240.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">returns: slides up</text><path d="M105 266 V300" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M320 266 V300" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><path d="M535 266 V300" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><rect x="20" y="300" width="170" height="70" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="105.0" y="332.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">0.26 s ease</text><text x="105.0" y="349.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">fade · no snap</text><rect x="235" y="300" width="170" height="70" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="332.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Bar never moves</text><text x="320.0" y="349.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">between two tabs</text><rect x="450" y="300" width="170" height="70" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="535.0" y="332.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Reduced motion</text><text x="535.0" y="349.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">fade 0.15 s · slide 0</text></svg>