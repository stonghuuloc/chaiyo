<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: tabs show the bar, focus screens hide it, strangers go to login</title><desc id="d1-desc">A learner opens an app URL. Signed out lands on Đăng nhập. Signed in on /practice sees Luyện tập with the tab bar and Luyện tập selected. Signed in on /practice/session sees the session with no tab bar.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d1-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="220" y="16" width="200" height="44" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="320.0" y="34.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Learner opens an app URL</text><text x="320.0" y="50.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">e.g. /practice</text><path d="M320 60 V92" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><polygon points="320,93.0 405.0,122 320,151.0 235.0,122" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="320" y="126" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Signed in?</text><path d="M235 122 H120 V170" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><text x="170" y="114" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">no</text><rect x="30" y="170" width="180" height="58" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="120.0" y="195.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Đăng nhập</text><text x="120.0" y="211.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">/login, no tab bar</text><path d="M320 151 V196" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><text x="328" y="178" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">yes</text><polygon points="320,197.0 415.0,226 320,255.0 225.0,226" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="320" y="230" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tab root?</text><path d="M415 226 H520 V280" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><text x="430" y="218" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">no — pushed</text><rect x="430" y="280" width="190" height="72" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="525.0" y="312.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Practice session</text><text x="525.0" y="328.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">/practice/session</text><text x="525" y="372" text-anchor="middle" font-size="13" fill="#f08a59" font-family="Geist Mono, ui-monospace, monospace">0 tab bars</text><path d="M320 255 V280" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d1-a)"/><text x="328" y="272" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">yes</text><rect x="210" y="280" width="200" height="72" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="310.0" y="312.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Luyện tập root</text><text x="310.0" y="328.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">/practice</text><rect x="170" y="386" width="280" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.6"/><text x="310.0" y="410.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Hôm nay · Lộ trình · [Luyện tập] · Tôi</text><text x="310.0" y="426.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">aria-current on Luyện tập</text><path d="M310 352 V386" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d1-ac)"/></svg>