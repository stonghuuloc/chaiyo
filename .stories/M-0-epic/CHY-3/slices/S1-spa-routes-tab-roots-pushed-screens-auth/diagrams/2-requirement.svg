<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement: where the learner lands, and whether the bar is there</title><desc id="d2-desc">Business flow for AC1, AC2, AC5: a signed-out learner reaches login; a signed-in learner tapping any of 4 tabs sees that tab with the bar; opening a lesson section, mixed practice, Gate Test, Word Page or any other pushed screen hides the bar.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d2-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="230" y="16" width="180" height="44" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="320.0" y="42.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Learner</text><path d="M230 38 H120 V100" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><text x="150" y="30" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">not signed in</text><path d="M300 60 V100" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M380 60 V80 H500 V100" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><text x="392" y="76" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">signed in</text><rect x="40" y="100" width="160" height="60" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="120.0" y="126.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Login screen</text><text x="120.0" y="142.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">AC5</text><rect x="220" y="100" width="160" height="60" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="300.0" y="126.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">taps a tab</text><text x="300.0" y="142.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">4 tabs</text><rect x="400" y="100" width="200" height="60" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="500.0" y="126.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">opens a focus screen</text><text x="500.0" y="142.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">lesson · test · word</text><path d="M300 160 V200" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><path d="M500 160 V200" fill="none" stroke="#bfc0c0" stroke-width="1.5" marker-end="url(#d2-a)"/><rect x="220" y="200" width="160" height="76" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="300.0" y="226.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">that tab’s screen</text><text x="300.0" y="242.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">+ tab bar, tab lit</text><text x="300.0" y="258.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">AC1</text><rect x="400" y="200" width="200" height="76" rx="6" fill="#3d3a45" stroke="#f08a59" stroke-width="1.6"/><text x="500.0" y="226.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">the screen alone</text><text x="500.0" y="242.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">no tab bar</text><text x="500.0" y="258.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">AC2</text><rect x="150" y="312" width="300" height="60" rx="6" fill="#363a4d" stroke="#f5f5f5" stroke-width="1.2"/><text x="300.0" y="338.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Hôm nay · Lộ trình · Luyện tập · Tôi</text><text x="300.0" y="354.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="Geist Mono, ui-monospace, monospace">one bar, one lit tab</text><path d="M300 276 V312" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#d2-ac)"/></svg>