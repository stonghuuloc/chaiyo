<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: three journeys the new prototype pages make clickable</title><desc id="d1-desc">Visitor lands on P1 and goes to login. A learner taps a hanzi and sees the X1 sheet. A learner takes the HSK 1 mock in Exam or Practice mode and sees a score out of 200.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="112" y="30" text-anchor="middle" font-size="13" fill="#f08a59" font-family="Geist, system-ui, sans-serif">Visitor</text><rect x="20" y="50" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="112.5" y="75.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">P1 Landing</text><text x="112.5" y="91.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">p1-landing.html</text><line x1="112" y1="106" x2="112" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="20" y="150" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="112.5" y="175.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">“Bắt đầu học”</text><text x="112.5" y="191.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">primary CTA</text><line x1="112" y1="206" x2="112" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="20" y="250" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="112.5" y="275.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">P2 Login</text><text x="112.5" y="291.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">p2-login.html</text><text x="317" y="30" text-anchor="middle" font-size="13" fill="#f08a59" font-family="Geist, system-ui, sans-serif">Learner reading</text><rect x="225" y="50" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="317.5" y="75.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tap 机 in 飞机</text><text x="317.5" y="91.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">x1-lookup.html</text><line x1="317" y1="106" x2="317" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="225" y="150" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="317.5" y="175.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">X1 sheet: 飞机</text><text x="317.5" y="191.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">never covers the line</text><line x1="317" y1="206" x2="317" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="225" y="250" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="317.5" y="275.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Xem chi tiết / Thêm</text><text x="317.5" y="291.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">or shrink to 飞</text><text x="522" y="30" text-anchor="middle" font-size="13" fill="#f08a59" font-family="Geist, system-ui, sans-serif">Learner, HSK 1 done</text><rect x="430" y="50" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="522.5" y="75.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Luyện tập › Thi thử</text><text x="522.5" y="91.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">p2-skill.html?k=thi</text><line x1="522" y1="106" x2="522" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="430" y="150" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="522.5" y="175.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Thi thật | Luyện</text><text x="522.5" y="191.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">Exam or Practice</text><line x1="522" y1="206" x2="522" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d1-a)"/><rect x="430" y="250" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="522.5" y="275.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">40 câu → điểm /200</text><text x="522.5" y="291.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">m2 → m3-result</text></svg>