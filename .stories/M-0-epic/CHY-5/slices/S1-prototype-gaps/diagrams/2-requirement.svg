<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement AC4: four planned screens get a prototype page</title><desc id="d2-desc">Landing, quick lookup, mock exam and mock result each get a clickable page, so the docs in S2 can list every screen with its page.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="30" width="140" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="90.0" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Landing page</text><text x="90.0" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">what Chaiyo is</text><line x1="90" y1="86" x2="320" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="172" y="30" width="140" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="242.0" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Quick lookup</text><text x="242.0" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">tap a character</text><line x1="242" y1="86" x2="320" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="324" y="30" width="140" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="394.0" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Mock exam</text><text x="394.0" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">HSK 1, 40 questions</text><line x1="394" y1="86" x2="320" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="476" y="30" width="140" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="546.0" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Mock result</text><text x="546.0" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">score + review</text><line x1="546" y1="86" x2="320" y2="150" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="170" y="150" width="300" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="175.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Each has a clickable prototype page</text><text x="320.0" y="191.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">looked at and approved by Loc</text><line x1="320" y1="206" x2="320" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="170" y="250" width="300" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="275.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Docs list every screen with its page</text><text x="320.0" y="291.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">1:1 — next slice (S2)</text></svg>