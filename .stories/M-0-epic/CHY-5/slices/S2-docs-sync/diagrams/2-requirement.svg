<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement AC1-AC3: docs describe the approved prototype</title><desc id="d2-desc">AC1 the screen list matches the prototype pages; AC2 the glossary uses per-skill practice; AC3 the removed dictionary tab and review screens are gone. Together: nobody builds a removed screen.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="30" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="112.5" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC1 Screen list</text><text x="112.5" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">= prototype pages</text><line x1="112" y1="86" x2="112" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="20" y="140" width="185" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="112.5" y="172.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">tabs + 37 rows, each with its page</text><line x1="112" y1="196" x2="320" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="225" y="30" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="317.5" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC2 Glossary</text><text x="317.5" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">practice per skill</text><line x1="317" y1="86" x2="317" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="225" y="140" width="185" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="317.5" y="172.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">one state per skill, daily mix</text><line x1="317" y1="196" x2="320" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="430" y="30" width="185" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="522.5" y="55.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">AC3 Removed</text><text x="522.5" y="71.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">no Từ điển tab</text><line x1="522" y1="86" x2="522" y2="140" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="430" y="140" width="185" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="522.5" y="172.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">no Tra từ, no R1 / R2</text><line x1="522" y1="196" x2="320" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d2-a)"/><rect x="140" y="250" width="360" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="275.0" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">A reader of the docs builds what the prototype shows</text><text x="320.0" y="291.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">nobody builds removed screens</text></svg>