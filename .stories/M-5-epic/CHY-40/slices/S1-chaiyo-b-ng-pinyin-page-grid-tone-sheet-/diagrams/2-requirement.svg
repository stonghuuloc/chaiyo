<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-title d2-desc" style="display:block;width:100%;height:auto"><title id="d2-title">Requirement: the four scenarios in business words</title><desc id="d2-desc">Rows AC1 to AC4: what the learner sees in the table, the tone sheet, a deep link and when closing.</desc><defs><marker id="d2-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d2-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><line x1="432" y1="318.0" x2="450" y2="318.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="244" y1="318.0" x2="262" y2="318.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="432" y1="228.0" x2="450" y2="228.0" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d2-a)"/><line x1="244" y1="228.0" x2="262" y2="228.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="432" y1="138.0" x2="450" y2="138.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="244" y1="138.0" x2="262" y2="138.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="432" y1="48.0" x2="450" y2="48.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><line x1="244" y1="48.0" x2="262" y2="48.0" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d2-a)"/><rect x="20" y="36" width="40" height="24" rx="2" fill="none" stroke="#f08a59" stroke-width="1"/><text x="40" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#f08a59" font-family="Geist, system-ui, sans-serif">AC1</text><rect x="76" y="20" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="45.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Table of syllables</text><text x="160.0" y="62.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">finals × initials, ∅ row</text><rect x="264" y="20" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="348.0" y="45.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Not a syllable</text><text x="348.0" y="62.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">empty cell</text><rect x="452" y="20" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="536.0" y="45.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Reference only</text><text x="536.0" y="62.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">no scores</text><rect x="20" y="126" width="40" height="24" rx="2" fill="none" stroke="#f08a59" stroke-width="1"/><text x="40" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#f08a59" font-family="Geist, system-ui, sans-serif">AC2</text><rect x="76" y="110" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="135.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tap a syllable</text><text x="160.0" y="152.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">e.g. “ba”</text><rect x="264" y="110" width="168" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="348.0" y="135.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Sheet: 4 tones</text><text x="348.0" y="152.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">pinyin · contour · hanzi</text><rect x="452" y="110" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="536.0" y="135.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tap = hear</text><text x="536.0" y="152.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">again = slow · no clip = “–”</text><rect x="20" y="216" width="40" height="24" rx="2" fill="none" stroke="#f08a59" stroke-width="1"/><text x="40" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#f08a59" font-family="Geist, system-ui, sans-serif">AC3</text><rect x="76" y="200" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="225.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Open from a link</text><text x="160.0" y="242.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">names a syllable</text><rect x="264" y="200" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="348.0" y="225.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Real syllable</text><text x="348.0" y="242.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">its sheet is open</text><rect x="452" y="200" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="536.0" y="225.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Anything else</text><text x="536.0" y="242.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">table, no sheet</text><rect x="20" y="306" width="40" height="24" rx="2" fill="none" stroke="#f08a59" stroke-width="1"/><text x="40" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#f08a59" font-family="Geist, system-ui, sans-serif">AC4</text><rect x="76" y="290" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="315.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Đóng · Esc · outside</text><text x="160.0" y="332.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">closes the sheet</text><rect x="264" y="290" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="348.0" y="315.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Focus</text><text x="348.0" y="332.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">back on the cell</text><rect x="452" y="290" width="168" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="536.0" y="315.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">✕</text><text x="536.0" y="332.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">previous screen or Nhập môn</text><text x="20" y="395" text-anchor="start" font-size="11" font-weight="400" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">one row per AC · read left to right · dashed = the other outcome</text></svg>