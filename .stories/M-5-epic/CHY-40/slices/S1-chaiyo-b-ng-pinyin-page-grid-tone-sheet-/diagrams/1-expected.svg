<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-title d1-desc" style="display:block;width:100%;height:auto"><title id="d1-title">Expected result: look up a syllable and hear its tones</title><desc id="d1-desc">Learner opens the table, taps ba, hears four tones, closes the sheet and leaves with the close button.</desc><defs><marker id="d1-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d1-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><line x1="300" y1="446.0" x2="362" y2="446.0" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d1-a)"/><line x1="300" y1="286.0" x2="362" y2="286.0" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d1-a)"/><line x1="300" y1="206.0" x2="362" y2="206.0" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d1-a)"/><line x1="160" y1="392" x2="160" y2="418" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d1-a)"/><line x1="160" y1="312" x2="160" y2="338" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d1-a)"/><line x1="160" y1="232" x2="160" y2="258" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d1-a)"/><line x1="160" y1="152" x2="160" y2="178" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d1-a)"/><line x1="160" y1="72" x2="160" y2="98" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d1-a)"/><rect x="20" y="20" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="43.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Learner opens Bảng pinyin</text><text x="160.0" y="60.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">/pinyin  ·  or a link with ?open=ba</text><rect x="20" y="100" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Table: 36 finals × 22 initials</text><text x="160.0" y="140.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">402 syllables · blank = not a syllable</text><rect x="20" y="180" width="280" height="52" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="160.0" y="203.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Sheet “ba” opens</text><text x="160.0" y="220.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">bā 八 · bá 拔 · bǎ 把 · bà 爸</text><rect x="20" y="260" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="283.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tap a tone → hear it</text><text x="160.0" y="300.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">tap it again → 0.5× slower</text><rect x="20" y="340" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="363.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Đóng · Esc · tap outside</text><text x="160.0" y="380.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">sheet closes, focus back on “ba”</text><rect x="20" y="420" width="280" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="443.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">✕ Quay lại</text><text x="160.0" y="460.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">came from a screen → back to it</text><rect x="364" y="180" width="256" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="492.0" y="203.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">?open=xyz</text><text x="492.0" y="220.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">table stays, no sheet</text><rect x="364" y="260" width="256" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="492.0" y="283.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Tone with no clip</text><text x="492.0" y="300.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">“–”, disabled (fixture only)</text><rect x="364" y="420" width="256" height="52" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="492.0" y="443.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, system-ui, sans-serif">Opened directly</text><text x="492.0" y="460.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">→ Nhập môn  /lesson/h0-00</text><text x="322" y="196" text-anchor="middle" font-size="10" font-weight="400" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">OR</text><text x="322" y="276" text-anchor="middle" font-size="10" font-weight="400" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">OR</text><text x="322" y="436" text-anchor="middle" font-size="10" font-weight="400" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">OR</text><text x="20" y="510" text-anchor="start" font-size="11" font-weight="400" fill="#bfc0c0" font-family="Geist, system-ui, sans-serif">solid = happy path · dashed = the branch an AC decides · orange = focal</text></svg>