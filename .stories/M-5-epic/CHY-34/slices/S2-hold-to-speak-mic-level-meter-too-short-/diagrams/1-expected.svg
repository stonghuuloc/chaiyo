serif" font-size="13" font-weight="600" fill="#f5f5f5">Ngắn quá — giữ nút</text><text x="412" y="312" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">lâu hơn… · hold again</text><line x1="20" y1="428" x2="620" y2="428" stroke="#f5f5f5" stroke-opacity="0.15"/><rect x="24" y="442" width="18" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="50" y="452" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0">the two outcomes AC2 / AC5 decide</text><rect x="291.79999999999995" y="442" width="18" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="317.79999999999995" y="452" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0">step</text></svg>
