="123.0" y="163" width="54" height="16" fill="#2d3142"/><text x="150" y="175" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0" letter-spacing="0.06em">MIC ON</text><rect x="20" y="20" width="320" height="52" rx="6" fill="#2d3142"/><rect x="20" y="20" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="32" y="42" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Đọc to câu này · 不客气。</text><text x="32" y="60" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">button: Giữ để nói</text><rect x="20" y="104" width="320" height="52" rx="6" fill="#2d3142"/><rect x="20" y="104" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="32" y="126" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Learner holds the red button</text><text x="32" y="144" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">browser asks for the mic</text><rect x="20" y="188" width="320" height="52" rx="6" fill="#2d3142"/><rect x="20" y="188" width="320" height="52" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.10"/><text x="32" y="210" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Live bars + timer 0:03</text><text x="32" y="228" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">button: Thả khi nói xong</text><rect x="20" y="272" width="320" height="52" rx="6" fill="#2d3142"/><rect x="20" y="272" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="32" y="294" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" fo