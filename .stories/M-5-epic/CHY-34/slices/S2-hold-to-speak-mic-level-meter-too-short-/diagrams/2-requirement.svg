<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 518" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2-requirement-title 2-requirement-desc" id="d-2-requirement-root"><title id="2-requirement-title">Requirement — speak, measure, discard</title><desc id="2-requirement-desc">Who does what when the learner speaks: the browser measures the sound and discards it, the server receives nothing, and a blocked mic still lets the section finish.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root { font-family: Geist,system-ui,sans-serif; color: #f5f5f5; }
      #d-2-requirement-root .diagram-container { width:100%;overflow-x:auto }</style><marker id="d-2-requirement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="12" width="190" height="452" rx="6" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.03" stroke-opacity="0.12"/><text x="32" y="32" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0" letter-spacing="0.12em">LEARNER</text><rect x="230" y="12" width="190" height="452" rx="6" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.03" stroke-opacity="0.12"/><text x="242" y="32" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0" letter-spacing="0.12em">BROWSER (THIS DEVICE)</text><rect x="440" y="12" width="190" height="452" rx="6" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.03" stroke-opacity="0.12"/><text x="452" y="32" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0" letter-spacing="0.12em">SERVER</text><path d="M204,70 L236,70" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M204,154 L236,154" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M325,180 L325,224" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M236,384 L204,384" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><rect x="32" y="44" width="172" height="52" rx="6" fill="#2d3142"/><rect x="32" y="44" width="172" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="44" y="66" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Holds the red</text><text x="44" y="84" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">button, speaks</text><rect x="242" y="44" width="172" height="52" rx="6" fill="#2d3142"/><rect x="242" y="44" width="172" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="254" y="66" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Mic on</text><text x="254" y="84" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">live bars · 0:03</text><rect x="32" y="128" width="172" height="52" rx="6" fill="#2d3142"/><rect x="32" y="128" width="172" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="44" y="150" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Releases</text><rect x="242" y="128" width="172" height="52" rx="6" fill="#2d3142"/><rect x="242" y="128" width="172" height="52" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.10"/><text x="254" y="150" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Sound measured,</text><text x="254" y="168" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">then thrown away</text><rect x="452" y="128" width="172" height="52" rx="6" fill="#2d3142"/><rect x="452" y="128" width="172" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" fill-opacity="0.04"/><text x="464" y="150" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Receives nothing</text><text x="464" y="168" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">stores nothing</text><rect x="242" y="224" width="172" height="68" rx="6" fill="#2d3142"/><rect x="242" y="224" width="172" height="68" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="254" y="246" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Held &lt; 0.7 s →</text><text x="254" y="264" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">&quot;Ngắn quá…&quot;</text><text x="254" y="279" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">≥ 0.7 s → Tiếp</text><rect x="242" y="358" width="172" height="52" rx="6" fill="#2d3142"/><rect x="242" y="358" width="172" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="254" y="380" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Mic blocked →</text><text x="254" y="398" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">skip message</text><rect x="32" y="358" width="172" height="68" rx="6" fill="#2d3142"/><rect x="32" y="358" width="172" height="68" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.10"/><text x="44" y="380" font-family="Geist, 'Noto Sans TC', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Presses &quot;Bỏ qua&quot;</text><text x="44" y="398" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">section still</text><text x="44" y="413" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="11" fill="#bfc0c0">counts as done</text><text x="230" y="336" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0" letter-spacing="0.08em">OR, WHEN THE BROWSER BLOCKS THE MIC</text><line x1="20" y1="476" x2="620" y2="476" stroke="#f5f5f5" stroke-opacity="0.15"/><rect x="24" y="490" width="18" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="50" y="500" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0">what AC3 / AC5 promise</text><rect x="219.2" y="490" width="18" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-dasharray="5,4"/><text x="245.2" y="500" font-family="'Geist Mono', 'Noto Sans TC', ui-monospace, monospace" font-size="10" fill="#bfc0c0">nothing crosses here</text></svg>
