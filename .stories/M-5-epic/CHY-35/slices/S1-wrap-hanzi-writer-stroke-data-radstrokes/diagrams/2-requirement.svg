<svg viewBox="0 0 640 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Requirement: pad loads strokes or says check network" style="display:block;width:100%;height:auto;font-family:sans-serif"><rect width="640" height="212" rx="8" fill="#1b1714"/><defs><marker id="m2-requirement" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#948a7e"/></marker></defs><rect x="10" y="20" width="130" height="50" rx="6" fill="#2b241f" stroke="#948a7e"/><text x="75.0" y="41.0" text-anchor="middle" font-size="12" fill="#f3ede2">Learner</text><text x="75.0" y="57.0" text-anchor="middle" font-size="11" fill="#b9ad9e">opens a character</text><line x1="140" y1="45" x2="170" y2="45" stroke="#948a7e" marker-end="url(#m2-requirement)"/><rect x="170" y="20" width="140" height="50" rx="6" fill="#2b241f" stroke="#948a7e"/><text x="240.0" y="41.0" text-anchor="middle" font-size="12" fill="#f3ede2">Stroke data</text><text x="240.0" y="57.0" text-anchor="middle" font-size="11" fill="#b9ad9e">from the internet</text><line x1="310" y1="45" x2="350" y2="45" stroke="#948a7e" marker-end="url(#m2-requirement)"/><text x="330" y="14" text-anchor="middle" font-size="10" fill="#b9ad9e">arrives</text><rect x="350" y="20" width="280" height="50" rx="6" fill="#3a1f1a" stroke="#e8604c"/><text x="490.0" y="41.0" text-anchor="middle" font-size="12" fill="#f3ede2">Pad ready: counter 0/N,</text><text x="490.0" y="57.0" text-anchor="middle" font-size="11" fill="#b9ad9e">radical red, pen 48</text><line x1="240" y1="70" x2="240" y2="120" stroke="#948a7e" marker-end="url(#m2-requirement)"/><text x="248" y="100" font-size="10" fill="#b9ad9e">missing</text><rect x="150" y="120" width="180" height="50" rx="6" fill="#3a2a12" stroke="#d9a441"/><text x="240.0" y="141.0" text-anchor="middle" font-size="12" fill="#f3ede2">Message: check network</text><text x="240.0" y="157.0" text-anchor="middle" font-size="11" fill="#f3ede2">and try again</text><line x1="490" y1="70" x2="490" y2="120" stroke="#948a7e" marker-end="url(#m2-requirement)"/><rect x="350" y="120" width="280" height="50" rx="6" fill="#3a1f1a" stroke="#e8604c"/><text x="490.0" y="141.0" text-anchor="middle" font-size="12" fill="#f3ede2">Each right stroke: +1</text><text x="490.0" y="157.0" text-anchor="middle" font-size="11" fill="#b9ad9e">Tools: example · hint · redo</text><text x="320" y="200" text-anchor="middle" font-size="10" fill="#b9ad9e">Rounds, results, skip and done list are the section (S2), not this pad</text></svg>