<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record every answer, resume an unfinished visit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 640px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · CHY-30 S2</p>
    <h1>Record every answer, resume an unfinished visit</h1>

t x="180" y="20" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="20" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="42" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Learner opens a section</text><text x="320.0" y="60" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">lesson + section</text><rect x="180" y="104" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="104" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="126" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Look for an unfinished visit</text><text x="320.0" y="144" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">same section, same length</text><rect x="180" y="188" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="188" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="210" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Unfinished visit found?</text><text x="320.0" y="228" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">not closed</text><rect x="40" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="40" y="284" width="240" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="160.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Start at step 1</text><text x="160.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">new visit</text><rect x="360" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="360" y="284" width="240" height="52" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="480.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Continue at 1st unanswered</text><text x="480.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">same visit, same progress</text><rect x="180" y="392" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="392" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="414" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Each answer stored once</text><text x="320.0" y="432" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">then the next step opens</text><rect x="180" y="476" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="476" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="498" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Study decides what happened</text><text x="320.0" y="516" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">section done · streak · events</text><rect x="20" y="556" width="20" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="48" y="566" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">business step</text><rect x="164.2" y="556" width="20" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="192.2" y="566" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">AC5 branch</text></svg>
    </div>
  </div>
</body>
</html>
