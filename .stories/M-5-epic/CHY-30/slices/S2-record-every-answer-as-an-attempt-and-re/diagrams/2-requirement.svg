<svg viewBox="0 0 640 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2-requirement-title 2-requirement-desc"><title id="2-requirement-title">Record every answer, resume an unfinished visit</title><desc id="2-requirement-desc">A section either continues an unfinished visit or starts a new one; every answer is stored once and Study decides the outcome.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M320,72 V104" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M320,156 V188" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M240,240 V256 Q240,264 232,264 H168 Q160,264 160,272 V284" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M400,240 V256 Q400,264 408,264 H472 Q480,264 480,272 V284" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="188.0" y="255" width="24" height="16" fill="#2d3142"/><text x="200" y="267" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#bfc0c0">NO</text><rect x="424.5" y="255" width="31" height="16" fill="#2d3142"/><text x="440" y="267" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#bfc0c0">YES</text><path d="M160,336 V364 Q160,372 168,372 H232 Q240,372 240,380 V392" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,336 V364 Q480,372 472,372 H408 Q400,372 400,380 V392" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M320,444 V476" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="180" y="20" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="20" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="42" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Learner opens a section</text><text x="320.0" y="60" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">lesson + section</text><rect x="180" y="104" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="104" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="126" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Look for an unfinished visit</text><text x="320.0" y="144" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">same section, same length</text><rect x="180" y="188" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="188" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="210" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Unfinished visit found?</text><text x="320.0" y="228" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">not closed</text><rect x="40" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="40" y="284" width="240" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="160.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Start at step 1</text><text x="160.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">new visit</text><rect x="360" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="360" y="284" width="240" height="52" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="480.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Continue at 1st unanswered</text><text x="480.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">same visit, same progress</text><rect x="180" y="392" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="392" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="414" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Each answer stored once</text><text x="320.0" y="432" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">then the next step opens</text><rect x="180" y="476" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="476" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="498" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Study decides what happened</text><text x="320.0" y="516" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">section done · streak · events</text><rect x="20" y="556" width="20" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="48" y="566" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">business step</text><rect x="164.2" y="556" width="20" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="192.2" y="566" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">AC5 branch</text></svg>