="280" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="320.0" y="402" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">CTA reads Tiếp</text><text x="320.0" y="420" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">miss → hint: quay lại ở phần ôn</text><rect x="180" y="464" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="464" width="280" height="52" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.10"/><text x="320.0" y="486" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Next step opens</text><text x="320.0" y="504" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">2/6 · 1 segment on</text><rect x="20" y="540" width="20" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="48" y="550" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">step</text><rect x="101.6" y="540" width="20" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="129.6" y="550" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">outcome the learner sees</text></svg>
