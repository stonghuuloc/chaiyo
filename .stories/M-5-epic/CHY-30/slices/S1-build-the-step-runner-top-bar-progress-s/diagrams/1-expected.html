<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choice step with feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 640px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · CHY-30 S1</p>
    <h1>Choice step with feedback</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 640 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="1-expected-title 1-expected-desc"><title id="1-expected-title">Choice step with feedback</title><desc id="1-expected-desc">A learner picks an answer, checks it, sees right or wrong, and moves to step 2 of 6.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M320,72 V104" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M320,156 V188" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M273,240 V256 Q273,264 265,264 H168 Q160,264 160,272 V284" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M367,240 V256 Q367,264 375,264 H472 Q480,264 480,272 V284" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M160,336 V350 Q160,358 168,358 H265 Q273,358 273,366 V380" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,336 V350 Q480,358 472,358 H375 Q367,358 367,366 V380" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M320,432 V464" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="180" y="20" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="20" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="42" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Open a 6-step section</text><text x="320.0" y="60" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">✕ · 6 segments · 1/6</text><rect x="180" y="104" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="104" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="126" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Pick 好</text><text x="320.0" y="144" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">CTA Kiểm tra → enabled</text><rect x="180" y="188" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="188" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="210" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Press Kiểm tra</text><text x="320.0" y="228" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">options lock</text><rect x="40" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="40" y="284" width="240" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="160.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Right pick</text><text x="160.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">Đúng rồi. · 好 marked</text><rect x="360" y="284" width="240" height="52" rx="6" fill="#2d3142"/><rect x="360" y="284" width="240" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="480.0" y="306" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Wrong pick 你</text><text x="480.0" y="324" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">Chưa đúng. Đáp án là 好</text><rect x="180" y="380" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="380" width="280" height="52" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1.2"/><text x="320.0" y="402" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">CTA reads Tiếp</text><text x="320.0" y="420" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">miss → hint: quay lại ở phần ôn</text><rect x="180" y="464" width="280" height="52" rx="6" fill="#2d3142"/><rect x="180" y="464" width="280" height="52" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="320.0" y="486" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Next step opens</text><text x="320.0" y="504" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">2/6 · 1 segment on</text><rect x="20" y="540" width="20" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="48" y="550" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">step</text><rect x="101.6" y="540" width="20" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="129.6" y="550" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">outcome the learner sees</text></svg>
    </div>
  </div>
</body>
</html>
