<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="2-requirement-title 2-requirement-desc" id="d-2-requirement-root"><title id="2-requirement-title">AC1 + AC2 in business words</title><desc id="2-requirement-desc">The learner learns two grammar points, practises each with three questions, and is told the section is done.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root { --color-paper:   #2d3142;   
      --color-ink:     #f5f5f5;   
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-2-requirement-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-2-requirement-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-2-requirement-root .diagram-container { overflow-x: visible; }</style><marker id="d-2-requirement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M320,72 V100" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M320,168 V196" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M320,264 V292" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow)"/><path d="M320,360 V388" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-arrow-accent)"/><rect x="170" y="20" width="300" height="52" rx="6" fill="#2d3142"/><rect x="170" y="20" width="300" height="52" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="320.0" y="42.0" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Learner opens Ngữ pháp</text><text x="320.0" y="60.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">lesson Bài 1</text><rect x="140" y="100" width="360" height="68" rx="6" fill="#2d3142"/><rect x="140" y="100" width="360" height="68" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="320.0" y="121.0" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Learns the pattern</text><text x="320.0" y="139.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">who is greeted + 好 · hears 2 examples</text><text x="320.0" y="155.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">sees the common mistake</text><rect x="140" y="196" width="360" height="68" rx="6" fill="#2d3142"/><rect x="140" y="196" width="360" height="68" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="320.0" y="217.0" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Practises it, 3 questions</text><text x="320.0" y="235.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">2 × pick the greeting</text><text x="320.0" y="251.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">1 × put the characters in order</text><rect x="140" y="292" width="360" height="68" rx="6" fill="#2d3142"/><rect x="140" y="292" width="360" height="68" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1.2" fill-opacity="0.04"/><text x="320.0" y="313.0" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Learns point 2, practises 3</text><text x="320.0" y="331.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">thank you → you are welcome</text><text x="320.0" y="347.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">sorry → no problem</text><rect x="140" y="388" width="360" height="52" rx="6" fill="#2d3142"/><rect x="140" y="388" width="360" height="52" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.10"/><text x="320.0" y="410.0" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f5f5f5">Told it is done</text><text x="320.0" y="428.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">and that it went into review</text><rect x="20" y="464" width="20" height="12" rx="2" fill="none" stroke="#bfc0c0"/><text x="48" y="474" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">what the learner does</text><rect x="227.4" y="464" width="20" height="12" rx="2" fill="none" stroke="#f08a59"/><text x="255.4" y="474" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#bfc0c0">outcome</text></svg>
