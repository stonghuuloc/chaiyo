<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" id="d-2-requirement-root">
<title id="requirement-title">Requirement: a report the admin can act on</title><desc id="requirement-desc">The learner picks a category and sends; the app attaches the content context, keeps it while offline, and the server saves it as Mới.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root { font-family: 'Geist',system-ui,sans-serif; color: #f5f5f5; }
      #d-2-requirement-root .diagram-container { width:100%;overflow-x:auto }
      #d-2-requirement-root .diagram-container { overflow-x:visible }</style><marker id="d-2-requirement-requirement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="d-2-requirement-requirement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
<rect width="100%" height="100%" fill="#2d3142"/>
<rect x="8" y="8" width="624" height="104" fill="#323648"/><text x="16" y="26" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10" letter-spacing="0.14em" fill="#bfc0c0">LEARNER</text>
<rect x="8" y="120" width="624" height="104" fill="#2d3142"/><text x="16" y="138" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10" letter-spacing="0.14em" fill="#bfc0c0">APP ON THE DEVICE</text>
<line x1="8" y1="120" x2="632" y2="120" stroke="#bfc0c0" stroke-opacity="0.35"/>
<rect x="8" y="232" width="624" height="104" fill="#323648"/><text x="16" y="250" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10" letter-spacing="0.14em" fill="#bfc0c0">SERVER</text>
<line x1="8" y1="232" x2="632" y2="232" stroke="#bfc0c0" stroke-opacity="0.35"/>
<path d="M136 64 L156 64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d-2-requirement-requirement-arrow)"/>
<path d="M284 64 L304 64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d-2-requirement-requirement-arrow)"/>
<path d="M432 64 L452 64" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#d-2-requirement-requirement-arrow-accent)"/>
<path d="M368 92 L368 148" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d-2-requirement-requirement-arrow)"/>
<path d="M432 176 L452 176" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#d-2-requirement-requirement-arrow)"/>
<path d="M516 204 L516 260" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#d-2-requirement-requirement-arrow)"/>
<rect x="473.0" y="223" width="86" height="16" fill="#2d3142"/><text x="516" y="235" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10" letter-spacing="0.06em" fill="#bfc0c0">WHEN ONLINE</text>
<rect x="16" y="36" width="120" height="56" rx="6" fill="#2d3142"/><rect x="16" y="36" width="120" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2"/>
<text x="76.0" y="60.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Open Báo lỗi</text>
<text x="76.0" y="76.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">from step / word</text>
<rect x="156" y="36" width="128" height="56" rx="6" fill="#2d3142"/><rect x="156" y="36" width="128" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2"/>
<text x="220.0" y="60.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Pick 1 of 5</text>
<text x="220.0" y="76.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">category chips</text>
<rect x="304" y="36" width="128" height="56" rx="6" fill="#2d3142"/><rect x="304" y="36" width="128" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2"/>
<text x="368.0" y="60.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Tap Gửi</text>
<text x="368.0" y="76.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">note optional</text>
<rect x="452" y="36" width="172" height="56" rx="6" fill="#2d3142"/><rect x="452" y="36" width="172" height="56" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.2" fill-opacity="0.12"/>
<text x="538.0" y="60.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Sees thank-you</text>
<text x="538.0" y="76.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">“Đã gửi. Cảm ơn bạn!”</text>
<rect x="304" y="148" width="128" height="56" rx="6" fill="#2d3142"/><rect x="304" y="148" width="128" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2"/>
<text x="368.0" y="172.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Attach context</text>
<text x="368.0" y="188.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">lesson·step·word</text>
<rect x="452" y="148" width="172" height="56" rx="6" fill="#2d3142"/><rect x="452" y="148" width="172" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="538.0" y="172.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Keep until online</text>
<text x="538.0" y="188.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">nothing is lost</text>
<rect x="452" y="260" width="172" height="56" rx="6" fill="#2d3142"/><rect x="452" y="260" width="172" height="56" rx="6" fill="#363b4f" stroke="#f5f5f5" stroke-width="1.2"/>
<text x="538.0" y="284.0" text-anchor="middle" font-family="Geist, 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Report saved as “Mới”</text>
<text x="538.0" y="300.0" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans TC', monospace" font-size="10.5" fill="#bfc0c0">M-10 inbox reads it</text>
</svg>
