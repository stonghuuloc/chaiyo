<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: saved before shown</title><desc id="requirement-desc">The learner opens a lesson online. The bundle downloads and is saved on the device before the lesson shows. If saving fails the lesson still shows.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-A1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-A2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="24" y="32" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THE LEARNER</text><text x="376" y="32" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">IF SAVING FAILS</text><rect x="24" y="48" width="240" height="48" rx="6" fill="#2d3142"/><rect x="24" y="48" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="77.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Opens a lesson online</text><rect x="24" y="120" width="240" height="48" rx="6" fill="#2d3142"/><rect x="24" y="120" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="149.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lesson bundle downloads</text><rect x="24" y="192" width="240" height="48" rx="6" fill="#2d3142"/><rect x="24" y="192" width="240" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="144.0" y="213.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Bundle saved on the device</text><text x="144.0" y="230.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">AC1: before the lesson shows</text><rect x="24" y="264" width="240" height="48" rx="6" fill="#2d3142"/><rect x="24" y="264" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="293.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lesson shows</text><rect x="376" y="192" width="240" height="48" rx="6" fill="#2d3142"/><rect x="376" y="192" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="496.0" y="221.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Save fails (device full)</text><rect x="376" y="264" width="240" height="48" rx="6" fill="#2d3142"/><rect x="376" y="264" width="240" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="496.0" y="293.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lesson still shows, not saved</text><path d="M144,96 L144,120" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-A1)"/><path d="M144,168 L144,192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-A1)"/><path d="M144,240 L144,264" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-A2)"/><path d="M264,216 L376,216" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-2-requirement-A1)"/><path d="M496,240 L496,264" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-2-requirement-A1)"/></svg>
