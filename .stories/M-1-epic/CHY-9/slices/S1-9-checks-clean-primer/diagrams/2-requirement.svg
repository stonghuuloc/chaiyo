<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: nine rules, three acceptance outcomes</title><desc id="requirement-desc">An author writes a lesson and nine rules check it, grouped as Characters, Pinyin, Text, Lesson and Voices. A broken rule gives exactly one error (AC1), a clean lesson gives zero errors (AC2), and a primer skips rules 1 to 7 and the word count while the rest apply (AC3).</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M320,100 L320,124" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M118,328 L118,376" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M320,328 L320,376" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M522,328 L522,376" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><text x="24" y="32" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AUTHOR</text><rect x="160" y="44" width="320" height="56" rx="6" fill="#2d3142"/><rect x="160" y="44" width="320" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Author writes a lesson</text><text x="320.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">every lesson is checked</text><rect x="12" y="124" width="616" height="204" rx="8" fill="none" stroke="#bfc0c0" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4,3"/><text x="24" y="144" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">NINE RULES</text><rect x="24" y="156" width="188" height="84" rx="6" fill="#2d3142"/><rect x="24" y="156" width="188" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="118.0" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Characters</text><text x="118.0" y="198" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">1 Hán Việt</text><text x="118.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">2 Polyphones</text><text x="118.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">7 Mnemonic reuse</text><rect x="226" y="156" width="188" height="84" rx="6" fill="#2d3142"/><rect x="226" y="156" width="188" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Pinyin</text><text x="320.0" y="198" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">3 Tone marks</text><text x="320.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">4 Sandhi</text><rect x="428" y="156" width="188" height="84" rx="6" fill="#2d3142"/><rect x="428" y="156" width="188" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="522.0" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Text</text><text x="522.0" y="198" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">5 80% known chars</text><text x="522.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0" font-famil