" y="376" width="188" height="108" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="238" y="398" font-size="12" font-weight="600" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC2</text><text x="320.0" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Clean lesson</text><text x="320.0" y="438" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">0 errors</text><rect x="428" y="376" width="188" height="108" rx="6" fill="#2d3142"/><rect x="428" y="376" width="188" height="108" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="440" y="398" font-size="12" font-weight="600" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC3</text><text x="522.0" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Primer lesson</text><text x="522.0" y="438" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">rules 1–7 skipped</text><text x="522.0" y="454" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">word count skipped</text><text x="522.0" y="470" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">rest still apply</text></svg>
