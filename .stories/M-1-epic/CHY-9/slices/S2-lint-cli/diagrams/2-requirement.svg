<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: every mistake is a readable line, and a script can act on it</title><desc id="requirement-desc">An author checks a content folder. Every mistake appears as one readable line naming the file, the field and the rule number. A failing result lets a script or build stop. A folder with no mistakes passes silently. This is acceptance criterion 4.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="24" y="32" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AUTHOR</text><path d="M240,100 L240,140" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M470,100 L470,140" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><path d="M210,212 L210,244" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M530,212 L530,244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><rect x="160" y="44" width="320" height="56" rx="6" fill="#2d3142"/><rect x="160" y="44" width="320" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Checks a content folder</text><text x="320.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">before it ships</text><text x="250" y="125" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">has mistakes</text><text x="480" y="125" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">no mistakes</text><rect x="20" y="140" width="380" height="72" rx="6" fill="#2d3142"/><rect x="20" y="140" width="380" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="210.0" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Every mistake is one readable line</text><text x="210.0" y="182" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">names the file, the field</text><text x="210.0" y="198" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">and the rule number</text><rect x="430" y="140" width="200" height="72" rx="6" fill="#2d3142"/><rect x="430" y="140" width="200" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="530.0" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Passes silently</text><text x="530.0" y="182" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">nothing to read</text><rect x="20" y="244" width="380" height="56" rx="6" fill="#2d3142"/><rect x="20" y="244" width="380" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="210.0" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">A failing result</text><text x="210.0" y="286" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">lets a script or build stop</text><text x="390" y="262" text-anchor="end" font-size="12" font-weight="600" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC4</text><rect x="430" y="244" width="200" height="56" rx="6" fill="#2d3142"/><rect x="430" y="244" width="200" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="530.0" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">A passing result</text><text x="530.0" y="286" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">lets the build go on</text><text x="620" y="262" text-anchor="end" font-size="12" font-weight="600" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC4</text></svg>
