<svg viewBox="0 0 640 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-title expected-desc" style="display:block;width:100%;height:auto" id="d-1-expected-root"><title id="expected-title">Expected result: pnpm lint:content prints one line per mistake</title><desc id="expected-desc">A content author runs pnpm lint:content on a content folder. With 3 mistakes in 2 files, three lines print, one per mistake with file, path, check number and message, and the process ends with a failing exit code. A clean folder prints nothing and exits 0.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-1-expected-root .wrap { overflow-x:auto }
