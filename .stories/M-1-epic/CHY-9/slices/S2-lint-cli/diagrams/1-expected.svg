="20" y="140" width="380" height="72" rx="6" fill="#2d3142"/><rect x="20" y="140" width="380" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="210.0" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Three lines print</text><text x="210.0" y="182" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">one line per mistake</text><text x="210.0" y="198" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">file · path · #check · message</text><rect x="430" y="140" width="200" height="72" rx="6" fill="#2d3142"/><rect x="430" y="140" width="200" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="530.0" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Nothing printed</text><text x="530.0" y="182" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">no output at all</text><rect x="20" y="244" width="380" height="56" rx="6" fill="#2d3142"/><rect x="20" y="244" width="380" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="210.0" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Process ends</text><text x="210.0" y="286" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">with a failing exit code</text><rect x="430" y="244" width="200" height="56" rx="6" fill="#2d3142"/><rect x="430" y="244" width="200" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="530.0" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Exit code 0</text><text x="530.0" y="286" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">build or script goes on</text></svg>
