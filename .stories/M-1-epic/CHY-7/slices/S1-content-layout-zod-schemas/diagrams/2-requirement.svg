<svg viewBox="0 0 640 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: four promises about content files</title><desc id="requirement-desc">AC1: listing the content folder shows eight expected places. AC2: a valid example of each of eight kinds is accepted. AC3: a wrong example returns errors that name the file and field. AC4: one good and one bad check per kind all pass.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M264,76 L376,76" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><path d="M264,156 L376,156" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><path d="M264,236 L376,236" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><path d="M264,316 L376,316" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><text x="24" y="32" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THE DEVELOPER DOES</text><text x="616" y="32" text-anchor="end" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THE DEVELOPER GETS</text><rect x="24" y="48" width="240" height="56" rx="6" fill="#2d3142"/><rect x="24" y="48" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="81.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC1 · Lists the content folder</text><rect x="376" y="48" width="240" height="56" rx="6" fill="#2d3142"/><rect x="376" y="48" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="496.0" y="81.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">All 8 expected places exist</text><rect x="24" y="128" width="240" height="56" rx="6" fill="#2d3142"/><rect x="24" y="128" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="161.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC2 · Hands over a valid example</text><rect x="376" y="128" width="240" height="56" rx="6" fill="#2d3142"/><rect x="376" y="128" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="496.0" y="161.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Accepted, typed result back</text><rect x="24" y="208" width="240" height="56" rx="6" fill="#2d3142"/><rect x="24" y="208" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC3 · Hands over a wrong field</text><rect x="376" y="208" width="240" height="56" rx="6" fill="#2d3142"/><rect x="376" y="208" width="240" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="496.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Errors naming file + field</text><rect x="24" y="288" width="240" height="56" rx="6" fill="#2d3142"/><rect x="24" y="288" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="144.0" y="321.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC4 · Runs the test suite</text><rect x="376" y="288" width="240" height="56" rx="6" fill="#2d3142"/><rect x="376" y="288" width="240" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="496.0" y="321.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">1 good + 1 bad per kind, pass</text></svg>
