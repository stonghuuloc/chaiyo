<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto"><title id="requirement-title">Requirement: AC2 and AC3 in business words</title><desc id="requirement-desc">A developer opens the schema&#x27;s open decisions; decision 1 reads decided and the Bài 1 example agrees with it; decision 2 reads decided and the grammar point shape and the h1-g01 example agree with it.</desc><defs><marker id="requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M268,72 L168.0,72.0 Q160,72 160.0,80.0 L160,112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M372,72 L472.0,72.0 Q480,72 480.0,80.0 L480,112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M160,168 L160,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M160,256 L160,288" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><path d="M480,168 L480,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M480,256 L480,288" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><rect x="204" y="48" width="232" height="48" rx="6" fill="#2d3142"/><rect x="204" y="48" width="232" height="48" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="70.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Developer opens</text><text x="320.0" y="86.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">the schema&#x27;s open decisions</text><rect x="30" y="112" width="260" height="56" rx="6" fill="#2d3142"/><rect x="30" y="112" width="260" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Decision 1 reads decided</text><text x="160.0" y="154.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">single chars inside compounds</text><rect x="30" y="200" width="260" height="56" rx="6" fill="#2d3142"/><rect x="30" y="200" width="260" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="160.0" y="226.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Answer: list both</text><text x="160.0" y="242.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">你 and 你好, when 你 is taught</text><rect x="30" y="288" width="260" height="56" rx="6" fill="#2d3142"/><rect x="30" y="288" width="260" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="160.0" y="314.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Bài 1 example agrees</text><text x="160.0" y="330.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">10 words, nothing removed</text><rect x="350" y="112" width="260" height="56" rx="6" fill="#2d3142"/><rect x="350" y="112" width="260" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="480.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Decision 2 reads decided</text><text x="480.0" y="154.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">own grammar ids (locked)</text><rect x="350" y="200" width="260" height="56" rx="6" fill="#2d3142"/><rect x="350" y="200" width="260" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="480.0" y="226.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Answer: own ids + std</text><text x="480.0" y="242.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">empty std allowed, why optional</text><rect x="350" y="288" width="260" height="56" rx="6" fill="#2d3142"/><rect x="350" y="288" width="260" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="480.0" y="314.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Shape + h1-g01 agree</text><text x="480.0" y="330.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">no grammar file changes</text><text x="30" y="104" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC2</text><text x="610" y="104" text-anchor="end" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC3</text></svg>