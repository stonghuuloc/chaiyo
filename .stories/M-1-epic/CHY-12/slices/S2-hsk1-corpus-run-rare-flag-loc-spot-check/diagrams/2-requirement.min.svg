<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: two promises of the HSK1 corpus run</title><desc id="requirement-desc">Two promises in run order: every HSK1 word has an entry with rare meanings flagged so the Word Page can fold them, and 20 random entries are shown to Loc who approves them before anything is imported.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');       #d-2-requirement-root .wrap { overflow-x:auto }       #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="24" y="32" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">TWO PROMISES, IN RUN ORDER</text><path d="M346,108 L346,148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><rect x="24" y="44" width="76" height="64" rx="6" fill="#2d3142"/><rect x="24" y="44" width="76" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="62.0" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC4</text><text x="62.0" y="89" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">COVERAGE</text><rect x="112" y="44" width="504" height="64" rx="6" fill="#2d3142"/><rect x="112" y="44" width="504" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="128" y="72" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Every HSK1 word has an entry, and rare meanings are flagged</text><text x="128" y="90" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">so the Word Page can fold them under &#x27;Xem thêm N nghĩa ít gặp&#x27;</text><rect x="24" y="148" width="76" height="64" rx="6" fill="#2d3142"/><rect x="24" y="148" width="76" height="64" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="62.0" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC5</text><text x="62.0" y="193" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">SIGN-OFF</text><rect x="112" y="148" width="504" height="64" rx="6" fill="#2d3142"/><rect x="112" y="148" width="504" height="64" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="128" y="176" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">20 random entries are shown to Loc and he approves</text><text x="128" y="194" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">them before anything is imported</text></svg> 
