<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 640 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-title expected-desc" style="display:block;width:100%;height:auto" id="d-1-expected-root"><title id="expected-title">Expected result: the HSK1 corpus run and Loc&#x27;s spot-check</title><desc id="expected-desc">The operator runs the script for all 505 HSK1 words and gets staged entries and a run summary, then draws a 20-entry sample with seed 1 to a review page. Loc reads it. If all 20 are approved, promote with approved 1 copies the entries into content, refused if the staged set changed after the sample, and they are committed. If not, the cause is fixed, affected words regenerated, and a new seed and sample drawn.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');       #d-1-expected-root .wrap { overflow-x:auto }       #d-1-expected-root .wrap svg { min-width:640px }</style><marker id="d-1-expected-expected-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-1-expected-expected-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M320,96 L320,124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><path d="M320,192 L320,220" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><path d="M320,272 L320,300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><path d="M320,384 L320,412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><path d="M320,464 L320,492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><path d="M230,556 L230,572 Q230,580 222,580 L178,580 Q170,580 170,588 L170,628" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a2)"/><path d="M410,556 L410,572 Q410,580 418,580 L462,580 Q470,580 470,588 L470,628" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a1)"/><text x="24" y="32" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">OPERATOR AND LOC</text><rect x="50.0" y="44" width="540" height="52" rx="6" fill="#2d3142"/><rect x="50.0" y="44" width="540" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Operator runs all 505 HSK1 words</text><text x="320.0" y="83" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">uv run scripts/gen-entries.py</text><rect x="50.0" y="124" width="540" height="68" rx="6" fill="#2d3142"/><rect x="50.0" y="124" width="540" height="68" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Staged entries + run summary</text><text x="320.0" y="163" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">words 505, files M, rejected 0,</text><text x="320.0" y="179" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">tatoeba T / ai A, rare senses K in W words</text><rect x="50.0" y="220" width="540" height="52" rx="6" fill="#2d3142"/><rect x="50.0" y="220" width="540" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Operator draws a sample</text><text x="320.0" y="259" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">uv run scripts/gen-entries.py --sample 20 --seed 1</text><rect x="50.0" y="300" width="540" height="84" rx="6" fill="#2d3142"/><rect x="50.0" y="300" width="540" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Review page of 20 random entries</text><text x="320.0" y="339" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">hanzi, pinyin, Hán Việt; senses by POS, rare ones starred *</text><text x="320.0" y="355" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">examples labelled Tatoeba #id / AI viết</text><text x="320.0" y="371" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">CC-CEDICT senses beside each entry</text><rect x="50.0" y="412" width="540" height="52" rx="6" fill="#2d3142"/><rect x="50.0" y="412" width="540" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="320.0" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Loc reads the page</text><text x="320.0" y="451" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">checks all 20 against CC-CEDICT</text><rect x="130" y="492" width="380" height="64" rx="6" fill="#2d3142"/><rect x="130" y="492" width="380" height="64" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="521" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">All 20 approved?</text><text x="320.0" y="537" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">Loc&#x27;s verdict</text><rect x="130" y="598" width="34" height="16" rx="2" fill="#2d3142"/><text x="160" y="610" text-anchor="end" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">YES</text><rect x="476" y="598" width="26" height="16" rx="2" fill="#2d3142"/><text x="480" y="610" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">NO</text><rect x="24" y="628" width="292" height="84" rx="6" fill="#2d3142"/><rect x="24" y="628" width="292" height="84" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="170.0" y="651" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Entries copied to content/</text><text x="170.0" y="667" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">--promote --approved 1</text><text x="170.0" y="683" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">refused if the staged set</text><text x="170.0" y="699" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">changed after the sample</text><rect x="324" y="628" width="292" height="84" rx="6" fill="#2d3142"/><rect x="324" y="628" width="292" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="470.0" y="651" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Fix, regenerate, resample</text><text x="470.0" y="667" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">fix the cause, regenerate</text><text x="470.0" y="683" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">affected words, new seed,</text><text x="470.0" y="699" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">then a new sample</text><path d="M616,670 L630,670 L630,246 L594.0,246" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-1-expected-expected-a1)"/><path d="M170,712 L170,740" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-1-expected-expected-a2)"/><rect x="24" y="740" width="292" height="52" rx="6" fill="#2d3142"/><rect x="24" y="740" width="292" height="52" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="170.0" y="763" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Committed</text><text x="170.0" y="779" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">entries live in content/</text></svg> 
