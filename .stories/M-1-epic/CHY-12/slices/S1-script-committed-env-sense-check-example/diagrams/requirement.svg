<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: three promises of the word script</title><desc id="requirement-desc">Three promises in run order: a fresh clone runs with no manual setup, a word with an unaccounted dictionary sense is rejected and named, and every example sentence states its origin.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="24" y="32" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THREE PROMISES, IN RUN ORDER</text><path d="M346,108 L346,148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><path d="M346,212 L346,252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><rect x="24" y="44" width="76" height="64" rx="6" fill="#2d3142"/><rect x="24" y="44" width="76" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="62.0" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC1</text><text x="62.0" y="89" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">SETUP</text><rect x="112" y="44" width="504" height="64" rx="6" fill="#2d3142"/><rect x="112" y="44" width="504" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="128" y="72" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">A fresh clone runs the script with no manual setup</text><text x="128" y="90" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">or files outside the repo</text><rect x="24" y="148" width="76" height="64" rx="6" fill="#2d3142"/><rect x="24" y="148" width="76" height="64" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="62.0" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC2</text><text x="62.0" y="193" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">CHECK</text><rect x="112" y="148" width="504" height="64" rx="6" fill="#2d3142"/><rect x="112" y="148" width="504" height="64" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="128" y="176" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">A word whose dictionary sense is neither used nor</text><text x="128" y="194" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">dropped with a reason is rejected and named</text><rect x="24" y="252" width="76" height="64" rx="6" fill="#2d3142"/><rect x="24" y="252" width="76" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="62.0" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">AC3</text><text x="62.0" y="297" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">SOURCE</text><rect x="112" y="252" width="504" height="64" rx="6" fill="#2d3142"/><rect x="112" y="252" width="504" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="128" y="280" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Every example sentence says where it came from:</text><text x="128" y="298" text-anchor="start" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Tatoeba with its id, or AI viết</text></svg>
