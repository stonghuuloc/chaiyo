<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto" id="d-2-requirement-root"><title id="requirement-title">Requirement: the Primer passes three checks</title><desc id="requirement-desc">The Primer lists syllables on its five section cards. AC2: every syllable and minimal pair must be on the valid pinyin list. AC3: each of five sections needs at least one drill. AC4: the gate pool needs at least 20 questions covering all five sections. Any no fails the lint. All yes gives AC1, 0 errors, exit 0.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-2-requirement-root .wrap { overflow-x:auto }
      #d-2-requirement-root .wrap svg { min-width:640px }</style><marker id="d-2-requirement-requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="d-2-requirement-requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="20" y="24" width="360" height="60" rx="6" fill="#2d3142"/><rect x="20" y="24" width="360" height="60" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="200.0" y="51.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Primer lists syllables on its 5 section cards</text><text x="200.0" y="68.0" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">tones, finals, initials, spelling, sandhi</text><path d="M200,84 L200,100" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><polygon points="200,100.0 390.0,148 200,196.0 10.0,148" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="200" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Every syllable and minimal pair</text><text x="200" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">is on the valid pinyin list?</text><rect x="10" y="140" width="34" height="16" rx="2" fill="#2d3142" stroke="#f08a59" stroke-width="1"/><text x="27" y="152" text-anchor="middle" font-size="11" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">AC2</text><path d="M390,148 L424,148" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><text x="407" y="140" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">no</text><rect x="424" y="120" width="192" height="56" rx="6" fill="#2d3142"/><rect x="424" y="120" width="192" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="520.0" y="153.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lint fails, names the card</text><path d="M200,196 L200,216" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><text x="214" y="214" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">yes</text><polygon points="200,216.0 390.0,264 200,312.0 10.0,264" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="200" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Each of the 5 sections has</text><text x="200" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">at least 1 drill?</text><rect x="10" y="256" width="34" height="16" rx="2" fill="#2d3142" stroke="#f08a59" stroke-width="1"/><text x="27" y="268" text-anchor="middle" font-size="11" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">AC3</text><path d="M390,264 L424,264" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><text x="407" y="256" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">no</text><rect x="424" y="236" width="192" height="56" rx="6" fill="#2d3142"/><rect x="424" y="236" width="192" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="520.0" y="269.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lint fails, names the section</text><path d="M200,312 L200,332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><text x="214" y="330" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">yes</text><polygon points="200,332.0 390.0,380 200,428.0 10.0,380" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="200" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Gate pool ≥ 20 questions (2 × draw of 10)</text><text x="200" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">and covers all 5 sections?</text><rect x="10" y="372" width="34" height="16" rx="2" fill="#2d3142" stroke="#f08a59" stroke-width="1"/><text x="27" y="384" text-anchor="middle" font-size="11" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">AC4</text><path d="M390,380 L424,380" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a2)"/><text x="407" y="372" text-anchor="middle" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">no</text><rect x="424" y="352" width="192" height="56" rx="6" fill="#2d3142"/><rect x="424" y="352" width="192" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="520.0" y="385.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lint fails, names the gap</text><path d="M200,428 L200,468" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#d-2-requirement-requirement-a1)"/><text x="214" y="452" text-anchor="start" font-size="12" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">yes</text><rect x="20" y="468" width="360" height="56" rx="6" fill="#2d3142"/><rect x="20" y="468" width="360" height="56" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="200.0" y="501.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">0 errors, exit 0</text><rect x="344" y="476" width="34" height="16" rx="2" fill="#2d3142" stroke="#f08a59" stroke-width="1"/><text x="361" y="488" text-anchor="middle" font-size="11" fill="#f08a59" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">AC1</text></svg>
