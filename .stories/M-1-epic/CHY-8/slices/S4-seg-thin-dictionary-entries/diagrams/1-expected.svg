<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-title expected-desc" style="display:block;width:100%;height:auto"><title id="expected-title">Expected result: a pre-cut sentence opens a thin entry</title><desc id="expected-desc">A learner taps a hanzi in 你们好！. The sentence is pre-cut into words shown as three chips: 你们, 好 and ！. Tapping 你们 opens a thin entry: 你们 · nǐ men · nhĩ môn · các bạn (số nhiều). The pre-cut chips are the accented step that AC9 decides.</desc><defs><marker id="expected-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="expected-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M200,132 L230,132" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M425,180 L425,198 Q425,206 417,206 L118,206 Q110,206 110,214 L110,232" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><path d="M200,264 L230,264" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><text x="20" y="72" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">LEARNER</text><text x="230" y="72" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">PRE-CUT WORDS · AC9</text><text x="20" y="222" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">TAP</text><text x="230" y="222" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THIN ENTRY</text><rect x="20" y="84" width="180" height="96" rx="6" fill="#2d3142"/><rect x="20" y="84" width="180" height="96" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="110.0" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Learner taps a hanzi</text><text x="110.0" y="144" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">in 你们好！</text><rect x="230" y="84" width="390" height="96" rx="6" fill="#2d3142"/><rect x="230" y="84" width="390" height="96" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="425" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Sentence is pre-cut into words</text><rect x="328" y="120" width="70" height="40" rx="6" fill="#2d3142"/><rect x="328" y="120" width="70" height="40" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="363.0" y="146" text-anchor="middle" font-size="17" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">你们</text><rect x="410" y="120" width="50" height="40" rx="6" fill="#2d3142"/><rect x="410" y="120" width="50" height="40" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="435.0" y="146" text-anchor="middle" font-size="17" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">好</text><rect x="472" y="120" width="50" height="40" rx="6" fill="#2d3142"/><rect x="472" y="120" width="50" height="40" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="497.0" y="146" text-anchor="middle" font-size="17" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">！</text><rect x="20" y="232" width="180" height="64" rx="6" fill="#2d3142"/><rect x="20" y="232" width="180" height="64" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="11