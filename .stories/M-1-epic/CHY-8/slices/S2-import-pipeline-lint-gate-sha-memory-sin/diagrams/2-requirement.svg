<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto"><title id="requirement-title">Requirement: errors stop the import, same content gives the same version</title><desc id="requirement-desc">AC1: a folder where one word's pinyin has no tone marks. Any error stops the import, so the developer sees that error and the store stays empty. AC2: the same files imported a second time. Same content gives the same version id, so nothing is written again and there is still one version row.</desc><defs><marker id="requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="20" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">INPUT</text><text x="232" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">RULE</text><text x="454" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">RESULT</text><text x="20" y="44" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC1 · BAD FOLDER</text><path d="M210,88 L232,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M432,88 L454,88" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><rect x="20" y="52" width="190" height="72" rx="6" fill="#2d3142"/><rect x="20" y="52" width="190" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="115.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Folder where one word's</text><text x="115.0" y="100.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">pinyin has no tone marks</text><rect x="232" y="52" width="200" height="72" rx="6" fill="#2d3142"/><rect x="232" y="52" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="332.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Any error stops</text><text x="332.0" y="100.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">the import</text><rect x="454" y="52" width="166" height="72" rx="6" fill="#2d3142"/><rect x="454" y="52" width="166" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="537.0" y="76.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Developer sees that</text><text x="537.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">error; the store</text><text x="537.0" y="108.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">stays empty</text><text x="20" y="140" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC2 · SAME FILES AGAIN</text><path d="M210,184 L232,184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M432,184 L454,184" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><rect x="20" y="148" width="190" height="72" rx="6" fill="#2d3142"/><rect x="20" y="148" width="190" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="115.0" y="180.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Same files imported</text><text x="115.0" y="196.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">a second time</text><rect x="232" y="148" width="200" height="72" rx="6" fill="#2d3142"/><rect x="232" y="148" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="332.0" y="180.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Same content gives</text><text x="332.0" y="196.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">the same version id</text><rect x="454" y="148" width="166" height="72" rx="6" fill="#2d3142"/><rect x="454" y="148" width="166" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="537.0" y="172.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Nothing is written</text><text x="537.0" y="188.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">again; still 1</text><text x="537.0" y="204.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">version row</text></svg>
