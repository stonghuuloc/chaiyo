<svg viewBox="0 0 640 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-title expected-desc" style="display:block;width:100%;height:auto"><title id="expected-title">Expected result: import lints first, then writes once by sha</title><desc id="expected-desc">A developer imports a content folder, which is linted. Any lint error returns { errors } and nothing is written (AC1). Otherwise fields are derived and hashed to sha A. If the sink already has A, the result is { sha: A } with no write (AC2). If not, the folder is written once and the result is { sha: A } with one content_versions row. The two decisions are accented.</desc><defs><marker id="expected-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="expected-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M140,88 L160,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M260,88 L270,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M160,88 L180,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M296,88 L316,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M456,88 L486,88" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="457.0" y="71" width="28" height="14" rx="2" fill="#2d3142"/><text x="471" y="81" text-anchor="middle" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">YES</text><path d="M386,128 L386,158 Q386,166 378,166 L103,166 Q95,166 95,174 L95,190" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="390.0" y="139" width="24" height="14" rx="2" fill="#2d3142"/><text x="402" y="149" text-anchor="middle" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">NO</text><path d="M170,218 L190,218" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><path d="M350,218 L470,218" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="396.0" y="201" width="28" height="14" rx="2" fill="#2d3142"/><text x="410" y="211" text-anchor="middle" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">YES</text><path d="M270,258 L270,300" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="274.0" y="272" width="24" height="14" rx="2" fill="#2d3142"/><text x="286" y="282" text-anchor="middle" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">NO</text><path d="M350,324 L470,324" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#expected-a1)"/><rect x="20" y="60" width="140" height="56" rx="6" fill="#2d3142"/><rect x="20" y="60" width="140" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="90.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Developer imports</text><text x="90.0" y="100.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">a content folder</text><rect x="180" y="60" width="116" height="56" rx="6" fill="#2d3142"/><rect x="180" y="60" width="116" height="56" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="238.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lint the folder</text><polygon points="386,48 456,88 