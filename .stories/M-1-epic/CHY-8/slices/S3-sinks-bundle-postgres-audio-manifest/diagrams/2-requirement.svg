<svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-title requirement-desc" style="display:block;width:100%;height:auto"><title id="requirement-title">Requirement: same content in each sink, audio keys by hanzi or id</title><desc id="requirement-desc">AC3: a valid content folder is imported with three sinks. Each sink must hold the same lessons, words, chars, sentences and questions. AC7: every Sentence and Word gets one audio key sha256(hanzi|voice). A Word whose id differs from its hanzi is split: its key uses id|voice and its TTS input is its reading.</desc><defs><marker id="requirement-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="requirement-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="20" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">INPUT</text><text x="232" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">RULE</text><text x="454" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">RESULT</text><text x="20" y="44" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC3 · EACH SINK, SAME CONTENT</text><path d="M210,88 L232,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M432,88 L454,88" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><rect x="20" y="52" width="190" height="72" rx="6" fill="#2d3142"/><rect x="20" y="52" width="190" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="115.0" y="84.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Valid folder, imported</text><text x="115.0" y="100.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">with each of 3 sinks</text><rect x="232" y="52" width="200" height="72" rx="6" fill="#2d3142"/><rect x="232" y="52" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="332.0" y="76.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lesson, words, chars,</text><text x="332.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">sentences, questions</text><text x="332.0" y="108.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">are the same in each</text><rect x="454" y="52" width="166" height="72" rx="6" fill="#2d3142"/><rect x="454" y="52" width="166" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="537.0" y="76.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Memory content, bundle</text><text x="537.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">files and SQL rows</text><text x="537.0" y="108.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">agree field by field</text><text x="20" y="140" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">AC7 · AUDIO MANIFEST KEYS</text><path d="M210,184 L232,184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#requirement-a1)"/><path d="M432,184 L454,184" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#requirement-a2)"/><rect x="20" y="148" width="190" height="72" rx="6" fill="#2d3142"/><rect x="20" y="148" width="190" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="115.0" y="172.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Every Sentence and Word;</text><text x="115.0" y="188.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">a split Word has id</text><text x="115.0" y="204.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">different from hanzi</text><rect x="232" y="148" width="200" height="72" rx="6" fill="#2d3142"/><rect x="232" y="148" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="332.0" y="172.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">key = sha256(hanzi|voice)</text><text x="332.0" y="188.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">split Word: id|voice,</text><text x="332.0" y="204.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">TTS input = reading</text><rect x="454" y="148" width="166" height="72" rx="6" fill="#2d3142"/><rect x="454" y="148" width="166" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="537.0" y="172.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Manifest lists one</text><text x="537.0" y="188.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">key per Sentence</text><text x="537.0" y="204.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">and Word</text></svg>
