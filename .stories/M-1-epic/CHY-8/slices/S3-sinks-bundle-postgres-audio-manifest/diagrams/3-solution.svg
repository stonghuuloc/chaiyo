x="172" y="312" width="282" height="48" rx="6" fill="#2d3142"/><rect x="172" y="312" width="282" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="313.0" y="332.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">scripts/import-content.ts</text><text x="313.0" y="348.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">--sink memory|bundle|postgres</text><rect x="20" y="150" width="120" height="72" rx="6" fill="#2d3142"/><rect x="20" y="150" width="120" height="72" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="80.0" y="174.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">sink.ts</text><text x="80.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">assemble.ts</text><text x="80.0" y="206.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">(S2)</text><path d="M140,156 L172,156" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#solution-a1)"/><path d="M140,216 L172,216" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#solution-a1)"/><rect x="20" y="290" width="120" height="56" rx="6" fill="#2d3142"/><rect x="20" y="290" width="120" height="56" rx="6" fill="#2d3142" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/><text x="80.0" y="314.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">lintDir · tsx</text><text x="80.0" y="330.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">(CHY-9)</text><path d="M140,336 L172,336" fill="none" stroke="#bfc0c0" stroke-width