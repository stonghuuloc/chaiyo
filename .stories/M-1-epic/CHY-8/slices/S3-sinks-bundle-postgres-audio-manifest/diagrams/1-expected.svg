<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-title expected-desc" style="display:block;width:100%;height:auto"><title id="expected-title">Expected result: one lint-clean import fans out to three sinks</title><desc id="expected-desc">A developer runs one import of a lint-clean content folder. It fans out to three sinks that hold the same content: the memory store, the bundle folder with one JSON per lesson plus manifest.json and audio-manifest.json, and ten Postgres tables. The audio manifest is emitted too. The fan-out and the shared content are accented.</desc><defs><marker id="expected-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="expected-a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="20" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">ONE IMPORT</text><text x="220" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">THREE SINKS · AC3</text><text x="500" y="28" text-anchor="start" font-size="10" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace" letter-spacing="0.06em">RESULT</text><rect x="20" y="92" width="150" height="84" rx="6" fill="#2d3142"/><rect x="20" y="92" width="150" height="84" rx="6" fill="#363a4d" stroke="#bfc0c0" stroke-width="1"/><text x="95.0" y="122.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Lint-clean</text><text x="95.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">content folder</text><text x="95.0" y="154.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">importContent</text><rect x="220" y="44" width="200" height="72" rx="6" fill="#2d3142"/><rect x="220" y="44" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="76.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Memory</text><text x="320.0" y="92.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">content in the test store</text><rect x="220" y="128" width="200" height="96" rx="6" fill="#2d3142"/><rect x="220" y="128" width="200" height="96" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="156.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Bundle folder</text><text x="320.0" y="172.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">&lt;sha&gt;/&lt;lesson&gt;.json</text><text x="320.0" y="188.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">manifest.json</text><text x="320.0" y="204.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">audio-manifest.json</text><rect x="220" y="236" width="200" height="72" rx="6" fill="#2d3142"/><rect x="220" y="236" width="200" height="72" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="320.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Postgres</text><text x="320.0" y="284.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">10 tables + 1 version row</text><path d="M170,134 L195,134 L195,80 L220,80" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><path d="M170,134 L220,176" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><path d="M170,134 L195,134 L195,272 L220,272" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="500" y="92" width="120" height="84" rx="6" fill="#2d3142"/><rect x="500" y="92" width="120" height="84" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="560.0" y="122.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Same</text><text x="560.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">content</text><text x="560.0" y="154.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="'Geist Mono', 'PingFang SC', ui-monospace, monospace">in each sink</text><path d="M420,80 L444,80 Q452,80 452,88 L452,126 Q452,134 460,134 L500,134" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><path d="M420,176 L500,134" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><path d="M420,272 L444,272 Q452,272 452,264 L452,142 Q452,134 460,134 L500,134" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#expected-a2)"/><rect x="220" y="320" width="400" height="48" rx="6" fill="#2d3142"/><rect x="220" y="320" width="400" height="48" rx="6" fill="#363a4d" stroke="#f08a59" stroke-width="1.8"/><text x="420.0" y="340.0" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5" font-family="Geist, 'PingFang SC', system-ui, sans-serif">Audio manifest: one key per Sentence and Word</text><text x="420.0" y="356.0" text-anchor="middle" font-size="11" fill="#bfc0c0" font-family="