# Content hashes used as clip ids live in a field named `key`, so the
# generic-api-key rule reads them as credentials. Allowlist those data files only.

[extend]
useDefault = true

[[allowlists]]
description = "sha256 clip ids in content data use the field name key"
condition = "AND"
paths = [
  '''src/routes/\(app\)/pinyin/chart\.json''',
  '''src/routes/dev/audio/clips\.ts''',
  '''prototype/a1-reports\.html''',
]
regexTarget = "match"
regexes = ['''[0-9a-f]{32,}''']

[[allowlists]]
description = "invented VAPID public key used as a test fixture"
paths = ['''src/lib/notify/subscribe\.test\.ts''']

[[allowlists]]
description = "invented Telegram link tokens used as test fixtures"
paths = [
  '''src/lib/notify/telegram-bot\.test\.ts''',
  '''src/lib/notify/telegram-store\.test\.ts''',
  '''src/routes/\(app\)/settings/ReminderChannels\.svelte\.test\.ts''',
]
