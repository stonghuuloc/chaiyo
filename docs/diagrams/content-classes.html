<title id="cm-title">Content model</title>
<desc id="cm-desc">A Lesson owns its Sentences and Questions, and references one or more Grammar Points and 8 to 15 Words. A Word groups one or more Chars and references 1 to 3 example Sentences. A Question uses Sentences as prompts. A dialogue Sentence may name one Cast member as its speaker. Sentence is the focal class: audio and tap lookup derive from it.</desc>
