# CHY-14 S1: TTS spike test set (30 items) and the OmniVoice voice prompts.
# Engine: OmniVoice (k2-fsa/OmniVoice, CC-BY-NC weights), local on Apple Silicon (mps, float16).
voices:
  engine: k2-fsa/OmniVoice
  audition: "你好！今天天气很好，我们一起去学校吧。你吃饭了吗？"
  seeds: { redpanda: 1401, takin: 1402, narrator: 1403 }
  chosen: { redpanda: redpanda-1, takin: takin-3, narrator: narrator-1 }
  pace: { redpanda: 0.85, takin: 0.85, narrator: 0.75 }
  candidates:
    redpanda:
      - { id: redpanda-1, instruct: "female, teenager, moderate pitch" }
    takin:
      - { id: takin-1, instruct: "male, young adult, moderate pitch" }
      - { id: takin-2, instruct: "male, teenager, moderate pitch" }
      - { id: takin-3, instruct: "male, young adult, high pitch" }
    narrator:
      - { id: narrator-1, instruct: "male, middle-aged, moderate pitch" }
      - { id: narrator-2, instruct: "male, middle-aged, low pitch" }
      - { id: narrator-3, instruct: "male, young adult, low pitch" }
