[project]
name = "chaiyo-content"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "jieba",
    "opencc",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.ruff.lint]
# Bug-class rules only; the scripts' terse one-liner style is intentional.
select = ["F", "E9"]
